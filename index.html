<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIGHER AD | ADMIN</title>
  <link rel="icon" href="/favicon.png?v=2">
  <meta property="og:title" content="HIGHER AD | ADMIN">
  <meta property="og:description" content="HigherAD 통합 파트너스 관리자 페이지">
  <meta property="og:image" content="https://higherad.kro.kr/admin_logo.png?v=2">
  <meta property="og:url" content="https://higherad.kro.kr/">
  <meta property="og:type" content="website">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
  <style>
    /* 숫자 입력 화살표(스피너) 제거 — 전 페이지 공통 */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    input[type=number] { -moz-appearance:textfield; appearance:textfield; }
    :root {
      --bg:#f0f4f8; --sidebar:#0f172a; --accent:#10b981; --accent2:#059669;
      --muted:#94a3b8; --card:#ffffff; --border:#e2e8f0;
      --text:#1e293b; --text2:#64748b; --danger:#ef4444; --warn:#f59e0b; --info:#3b82f6;
    }
    *, *::before, *::after { box-sizing:border-box; }
    body { margin:0; font-family:'Pretendard',sans-serif; background:var(--bg); display:none; min-height:100vh; color:var(--text); }

    :root { --sidebar-w:208px; --sidebar-w-collapsed:64px; }
    aside { width:var(--sidebar-w); background:var(--sidebar); color:#fff; display:flex; flex-direction:column; position:fixed; height:100vh; z-index:100; transition:width .2s ease; overflow-x:hidden; }
    .brand { padding:28px 16px 22px 20px; display:flex; align-items:center; justify-content:space-between; gap:8px; white-space:nowrap; }
    .brand-logo { cursor:pointer; min-width:0; overflow:hidden; }
    .brand-name { font-size:19px; font-weight:900; letter-spacing:-0.5px; }
    .brand-name span { color:var(--accent); }
    .brand-sub { font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:2px; text-transform:uppercase; }
    .nav-section { padding:0 10px; }
    .nav-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; padding:16px 10px 6px; white-space:nowrap; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500; transition:all .2s; margin-bottom:2px; user-select:none; white-space:nowrap; }
    .nav-item i[data-lucide] { width:16px; height:16px; flex-shrink:0; }
    .nav-item:hover { color:#fff; background:rgba(255,255,255,.06); }
    .nav-item.active { color:#fff; background:var(--accent); box-shadow:0 4px 12px rgba(16,185,129,.25); }
    .nav-item .badge { margin-left:auto; background:var(--warn); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; }
    .sidebar-bottom { margin-top:auto; padding:14px 10px; border-top:1px solid rgba(255,255,255,.06); display:flex; align-items:center; justify-content:space-between; gap:6px; white-space:nowrap; }
    .admin-info { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; min-width:0; overflow:hidden; }
    .admin-avatar { width:34px; height:34px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; flex-shrink:0; }
    .admin-name { font-size:13px; font-weight:600; }
    .admin-role { font-size:11px; color:var(--muted); }
    .btn-logout, .btn-collapse { display:flex; align-items:center; justify-content:center; padding:9px; border-radius:8px; cursor:pointer; color:var(--muted); transition:.2s; flex-shrink:0; }
    .btn-logout:hover, .btn-collapse:hover { color:#fff; background:rgba(255,255,255,.06); }

    /* ── 사이드바 접기(데스크톱) ── */
    aside.collapsed { width:var(--sidebar-w-collapsed); }
    aside.collapsed .brand-logo,
    aside.collapsed .nav-item .nav-text,
    aside.collapsed .admin-info { display:none; }
    aside.collapsed .brand { padding:20px 0; justify-content:center; }
    /* 라벨 텍스트 대신 섹션 구분선만 남김(글자는 숨기고 위쪽 테두리만 남김) */
    aside.collapsed .nav-label { font-size:0; height:0; padding:8px 0 0; margin:8px 14px 0; border-top:1px solid rgba(255,255,255,.22); }
    aside.collapsed .nav-item { justify-content:center; padding:10px; position:relative; }
    /* 접힌 상태에선 라벨 옆이 아니라 아이콘 위 우상단에 배지로 띄움 */
    aside.collapsed .nav-item .badge { display:flex; position:absolute; top:4px; right:6px; margin-left:0; align-items:center; justify-content:center; min-width:14px; height:14px; padding:0 3px; font-size:9px; line-height:1; }
    aside.collapsed .sidebar-bottom { justify-content:center; }
    aside.collapsed ~ main { margin-left:var(--sidebar-w-collapsed); }
    /* lucide.createIcons()가 <i data-lucide>를 <svg>로 통째로 갈아치워서 <i> 셀렉터로는 못 잡음 — 버튼 자체를 돌림 */
    .btn-collapse { transition:transform .2s ease, color .2s, background .2s; }
    aside.collapsed .btn-collapse { transform:rotate(180deg); }

    main { flex-grow:1; margin-left:var(--sidebar-w); padding:32px 36px; transition:margin-left .2s ease; }
    #content-area { animation:fadeIn .3s ease-out; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .page-heading { font-size:22px; font-weight:800; color:var(--text); }
    /* 페이지별 상단 버튼 — loadPage()가 PAGE_ACTIONS로 채움. 오른쪽 흰 툴바 하나에 하는 일별 묶음, 묶음 사이만 세로선 */
    .top-bar { gap:16px; flex-wrap:wrap; }
    #page-actions:empty { display:none; }
    #page-actions { display:flex; align-items:center; flex-wrap:wrap; background:#fff; border:1px solid var(--border); border-radius:10px; padding:3px; }
    #page-actions .pa-group { display:flex; align-items:center; }
    #page-actions .pa-group + .pa-group { border-left:1px solid var(--border); margin-left:3px; padding-left:3px; }
    #page-actions button { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border:none; border-radius:7px; background:transparent; color:var(--text2); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
    #page-actions button svg { width:15px; height:15px; flex-shrink:0; }
    #page-actions button:hover { background:rgba(15,23,42,.06); color:var(--text); }
    #page-actions button.danger { color:var(--danger); }
    #page-actions button.danger:hover { background:#fef2f2; }
    #page-actions button:disabled { opacity:.5; cursor:default; }
    #page-actions button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .stat-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:24px; }
    .stat-card { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border); position:relative; overflow:hidden; text-align:center; }
    .stat-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
    .stat-card.c-green::after { background:var(--accent); }
    .stat-card.c-warn::after  { background:var(--warn); }
    .stat-card.c-danger::after{ background:var(--danger); }
    .stat-card.c-info::after  { background:var(--info); }
    .stat-label { font-size:11px; color:var(--text2); font-weight:600; margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
    .stat-value { font-size:28px; font-weight:800; color:var(--text); line-height:1; }
    .stat-unit  { font-size:13px; color:var(--muted); font-weight:400; margin-left:2px; }
    .stat-card.c-warn  .stat-value { color:var(--warn); }
    .stat-card.c-danger .stat-value{ color:var(--danger); }

    .bottom-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }
    .notes-card { grid-column:span 2; }

    /* 바로가기 카드 */
    .dash-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px 24px; height:100%; }
    .dash-card-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .dash-card-header i { width:18px; height:18px; }
    .dash-card-title { font-size:15px; font-weight:700; }
    .site-link { display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:10px; text-decoration:none; color:var(--text); transition:.2s; }
    .site-link:hover { background:#f1f5f9; }
    .site-link i { width:16px; height:16px; color:var(--muted); flex-shrink:0; }
    .site-link-name { font-size:13px; font-weight:700; }
    .site-link-url { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .loading-wrap { display:flex; align-items:center; justify-content:center; height:200px; color:var(--muted); font-size:14px; gap:10px; }
    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── 공통 모달 오버레이 ── */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9000; display:flex; align-items:center; justify-content:center; }

    /* ── 햄버거 버튼 ── */
    .hamburger {
      display:none; flex-direction:column; justify-content:center; gap:5px;
      width:36px; height:36px; cursor:pointer; padding:6px;
      border-radius:8px; border:1px solid var(--border); background:var(--card);
    }
    .hamburger span { display:block; height:2px; background:var(--text); border-radius:2px; transition:.3s; }

    /* ── 사이드바 오버레이 (모바일) ── */
    .sidebar-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:99;
    }
    .sidebar-overlay.show { display:block; }

    /* ── 반응형 ── */
    @media (max-width:768px) {
      aside {
        transform:translateX(-100%);
        transition:transform .3s ease;
        z-index:200;
      }
      aside.open { transform:translateX(0); }
      /* 모바일은 접기 기능 대상 아님 — 항상 원래 너비로, 접기 버튼도 숨김 */
      aside.collapsed, aside.collapsed.open { width:var(--sidebar-w); }
      aside.collapsed .brand-logo,
      aside.collapsed .nav-item .nav-text, aside.collapsed .nav-item .badge,
      aside.collapsed .admin-info { display:revert; }
      aside.collapsed .brand { padding:28px 20px 22px; justify-content:space-between; }
      aside.collapsed .nav-label { font-size:10px; height:auto; padding:16px 10px 6px; margin:0; border-top:none; }
      aside.collapsed .nav-item { justify-content:flex-start; padding:10px 11px; }
      aside.collapsed .sidebar-bottom { justify-content:space-between; }
      .btn-collapse { display:none; }

      main, aside.collapsed ~ main { margin-left:0; padding:16px; }

      .top-bar { margin-bottom:16px; }
      #page-actions { width:100%; }
      .page-heading { font-size:17px; }

      .hamburger { display:flex; }

      /* 카드 그리드 — 2열 */
      .stat-grid { grid-template-columns:repeat(2,1fr) !important; gap:10px; }
      .stat-card { padding:14px; }
      .stat-value { font-size:22px; }

      /* 하단 그리드 — 1열 */
      .bottom-grid { grid-template-columns:1fr; }
      .notes-card { grid-column:auto; }

      /* 테이블 — 가로 스크롤 */
      .tbl-wrap, #receipt-page .tbl-wrap, #slots-page .tbl-wrap,
      #settle-page .tbl-wrap {
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
      }

      /* 필터바 — 줄바꿈 */
      .filter-bar, #receipt-page .filter-bar, #slots-page .filter-bar,
      #settle-page .filter-bar {
        flex-wrap:wrap;
        gap:6px;
      }

      /* 현황 카드 (접수관리, 전체캠페인) */
      .stat-bar { grid-template-columns:1fr 1fr !important; gap:8px; }
      .sb-val { font-size:18px !important; }
    }
  </style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="brand-logo" onclick="loadDashboard()">
      <div class="brand-name">HIGHER <span>AD</span></div>
      <div class="brand-sub">Admin Portal</div>
    </div>
    <div class="btn-collapse" onclick="toggleSidebarCollapse()" title="사이드바 접기/펼치기" aria-label="사이드바 접기/펼치기">
      <i data-lucide="chevron-left" size="16"></i>
    </div>
  </div>
  <div class="nav-section">
    <div class="nav-label">Management</div>
    <div class="nav-item" id="nav-slots"   onclick="loadPage('진행현황.html',this)" title="진행 현황"><i data-lucide="activity" size="16"></i><span class="nav-text"> 진행 현황</span></div>
    <div class="nav-item" id="nav-pending" onclick="loadPage('접수관리.html',this)" title="접수 관리"><i data-lucide="inbox" size="16"></i><span class="nav-text"> 접수 관리</span><span class="badge" id="pending-badge" style="display:none">0</span></div>
    <div class="nav-label">Finance & Users</div>
    <div class="nav-item" id="nav-settle"  onclick="loadPage('정산관리.html',this)" title="정산 관리"><i data-lucide="receipt" size="16"></i><span class="nav-text"> 정산 관리</span><span class="badge" id="settle-badge" style="display:none">0</span></div>
    <div class="nav-item" id="nav-cost"    style="display:none" onclick="loadPage('지출관리.html',this)" title="지출 관리"><i data-lucide="wallet" size="16"></i><span class="nav-text"> 지출 관리</span></div>
    <div class="nav-item" id="nav-users"   onclick="loadPage('회원관리.html',this)" title="회원 관리"><i data-lucide="users-round" size="16"></i><span class="nav-text"> 회원 관리</span></div>
    <div class="nav-label">Tools</div>
    <div class="nav-item" id="nav-adclassify" onclick="loadPage('광고분류.html',this)" title="광고 분류"><i data-lucide="tags" size="16"></i><span class="nav-text"> 광고 분류</span></div>
    <div class="nav-item" id="nav-rank" onclick="loadPage('순위조회.html',this)" title="순위 조회"><i data-lucide="trending-up" size="16"></i><span class="nav-text"> 순위 조회</span></div>
    <div class="nav-item" id="nav-tool" onclick="window.open('https://higheradtool.kro.kr/','_blank')" title="도구 모음"><i data-lucide="wrench" size="16"></i><span class="nav-text"> 도구 모음</span></div>
  </div>
  <div class="sidebar-bottom">
    <div class="admin-info">
      <div><div class="admin-name" id="sidebar-name">관리자</div><div class="admin-role" id="sidebar-role">Super Admin</div></div>
    </div>
    <div class="btn-logout" onclick="doLogout()" title="로그아웃" aria-label="로그아웃">
      <i data-lucide="log-out" size="15"></i>
    </div>
  </div>
</aside>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<main>
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="hamburger" id="hamburger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </div>
      <div class="page-heading" id="page-heading">운영 현황 대시보드</div>
    </div>
    <div id="page-actions"></div>
  </div>
  <div id="content-area">
    <div class="loading-wrap"><div class="spinner"></div> 데이터 불러오는 중...</div>
  </div>
</main>

<script type="module">
  import HI from './hi-store.js';

  window.HI = HI;

  // #content-area 렌더 요청마다 증가하는 세대 번호 — await 대기 중 사용자가 다른 메뉴로 넘어가면 뒤늦게 도착한 이전 렌더가 최신 화면을 덮어쓰지 않게 막음
  let navGen = 0;

  // URL에서 파일명 숨기기 — 항상 / 로만 표시
  history.replaceState(null, '', '/');

  // ── 로그아웃 ──────────────────────────────────────────────
  window.doLogout = () => {
    HI.logout();
    sessionStorage.removeItem('ha_admin_auth');
    location.href = 'admin-login.html';
  };

  // ── 대시보드 렌더 ─────────────────────────────────────────
  window.renderDashboard = async function() {
    const myGen = ++navGen;
    const area = document.getElementById('content-area');
    area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> 데이터 불러오는 중...</div>';

    // 대시보드 수치는 전부 진행 중 캠페인(대기·접수·승인·예약) 기준 — live만 받으면 됨
    const [allUsers, allSlots] = await Promise.all([
      HI.getUsers(),
      HI.getLive(),
    ]);
    if (myGen !== navGen) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단

    const todayStr = localYMD(new Date());
    const in3 = new Date(); in3.setDate(in3.getDate() + 3);
    const in3Str = localYMD(in3);

    const agencies = allUsers.length;
    const { activeAgencyIds, activeSlots, totalTarget, expiringSoon, pendingCount, acceptedCount } = allSlots.reduce((acc, sl) => {
      if (isRunningSlot(sl, todayStr)) {
        acc.activeAgencyIds.add(sl.agencyId); acc.activeSlots++; acc.totalTarget += (sl.dailyTarget||0);
        if (sl.endDate && sl.endDate >= todayStr && sl.endDate <= in3Str) acc.expiringSoon++;
      }
      else if (sl.status === 'pending')  acc.pendingCount++;
      else if (sl.status === 'accepted') acc.acceptedCount++;
      return acc;
    }, { activeAgencyIds:new Set(), activeSlots:0, totalTarget:0, expiringSoon:0, pendingCount:0, acceptedCount:0 });
    const activeAgencies = activeAgencyIds.size;

    area.innerHTML = `
      <div class="stat-grid" style="grid-template-columns:repeat(7,1fr)">
        <div class="stat-card c-info"><div class="stat-label">영업점</div><div class="stat-value">${agencies}<span class="stat-unit">곳</span></div></div>
        <div class="stat-card c-green"><div class="stat-label">진행중 영업점</div><div class="stat-value">${activeAgencies}<span class="stat-unit">곳</span></div></div>
        <div class="stat-card c-green"><div class="stat-label">진행중 캠페인</div><div class="stat-value">${activeSlots}<span class="stat-unit">개</span></div></div>
        <div class="stat-card c-green"><div class="stat-label">진행중 일 목표</div><div class="stat-value">${totalTarget.toLocaleString()}<span class="stat-unit">개</span></div></div>
        <div class="stat-card c-warn"><div class="stat-label">종료 예정(3일)</div><div class="stat-value">${expiringSoon}<span class="stat-unit">건</span></div></div>
        <div class="stat-card c-info"><div class="stat-label">대기</div><div class="stat-value">${pendingCount}<span class="stat-unit">건</span></div></div>
        <div class="stat-card c-info"><div class="stat-label">접수</div><div class="stat-value">${acceptedCount}<span class="stat-unit">건</span></div></div>
      </div>
      <div class="bottom-grid">${renderSiteCard()}
        <div class="dash-card notes-card">
          <div class="dash-card-header">
            <i data-lucide="megaphone" style="color:var(--info)"></i>
            <span class="dash-card-title">업데이트 노트</span>
          </div>
          <div id="notes-body" style="max-height:320px;overflow:auto;font-size:13px;line-height:1.7;color:var(--text2)">불러오는 중...</div>
        </div>
      </div>`;
    lucide.createIcons();
    loadUpdateNotes(area.querySelector('#notes-body'));
  };

  const YUPFL_SITES = [
    { name:'풀스택',   url:'http://183.100.195.91:3005/' },
    { name:'프리미엄', url:'http://premiumset.store/sb/' },
    { name:'부산',     url:'https://busan2027.link/' },
  ];
  function renderSiteCard() {
    const links = YUPFL_SITES.map(s => `
      <a class="site-link" href="${s.url}" target="_blank" rel="noopener noreferrer">
        <i data-lucide="external-link"></i>
        <span class="site-link-name">${s.name}</span>
        <span class="site-link-url">${s.url.replace(/^https?:\/\//, '')}</span>
      </a>`).join('');
    return `
      <div class="dash-card">
        <div class="dash-card-header">
          <i data-lucide="globe" style="color:var(--info)"></i>
          <span class="dash-card-title">유입플 사이트</span>
        </div>
        ${links}
      </div>`;
  }

  function localYMD(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  // 진행중 = 승인(active) 또는 예약 등록 중(split — 캐시 차감 후 매일 등록이 나가는 중)이면서 시작일이 지난 캠페인.
  // 예약 접수가 대부분이라 active만 세면 진행중 카드·종료예정이 크게 빠짐
  function isRunningSlot(sl, todayStr) {
    return (sl.status === 'active' || sl.status === 'split') && (sl.startDate || '') <= todayStr;
  }

  window.loadDashboard = function() {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.getElementById('page-heading').textContent = '운영 현황 대시보드';
    renderPageActions(null);
    renderDashboard();
    window.scrollTo(0, 0);
  };

  const PAGE_TITLES = {
    '진행현황.html':'진행 현황', '접수관리.html':'접수 관리',
    '정산관리.html':'정산 관리', '지출관리.html':'지출 관리',
    '회원관리.html':'회원 관리',
    '광고분류.html':'광고 분류', '순위조회.html':'순위 조회',
  };

  // 페이지별 상단 버튼 묶음 — [아이콘(lucide), 이름, 클릭 시 호출(페이지 스크립트의 window 함수), 옵션]. 묶음 = 하는 일이 같은 버튼
  const PAGE_ACTIONS = {
    '접수관리.html': [
      [['file-spreadsheet', '엑셀 접수', 'openReceiptExcelModal()'], ['history', '재접수', 'openReacceptModal()']],
      [['ban', '강제종료', 'openForceStopModal()', { danger: true }]],
      [['tags', '분류 설정', 'openKwCategoryModal()']],
      [['download', '엑셀 다운로드', 'downloadExcelList()', { id: 'dl-single-btn' }]],
    ],
    '정산관리.html': [
      [['clipboard-plus', '정산 등록', 'openSettleRegModal()'], ['undo-2', '환불 등록', 'openPendingRefundModal()']],
      [['check-check', '선택 입금', 'bulkPayConfirm()']],
      [['download', '엑셀 다운로드', 'exportSettleExcel()']],
    ],
    '진행현황.html': [[['trophy', '순위표', 'downloadRankTable()', { id: 'rank-table-btn' }]], [['trash-2', '휴지통', 'openTrashView()']]],
    '지출관리.html': [[['settings-2', '원가 설정', 'openCostModal()']], [['download', '엑셀 다운로드', 'exportCostExcel()']]],
    '회원관리.html': [[['refresh-cw', '단가 불러오기', 'refreshYupflVendorList(this)', { title: '가이드 시트 탭 이름으로 리워드·유입플 업체 항목만 불러옴(설정된 단가는 그대로)' }], ['user-plus', '회원 추가', 'openUserModal(null)']]],
  };
  function renderPageActions(page) {
    const el = document.getElementById('page-actions');
    el.innerHTML = (PAGE_ACTIONS[page] || []).map(group => `<div class="pa-group">${group.map(([icon, label, call, o = {}]) =>
      `<button type="button"${o.id ? ` id="${o.id}"` : ''}${o.danger ? ' class="danger"' : ''}${o.title ? ` title="${o.title}"` : ''} onclick="${call}"><i data-lucide="${icon}"></i><span>${label}</span></button>`
    ).join('')}</div>`).join('');
    if (window.lucide) lucide.createIcons();
  }

  // 회원관리 '단가 불러오기' — 가이드 시트 탭 이름으로 리워드·유입플 업체 항목만 갱신(hi/guide_items), 설정된 단가·원가는 안 건드림
  window.refreshYupflVendorList = async function(btn) {
    const label = btn?.querySelector('span');
    if (btn?.disabled) return;
    // 불러오는 동안 글자만 '불러오는 중..'으로 — 버튼 폭은 원래 크기로 고정
    if (btn) { btn.style.width = btn.offsetWidth + 'px'; btn.style.justifyContent = 'center'; btn.disabled = true; label.textContent = '불러오는 중..'; }
    try {
      const { rewards, vendors } = await HI.refreshGuideItems();
      alert(`항목을 불러왔습니다.\n리워드: ${rewards.join(', ')}\n유입플: ${vendors.join(', ')}`);
    } catch (e) { alert('가이드 시트를 불러오지 못했습니다: ' + e.message); }
    finally { if (btn) { btn.disabled = false; label.textContent = '단가 불러오기'; btn.style.width = btn.style.justifyContent = ''; } }
  };

  window.loadPage = async function(page, navEl, afterLoad) {
    const myGen = ++navGen;
    window.closeSidebar?.();
    if (navEl) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      navEl.classList.add('active');
    }
    document.getElementById('page-heading').textContent = PAGE_TITLES[page] || page;
    renderPageActions(page);

    const area = document.getElementById('content-area');
    area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div>';

    try {
      const res = await fetch(page + '?v=' + Date.now());
      if (!res.ok) throw new Error();
      const html = await res.text();
      if (myGen !== navGen) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단

      const doc = new DOMParser().parseFromString(html, 'text/html');
      area.innerHTML = '';

      // 파일 맨 앞의 <style>은 파서가 <head>로 옮김(광고분류.html) — body만 옮기면 그 페이지 CSS가 통째로 빠짐
      doc.head.querySelectorAll('style').forEach(st => area.appendChild(document.importNode(st, true)));
      doc.body.childNodes.forEach(node => {
        if (node.nodeName !== 'SCRIPT') {
          area.appendChild(document.importNode(node, true));
        }
      });

      if (afterLoad) afterLoad();

      doc.body.querySelectorAll('script').forEach(old => {
        const blob = new Blob([old.textContent], { type: 'application/javascript' });
        const url  = URL.createObjectURL(blob);
        const s    = document.createElement('script');
        s.src      = url;
        document.body.appendChild(s);
        s.onload  = () => URL.revokeObjectURL(url);
        s.onerror = () => URL.revokeObjectURL(url);
      });

      lucide.createIcons();
      window.scrollTo(0, 0);
    } catch(err) {
      console.error('loadPage error:', err);
      if (myGen !== navGen) return; // 대기 중 다른 메뉴로 이동한 경우 에러 화면도 표시하지 않음
      area.innerHTML = `<div style="padding:80px;text-align:center;background:#fff;border-radius:16px;border:1px solid var(--border)">
        <p style="color:var(--text2);font-size:14px">${page} 파일을 찾을 수 없습니다.</p></div>`;
    }
  };

  // ── 사이드바 배지 (실시간) ────────────────────────────────
  HI.subscribeLive(slots => {
    const n = slots.filter(s => s.status === 'pending').length;
    const el = document.getElementById('pending-badge');
    if (el) { el.textContent = n; el.style.display = n > 0 ? '' : 'none'; }
  });

  // ── 정산관리 배지 (미정산 건) ──────────────────────────────
  HI.onUnpaidGroupsChange(n => {
    const el = document.getElementById('settle-badge');
    if (el) { el.textContent = n; el.style.display = n > 0 ? '' : 'none'; }
  });

  // ── 앱 시작 ───────────────────────────────────────────────
  async function init() {
    if (sessionStorage.getItem('ha_admin_auth') !== '1') {
      location.href = 'admin-login.html';
      return;
    }
    // 사이드바 유저 정보 표시
    const cur = HI.getCurrentUser();
    if (cur) {
      const nameEl   = document.getElementById('sidebar-name');
      const roleEl   = document.getElementById('sidebar-role');
      const avatarEl = document.getElementById('sidebar-avatar');
      if (nameEl)   nameEl.textContent   = cur.name || cur.username;
      if (roleEl)   roleEl.textContent   = cur.role === 'admin' ? 'Super Admin' : '담당자';
      if (avatarEl) avatarEl.textContent = (cur.name || cur.username).charAt(0).toUpperCase();
      if (HI.canSeeCost(cur)) document.getElementById('nav-cost').style.display = '';
    }
    // 테스트 데이터(hi_test 등)에 붙어 있으면 눈에 띄게 표시 — 외부 서버 호출은 hi-store가 막음
    if (HI.ROOT !== 'hi') {
      document.title = `[TEST:${HI.ROOT}] ` + document.title;
      document.querySelector('.brand-sub').innerHTML = `<span style="color:#f87171;font-weight:800">TEST · ${HI.ROOT}</span>`;
    }
    document.body.style.display = 'flex';
    lucide.createIcons();
    if (navGen === 0) {
      await renderDashboard();
    }
    lucide.createIcons();
  }

  // ── 사이드바 토글 (모바일) ──────────────────────────────────
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-overlay').classList.toggle('show');
  };
  window.closeSidebar = function() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  };

  // ── 사이드바 접기 (데스크톱) ────────────────────────────────
  window.toggleSidebarCollapse = function() {
    const collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
    localStorage.setItem('ha_sidebar_collapsed', collapsed ? '1' : '0');
  };

  if (localStorage.getItem('ha_sidebar_collapsed') !== '0') {
    document.getElementById('sidebar').classList.add('collapsed');
  }

  // ── 새 버전 배포 감지 ─────────────────────────────────────
  // GitHub Pages는 배포 때마다 모든 파일 Last-Modified가 배포 시각으로 바뀜 — 지금 화면의 값보다 새로우면 클릭 시 새로고침 안내
  // Pages CDN은 파일을 10분(max-age 600) 들고 있음 — 확인·새로고침 둘 다 ?v=시각을 붙여 CDN 캐시를 건너뜀(옛 index를 다시 받아 팝업이 반복되지 않게)
  const loadedAt = Date.parse(document.lastModified);
  // 업데이트 노트 = update-notes.json [{at: 'YYYY-MM-DDTHH:MM'(KST), text, upd?}] — 커밋과 무관하게 기능 변경만 사람이 적음(순서 무관, 시각순 정렬)
  // upd = 같은 날 문구를 고친 시각 — 노트 날짜는 at, 새로고침 팝업은 upd(없으면 at)가 지금 화면보다 새로우면 보여 줌
  const fetchNotes = () => fetch(`update-notes.json?v=${Date.now()}`, { cache: 'no-store' }).then(r => r.json())
    .then(list => list.map(n => ({ ...n, time: Date.parse(n.at + ':00+09:00'), changed: Date.parse((n.upd || n.at) + ':00+09:00') })).sort((a, b) => b.time - a.time));
  let lastCheck = 0, outdated = false, changes = [];
  async function checkVersion() {
    if (outdated || Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    try {
      const res = await fetch(`index.html?v=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
      outdated = Date.parse(res.headers.get('Last-Modified')) > loadedAt;
      // 업데이트 내용 = 지금 화면 배포 이후에 적힌 노트
      if (outdated) changes = (await fetchNotes()).filter(n => n.changed > loadedAt).map(n => n.text);
    } catch {}
  }
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  function showReloadNotice() {
    if (document.getElementById('reload-notice')) return;
    const el = document.createElement('div');
    el.id = 'reload-notice';
    el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center';
    el.innerHTML = `<div style="background:#fff;border-radius:12px;padding:24px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;line-height:1.6">
      <b style="font-size:16px">새 버전이 배포되었습니다</b><br>${changes.length ? '최신 기능을 쓰려면' : '업데이트를 적용하려면'} 새로고침해 주세요.<br>
      ${changes.length ? `<ul style="text-align:left;margin:12px 0 0;padding-left:18px;max-height:240px;overflow:auto;max-width:480px;color:#374151">${changes.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}
      <button onclick="location.replace('/?v=' + Date.now())" style="margin-top:14px;padding:8px 20px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer">새로고침</button></div>`;
    document.body.appendChild(el);
  }
  // 새 버전이면 어떤 클릭이든 막고 안내 — 새로고침 버튼만 통과
  document.addEventListener('click', e => {
    if (outdated && !e.target.closest('#reload-notice')) { e.stopPropagation(); e.preventDefault(); showReloadNotice(); }
    else checkVersion();
  }, true);
  setInterval(checkVersion, 5 * 60000);

  // ── 대시보드 업데이트 노트 — update-notes.json을 날짜별로 ──
  async function loadUpdateNotes(body) {
    try {
      const byDay = new Map();
      (await fetchNotes()).forEach(({ time, text }) => {
        const day = new Date(time).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
        byDay.has(day) ? byDay.get(day).push(text) : byDay.set(day, [text]);
      });
      body.innerHTML = byDay.size ? [...byDay].map(([day, msgs]) => `<div style="margin-bottom:14px"><div style="font-weight:700;color:var(--text);margin-bottom:4px">${day}</div>
        <ul style="margin:0;padding-left:18px">${msgs.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`).join('') : '업데이트 내역이 없습니다.';
    } catch { body.textContent = '업데이트 노트를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'; }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });

  init();
</script>
</body>
</html>
