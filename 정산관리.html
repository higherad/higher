<div id="settle-page">
<style>
  #settle-page .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  #settle-page .sum-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px 24px; position:relative; overflow:hidden; }
  #settle-page .sum-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; }
  #settle-page .sum-card.month::after { background:var(--accent); }
  #settle-page .sum-card.today::after { background:var(--info); }
  #settle-page .sum-card .sc-label { font-size:11px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  #settle-page .sum-card.month .sc-value { font-size:28px; font-weight:800; color:var(--accent); line-height:1; }
  #settle-page .sum-card.today .sc-value { font-size:28px; font-weight:800; color:var(--info); line-height:1; }
  #settle-page .sum-card .sc-sub { font-size:12px; color:var(--muted); margin-top:6px; }
  #settle-page .sum-card.clickable { cursor:pointer; transition:box-shadow .15s, transform .15s; }
  #settle-page .sum-card.clickable:hover { box-shadow:0 4px 20px rgba(0,0,0,.1); transform:translateY(-2px); }
  #settle-page .sum-card.clickable .sc-label::after { content:' ↗'; font-size:10px; opacity:.5; }
  .total-popup-box { background:#fff;border-radius:16px;width:660px;max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.2); }
  #settle-page .filter-bar { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  #settle-page select, #settle-page input { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; color:var(--text); background:#fff; outline:none; }
  #settle-page .tbl-wrap { background:#fff; border:1px solid var(--border); border-radius:10px; overflow-x:auto; }
  #settle-page table { width:100%; border-collapse:collapse; font-size:12px; }
  #settle-page thead th { background:#1e293b; color:#fff; padding:11px 7px; font-weight:500; border-right:1px solid #2d3f55; white-space:nowrap; text-align:center; font-size:11px; }
  #settle-page tbody td { padding:10px 7px; border-bottom:1px solid var(--border); text-align:center; vertical-align:middle; }
  #settle-page tbody tr:last-child td { border-bottom:none; }
  #settle-page tbody tr:hover { background:#f8fafc; }
  .agency-link { color:var(--info); font-weight:700; cursor:pointer; text-decoration:underline; }
  .agency-link:hover { color:var(--accent); }
  .paid-badge   { background:rgba(16,185,129,.1); color:#059669; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; }
  .unpaid-badge { background:rgba(239,68,68,.1); color:var(--danger); padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; }
  .btn-refund   { background:rgba(239,68,68,.1); color:var(--danger); padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; margin-right:4px; }
  .action-btn  { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; }
  .btn-toggle { transition: box-shadow .25s ease, background-color .25s ease, color .25s ease; }
  .btn-confirm { background:var(--accent); color:#fff; }
  .empty-row td { height:200px; text-align:center; color:var(--muted); font-size:13px; }
  .pagination { display:flex;justify-content:center;gap:5px;margin-top:16px; }
  .pg-btn { width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center; }
  .pg-btn.active { background:var(--info);color:#fff;border-color:var(--info); }
  .loading-wrap { display:flex;align-items:center;justify-content:center;height:120px;color:var(--muted);font-size:13px;gap:8px; }
  .spinner { width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .sp-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px; }
  .sp-box { background:#fff;border-radius:16px;width:860px;max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .sp-title { font-size:17px;font-weight:800;margin-bottom:2px; }
  .sp-sub { font-size:12px;color:var(--muted);margin-bottom:16px; }
  .sp-cards { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px; }
  .sp-card { background:#f8fafc;border-radius:10px;padding:14px 16px;position:relative;overflow:hidden; }
  .sp-card::after { content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--border); }
  .sp-card.c-green::after { background:var(--accent); }
  .sp-card.c-blue::after  { background:var(--info); }
  .sp-card.c-red::after   { background:var(--danger); }
  .sp-card.c-purple::after { background:#7c3aed; }
  .sp-card-label { font-size:11px;color:var(--text2);font-weight:600;margin-bottom:8px; }
  .sp-card-value { font-size:20px;font-weight:800;line-height:1; }
  .sp-section { font-size:13px;font-weight:700;margin-bottom:8px;margin-top:16px;color:var(--text); }
  .sp-tbl { width:100%;border-collapse:collapse;font-size:12px; }
  .sp-tbl th { background:#1e293b;color:#fff;padding:8px 8px;font-weight:500;text-align:center;white-space:nowrap; }
  .sp-tbl td { padding:8px 8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2);white-space:nowrap; }
  .sp-tbl tr:last-child td { border-bottom:none; }
  .sp-footer { display:flex;justify-content:flex-end;gap:10px;margin-top:20px; }
  .btn-close-sp { padding:9px 24px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit; }

  .agency-block{margin-bottom:16px;border:1.5px solid #c7d2fe;border-radius:14px;overflow:hidden}
  .agency-block:last-child{margin-bottom:0}
  .agency-hd{display:flex;justify-content:space-between;align-items:center;background:#eff4ff;padding:12px 16px;border-bottom:1.5px solid #c7d2fe}
  .agency-hd .aname{font-size:15px;font-weight:800;color:var(--info)}
  .agency-hd .ameta{font-size:12px;color:#6366f1;margin-top:1px}
  .ag-table{width:100%;border-collapse:collapse;font-size:13px}
  .ag-table thead th{background:#f8fafc;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}
  .ag-table tbody tr{border-bottom:1px solid var(--border)}
  .ag-table tbody tr:last-child{border-bottom:none}
  .ag-table tbody td{padding:10px 14px}
  .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge-done{background:#eff6ff;color:var(--info)}
  .badge-pend{background:#fef9c3;color:#854d0e}
  .agency-ft{background:#f0f4ff;border-top:1.5px solid #c7d2fe;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .agency-ft .totals{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .agency-ft .totals span b{color:var(--info)}
  .agency-copy-btn{background:#0d9488;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
  .agency-copy-btn:hover{background:#0f766e}
  .agency-copy-btn.ok{background:#0f766e}
  #settle-reg-overlay .sp-box{width:960px}

  /* ── 반응형 ── */
  @media (max-width: 768px) {
    #settle-page .summary-grid { grid-template-columns: 1fr 1fr !important; }
    #settle-page .filter-bar { flex-wrap: wrap; gap: 6px; }
    #settle-page .filter-bar > * { flex: 1 1 calc(50% - 6px); min-width: 120px; }
    #settle-page .filter-bar > div[style*="margin-left:auto"] { flex: 1 1 100%; margin-left: 0 !important; }
    #settle-page .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #settle-page table { min-width: 700px; }
    .sp-box { width: calc(100vw - 32px); padding: 20px; }
    .sp-cards { grid-template-columns: 1fr; }
  }
</style>

<div class="summary-grid" id="settle-summary">
  <div style="grid-column:1/-1"><div class="loading-wrap"><div class="spinner"></div> 로드 중...</div></div>
</div>

<div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:16px;">
  <div style="display:flex;gap:8px;">
    <button class="action-btn" style="background:#16a34a;color:#fff;padding:7px 16px;font-size:12px;" onclick="exportSettleExcel()">📥 엑셀 다운로드</button>
    <button class="action-btn" style="background:#0d9488;color:#fff;padding:7px 16px;font-size:12px;" onclick="openSettleRegModal()">📋 정산 등록</button>
    <button class="action-btn btn-confirm" style="padding:7px 16px;font-size:12px;background:var(--accent);" onclick="bulkPayConfirm()">선택 입금</button>
  </div>
</div>

<div class="filter-bar">
  <select id="sf-paid" onchange="renderSettle(false)">
    <option value="">정산상태 전체</option>
    <option value="paid">정산완료</option>
    <option value="unpaid">미정산</option>
    <option value="uncharged">미충전</option>
  </select>
  <div style="display:flex;align-items:center;gap:4px;">
    📅 <input type="date" id="sf-from" onchange="onSettleDateChange()" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;">
    <span style="color:var(--text2);font-size:12px;">~</span>
    <input type="date" id="sf-to" onchange="onSettleDateChange()" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;">
    <button id="sf-date-clear" onclick="clearSettleDate()" style="display:none;margin-left:2px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px;" title="날짜 초기화">✕</button>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px;">
    <input type="text" id="sf-kw" placeholder="대행사/아이디 검색" style="width:180px;" onkeydown="if(event.key==='Enter') renderSettle()">
    <button class="action-btn" style="background:#475569;color:#fff;padding:6px 14px;" onclick="renderSettle()">검색</button>
    <button class="action-btn" style="background:#fff;border:1px solid var(--border);padding:6px 12px;" onclick="resetSettle()">초기화</button>
  </div>
</div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="settle-chk-all" title="전체선택" onchange="toggleAllSettle(this)"></th>
        <th>접수일시</th><th>대행사</th><th>단가(원)</th><th>캠페인 수</th>
        <th>일 목표 합산</th><th>정산 금액(VAT 별도)</th><th id="th-yupfl" style="display:none;color:#a78bfa">유입플 금액</th><th id="th-deduct" style="display:none;color:#f87171">차감 금액</th><th>입금액(VAT 포함)</th><th>환불 금액</th><th>정산상태</th><th>충전 담당자</th><th>입금 담당자</th><th>액션</th>
      </tr>
    </thead>
    <tbody id="settle-body">
      <tr><td colspan="14"><div class="loading-wrap"><div class="spinner"></div> 데이터 불러오는 중...</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="settle-pagination"></div>

<div id="settle-reg-overlay" class="sp-overlay" style="display:none" onclick="if(event.target===this&&!window.settleCharging)this.style.display='none'">
  <div class="sp-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
      <div class="sp-title">📂 정산 등록 — 대행사별 분류</div>
    </div>
    <div class="sp-sub" id="settle-reg-sub"></div>
    <div id="settle-reg-body"></div>
    <div class="sp-footer">
      <button class="btn-close-sp" onclick="if(!window.settleCharging)document.getElementById('settle-reg-overlay').style.display='none'">닫기</button>
      <button id="settle-charge-btn" onclick="startSettleCharge()" style="background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">⚡ 충전 신청</button>
    </div>
  </div>
</div>

<script>
(function(){
  let sPage=1; const PER=20;
  let _settleLoaded=false;
  let allSlots=[],allUsers=[],paidSet=new Set(),refundMap={};
  let snapshotMap={};
  let filteredRows=[];
  const selectedSnapKeys=new Set();
  const todayStr=(() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  // 차감 금액 컬럼 노출 대상 — admin 롤 + kimpro/higherad1 (개별 요청으로 추가, staff 롤 전체는 아님)
  const DEDUCT_VIEW_USERS=new Set(['kimpro','higherad1']);
  const _cu=HA.getCurrentUser?.();
  const isAdmin=_cu?.role==='admin'||DEDUCT_VIEW_USERS.has(_cu?.username);
  document.getElementById('th-deduct')?.style.setProperty('display', isAdmin ? '' : 'none');
  document.getElementById('th-yupfl')?.style.setProperty('display', isAdmin ? '' : 'none');

  function refundKey(timeKey,agencyId,userId){const safe=s=>s.replace(/[.#$\[\]]/g,'_');return `${safe(timeKey)}__${safe(agencyId)}__${safe(userId)}`;}
  function getRefund(timeKey,agencyId,userId){return refundMap[refundKey(timeKey,agencyId,userId)]||0;}
  function getPrice(userId){const u=allUsers.find(u=>u.username===userId);return u?(u.unitPrice||0):0;}
  // 슬롯 저장 단가 우선, 없거나 0이면 현재 유저 단가 (기존 데이터 호환)
  function getSlotPrice(s){return (s.unitPrice!=null&&s.unitPrice!==''&&s.unitPrice>0)?s.unitPrice:getPrice(s.userId);}
  const escProd = v => String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // decodeURIComponent(...)로 onclick 홑따옴표 JS 문자열에 넣는 값 전용 — encodeURIComponent는
  // 홑따옴표(')를 인코딩하지 않으므로 agencyId/userId에 '가 있으면 그대로 살아남아 JS 문자열을
  // 탈출할 수 있다. %27로 추가 치환해 막는다(decodeURIComponent가 다시 '로 정확히 복원함).
  const encAttr = v => encodeURIComponent(v).replace(/'/g,'%27');
  function slotAmount(s){return (s.dailyTarget||0)*(s.days||0)*getSlotPrice(s);}

  // 분 단위 키
  function getMinuteKey(isoStr){
    if(!isoStr) return 'unknown';
    const d=new Date(isoStr);
    const yyyy=d.getFullYear();
    const mo=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const hh=String(d.getHours()).padStart(2,'0');
    const mn=String(d.getMinutes()).padStart(2,'0');
    return `${yyyy}-${mo}-${dd} ${hh}:${mn}`;
  }

  function fmtDatetime(isoStr){
    if(!isoStr) return '-';
    const d=new Date(isoStr);
    const yyyy=d.getFullYear();
    const mo=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const date=`${yyyy}-${mo}-${dd}`;
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    const ss=String(d.getSeconds()).padStart(2,'0');
    return `${date}<br><span style="color:var(--accent);font-size:11px">${hh}:${mm}:${ss}</span>`;
  }

  function calcGroup(g){
    const prices = [...new Set(g.slots.map(s=>getSlotPrice(s)))];
    const p   = prices.length === 1 ? prices[0] : prices[0];
    const pDisplay = prices.length > 1 ? `${Math.min(...prices).toLocaleString()}~${Math.max(...prices).toLocaleString()}` : prices[0].toLocaleString();
    const tot = g.slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
    const amt = g.slots.reduce((a,s)=>a+slotAmount(s),0);
    const ded = g.slots.reduce((a,s)=>a+(s.deductAmount||0),0);
    const yup = g.slots.reduce((a,s)=>a+(s.yupflAmount||0),0);
    return {p, pDisplay, tot, amt, ded, yup};
  }

  // 분 단위 + 대행사 + 유저ID 그룹핑
  function groupByTimeAgency(slots){
    const map={};
    slots.forEach(s=>{
      const t=getMinuteKey(s.createdAt);
      const k=t+'||'+(s.agencyId||'-')+'||'+(s.userId||'-');
      if(!map[k])map[k]={timeKey:t, agencyId:s.agencyId||'-', userId:s.userId||'-', slots:[]};
      map[k].slots.push(s);
    });
    return Object.values(map).sort((a,b)=>b.timeKey.localeCompare(a.timeKey));
  }

  function getFiltered(){
    const paid=document.getElementById('sf-paid').value;
    const from=document.getElementById('sf-from').value;
    const to=document.getElementById('sf-to').value;
    const kw=(document.getElementById('sf-kw').value||'').toLowerCase();
    return allSlots.filter(s=>{
      if(s.status==='active'||s.status==='accepted'||s.status==='expired'||s.status==='pending') return true;
      return false;
    }).filter(s=>{
      if(paid==='paid'&&!paidSet.has(s._key))return false;
      if(paid==='unpaid'&&paidSet.has(s._key))return false;
      if(from||to){
        const d=new Date(s.createdAt||'');
        const yyyy=d.getFullYear();
        const mo=String(d.getMonth()+1).padStart(2,'0');
        const dd=String(d.getDate()).padStart(2,'0');
        const sDate=`${yyyy}-${mo}-${dd}`;
        if(from&&sDate<from)return false;
        if(to&&sDate>to)return false;
      }
      if(kw&&![(s.agencyId||''),(s.userId||'')].some(v=>v.toLowerCase().includes(kw)))return false;
      return true;
    });
  }

  window.onSettleDateChange = function() {
    const has = document.getElementById('sf-from').value || document.getElementById('sf-to').value;
    document.getElementById('sf-date-clear').style.display = has ? 'inline' : 'none';
    renderSettle();
  };

  window.clearSettleDate = function() {
    document.getElementById('sf-from').value = '';
    document.getElementById('sf-to').value = '';
    document.getElementById('sf-date-clear').style.display = 'none';
    renderSettle();
  };

  window.resetSettle = function() {
    document.getElementById('sf-paid').value = '';
    document.getElementById('sf-kw').value = '';
    document.getElementById('sf-from').value = '';
    document.getElementById('sf-to').value = '';
    document.getElementById('sf-date-clear').style.display = 'none';
    renderSettle();
  };

  function renderSummary(){
    // 과거: 스냅샷 합산 / 오늘: 실시간 계산
    const snapVals = Object.values(snapshotMap);
    const pastTotal = snapVals
      .filter(v => v.timeKey && v.timeKey.slice(0,10) < todayStr)
      .reduce((a,v) => a + (v.amount||0), 0);
    const todayBase = allSlots.filter(s => {
      if(!(s.status==='active'||s.status==='accepted'||s.status==='expired'||s.status==='pending')) return false;
      const d=new Date(s.createdAt||'');
      const yyyy=d.getFullYear();
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const dd=String(d.getDate()).padStart(2,'0');
      const sDate=`${yyyy}-${mo}-${dd}`;
      return sDate === todayStr;
    });
    const dA = todayBase.reduce((a,s)=>a+slotAmount(s),0);
    // 오늘 환불 차감
    const todayRefund = Object.entries(refundMap||{}).reduce((a,[k,v])=>{
      return k.split('__')[0].slice(0,10) === todayStr ? a+(v||0) : a;
    }, 0);
    const todayNet = dA - todayRefund;
    const totalA = pastTotal + todayNet;
    const dS = todayBase;
    document.getElementById('settle-summary').innerHTML=`
      <div class="sum-card month clickable" onclick="openMonthPopup()">
        <div class="sc-label">총 매출액(VAT 별도)</div>
        <div class="sc-value">${totalA.toLocaleString()}<span style="font-size:14px;color:var(--muted);font-weight:400;margin-left:4px">원</span></div>
        <div class="sc-sub">${snapVals.filter(v=>v.timeKey&&v.timeKey.slice(0,10)<todayStr).reduce((a,v)=>a+(v.slotCount||1),0) + dS.length}건 전체</div>
      </div>
      <div class="sum-card month clickable" onclick="openTotalPopup()">
        <div class="sc-label">총 입금액(VAT 포함)</div>
        <div class="sc-value">${Math.round(totalA*1.1).toLocaleString()}<span style="font-size:14px;color:var(--muted);font-weight:400;margin-left:4px">원</span></div>
        <div class="sc-sub">VAT 10% 포함</div>
      </div>

  window.openMonthPopup = function() {
    const now = new Date();
    const curYear  = now.getFullYear();
    const curMonth = now.getMonth() + 1;
    const curYM    = `${curYear}-${String(curMonth).padStart(2,'0')}`;
    const monthLabel = `${curMonth}월`;

    // 당월 스냅샷 집계 (과거 날짜) + 오늘 실시간
    const byDay = {};

    // 스냅샷에서 당월 데이터
    Object.values(snapshotMap).forEach(v => {
      if (!v.timeKey) return;
      const d = v.timeKey.slice(0,10);
      if (d.slice(0,7) !== curYM || d >= todayStr) return;
      if (!byDay[d]) byDay[d] = { count:0, tgt:0, amt:0, ded:0 };
      byDay[d].count += v.slotCount||1;
      byDay[d].tgt += v.totalTarget||0;
      byDay[d].amt += v.amount||0;
      byDay[d].ded += v.deductAmt||0;
    });

    // 오늘 실시간
    const todaySlots = allSlots.filter(s => {
      if(!(s.status==='active'||s.status==='accepted'||s.status==='expired'||s.status==='pending')) return false;
      const d=new Date(s.createdAt||'');
      const yyyy=d.getFullYear();
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const dd=String(d.getDate()).padStart(2,'0');
      const sDate=`${yyyy}-${mo}-${dd}`;
      return sDate === todayStr;
    });
    if (todaySlots.length && todayStr.slice(0,7) === curYM) {
      const todayAmt = todaySlots.reduce((a,s)=>a+slotAmount(s),0);
      const todayRef = Object.entries(refundMap||{}).reduce((a,[k,v])=>k.split('__')[0].slice(0,10)===todayStr?a+(v||0):a,0);
      const todayDed = todaySlots.reduce((a,s)=>a+(s.deductAmount||0),0);
      byDay[todayStr] = { count: todaySlots.length, tgt: todaySlots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0), amt: todayAmt-todayRef, ded: todayDed };
    }

    const monthTotal = Object.values(byDay).reduce((a,v)=>a+(v.amt||0),0);
    const monthDeduct = Object.values(byDay).reduce((a,v)=>a+(v.ded||0),0);

    const sortedDays = Object.keys(byDay).sort().reverse();
    const DAY_PER = 12;

    const ov = document.createElement('div');
    ov.className = 'sp-overlay';
    ov.innerHTML = `<div class="total-popup-box">
      <div class="sp-title">${curYear}년 ${monthLabel} 정산 현황</div>
      <div class="sp-sub">${curYM} · 일자별 합산</div>
      <div class="sp-cards">
        <div class="sp-card c-green"><div class="sp-card-label">${monthLabel} 매출액(VAT 별도)</div><div class="sp-card-value" style="color:var(--accent)">${monthTotal.toLocaleString()}원</div></div>
        <div class="sp-card c-blue"><div class="sp-card-label">${monthLabel} 입금액(VAT 포함)</div><div class="sp-card-value" style="color:var(--info)">${Math.round(monthTotal*1.1).toLocaleString()}원</div></div>
        ${isAdmin?`<div class="sp-card c-red"><div class="sp-card-label">${monthLabel} 차감 금액(VAT 별도)</div><div class="sp-card-value" style="color:#f87171">${monthDeduct.toLocaleString()}원</div></div>`:''}
      </div>
      <div class="sp-section">일자별 합산</div>
      <table class="sp-tbl">
        <thead><tr><th>날짜</th><th>캠페인 수</th><th>일목표 합산</th><th>정산 금액(VAT 별도)</th><th>입금액(VAT 포함)</th>${isAdmin?'<th>차감액(VAT 별도)</th>':''}</tr></thead>
        <tbody id="mp-day-tbody"></tbody>
      </table>
      <div id="mp-day-pg" class="pagination" style="margin-top:12px;"></div>
      <div class="sp-footer"><button class="btn-close-sp" onclick="this.closest('.sp-overlay').remove()">닫기</button></div>
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });

    let mpCurPg = 1;
    function renderMpDay() {
      const total = Math.ceil(sortedDays.length / DAY_PER) || 1;
      const slice = sortedDays.slice((mpCurPg-1)*DAY_PER, mpCurPg*DAY_PER);
      ov.querySelector('#mp-day-tbody').innerHTML = slice.length
        ? slice.map(d => { const dv=byDay[d]; return `<tr><td style="font-weight:600">${d}</td><td>${dv.count}건</td><td>${dv.tgt.toLocaleString()}</td><td style="font-weight:700;color:var(--accent)">${dv.amt.toLocaleString()}원</td><td style="font-weight:700;color:var(--info)">${Math.round(dv.amt*1.1).toLocaleString()}원</td>${isAdmin?`<td style="font-weight:700;color:#f87171">${(dv.ded||0).toLocaleString()}원</td>`:''}</tr>`; }).join('')
        : `<tr><td colspan="${isAdmin?6:5}" style="color:var(--muted);padding:16px;text-align:center">데이터 없음</td></tr>`;
      const pgDiv = ov.querySelector('#mp-day-pg');
      if (total <= 1) { pgDiv.innerHTML=''; return; }
      let ph=`<button class="pg-btn" data-pg="1">&laquo;</button><button class="pg-btn" data-pg="${Math.max(1,mpCurPg-1)}">&lsaquo;</button>`;
      const s=Math.max(1,mpCurPg-2),e=Math.min(total,mpCurPg+2);
      if(s>1){ph+=`<button class="pg-btn" data-pg="1">1</button>`;if(s>2)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;}
      for(let i=s;i<=e;i++) ph+=`<button class="pg-btn${i===mpCurPg?' active':''}" data-pg="${i}">${i}</button>`;
      if(e<total){if(e<total-1)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;ph+=`<button class="pg-btn" data-pg="${total}">${total}</button>`;}
      ph+=`<button class="pg-btn" data-pg="${Math.min(total,mpCurPg+1)}">&rsaquo;</button><button class="pg-btn" data-pg="${total}">&raquo;</button>`;
      pgDiv.innerHTML = ph;
    }
    renderMpDay();
    ov.querySelector('#mp-day-pg').addEventListener('click', e => {
      const btn = e.target.closest('[data-pg]');
      if (!btn) return;
      mpCurPg = parseInt(btn.dataset.pg);
      renderMpDay();
    });
  };

      </div>

  window.renderSettle=async function(resetPage = true, forceReload = false){
    if (resetPage) { sPage = 1; }
    selectedSnapKeys.clear(); updateExportBtn();
    if (!_settleLoaded || forceReload) {
      document.getElementById('settle-body').innerHTML='<tr><td colspan="14"><div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div></td></tr>';
      [allSlots,allUsers,paidSet]=await Promise.all([HA.getSlots(),HA.getUsers(),HA.getPaidSet()]);
      try { refundMap = (await HA.getRefunds()) || {}; } catch(e) { refundMap={}; }
      snapshotMap={};
      try { snapshotMap = await HA.getAllSettleSnapshots(); } catch(e) { snapshotMap={}; }
      _settleLoaded = true;
    }
    if (!document.getElementById('settle-page')) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단

    renderSummary();

    // 과거 날짜 그룹 스냅샷 저장 (오늘 이전만, 아직 저장 안 된 그룹만)
    // 먼저 캐시된 allSlots로 "새로 얼려야 할 그룹"이 있는지만 싸게 확인 — 없으면 조회 자체를 스킵해서
    // 매 렌더(검색/필터/페이지 이동)마다 전체 slots를 다시 받는 비용을 피한다.
    const safe2=s=>s.replace(/[.#$[\]/]/g,'_');
    const findNewGroups = (slots) => groupByTimeAgency(slots.filter(s=>s.status==='active'||s.status==='accepted'||s.status==='expired'||s.status==='pending'))
      .filter(g => g.timeKey.slice(0,10) < todayStr && !snapshotMap[`${safe2(g.timeKey)}__${safe2(g.agencyId)}__${safe2(g.userId)}`]);
    if (findNewGroups(allSlots).length) {
      // 캐시된 allSlots/refundMap은 탭을 오래 열어둔 세션에서 승인/환불 전 상태로 낡아있을 수 있어,
      // 한 번 저장하면 영구 고정되는 스냅샷을 실제로 얼릴 때만 새로 조회해서 그 순간의 정확한 값을 쓴다.
      const [freshSlots, freshRefundMap] = await Promise.all([HA.getSlots(), HA.getRefunds().catch(()=>({}))]);
      const freshRefund = (timeKey,agencyId,userId) => (freshRefundMap||{})[refundKey(timeKey,agencyId,userId)]||0;
      for (const g of findNewGroups(freshSlots)) {
        const sk=`${safe2(g.timeKey)}__${safe2(g.agencyId)}__${safe2(g.userId)}`;
        const {tot:t,amt:a,ded:d,yup:y}=calcGroup(g);
        if(!a) continue; // 금액 없으면 스킵
        const r=freshRefund(g.timeKey,g.agencyId,g.userId);
        const snap={timeKey:g.timeKey,agencyId:g.agencyId,userId:g.userId,
          slotCount:g.slots.length,totalTarget:t,amount:a-r,refund:r,deductAmt:d,yupflAmt:y,
          unitPrice:getSlotPrice(g.slots[0])};
        await HA.saveSettleSnapshot(sk,snap,false); // 최초 1회만 저장
        snapshotMap[sk]=snap;
      }
    }
    if (!document.getElementById('settle-page')) return; // 스냅샷 저장 중 다른 메뉴로 이동한 경우 렌더 중단

    let rows=groupByTimeAgency(getFiltered());
    if(document.getElementById('sf-paid').value==='uncharged'){
      rows=rows.filter(g=>{
        const safe=s=>s.replace(/[.#$[\]/]/g,'_');
        const sk=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
        return !snapshotMap[sk]?.chargeConfirmedByName;
      });
    }
    filteredRows=rows;
    const start=(sPage-1)*PER;
    const list=rows.slice(start,start+PER);
    const body=document.getElementById('settle-body');
    if(!list.length){body.innerHTML='<tr class="empty-row"><td colspan="14">데이터가 없습니다.</td></tr>';return;}
    body.innerHTML=list.map(g=>{
      const safe=s=>s.replace(/[.#$[\]/]/g,'_');
      const snapKey=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
      const savedSnap=snapshotMap[snapKey];
      const groupDate=g.timeKey.slice(0,10);
      // 과거 날짜는 스냅샷, 오늘은 실시간
      const useSnap = groupDate < todayStr && savedSnap;
      const {p, pDisplay, tot, amt, ded, yup} = useSnap ? {
        p: savedSnap.unitPrice||getSlotPrice(g.slots[0]),
        pDisplay: (savedSnap.unitPrice||getSlotPrice(g.slots[0])).toLocaleString(),
        tot: savedSnap.totalTarget||0,
        amt: savedSnap.amount+(savedSnap.refund||0),
        ded: savedSnap.deductAmt||0,
        yup: savedSnap.yupflAmt||0,
      } : calcGroup(g);
      const refund = useSnap ? (savedSnap.refund||0) : getRefund(g.timeKey,g.agencyId,g.userId);
      const netAmt = amt-refund;
      const netVat = Math.round(netAmt*1.1);
      const pc     = g.slots.filter(s=>paidSet.has(s._key)).length;
      const allP   = pc===g.slots.length;
      const badge  = allP?'<span class="paid-badge">정산완료</span>':'<span class="unpaid-badge">미정산</span>';
      const ea     = encAttr(g.agencyId);
      const eu     = encAttr(g.userId);
      const et     = encAttr(g.timeKey);
      const memo = savedSnap?.memo || '';
      const chargeConfirmedByName = savedSnap?.chargeConfirmedByName || '';
      const chargeConfirmedAt = savedSnap?.chargeConfirmedAt ? new Date(savedSnap.chargeConfirmedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      const isCharged = !!chargeConfirmedByName;
      const chargeStaffCell = isCharged
        ? `<span style="font-size:11px;font-weight:700;color:var(--info)">${chargeConfirmedByName}</span>${chargeConfirmedAt?`<br><span style="font-size:10px;color:var(--muted)">${chargeConfirmedAt}</span>`:''}`
        : `<span style="color:var(--muted);font-size:11px">-</span>`;
      const confirmedByName = savedSnap?.confirmedByName || savedSnap?.confirmedBy || '';
      const confirmedAt = savedSnap?.confirmedAt ? new Date(savedSnap.confirmedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
      const confirmStaffCell = allP && confirmedByName
        ? `<span style="font-size:11px;font-weight:700;color:var(--info)">${confirmedByName}</span>${confirmedAt?`<br><span style="font-size:10px;color:var(--muted)">${confirmedAt}</span>`:''}`
        : `<span style="color:var(--muted);font-size:11px">-</span>`;
      const repTime = g.slots.map(s=>s.createdAt||'').sort()[0];
      return `<tr>
        <td><input type="checkbox" class="settle-chk" data-snapkey="${snapKey}" ${selectedSnapKeys.has(snapKey)?'checked':''} onchange="onSettleChkChange(this)"></td>
        <td style="color:var(--text2);font-size:11px">${fmtDatetime(repTime)}</td>
        <td><span class="agency-link" onclick="openAgencyPopup(decodeURIComponent('${ea}'),decodeURIComponent('${eu}'))">${escProd(g.agencyId)}</span></td>
        <td style="color:var(--text2)">${pDisplay}원</td>
        <td>${useSnap ? (savedSnap.slotCount||g.slots.length) : g.slots.length}건</td>
        <td><strong>${tot.toLocaleString()}</strong></td>
        <td style="font-weight:700;color:var(--accent)">${netAmt.toLocaleString()}원</td>
        ${isAdmin?`<td style="color:#7c3aed">${yup>0?yup.toLocaleString()+'원':'-'}</td>`:''}
        ${isAdmin?`<td style="color:var(--danger)">${ded>0?ded.toLocaleString()+'원':'-'}</td>`:''}
        <td style="font-weight:700;color:var(--info)">${netVat.toLocaleString()}원</td>
        <td style="color:var(--danger);font-weight:700">${refund>0?refund.toLocaleString()+'원':'-'}</td>
        <td>${badge}</td>
        <td>${chargeStaffCell}</td>
        <td>${confirmStaffCell}</td>
        <td style="white-space:nowrap;">
          <div style="display:flex;gap:4px;justify-content:center;align-items:center;">
            <button class="action-btn btn-toggle" style="${isCharged?'background:#f1f5f9;color:var(--text2);box-shadow:inset 0 2px 4px rgba(0,0,0,.15);':'background:var(--info);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);'}"
              onclick="${isCharged?"this.style.background='var(--info)';this.style.color='#fff';this.style.boxShadow='0 2px 0 rgba(0,0,0,.15)';":"this.style.background='#f1f5f9';this.style.color='var(--text2)';this.style.boxShadow='inset 0 2px 4px rgba(0,0,0,.15)';"}chargeConfirm(decodeURIComponent('${et}'),decodeURIComponent('${ea}'),decodeURIComponent('${eu}'))">충전</button>
            <button class="action-btn btn-toggle" style="${allP?'background:#f1f5f9;color:var(--text2);box-shadow:inset 0 2px 4px rgba(0,0,0,.15);':'background:var(--accent);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);'}"

              onclick="openMemoPopup('${snapKey}',decodeURIComponent('${et}'),decodeURIComponent('${ea}'),decodeURIComponent('${eu}'))">메모</button>
            <button class="btn-refund" onclick="setRefund(decodeURIComponent('${et}'),decodeURIComponent('${ea}'),decodeURIComponent('${eu}'))">환불</button>
          </div>
        </td>
      </tr>`;

  window.chargeConfirm=async function(timeKey,agencyId,userId){
    const safe=s=>s.replace(/[.#$[\]/]/g,'_');
    const snapKey=`${safe(timeKey)}__${safe(agencyId)}__${safe(userId)}`;
    const snap=snapshotMap[snapKey];
    const isCharged=!!snap?.chargeConfirmedByName;
    const currentUser=HA.getCurrentUser?HA.getCurrentUser():null;
    const staffName=currentUser?(currentUser.name||currentUser.username):'알 수 없음';
    const staffId=currentUser?currentUser.username:'-';
    if(!isCharged){
      const updates={chargeConfirmedAt:new Date().toISOString(),chargeConfirmedBy:staffId,chargeConfirmedByName:staffName};
      if(snap){
        Object.assign(snap,updates);
        await HA.saveSettleSnapshot(snapKey,snap,true);
      } else {
        const slots=allSlots.filter(s=>getMinuteKey(s.createdAt)===timeKey&&s.agencyId===agencyId&&s.userId===userId);
        const tot=slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
        const amt=slots.reduce((a,s)=>a+slotAmount(s),0);
        const ded=slots.reduce((a,s)=>a+(s.deductAmount||0),0);
        const yup=slots.reduce((a,s)=>a+(s.yupflAmount||0),0);
        const refund=getRefund(timeKey,agencyId,userId);
        const newSnap={timeKey,agencyId,userId,slotCount:slots.length,totalTarget:tot,amount:amt-refund,refund,deductAmt:ded,yupflAmt:yup,unitPrice:getSlotPrice(slots[0]),...updates};
        await HA.saveSettleSnapshot(snapKey,newSnap,true);
        snapshotMap[snapKey]=newSnap;
      }
    } else {
      if(snap){
        delete snap.chargeConfirmedAt;
        delete snap.chargeConfirmedBy;
        delete snap.chargeConfirmedByName;
        await HA.saveSettleSnapshot(snapKey,snap,true);
      }
    }
    renderSettle(false);
  };

  window.bulkRow=async function(timeKey,agencyId,userId){
    const keys=allSlots.filter(s=>getMinuteKey(s.createdAt)===timeKey&&s.agencyId===agencyId&&s.userId===userId).map(s=>s._key);
    const allP=keys.every(k=>paidSet.has(k));
    const nowPaid=!allP;
    const currentUser=HA.getCurrentUser?HA.getCurrentUser():null;
    const staffName=currentUser?(currentUser.name||currentUser.username):'알 수 없음';
    const staffId=currentUser?currentUser.username:'-';
    const safe=s=>s.replace(/[.#$[\]/]/g,'_');
    const snapKey=`${safe(timeKey)}__${safe(agencyId)}__${safe(userId)}`;
    if(nowPaid){
      const slots=allSlots.filter(s=>getMinuteKey(s.createdAt)===timeKey&&s.agencyId===agencyId&&s.userId===userId);
      const p=getPrice(userId);
      const tot=slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
      const amt=slots.reduce((a,s)=>a+slotAmount(s),0);
      const ded=slots.reduce((a,s)=>a+(s.deductAmount||0),0);
      const yup=slots.reduce((a,s)=>a+(s.yupflAmount||0),0);
      const refund=getRefund(timeKey,agencyId,userId);
      // 기존 스냅샷 보존(충전 담당자 등) 후 입금 필드만 덮어쓰기
      const existing=snapshotMap[snapKey]||{};
      const snap={...existing,slotCount:slots.length,totalTarget:tot,amount:amt-refund,deductAmt:ded,yupflAmt:yup,unitPrice:p,refund,agencyId,userId,timeKey,
        confirmedAt:new Date().toISOString(),confirmedBy:staffId,confirmedByName:staffName};
      await HA.saveSettleSnapshot(snapKey,snap,true);
      snapshotMap[snapKey]=snap;
    } else {
      const existing=snapshotMap[snapKey];
      if(existing?.chargeConfirmedByName){
        // 충전 확인 로그가 있으면 입금 필드만 제거, 스냅샷 유지
        delete existing.confirmedAt;
        delete existing.confirmedBy;
        delete existing.confirmedByName;
        await HA.saveSettleSnapshot(snapKey,existing,true);
      } else {
        try{await HA.deleteSettleSnapshot(snapKey);}catch(e){}
        delete snapshotMap[snapKey];
      }
    }
    await Promise.all(keys.map(k=>HA.setPaid(k,nowPaid)));
    keys.forEach(k=>{ if(nowPaid) paidSet.add(k); else paidSet.delete(k); });
    renderSettle(false);
  };

  window.openAgencyPopup=function(agencyId,userId){

    const byMonth={}, byDay={};
    let totA=0, totTgt=0, totalRefund=0, totalDeduct=0, totalYup=0;

    // ── 과거 날짜: 스냅샷 기준 집계 ──
    Object.entries(snapshotMap)
      .filter(([k,v]) => v.agencyId===agencyId && v.userId===userId && (v.timeKey||'').slice(0,10) < todayStr)
      .forEach(([k,v]) => {
        const date = v.timeKey.slice(0,10);
        const month = date.slice(0,7);
        const grossAmt = (v.amount||0) + (v.refund||0);
        const ref = v.refund||0;
        const net = grossAmt - ref;
        const tgt = v.totalTarget||0;
        const ded = v.deductAmt||0;
        const yup = v.yupflAmt||0;
        totA += net; totTgt += tgt; totalRefund += ref; totalDeduct += ded; totalYup += yup;
        if(!byMonth[month]) byMonth[month]={count:0,tgt:0,net:0,ded:0,yup:0};
        byMonth[month].count += v.slotCount||1; byMonth[month].tgt += tgt; byMonth[month].net += net; byMonth[month].ded += ded; byMonth[month].yup += yup;
        if(!byDay[date]) byDay[date]={count:0,tgt:0,net:0,ded:0,yup:0};
        byDay[date].count += v.slotCount||1; byDay[date].tgt += tgt; byDay[date].net += net; byDay[date].ded += ded; byDay[date].yup += yup;
      });

    // ── 오늘 날짜: 스냅샷 무시, allSlots 실시간 전체 집계 ──
    const todaySlots = allSlots.filter(s => {
      if(s.agencyId !== agencyId || s.userId !== userId) return false;
      if(!(s.status==='active'||s.status==='accepted'||s.status==='expired'||s.status==='pending')) return false;
      const d=new Date(s.createdAt||'');
      const yyyy=d.getFullYear();
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const dd=String(d.getDate()).padStart(2,'0');
      const sDate=`${yyyy}-${mo}-${dd}`;
      return sDate === todayStr;
    });
    if (todaySlots.length > 0) {
      // 분 단위 그룹핑
      const todayGroups = {};
      todaySlots.forEach(s => {
        const t = getMinuteKey(s.createdAt);
        if (!todayGroups[t]) todayGroups[t] = [];
        todayGroups[t].push(s);
      });
      const month = todayStr.slice(0,7);
      if (!byMonth[month]) byMonth[month] = {count:0,tgt:0,net:0,ded:0,yup:0};
      if (!byDay[todayStr]) byDay[todayStr] = {count:0,tgt:0,net:0,ded:0,yup:0};
      Object.entries(todayGroups).forEach(([t, grpSlots]) => {
        const amt = grpSlots.reduce((a,s)=>a+slotAmount(s),0);
        const tgt = grpSlots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
        const ref = getRefund(t, agencyId, userId);
        const ded = grpSlots.reduce((a,s)=>a+(s.deductAmount||0),0);
        const yup = grpSlots.reduce((a,s)=>a+(s.yupflAmount||0),0);
        const net = amt - ref;
        totA += net; totTgt += tgt; totalRefund += ref; totalDeduct += ded; totalYup += yup;
        byMonth[month].count += grpSlots.length; byMonth[month].tgt += tgt; byMonth[month].net += net; byMonth[month].ded += ded; byMonth[month].yup += yup;
        byDay[todayStr].count += grpSlots.length; byDay[todayStr].tgt += tgt; byDay[todayStr].net += net; byDay[todayStr].ded += ded; byDay[todayStr].yup += yup;
      });
    }

    const p=getPrice(userId);
    const netTotA=totA;
    const userMemo=allUsers.find(u=>u.username===userId)?.memo||'';

    const mRows=Object.keys(byMonth).sort().reverse().map(m=>{
      const mv=byMonth[m];
      return `<tr><td style="font-weight:600">${m}</td><td>${mv.count}건</td><td>${mv.tgt.toLocaleString()}</td><td style="font-weight:700;color:var(--accent)">${mv.net.toLocaleString()}원</td><td style="font-weight:700;color:var(--info)">${Math.round(mv.net*1.1).toLocaleString()}원</td>${isAdmin?`<td style="font-weight:700;color:#7c3aed">${(mv.yup||0).toLocaleString()}원</td><td style="font-weight:700;color:#f87171">${mv.ded.toLocaleString()}원</td>`:''}</tr>`;
    }).join('');
    const sortedAgDays = Object.keys(byDay).sort().reverse();
    const AG_DAY_PER = 12;

    const ov=document.createElement('div');
    ov.className='sp-overlay';
    ov.innerHTML=`<div class="sp-box">
      <div class="sp-title">${escProd(agencyId)}</div>
      <div class="sp-sub">유저ID: ${escProd(userId)} · 단가: ${p.toLocaleString()}원/개${userMemo ? ` · <span style="color:var(--danger);font-weight:600">${escProd(userMemo)}</span>` : ''}</div>
      <div class="sp-cards">
        <div class="sp-card c-green"><div class="sp-card-label">총 정산 금액(VAT 별도)</div><div class="sp-card-value" style="color:var(--accent)">${netTotA.toLocaleString()}원</div></div>
        <div class="sp-card c-blue"><div class="sp-card-label">총 입금액(VAT 포함)</div><div class="sp-card-value" style="color:var(--info)">${Math.round(netTotA*1.1).toLocaleString()}원</div></div>
        <div class="sp-card c-green"><div class="sp-card-label">총 목표 합산</div><div class="sp-card-value" style="color:var(--accent)">${totTgt.toLocaleString()}<small style="font-size:13px;font-weight:400;color:var(--muted)"> 개</small></div></div>
        <div class="sp-card c-red"><div class="sp-card-label">환불 금액</div><div class="sp-card-value" style="color:var(--danger)">${totalRefund.toLocaleString()}원</div></div>
        ${isAdmin?`<div class="sp-card c-purple"><div class="sp-card-label">유입플 금액(VAT 별도)</div><div class="sp-card-value" style="color:#7c3aed">${totalYup.toLocaleString()}원</div></div>`:''}
        ${isAdmin?`<div class="sp-card c-red"><div class="sp-card-label">차감 금액(VAT 별도)</div><div class="sp-card-value" style="color:#f87171">${totalDeduct.toLocaleString()}원</div></div>`:''}
      </div>
      <div class="sp-section">월별 합산</div>
      <table class="sp-tbl"><thead><tr><th>월</th><th>캠페인 수</th><th>월별 목표 합산</th><th>정산 금액(VAT 별도)</th><th>입금액(VAT 포함)</th>${isAdmin?'<th>유입플액(VAT 별도)</th><th>차감액(VAT 별도)</th>':''}</tr></thead>
        <tbody>${mRows||`<tr><td colspan="${isAdmin?7:5}" style="color:var(--muted);padding:16px;text-align:center">데이터 없음</td></tr>`}</tbody></table>
      <div class="sp-section">일별 합산</div>
      <table class="sp-tbl"><thead><tr><th>날짜</th><th>캠페인 수</th><th>일목표합산</th><th>정산 금액(VAT 별도)</th><th>입금액(VAT 포함)</th>${isAdmin?'<th>유입플액(VAT 별도)</th><th>차감액(VAT 별도)</th>':''}</tr></thead>
        <tbody id="ag-day-tbody"></tbody></table>
      <div id="ag-day-pg" class="pagination" style="margin-top:12px;"></div>
      <div class="sp-footer"><button class="btn-close-sp" onclick="this.closest('.sp-overlay').remove()">닫기</button></div>
    </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});

    let agCurPg = 1;
    function renderAgDay() {
      const total = Math.ceil(sortedAgDays.length / AG_DAY_PER) || 1;
      const slice = sortedAgDays.slice((agCurPg-1)*AG_DAY_PER, agCurPg*AG_DAY_PER);
      ov.querySelector('#ag-day-tbody').innerHTML = slice.length
        ? slice.map(d => { const dv=byDay[d]; return `<tr><td>${d}</td><td>${dv.count}건</td><td>${dv.tgt.toLocaleString()}</td><td style="font-weight:700;color:var(--accent)">${dv.net.toLocaleString()}원</td><td style="font-weight:700;color:var(--info)">${Math.round(dv.net*1.1).toLocaleString()}원</td>${isAdmin?`<td style="font-weight:700;color:#7c3aed">${(dv.yup||0).toLocaleString()}원</td><td style="font-weight:700;color:#f87171">${dv.ded.toLocaleString()}원</td>`:''}</tr>`; }).join('')

      const pgDiv = ov.querySelector('#ag-day-pg');
      if (total <= 1) { pgDiv.innerHTML=''; return; }
      let ph=`<button class="pg-btn" data-pg="1">&laquo;</button><button class="pg-btn" data-pg="${Math.max(1,agCurPg-1)}">&lsaquo;</button>`;
      const s=Math.max(1,agCurPg-2),e=Math.min(total,agCurPg+2);
      if(s>1){ph+=`<button class="pg-btn" data-pg="1">1</button>`;if(s>2)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;}
      for(let i=s;i<=e;i++) ph+=`<button class="pg-btn${i===agCurPg?' active':''}" data-pg="${i}">${i}</button>`;
      if(e<total){if(e<total-1)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;ph+=`<button class="pg-btn" data-pg="${total}">${total}</button>`;}
      ph+=`<button class="pg-btn" data-pg="${Math.min(total,agCurPg+1)}">&rsaquo;</button><button class="pg-btn" data-pg="${total}">&raquo;</button>`;
      pgDiv.innerHTML = ph;
    }
    renderAgDay();
    ov.querySelector('#ag-day-pg').addEventListener('click', e => {
      const btn = e.target.closest('[data-pg]');
      if (!btn) return;
      agCurPg = parseInt(btn.dataset.pg);
      renderAgDay();
    });
  };

  window.exportSettleExcel=function(){
    let rows;
    if(selectedSnapKeys.size>0){
      rows=filteredRows.filter(g=>{
        const safe=s=>s.replace(/[.#$[\]/]/g,'_');
        const sk=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
        return selectedSnapKeys.has(sk);
      });
    } else {
      rows=filteredRows;
    }

    if(!rows.length) return alert('다운로드할 데이터가 없습니다.');

    function buildAndDownload(){
      const XLSX=window.XLSX;
      const wb=XLSX.utils.book_new();
      const header=['접수일시','대행사','단가(원)','캠페인 수','일 목표 합산','정산 금액(VAT 별도)',...(isAdmin?['유입플 금액','차감 금액']:[]),'입금액(VAT 포함)','환불 금액','정산상태'];
      const dataRows=rows.map(g=>{
        const safe=s=>s.replace(/[.#$[\]/]/g,'_');
        const snapKey=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
        const savedSnap=snapshotMap[snapKey];
        const gDate=g.timeKey.slice(0,10);
        const useSnap=gDate<todayStr&&savedSnap;
        const tot=g.slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
        const grossAmt=useSnap?(savedSnap.amount+(savedSnap.refund||0)):g.slots.reduce((ac,s)=>ac+slotAmount(s),0);
        const refund=useSnap?(savedSnap.refund||0):getRefund(g.timeKey,g.agencyId,g.userId);
        const netAmt=grossAmt-refund;
        const p=useSnap?(savedSnap.unitPrice||getSlotPrice(g.slots[0])):getSlotPrice(g.slots[0]);
        const ded=useSnap?(savedSnap.deductAmt||0):g.slots.reduce((ac,s)=>ac+(s.deductAmount||0),0);
        const yup=useSnap?(savedSnap.yupflAmt||0):g.slots.reduce((ac,s)=>ac+(s.yupflAmount||0),0);
        const pc=g.slots.filter(s=>paidSet.has(s._key)).length;
        const status=pc===g.slots.length?'정산완료':'미정산';
        return [g.timeKey,g.agencyId,p,g.slots.length,tot,netAmt,...(isAdmin?[yup,ded]:[]),Math.round(netAmt*1.1),refund,status];
      });
      const ws=XLSX.utils.aoa_to_sheet([header,...dataRows]);
      ws['!cols']=[{wch:18},{wch:16},{wch:12},{wch:10},{wch:14},{wch:20},...(isAdmin?[{wch:16},{wch:16}]:[]),{wch:20},{wch:12},{wch:10}];
      XLSX.utils.book_append_sheet(wb,ws,'정산');
      const today=new Date();
      const dateStr=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
      XLSX.writeFile(wb,`정산내역_${dateStr}.xlsx`);
    }

    if(window.XLSX){
      buildAndDownload();
    } else {
      const script=document.createElement('script');
      script.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.onload=buildAndDownload;
      document.head.appendChild(script);
    }
  };

  window.bulkPayConfirm=async function(){
    const keys=[...selectedSnapKeys];
    if(!keys.length) return alert('선택된 항목이 없습니다.');
    if(!confirm(`선택된 ${keys.length}건을 입금 확인 처리하시겠습니까?`)) return;
    const currentUser=HA.getCurrentUser?HA.getCurrentUser():null;
    const staffName=currentUser?(currentUser.name||currentUser.username):'알 수 없음';
    const staffId=currentUser?currentUser.username:'-';
    for(const snapKey of keys){
      // snap 유무와 관계없이 슬롯 먼저 조회
      const slots=allSlots.filter(s=>{
        const safe=v=>v.replace(/[.#$[\]/]/g,'_');
        return `${safe(getMinuteKey(s.createdAt))}__${safe(s.agencyId||'-')}__${safe(s.userId||'-')}`===snapKey;
      });
      if(!slots.length) continue;
      const slotKeys=slots.map(s=>s._key);
      const allP=slotKeys.every(k=>paidSet.has(k));
      if(allP) continue;
      const timeKey=getMinuteKey(slots[0].createdAt);
      const agencyId=slots[0].agencyId||'-';
      const userId=slots[0].userId||'-';
      const tot=slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
      const amt=slots.reduce((a,s)=>a+slotAmount(s),0);
      const ded=slots.reduce((a,s)=>a+(s.deductAmount||0),0);
      const yup=slots.reduce((a,s)=>a+(s.yupflAmount||0),0);
      const refund=getRefund(timeKey,agencyId,userId);
      const existing=snapshotMap[snapKey]||{};
      const newSnap={...existing,slotCount:slots.length,totalTarget:tot,amount:amt-refund,deductAmt:ded,yupflAmt:yup,unitPrice:getSlotPrice(slots[0]),refund,agencyId,userId,timeKey,
        confirmedAt:new Date().toISOString(),confirmedBy:staffId,confirmedByName:staffName};
      await HA.saveSettleSnapshot(snapKey,newSnap,true);
      snapshotMap[snapKey]=newSnap;
      await Promise.all(slotKeys.map(k=>HA.setPaid(k,true)));
      slotKeys.forEach(k=>paidSet.add(k));
    }
    renderSettle(false);
  };

  window.openSettleRegModal=function(){
    const safe=s=>s.replace(/[.#$[\]/]/g,'_');
    let rows;
    if(selectedSnapKeys.size>0){
      rows=filteredRows.filter(g=>{
        const sk=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
        return selectedSnapKeys.has(sk);
      });
    } else {
      rows=filteredRows;
    }
    if(!rows.length) return;
    const regBody=document.getElementById('settle-reg-body');
    const regSub=document.getElementById('settle-reg-sub');
    const regOverlay=document.getElementById('settle-reg-overlay');

    const agencyRows=rows.map(g=>{
      const snapKey=`${safe(g.timeKey)}__${safe(g.agencyId)}__${safe(g.userId)}`;
      const savedSnap=snapshotMap[snapKey];
      const groupDate=g.timeKey.slice(0,10);
      const useSnap=groupDate<todayStr&&savedSnap;
      const tot=useSnap?(savedSnap.totalTarget||0):g.slots.reduce((a,s)=>a+(s.dailyTarget||0)*(s.days||0),0);
      const grossAmt=useSnap?(savedSnap.amount+(savedSnap.refund||0)):g.slots.reduce((a,s)=>a+slotAmount(s),0);
      const refund=useSnap?(savedSnap.refund||0):getRefund(g.timeKey,g.agencyId,g.userId);
      const netAmt=grossAmt-refund;
      const uPrice=useSnap?(savedSnap.unitPrice||getSlotPrice(g.slots[0])):getSlotPrice(g.slots[0]);
      const slotCount=useSnap?(savedSnap.slotCount||g.slots.length):g.slots.length;
      const allP=g.slots.every(s=>paidSet.has(s._key));
      return {date:g.timeKey,agency:g.agencyId,userId:g.userId,campaigns:slotCount,totalGoal:tot,unitPrice:uPrice,amount:netAmt,deposit:Math.round(netAmt*1.1),refund,status:allP?'정산완료':'미정산'};
    });

    const order=[],groups={};
    agencyRows.forEach(r=>{
      if(!groups[r.agency]){groups[r.agency]=[];order.push(r.agency);}
      groups[r.agency].push(r);
    });

    const container=document.createElement('div');
    order.forEach(agency=>{
      const list=groups[agency];
      let totalAmt=0,totalDep=0,totalRefund=0,totalCamp=0,totalG=0,pendCount=0;
      list.forEach(r=>{totalAmt+=r.amount;totalDep+=r.deposit;totalRefund+=r.refund;totalCamp+=r.campaigns;totalG+=r.totalGoal;if(r.status!=='정산완료')pendCount++;});

      const block=document.createElement('div');
      block.className='agency-block';

      const hd=document.createElement('div');
      hd.className='agency-hd';
      hd.innerHTML=`<div><div class="aname">${escProd(agency)}</div><div class="ameta">총 ${totalCamp}건 · 전체 목표 ${Math.round(totalG).toLocaleString()}건</div></div><button class="agency-copy-btn">📋 복사</button>`;
      block.appendChild(hd);

      const wrap=document.createElement('div');
      wrap.style.overflowX='auto';
      const tbl=document.createElement('table');
      tbl.className='ag-table';
      tbl.innerHTML=`<thead><tr><th>접수일시</th><th>유저ID</th><th>캠페인 수</th><th>일 목표 합산</th><th>단가(원)</th><th>정산 금액(VAT 별도)</th><th>입금액(VAT 포함)</th><th>환불 금액</th><th>상태</th></tr></thead>`;
      const tbody=document.createElement('tbody');
      list.forEach(r=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${escProd(r.date)}</td><td>${escProd(r.userId)}</td><td style="text-align:right">${r.campaigns.toLocaleString()}</td><td style="text-align:right"><b>${Math.round(r.totalGoal).toLocaleString()}</b></td><td style="text-align:right">${Math.round(r.unitPrice).toLocaleString()}</td><td style="text-align:right"><b>${Math.round(r.amount).toLocaleString()}</b></td><td style="text-align:right;color:var(--info);font-weight:700">${Math.round(r.deposit).toLocaleString()}</td><td style="text-align:right${r.refund?';color:#dc2626;font-weight:700':''}">${r.refund?Math.round(r.refund).toLocaleString():'-'}</td><td><span class="badge ${r.status==='정산완료'?'badge-done':'badge-pend'}">${r.status}</span></td>`;
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);wrap.appendChild(tbl);block.appendChild(wrap);

      const ft=document.createElement('div');
      ft.className='agency-ft';
      ft.innerHTML=`<div class="totals"><span>정산 합계 <b>${Math.round(totalAmt).toLocaleString()}원</b></span><span>입금 합계 <b>${Math.round(totalDep).toLocaleString()}원</b></span>${totalRefund?`<span style="color:#dc2626">환불 <b>${Math.round(totalRefund).toLocaleString()}원</b></span>`:''}</div><div class="charge-status-cell" data-agency="${escProd(agency)}" data-amount="${Math.round(totalAmt)}"></div>`;
      block.dataset.rows=JSON.stringify(list.map(r=>({timeKey:r.date,agencyId:r.agency,userId:r.userId})));
      block.appendChild(ft);
      container.appendChild(block);

      hd.querySelector('.agency-copy-btn').onclick=function(){
        const uPrice=list[0].unitPrice;
        const header=`• 캠페인 수: ${totalCamp}건\n• 전체 목표: ${Math.round(totalG).toLocaleString()}개\n\n• 단가: ${Math.round(uPrice).toLocaleString()}원\n`;
        const amtPart=totalRefund>0?`• 환불 금액: -${Math.round(totalRefund).toLocaleString()}원\n• 금액: ${Math.round(totalAmt).toLocaleString()}원 (VAT 별도)\n\n• 입금액: ${Math.round(totalDep).toLocaleString()}원 (VAT 포함)`:`• 금액: ${Math.round(totalAmt).toLocaleString()}원 (VAT 별도)\n\n• 입금액: ${Math.round(totalDep).toLocaleString()}원 (VAT 포함)`;
        const msg=header+amtPart+'\n\n주식회사 하이어애드\n666-045450-04-013\nIBK기업은행\n\n확인 후 입금 부탁드립니다.';
        navigator.clipboard.writeText(msg).then(()=>{
          const btn=this;
          btn.classList.add('ok');btn.textContent='✓ 복사됨';
          setTimeout(()=>{btn.classList.remove('ok');btn.textContent='📋 복사';},1500);
        });
      };
    });

    const cBtn=document.getElementById('settle-charge-btn');
    if(!window.settleCharging){
      const allCharged=rows.every(r=>snapshotMap[refundKey(r.timeKey,r.agencyId,r.userId)]?.chargeConfirmedByName);
      if(allCharged){cBtn.disabled=true;cBtn.textContent='✅ 충전 완료';cBtn.style.background='#475569';cBtn.style.cursor='default';}
      else{cBtn.disabled=false;cBtn.textContent='⚡ 충전 신청';cBtn.style.background='#4f46e5';cBtn.style.cursor='pointer';}
    }
    regBody.innerHTML='';
    regBody.appendChild(container);
    regSub.textContent=selectedSnapKeys.size>0?`선택 ${rows.length}건`:`전체 ${rows.length}건`;
    regOverlay.style.display='flex';
  };

  window.startSettleCharge=async function(){
    const safe=s=>s.replace(/[.#$[\]/]/g,'_');
    const badge=(bg,fg,txt)=>`<span style="display:inline-block;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;background:${bg};color:${fg}">${txt}</span>`;
    const btn=document.getElementById('settle-charge-btn');
    window.settleCharging=true;
    btn.disabled=true;btn.textContent='⏳ 처리 중...';btn.style.background='#6b7280';btn.style.cursor='default';
    const {getDatabase,ref,get}=await import('https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js');
    const db=getDatabase();
    const SERVER='https://macro-1-bizfit-charge-938928195180.asia-northeast3.run.app';
    for(const cell of document.querySelectorAll('#settle-reg-body .charge-status-cell')){
      const agencyId=cell.dataset.agency;
      const amount=parseInt(cell.dataset.amount);
      const rowsData=JSON.parse(cell.closest('.agency-block').dataset.rows||'[]');
      if(rowsData.every(r=>snapshotMap[refundKey(r.timeKey,r.agencyId,r.userId)]?.chargeConfirmedByName)){
        cell.innerHTML=badge('#f0fdf4','#166534','✅ 이미 충전 완료');
        continue;
      }
      if(rowsData.some(r=>snapshotMap[refundKey(r.timeKey,r.agencyId,r.userId)]?.chargeConfirmedByName)){
        cell.innerHTML=badge('#fee2e2','#991b1b','❌ 일부 항목 이미 충전됨 (충전 담당자 확인 필요)');
        continue;
      }
      const acctSnap=await get(ref(db,`ha/bizfit_charge/${safe(agencyId)}`));
      const acct=acctSnap.exists()?acctSnap.val():null;
      if(!acct){
        cell.innerHTML=badge('#fef9c3','#854d0e','⚠️ 계정 정보 미등록');
        continue;
      }
      cell.innerHTML=badge('#dbeafe','#1d4ed8',`⏳ 충전 중... ${amount.toLocaleString()}원`);
      let ok=false,resultMsg='';
      try{
        const res=await fetch(`${SERVER}/charge-stream`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:acct.id,pw:acct.pw,amount}),signal:AbortSignal.timeout(120000)});
        if(!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
        const reader=res.body.getReader();const decoder=new TextDecoder();let buffer='';
        outer:while(true){
          const{done:sd,value}=await reader.read();if(sd)break;
          buffer+=decoder.decode(value,{stream:true});
          const lines=buffer.split('\n');buffer=lines.pop();
          for(const line of lines){
            if(!line.startsWith('data: '))continue;
            let data;try{data=JSON.parse(line.slice(6));}catch{continue;}
            if(data.ping)continue;
            if(data.done!==undefined){ok=data.done.success;resultMsg=data.done.message||(ok?'충전 완료':'실패');break outer;}
          }
        }
      }catch(e){ok=false;resultMsg=`서버 연결 실패: ${e.message}`;}
      if(ok){
        cell.innerHTML=badge('#dcfce7','#166534',`✅ 캐시 충전 완료 · ${amount.toLocaleString()}원`);
        await Promise.all(rowsData
          .filter(r=>!snapshotMap[refundKey(r.timeKey,r.agencyId,r.userId)]?.chargeConfirmedByName)
          .map(r=>chargeConfirm(r.timeKey,r.agencyId,r.userId)));
      }else{
        cell.innerHTML=badge('#fee2e2','#991b1b',`❌ ${resultMsg}`);
      }
    }
    window.settleCharging=false;
    btn.textContent='✅ 충전 완료';btn.style.background='#475569';
  };

  renderSettle(false);
})();
</script>
