<div id="user-page">
<style>
  #user-page .action-bar { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  #user-page input[type=text] { padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; color:var(--text); background:#fff; outline:none; }
  #user-page .tbl-wrap { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  #user-page table { width:100%; border-collapse:collapse; font-size:12px; }
  #user-page thead th { background:#1e293b; color:#fff; padding:12px 10px; font-weight:500; border-right:1px solid #2d3f55; text-align:center; white-space:nowrap; }
  #user-page tbody td { padding:12px 10px; border-bottom:1px solid var(--border); text-align:center; vertical-align:middle; }
  #user-page tbody tr:last-child td { border-bottom:none; }
  #user-page tbody tr:hover { background:#f8fafc; }
  .req { color:var(--danger); font-size:10px; margin-left:2px; vertical-align:top; }
  .pw-input-wrap { position:relative; }
  .pw-masked { -webkit-text-security:disc; }  /* type=password면 크롬이 로그인으로 보고 저장 팝업을 띄워 text + CSS 가리기 */
  .pw-input-wrap input { padding-right:34px !important; }
  .pw-eye-btn { position:absolute; right:6px; top:50%; transform:translateY(-50%); cursor:pointer; line-height:1; background:none; border:none; padding:4px; color:var(--text2); display:flex; align-items:center; }
  .pw-eye-btn svg { width:16px; height:16px; }
  .action-btn { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; }
  .btn-edit    { background:#eff6ff; color:#1d4ed8; }
  .btn-del     { background:#fef2f2; color:var(--danger); }
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center; }
  .modal-box { background:#fff;border-radius:16px;width:460px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .modal-title { font-size:17px;font-weight:700;margin-bottom:20px; }
  .modal-field { margin-bottom:14px; }
  .modal-field label { display:block;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:5px; }
  .modal-field input,.modal-field select { width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;outline:none;color:var(--text); }
  .modal-field input:focus { border-color:var(--accent); }
  .modal-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  .modal-row-3 { grid-template-columns:1fr 1fr 1fr; }
  .modal-footer { display:flex;justify-content:flex-end;gap:10px;margin-top:20px; }
  .btn-cancel { padding:8px 20px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:13px; }
  .btn-save   { padding:8px 20px;border:none;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:600; }
  .btn-save:hover { background:var(--accent2); }
  .empty-row td { height:200px;text-align:center;color:var(--muted);font-size:13px; }
  .pagination { display:flex;justify-content:center;gap:5px;margin-top:16px; }
  .pg-btn { width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center; }
  .pg-btn.active { background:var(--info);color:#fff;border-color:var(--info); }
  .loading-wrap { display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:13px;gap:8px; }
  .spinner { width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .agency-link { color:var(--info); font-weight:700; cursor:pointer; text-decoration:underline; }
  .agency-link:hover { color:var(--accent); }
  .sp-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px; }
  .sp-box { background:#fff;border-radius:16px;width:620px;max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .sp-title { font-size:17px;font-weight:800;margin-bottom:2px; }
  .sp-sub { font-size:12px;color:var(--muted);margin-bottom:16px; }
  .sp-cards { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px; }
  .sp-card { background:#f8fafc;border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;text-align:center; }
  .sp-card::after { content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--border); }
  .sp-card.c-green::after { background:var(--accent); }
  .sp-card.c-blue::after  { background:var(--info); }
  .sp-card.c-warn::after  { background:var(--warn); }
  .sp-card-label { font-size:11px;color:var(--text2);font-weight:600;margin-bottom:8px; }
  .sp-card-value { font-size:20px;font-weight:800;line-height:1; }
  .sp-section { font-size:13px;font-weight:700;margin-bottom:8px;margin-top:16px;color:var(--text); }
  .sp-tbl { width:100%;border-collapse:collapse;font-size:12px; }
  .sp-tbl th { background:#1e293b;color:#fff;padding:8px 8px;font-weight:500;text-align:center;white-space:nowrap; }
  .sp-tbl td { padding:8px 8px;border-bottom:1px solid var(--border);text-align:center;color:var(--text2);white-space:nowrap; }
  .sp-tbl tr:last-child td { border-bottom:none; }
  .sp-footer { display:flex;justify-content:flex-end;margin-top:20px; }
  .btn-close-sp { padding:9px 24px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit; }


  /* ── 반응형 ── */
  @media (max-width: 768px) {
    #user-page .action-bar { flex-wrap: wrap; gap: 6px; }
    #user-page .action-bar > * { flex: 1 1 calc(50% - 6px); min-width: 120px; }
    #user-page .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #user-page table { min-width: 700px; }
    .modal-box { width: calc(100vw - 32px); padding: 20px; }
    .modal-row { grid-template-columns: 1fr; }
  }
</style>

<div class="action-bar">
  <input type="text" id="u-kw" placeholder="아이디/대행사 검색" style="width:200px;" onkeydown="if(event.key==='Enter') renderUsers()">
  <button class="action-btn" style="background:#475569;color:#fff;padding:6px 14px;" onclick="renderUsers()">검색</button>
  <button class="action-btn" style="background:#fff;border:1px solid var(--border);padding:6px 12px;" onclick="document.getElementById('u-kw').value='';renderUsers()">초기화</button>
</div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th>번호</th><th>가입일</th><th>최종 접수일</th><th>대행사</th><th>단가(원)</th>
        <th>아이디</th><th>캠페인 수</th><th>메모</th><th>액션</th>
      </tr>
    </thead>
    <tbody id="user-body">
      <tr><td colspan="9"><div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="user-pagination"></div>

<script>
(function(){
  let page = 1;
  const PER = 20;
  let allUsers = [];
  let charges = {};   // 아이디·비밀번호 = BizFit 충전 계정(hi/bizfit_charge/{업체명})
  let _chargesLoaded = false;  // 저장·삭제 후 다시 받음
  const chargeIdOf = u => HI.chargeOf(charges, u)?.id || '';
  let allSlots = [];
  let _slotsLoaded = false; // 캠페인 전체(종료 포함)는 캠페인 수·최종 접수일 표시용이라 1회 로드 후 재사용
  const userByKey = key => allUsers.find(x => x._key === key);

  function getFiltered() {
    const kw = (document.getElementById('u-kw').value||'').toLowerCase();
    return allUsers.filter(u => !kw || [chargeIdOf(u),(u.agency||''),(u.agencyId||'')].some(v=>v.toLowerCase().includes(kw)));
  }

  // 진행 중 캠페인 수 — 승인 + 예약 분할 진행(split)
  function getUserSlotCount(username) {
    return allSlots.filter(s => s.userId === username && (s.status === 'active' || s.status === 'split')).length;
  }

  // 최종 접수일 — 휴지통(삭제)으로 간 건 제외하고 가장 최근 createdAt
  function getUserLastReceiptDate(username) {
    const dates = allSlots.filter(s => s.userId === username && s.createdAt && s.status !== 'deleted').map(s => s.createdAt);
    return dates.length ? dates.reduce((a, b) => (a > b ? a : b)) : null;
  }

  function fmtDateOnly(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  window.renderUsers = async function(resetPage = true, forceReload = false) {
    if (resetPage) page = 1;
    document.getElementById('user-body').innerHTML =
      '<tr><td colspan="9"><div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div></td></tr>';
    // 회원 목록은 저장·삭제 직후 정확한 값이 필요해 매번 새로 받음(4.5KB라 저렴) — 슬롯·충전 계정만 캐시
    const usersPromise = HI.getUsers();
    const chargesPromise = _chargesLoaded && !forceReload ? charges
      : HI.getBizfitCharges().then(c => { _chargesLoaded = true; return c; }).catch(e => { console.error('충전 계정 로드 실패:', e); return {}; });
    if (!_slotsLoaded || forceReload) {
      allSlots = await HI.getAll(); // 진행 중 + 종료 전체
      _slotsLoaded = true;
    }
    allUsers = [...await usersPromise];
    charges = await chargesPromise;
    if (!document.getElementById('user-page')) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단
    // 최신 등록순(createdAt 날짜) — 같은 날은 옛 push 키(legacyKey, 시간순), legacyKey 없는 건이 위
    const order = u => `${u.createdAt || ''}|${u.legacyKey || '~'}`;
    allUsers.sort((a, b) => order(b).localeCompare(order(a)));

    const all   = getFiltered();
    const start = (page-1)*PER;
    const list  = all.slice(start, start+PER);
    const body  = document.getElementById('user-body');

    if (!list.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="9">데이터가 없습니다.</td></tr>';
    } else {
      body.innerHTML = list.map((u, i) => {
        return `<tr>
          <td style="color:var(--text2)">${all.length - start - i}</td>
          <td style="color:var(--text2)">${fmtDateOnly(u.createdAt)}</td>
          <td style="color:var(--text2)">${fmtDateOnly(getUserLastReceiptDate(u.username))}</td>
          <td><span class="agency-link" onclick="openUserAgencyPopup('${u._key}')">${u.agency||u.agencyId||'-'}</span></td>
          <td><button class="action-btn btn-edit" onclick="openUserPricePopup('${u._key}')">보기</button></td>
          <td style="font-weight:700">${escHtml(chargeIdOf(u)) || '-'}</td>
          <td>${getUserSlotCount(u.username)}</td>
          <td style="color:var(--text2);font-size:11px">${u.memo||'-'}</td>
          <td>
            <div style="display:flex;gap:5px;justify-content:center;">
              <button class="action-btn btn-edit" onclick="openUserModal('${u._key}')">수정</button>
              <button class="action-btn btn-del"  onclick="deleteUser('${u._key}')">삭제</button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    const pages = Math.ceil(all.length/PER)||1;
    const pg = document.getElementById('user-pagination');
    let ph = `<button class="pg-btn" onclick="goUP(1)">&laquo;</button><button class="pg-btn" onclick="goUP(${Math.max(1,page-1)})">&lsaquo;</button>`;
    const s=Math.max(1,page-2),e=Math.min(pages,page+2);
    if(s>1){ph+=`<button class="pg-btn" onclick="goUP(1)">1</button>`;if(s>2)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;}
    for(let i=s;i<=e;i++) ph+=`<button class="pg-btn ${i===page?'active':''}" onclick="goUP(${i})">${i}</button>`;
    if(e<pages){if(e<pages-1)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;ph+=`<button class="pg-btn" onclick="goUP(${pages})">${pages}</button>`;}
    ph+=`<button class="pg-btn" onclick="goUP(${Math.min(pages,page+1)})">&rsaquo;</button><button class="pg-btn" onclick="goUP(${pages})">&raquo;</button>`;
    pg.innerHTML = ph;
  };

  window.goUP = n => { page=n; renderUsers(false); };

  const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  window.PW_EYE_ICON = EYE_OFF_ICON;

  window.toggleInputPw = function(btn) {
    const input = btn.previousElementSibling;
    btn.innerHTML = input.classList.toggle('pw-masked') ? EYE_OFF_ICON : EYE_ICON;
  };

  window.deleteUser = async function(key) {
    if (!confirm('회원을 삭제하시겠습니까?')) return;
    await HI.deleteUser(userByKey(key).username);  // 충전 계정도 같이 삭제
    _chargesLoaded = false;
    renderUsers(false);
  };

  const escHtml = HI.esc;
  // 리워드 단가 목록 [{name, price}] — 첫 줄(가이드 '리워드' 탭) = 정산 계산 단가(unitPrice)
  const rewardPricesOf = u => u.rewardPrices?.length ? u.rewardPrices : [{ name: '리워드', price: u.unitPrice || 0 }];
  // 단가 한 줄 — 항목명 고정(가이드 시트), 금액만 입력
  const ypRowHtml = (n, v = '', grp = 'yupfl', base = false) => `<div class="um-price-row" data-grp="${grp}"${base ? ' data-base="1"' : ''} style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input class="um-p-name" value="${escHtml(n)}" style="width:110px" disabled>
      <input class="um-p-price" type="number" min="0" value="${v}" placeholder="단가(원)" style="width:80px;text-align:center"></div>`;
  // 목록 + 목록에서 빠졌지만 단가가 남은 항목
  const itemRowsHtml = (list, cur, grp) => [...new Set([...list, ...Object.keys(cur)])].map(n => ypRowHtml(n, cur[n] || '', grp)).join('');
  // 단가 열 '보기' — 리워드·유입플 업체별 단가 읽기 전용 팝업(수정은 '수정' 버튼)
  window.openUserPricePopup = function(key) {
    const u = userByKey(key);
    if (!u) return;
    const row = (k, v) => `<tr><td style="text-align:left">${escHtml(k)}</td><td style="text-align:right;font-weight:700;color:var(--text)">${Number(v) > 0 ? Number(v).toLocaleString() + '원' : '<span style="color:var(--danger)">단가 설정 필요</span>'}</td></tr>`;
    const yp = Object.entries(u.yupflPrices || {});
    const ov = document.createElement('div');
    ov.className = 'sp-overlay';
    ov.innerHTML = `<div class="sp-box" style="width:auto;min-width:300px;max-width:96vw">
      <div class="sp-title">${escHtml(u.agency || u.agencyId || u.username)} 단가</div>
      <div class="sp-section">리워드</div>
      <table class="sp-tbl"><tbody>${rewardPricesOf(u).map(r => row(r.name, r.price)).join('')}</tbody></table>
      <div class="sp-section">유입플</div>
      <table class="sp-tbl"><tbody>${yp.length ? yp.map(([n, v]) => row(n, v)).join('') : '<tr><td colspan="2" style="color:var(--muted)">설정 없음</td></tr>'}</tbody></table>
      <div class="sp-footer"><button class="btn-close-sp" onclick="this.closest('.sp-overlay').remove()">닫기</button></div>
    </div>`;
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  };
  window.openUserModal = function(key) {
    const u = key ? (userByKey(key) || {}) : {};
    const isEdit = !!key;
    const currentAgency = u.agency || u.agencyId || '';
    const charge = isEdit ? HI.chargeOf(charges, u) : null;  // 충전 계정 = hi/bizfit_charge/{업체명}(접수 승인 시 캐시 차감용)

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">${isEdit?'회원 정보 수정':'회원 추가'}</div>
        <div class="modal-row modal-row-3">
          <div class="modal-field"><label>아이디<span class="req">*</span></label><input id="cs-id" type="text" value="${escHtml(charge?.id)}" placeholder="BizFit 아이디" autocomplete="off"></div>
          <div class="modal-field"><label>비밀번호<span class="req">*</span></label><div class="pw-input-wrap"><input id="cs-pw" type="text" class="pw-masked" value="${escHtml(charge?.pw)}" placeholder="BizFit 패스워드" autocomplete="off"><button type="button" class="pw-eye-btn" onclick="toggleInputPw(this)">${window.PW_EYE_ICON}</button></div></div>
          <div class="modal-field"><label>업체명 (대행사)<span class="req">*</span></label><input id="um-agency" value="${currentAgency}" placeholder="업체명을 입력하세요"></div>
        </div>
        <div class="modal-field"><label>리워드 단가 (원)<span class="req">*</span></label>
          <div id="um-reward-prices">${ypRowHtml('리워드', rewardPricesOf(u)[0].price || '', 'reward', true)}</div></div>
        <div class="modal-field"><label>유입플 업체별 단가 (원)</label>
          <div id="um-yupfl-prices"><span style="color:var(--muted);font-size:12px">불러오는 중...</span></div></div>
        <div class="modal-field"><label>메모</label><input id="um-memo" value="${u.memo||''}"></div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">취소</button>
          <button class="btn-save" id="user-save-btn">${isEdit?'저장':'추가'}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('user-save-btn').onclick = () => saveUser(key);
    // 항목 = 가이드 시트 탭 이름(리워드 탭·유입플 업체 탭) — 상단 '단가 불러오기'로 갱신
    HI.getGuideItems().catch(() => ({ rewards: [], vendors: [] })).then(items => {
      const rEl = document.getElementById('um-reward-prices'), el = document.getElementById('um-yupfl-prices');
      if (!rEl || !el) return;
      rEl.querySelector('.um-p-name').value = items.rewards[0] || '리워드';
      rEl.insertAdjacentHTML('beforeend', itemRowsHtml(items.rewards.slice(1), Object.fromEntries(rewardPricesOf(u).slice(1).map(r => [r.name, r.price])), 'reward'));
      el.innerHTML = itemRowsHtml(items.vendors, u.yupflPrices || {}, 'yupfl');
      el.dataset.loaded = '1';
    });
  };

  window.saveUser = async function(key) {
    const agencyVal = document.getElementById('um-agency').value.trim();
    if (!agencyVal) return alert('업체명을 입력하세요.');
    const bfId = document.getElementById('cs-id').value.trim(), bfPw = document.getElementById('cs-pw').value;
    if (!bfId || !bfPw) return alert('아이디와 비밀번호를 입력해 주세요.');
    // 항목 목록이 뜨기 전에 저장하면 기존 상품·업체 단가가 비워짐 — 다 뜬 뒤에만
    if (!document.getElementById('um-yupfl-prices')?.dataset.loaded) return alert('단가 항목을 불러오는 중입니다. 잠시 후 다시 저장해 주세요.');
    const base = Number(document.querySelector('.um-price-row[data-base] .um-p-price').value) || 0;
    if (!(base > 0)) return alert('리워드 단가를 입력해 주세요.');
    // 리워드 = [첫 줄(계산 단가), 그 밖 리워드 탭 줄…], 유입플 = {업체: 단가} — 비운 칸은 미설정
    const yupflPrices = {}, rewardPrices = [{ name: document.querySelector('.um-price-row[data-base] .um-p-name').value, price: base }];
    for (const r of document.querySelectorAll('.um-price-row:not([data-base])')) {
      const n = r.querySelector('.um-p-name').value, v = Number(r.querySelector('.um-p-price').value) || 0;
      if (!(v > 0)) continue;
      if (r.dataset.grp === 'reward') rewardPrices.push({ name: n, price: v }); else yupflPrices[n] = v;
    }
    const data = {
      agency:    agencyVal,
      agencyId:  agencyVal,
      unitPrice: rewardPrices[0].price,  // 정산 계산은 첫 리워드 줄
      rewardPrices,
      yupflPrices,
      memo:      document.getElementById('um-memo').value.trim(),
    };
    if (key) {
      const { username, agencyId, agency } = userByKey(key);
      const oldAgency  = agencyId || agency || '';
      const agencyChanged = oldAgency && oldAgency !== agencyVal;

      await HI.updateUser(username, data);

      // 캠페인 agencyId 동기화(진행 중·종료 모두 — 정산 묶음 키에 대행사명이 들어감). 캠페인마다 읽기+쓰기라
      // 값이 다른 캠페인만(단가만 바꾼 저장에서 같은 값을 수천 건 다시 쓰던 지연 원인)
      const userSlots = allSlots.filter(s => s.userId === username && s.agencyId !== agencyVal);
      await Promise.all(userSlots.map(s => HI.updateCampaign(s._key, { agencyId: agencyVal })));
      userSlots.forEach(s => { s.agencyId = agencyVal; });

      // 대행사명 변경 시 정산 스냅샷·환불 키·충전 계정도 이전
      if (agencyChanged) {
        try { await HI.renameAgencyKeys(username, oldAgency, agencyVal); }
        catch(e) { console.error('키 이전 오류:', e); alert('정산 스냅샷 키 이전에 실패했습니다. 새로고침 후 다시 저장해 주세요.\n' + e.message); }
      }
    } else {
      try { await HI.addUser(data); }
      catch(e) { return alert(e.message); }
    }
    try { await HI.setBizfitCharge(agencyVal, { id: bfId, pw: bfPw }); }
    catch(e) { console.error('충전 계정 저장 오류:', e); alert('충전 계정 저장에 실패했습니다.\n' + e.message); }
    _chargesLoaded = false;
    document.querySelector('.modal-overlay').remove();
    renderUsers(false);
  };

  // ── 대행사 클릭 팝업 ─────────────────────────────────────
  window.openUserAgencyPopup = function(userKey) {
    const u = userByKey(userKey);
    if (!u) return;
    const agencyName = u.agency || u.agencyId || '-';
    const unitPrice  = u.unitPrice || 0;

    const mySlots = allSlots.filter(s => s.userId === u.username);
    const active  = mySlots.filter(s => s.status === 'active' || s.status === 'split');
    const pending = mySlots.filter(s => s.status === 'pending');
    const totalTarget = active.reduce((a,s) => a+(s.dailyTarget||0)*(s.days||0), 0);

    // 정산 금액은 회원관리 단가(리워드 u.unitPrice·유입플 업체 u.yupflPrices, HI.slotBill)로 계산, 대상은 정산관리와 같은 기준(HI.isBillable — 재접수·휴지통 제외)
    const billable = mySlots.filter(HI.isBillable);
    const amtOf = s => HI.slotBill({ ...s, unitPrice: 0 }, u).amount;
    const totalAmt = billable.reduce((a,s) => a+amtOf(s), 0);
    const totalVat = Math.round(totalAmt * 1.1);

    // 월별 정산 현황
    const byMonth = {};
    billable.forEach(s => {
      const m = (s.createdAt||'').slice(0,7);
      if (!m) return;
      if (!byMonth[m]) byMonth[m] = { count:0, target:0, amt:0 };
      byMonth[m].count++;
      byMonth[m].target += (s.dailyTarget||0)*(s.days||0);
      byMonth[m].amt    += amtOf(s);
    });
    const mRows = Object.keys(byMonth).sort().reverse().map(m => {
      const mv = byMonth[m];
      return `<tr>
        <td style="font-weight:600">${m}</td>
        <td>${mv.count}</td>
        <td>${mv.target.toLocaleString()}</td>
        <td style="font-weight:700;color:var(--accent)">${mv.amt.toLocaleString()}원</td>
        <td style="font-weight:700;color:var(--info)">${Math.round(mv.amt*1.1).toLocaleString()}원</td>
      </tr>`;
    }).join('');

    const ov = document.createElement('div');
    ov.className = 'sp-overlay';
    ov.innerHTML = `
      <div class="sp-box">
        <div class="sp-title">${agencyName}</div>
        <div class="sp-sub">아이디: ${escHtml(chargeIdOf(u)) || '-'} · 단가: ${unitPrice.toLocaleString()}원/개</div>
        <div class="sp-cards">
          <div class="sp-card c-green">
            <div class="sp-card-label">진행중 캠페인</div>
            <div class="sp-card-value" style="color:var(--accent)">${active.length}<small style="font-size:12px;font-weight:400;color:var(--muted)"> 건</small></div>
          </div>
          <div class="sp-card c-green">
            <div class="sp-card-label">전체 목표</div>
            <div class="sp-card-value" style="color:var(--accent)">${totalTarget.toLocaleString()}<small style="font-size:12px;font-weight:400;color:var(--muted)"> 개</small></div>
          </div>
          <div class="sp-card c-blue">
            <div class="sp-card-label">누적 정산 금액(VAT 별도)</div>
            <div class="sp-card-value" style="color:var(--info)">${totalAmt.toLocaleString()}<small style="font-size:12px;font-weight:400;color:var(--muted)"> 원</small></div>
          </div>
          <div class="sp-card c-blue">
            <div class="sp-card-label">누적 입금액(VAT 포함)</div>
            <div class="sp-card-value" style="color:var(--info)">${totalVat.toLocaleString()}<small style="font-size:12px;font-weight:400;color:var(--muted)"> 원</small></div>
          </div>
        </div>
        <div class="sp-section">월별 정산 현황</div>
        <table class="sp-tbl">
          <thead><tr><th>월</th><th>캠페인 수</th><th>월별 목표 합산</th><th>정산 금액(VAT 별도)</th><th>입금액(VAT 포함)</th></tr></thead>
          <tbody>${mRows || '<tr><td colspan="5" style="color:var(--muted);padding:16px;text-align:center">데이터 없음</td></tr>'}</tbody>
        </table>
        <div class="sp-footer">
          <button class="btn-close-sp" onclick="this.closest('.sp-overlay').remove()">닫기</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  };

  renderUsers();
})();
</script>
</div>
