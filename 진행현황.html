<div id="slots-page">
<style>
  /* 상단 카드 — 접수관리와 같은 모양 */
  #slots-page .stat-bar { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:16px; }
  #slots-page .rc-stat { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; }
  #slots-page .rc-label { font-size:11px; color:var(--text2); font-weight:600; white-space:nowrap; }
  #slots-page .rc-val { font-size:22px; font-weight:800; line-height:1; }
  #slots-page .rc-stat[onclick] { cursor:pointer; }
  #slots-page .rc-stat[onclick]:hover { border-color:#cbd5e1; background:#f8fafc; }
  @media (max-width:1100px) { #slots-page .stat-bar { grid-template-columns:repeat(3,1fr); } }
  .type-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; background:#f1f5f9; color:#334155; border:1px solid #e2e8f0; }
  .type-badge.full { background:#ccfbf1; color:#0f766e; border-color:#99f6e4; }
  .type-badge.change { background:#fee2e2; color:#b91c1c; border-color:#fca5a5; }
  #slots-page .filter-bar {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap;
  }
  #slots-page select, #slots-page input[type=text], #slots-page input[type=date] {
    padding:6px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:12px; font-family:inherit; color:var(--text); background:#fff; outline:none;
  }
  #slots-page #f-status, #slots-page #ef-range { width:104px; }
  #slots-page .tbl-wrap { background:#fff; border:1px solid var(--border); border-radius:10px; overflow-x:auto; }
  #slots-page table { width:100%; min-width:1200px; border-collapse:collapse; font-size:12px; }
  #slots-page thead th { background:#1e293b; color:#fff; padding:11px 8px; font-weight:500; border-right:1px solid #2d3f55; white-space:nowrap; text-align:center; }
  #slots-page tbody td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:center; vertical-align:middle; }
  #slots-page tbody tr:last-child td { border-bottom:none; }
  #slots-page tbody tr:hover { background:#f8fafc; }
  .rank-badge { color:var(--info); border:1px solid var(--info); padding:2px 8px; border-radius:4px; font-weight:700; font-size:11px; }
  .action-btn { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; }
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center; }
  .empty-row td { height:200px;text-align:center;color:var(--muted);font-size:13px; }
  .pagination { display:flex;justify-content:center;gap:5px;margin-top:16px; }
  .pg-btn { width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center; }
  .pg-btn.active { background:var(--info);color:#fff;border-color:var(--info); }
  .loading-wrap { display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:13px;gap:8px; }
  .spinner { width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .trash-days-ok   { color:#059669; font-weight:700; }
  .trash-days-warn { color:#d97706; font-weight:700; }
  .trash-days-bad  { color:#dc2626; font-weight:700; }
  .kw-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:#eff6ff; color:#1d4ed8; display:inline-block; }
  .status-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .s-active   { background:rgba(16,185,129,.1); color:#059669; }
  .s-reserved { background:rgba(245,158,11,.12); color:#d97706; }
  .s-expired  { background:#f1f5f9; color:#64748b; }
  .s-split    { background:#fef3c7; color:#b45309; }
  .s-force    { background:rgba(239,68,68,.1); color:#dc2626; }
  .s-wait     { background:rgba(59,130,246,.1); color:#1d4ed8; }
  .dday-today  { background:#fef2f2; color:var(--danger); font-weight:700; padding:2px 8px; border-radius:4px; font-size:11px; }
  .dday-urgent { background:#fff7ed; color:#c2410c; font-weight:700; padding:2px 8px; border-radius:4px; font-size:11px; }
  .dday-soon   { background:#fefce8; color:#a16207; font-weight:700; padding:2px 8px; border-radius:4px; font-size:11px; }
  .dday-normal { background:#f0fdf4; color:#15803d; font-weight:600; padding:2px 8px; border-radius:4px; font-size:11px; }
  #slots-page .summary-bar { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px 20px; display:flex; gap:40px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  #slots-page .summary-bar .sum-label { font-size:11px; color:var(--text2); margin-bottom:4px; }
  #slots-page .summary-bar .sum-val { font-size:20px; font-weight:800; }
</style>

<div class="stat-bar">
  <div class="rc-stat" onclick="filterByCard('active')" title="클릭하면 이 상태만 봅니다"><div class="rc-label">진행</div><div class="rc-val" id="stat-companies" style="color:var(--accent)">-</div></div>
  <div class="rc-stat" onclick="filterByCard('reserved')" title="클릭하면 이 상태만 봅니다"><div class="rc-label">예약</div><div class="rc-val" id="stat-reserved" style="color:var(--warn)">-</div></div>
  <div class="rc-stat" onclick="filterByCard('split')" title="클릭하면 이 상태만 봅니다"><div class="rc-label">분할</div><div class="rc-val" id="stat-split" style="color:#b45309">-</div></div>
  <div class="rc-stat" onclick="filterByCard('force_stopped')" title="클릭하면 이 상태만 봅니다"><div class="rc-label">강제종료</div><div class="rc-val" id="stat-force" style="color:#dc2626">-</div></div>
  <div class="rc-stat"><div class="rc-label">전체 목표</div><div class="rc-val" id="stat-target" style="color:var(--info)">-</div></div>
  <div class="rc-stat"><div class="rc-label">진행 일 목표</div><div class="rc-val" id="stat-today-target" style="color:#7c3aed">-</div></div>
</div>

<div class="summary-bar" id="expire-summary">
  <div class="loading-wrap"><div class="spinner"></div> 로드 중...</div>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
  <span id="slots-count" style="font-size:13px;color:var(--text2)">로드 중...</span>
</div>

<div class="filter-bar">
  <select id="f-status" onchange="renderSlots()">
    <option value="">진행 전체</option>
    <option value="active">진행</option>
    <option value="reserved">예약</option>
    <option value="split">분할</option>
    <option value="force_stopped">강제종료</option>
    <option value="expired">종료</option>
  </select>
  <select id="ef-range" onchange="renderSlots()">
    <option value="all" selected>종료 전체</option>
    <option value="3">3일 이내 종료</option>
    <option value="7">7일 이내 종료</option>
    <option value="14">14일 이내 종료</option>
  </select>
  <div style="margin-left:auto;display:flex;gap:6px;">
    <input type="text" id="f-kw" placeholder="대행사/ID/플레이스명/MID 검색" style="width:240px;" onkeydown="if(event.key==='Enter') renderSlots()">
    <button class="action-btn" style="background:#475569;color:#fff;padding:6px 14px;" onclick="renderSlots()">검색</button>
    <button class="action-btn" style="background:#fff;border:1px solid var(--border);padding:6px 12px;" onclick="resetFilter()">초기화</button>
  </div>
</div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:30px;"><input type="checkbox" id="s-check-all" onchange="document.querySelectorAll('.s-check').forEach(c=>c.checked=this.checked)"></th><th>번호</th><th>대행사</th><th>비율</th><th>캠페인타입</th>
        <th>플레이스명</th><th>MID</th><th>순위키워드</th><th>분류</th>
        <th>일 수</th><th>시작일</th><th>종료일</th><th>일 목표</th><th>검색키워드</th><th>D-Day</th><th>상태</th><th>순위</th>
      </tr>
    </thead>
    <tbody id="slots-body">
      <tr><td colspan="17"><div class="loading-wrap"><div class="spinner"></div> 데이터 불러오는 중...</div></td></tr>
    </tbody>
  </table>
</div>
<div class="pagination" id="slots-pagination"></div>

<script>
(function(){
  let page = 1;
  const PER = 20;
  let allSlots = [];
  let _slotsCacheLoaded = false;

  const stLabel = {
    active:  '<span class="status-badge s-active">진행</span>',
    expired: '<span class="status-badge s-expired">종료</span>',
    split:   '<span class="status-badge s-split">분할</span>',
    force_stopped: '<span class="status-badge s-force">강제종료</span>',
    requeue: '<span class="status-badge s-wait">재접수 | 대기</span>',
    pending: '<span class="status-badge s-wait">대기</span>',
    accepted:'<span class="status-badge s-wait">접수</span>',
  };

  // 시작일이 오늘 이후인 active 캠페인 = 예약중 (실제 status 값은 그대로 active 유지)
  function todayYMD() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function isReserved(s, todayStr) { return s.status === 'active' && s.startDate > todayStr; }
  // 진행중 계열 — 승인(active) + 예약 등록 중(split, 매일 등록이 나가는 중). D-Day·종료 예정 요약·종료임박 필터 공통
  function isRunning(s) { return s.status === 'active' || s.status === 'split'; }
  // 재접수 캠페인은 한 배지에 '재접수 | 상태'(색은 그 상태 색)
  function statusBadge(s, todayStr) {
    const html = isReserved(s, todayStr) ? '<span class="status-badge s-reserved">예약</span>' : (stLabel[s.status] || s.status);
    return s.isRequeue && s.status !== 'requeue' && html.startsWith('<span') ? html.replace(/>([^<]+)<\/span>$/, '>재접수 | $1</span>') : html;
  }

  // ── 종료예정(D-Day) 계산 — 종료예정.html에서 흡수 ─────────────
  function getDday(endDate) {
    const today = new Date(); today.setHours(0,0,0,0);
    const end   = new Date(endDate); end.setHours(0,0,0,0);
    return Math.ceil((end - today) / 86400000);
  }
  function hasStarted(s) {
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(s.startDate); start.setHours(0,0,0,0);
    return start <= today;
  }
  function ddayBadge(d) {
    if(d === 0) return `<span class="dday-today">D-Day</span>`;
    if(d < 0)   return `<span class="dday-today">D+${Math.abs(d)}</span>`;
    if(d <= 1)  return `<span class="dday-today">D-${d}</span>`;
    if(d <= 3)  return `<span class="dday-urgent">D-${d}</span>`;
    if(d <= 7)  return `<span class="dday-soon">D-${d}</span>`;
    return `<span class="dday-normal">D-${d}</span>`;
  }

  function getFiltered() {
    const status  = document.getElementById('f-status').value;
    const kw      = (document.getElementById('f-kw').value||'').toLowerCase();
    const range   = document.getElementById('ef-range').value;
    const todayStr = todayYMD();
    let rows = allSlots.filter(s => {
      if (status === 'reserved') { if (!isReserved(s, todayStr)) return false; }
      else if (status === 'active') { if (s.status !== 'active' || isReserved(s, todayStr)) return false; }
      else if (status) { if (s.status !== status) return false; }
      // 전체: 이미 진행됐거나 끝난 캠페인만(대기/접수/재접수대기는 제외)
      else { if (!['active','split','expired','force_stopped'].includes(s.status)) return false; }
      if (kw && ![s.agencyId,s.userId,s.storeName,s.mid].some(v=>(v||'').toLowerCase().includes(kw))) return false;
      return true;
    });
    if (range === 'all') {
      rows.sort((a,b) => (b.startDate||'').localeCompare(a.startDate||'')); // 시작일 내림차순
    } else {
      // 종료임박 필터 — 진행중(active 또는 예약 등록 중 split) + 종료일이 범위 이내인 것만, 시작 안 한(예약) 캠페인은 뒤로
      const today = new Date(); today.setHours(0,0,0,0);
      const limit = new Date(today); limit.setDate(today.getDate()+Number(range)); limit.setHours(23,59,59,999);
      rows = rows.filter(s => {
        if (!isRunning(s) || !s.endDate) return false;
        const d = new Date(s.endDate); d.setHours(0,0,0,0);
        return d >= today && d <= limit;
      });
      rows.sort((a,b) => {
        const aStarted = hasStarted(a), bStarted = hasStarted(b);
        if (aStarted && !bStarted) return -1;
        if (!aStarted && bStarted) return 1;
        return new Date(a.endDate) - new Date(b.endDate);
      });
    }
    return rows;
  }

  function renderExpireSummary() {
    const el = document.getElementById('expire-summary');
    if (!el) return;
    const range = document.getElementById('ef-range').value;
    const today = new Date(); today.setHours(0,0,0,0);
    const activeFuture = allSlots.filter(s => isRunning(s) && s.endDate).filter(s => {
      const d = new Date(s.endDate); d.setHours(0,0,0,0);
      return d >= today;
    });
    const started = activeFuture.filter(hasStarted);
    const t3  = started.filter(s => getDday(s.endDate) <= 3).length;
    const t7  = started.filter(s => { const d=getDday(s.endDate); return d >= 4  && d <= 7; }).length;
    const t14 = started.filter(s => { const d=getDday(s.endDate); return d >= 8  && d <= 14; }).length;
    const t30 = started.filter(s => { const d=getDday(s.endDate); return d >= 15 && d <= 30; }).length;

    const BANDS = [
      {label:'3일 이내 종료',  cnt:t3,  color:'var(--danger)', minRange:3},
      {label:'7일 이내 종료',  cnt:t7,  color:'var(--warn)',   minRange:7},
      {label:'14일 이내 종료', cnt:t14, color:'var(--info)',   minRange:14},
      {label:'30일 이내 종료', cnt:t30, color:'var(--text2)',  minRange:Infinity},
    ];
    const rangeNum = range === 'all' ? Infinity : Number(range);
    const countItems = BANDS
      .filter(b => rangeNum >= b.minRange)
      .map(b => `<div class="sum-item"><div class="sum-label">${b.label}</div><div class="sum-val" style="color:${b.color}">${b.cnt} <small style="font-size:12px;color:var(--muted);font-weight:400">건</small></div></div>`)
      .join('');
    el.innerHTML = `
      <div class="sum-item"><div class="sum-label">종료 예정</div><div class="sum-val" style="color:var(--info)">${activeFuture.length} <small style="font-size:12px;color:var(--muted);font-weight:400">개</small></div></div>
      ${countItems}`;
  }

  function renderSummary() {
    const todayStr    = todayYMD();
    const active      = allSlots.filter(s => s.status === 'active');
    const reserved    = active.filter(s => isReserved(s, todayStr));
    const inProgress  = active.filter(s => !isReserved(s, todayStr));
    const split       = allSlots.filter(s => s.status === 'split').length;
    const forceStopped = allSlots.filter(s => s.status === 'force_stopped').length;
    // 목표 카드 2개는 같은 대상 — 진행중(active+split)이면서 시작일이 지난 캠페인(대시보드 진행중 집계와 동일 기준)
    const running     = allSlots.filter(s => isRunning(s) && hasStarted(s));
    const totalTarget = running.reduce((a,s) => a+((s.dailyTarget||0)*(s.days||0)), 0);
    const todayTarget = running.reduce((a,s) => a+(s.dailyTarget||0), 0);
    document.getElementById('stat-companies').textContent    = inProgress.length;
    document.getElementById('stat-reserved').textContent     = reserved.length;
    document.getElementById('stat-split').textContent        = split;
    document.getElementById('stat-force').textContent        = forceStopped;
    document.getElementById('stat-target').textContent      = totalTarget.toLocaleString();
    document.getElementById('stat-today-target').textContent = todayTarget.toLocaleString();
  }

  // 종료 전체(30일+ 이전 포함) 표시 여부 — 이 메뉴에서만 유효(메뉴 재진입 시 스크립트 재실행으로 초기화).
  // 데이터 자체는 hi-store.js가 세션당 1회만 받아 보관, 여기선 합칠지만 정함
  let _withArchive = false;
  let _historyPromise = null; // 로드 중 중복 호출(검색 입력 + » 등)이 같은 완료를 기다리게 공유
  let _historyAlerted = false;
  window.loadSlotsHistory = function() {
    if (!_historyPromise) _historyPromise = (async () => {
      try {
        await HI.loadClosed();
      } catch (e) {
        // 실패하면 다음 검색·» 클릭 때 다시 시도(전엔 한 번 실패하면 메뉴 재진입 전까지 재시도 안 함)
        console.error('이전 기록 로딩 실패:', e);
        _historyPromise = null;
        // 검색 입력마다 재시도하므로 팝업은 메뉴 진입당 한 번만
        if (!_historyAlerted) { _historyAlerted = true; alert('캠페인 데이터 일부를 불러오지 못했습니다. 새로고침해 주세요.'); }
        return;
      }
      _withArchive = true;
      if (document.getElementById('slots-page')) await renderSlots(false, true);
    })();
    return _historyPromise;
  };

  // ── Firebase에서 데이터 불러와서 렌더 ──────────────────────
  window.renderSlots = async function(resetPage = true, forceReload = false) {
    if (resetPage) page = 1;
    const todayStr = todayYMD();
    if (!_slotsCacheLoaded || forceReload) {
      document.getElementById('slots-body').innerHTML =
        '<tr><td colspan="17"><div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div></td></tr>';

      // 기본 = 진행 중 + 최근 30일 종료, 검색·종료필터·» = 종료 전체까지
      const [live, recent] = await Promise.all([HI.getLive(), HI.getRecentClosed()]);

      // ── 종료일 지난 active 캠페인 자동 종료 처리(한 번의 쓰기로 live→closed 이동) ──
      const toExpire = live.filter(s => HI.shouldExpire(s, todayStr));
      if (toExpire.length) {
        await HI.expire(toExpire.map(s => s._key));
        toExpire.forEach(s => { s.status = 'expired'; });
      }

      const recentKeys = new Set(live.map(s => s._key));
      const base = [...live, ...recent.filter(s => !recentKeys.has(s._key))];
      allSlots = _withArchive ? HI.withClosed(base) : base;
      _slotsCacheLoaded = true;
    }
    if (!document.getElementById('slots-page')) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단

    renderSummary();
    renderExpireSummary();

    // 종료 30일+ 이전 기록은 기본 목록에 없음 — 검색·종료 필터를 쓰면 이 메뉴에 불러와 다시 렌더
    const fStatus = document.getElementById('f-status').value;
    if (!_withArchive && (document.getElementById('f-kw').value.trim() || ['expired','force_stopped'].includes(fStatus))) {
      loadSlotsHistory();
    }
    const all   = getFiltered();
    document.getElementById('slots-count').textContent = `전체 ${all.length}건`;
    const start = (page-1)*PER;
    const list  = all.slice(start, start+PER);
    const body  = document.getElementById('slots-body');

    if (!list.length) {
      body.innerHTML = '<tr class="empty-row"><td colspan="17">데이터가 없습니다.</td></tr>';
    } else {
      body.innerHTML = list.map((s,i) => {
        const kwCount = s.searchKwCount || 0;   // 키워드 본문은 campaign_keywords에 있고 목록엔 개수만
        return `
        <tr>
          <td><input type="checkbox" class="s-check" data-key="${s._key}"></td>
          <td style="color:var(--text2)">${all.length - start - i}</td>
          <td style="font-weight:600">${s.agencyId||'-'}</td>
          <td>${HI.ratioBadgeHtml(s.yupflRatio)}</td>
          <td>${typeCellHtml(s)}</td>
          <td>${s.url ? `<a href="${s.url}" target="_blank" style="color:var(--accent);font-weight:500;text-decoration:none;">${s.storeName||'-'}</a>` : `<span style="font-weight:500">${s.storeName||'-'}</span>`}</td>
          <td style="color:var(--text2);font-size:11px">${s.mid||'-'}</td>
          <td style="color:var(--text2)">${s.rankKeyword ? `<a href="https://m.search.naver.com/search.naver?where=m&query=${encodeURIComponent(s.rankKeyword)}" target="_blank" style="color:var(--text2);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text2)'">${s.rankKeyword}</a>` : '-'}</td>
          <td style="color:var(--text2)">${s.category ? esc(s.category) : '<span style="color:#dc2626;font-weight:700;">-</span>'}</td>
          <td style="color:var(--text2)">${s.days||'-'}</td>
          <td style="color:var(--text2)">${s.startDate||'-'}</td>
          <td style="color:var(--text2)">${s.endDate||'-'}</td>
          <td><strong>${(s.dailyTarget||0).toLocaleString()}</strong>${HI.dailySplitHtml(s)}</td>
          <td><span class="kw-badge">${kwCount}개</span></td>
          <td>${isRunning(s) && hasStarted(s) ? ddayBadge(getDday(s.endDate)) : '-'}</td>
          <td>${statusBadge(s, todayStr)}</td>
          <td>
            <button class="action-btn" style="background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd;" onclick="openRankPopup('${s._key}')">순위</button>
          </td>
        </tr>`;
      }).join('');
    }

    const pages = Math.ceil(all.length/PER)||1;
    const pg = document.getElementById('slots-pagination');
    let ph = `<button class="pg-btn" onclick="goP(1)">&laquo;</button><button class="pg-btn" onclick="goP(${Math.max(1,page-1)})">&lsaquo;</button>`;
    const s=Math.max(1,page-2),e=Math.min(pages,page+2);
    if(s>1){ph+=`<button class="pg-btn" onclick="goP(1)">1</button>`;if(s>2)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;}
    for(let i=s;i<=e;i++) ph+=`<button class="pg-btn ${i===page?'active':''}" onclick="goP(${i})">${i}</button>`;
    if(e<pages){if(e<pages-1)ph+=`<span class="pg-btn" style="pointer-events:none">…</span>`;ph+=`<button class="pg-btn" onclick="goP(${pages})">${pages}</button>`;}
    ph+=`<button class="pg-btn" onclick="goP(${Math.min(pages,page+1)})">&rsaquo;</button><button class="pg-btn" onclick="goLastP()">&raquo;</button>`;
    pg.innerHTML = ph;
    if(window.lucide) lucide.createIcons();
  };

  // 캠페인타입 칸 — 접수관리와 같은 값: 등록·예약 때 캠페인에 저장한 상품(campaignType) + 시트 분류 때 정한 풀스텍 상품(fullstackType, 청록) + 진행 중이면 변경 요청(빨간 배지)
  const TYPE_LIVE = ['active','split','force_stopped'];
  const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const typeLabels = s => Array.isArray(s?.campaignType) ? s.campaignType : (s?.campaignType ? Object.values(s.campaignType) : []);
  // 유입플 상품 = vendorProducts {업체: [상품]}의 상품 전부, 없는 옛 캠페인은 fullstackType
  const yupflLabels = s => s?.vendorProducts ? Object.values(s.vendorProducts).flatMap(l => Array.isArray(l) ? l : Object.values(l))
    : Array.isArray(s?.fullstackType) ? s.fullstackType : Object.values(s?.fullstackType || {});
  function typeCellHtml(s) {
    if (s.status === 'expired') return '<span style="color:#cbd5e1">-</span>';  // 종료된 캠페인은 배지 숨김(데이터는 남음)
    const live = TYPE_LIVE.includes(s.status);
    const change = live ? (s.changeRequest?.to || s.changeTo || '') : '';
    const html = [
      ...typeLabels(s).map(l => `<span class="type-badge">${esc(l)}</span>`),
      ...yupflLabels(s).map(l => `<span class="type-badge full">${esc(l)}</span>`),
      ...(change ? [`<span class="type-badge change">${esc(change)}</span>`] : []),
    ].join('');
    return html ? `<div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center">${html}</div>` : '<span style="color:#cbd5e1">-</span>';
  }


  // ── 캠페인 타입 변경 요청 ─────────────────────────────────
  // 체크한 승인·예약 캠페인에 바꿀 상품을 요청 → 접수관리·진행현황 등급 아래 빨간 배지, 접수관리 '변경' 카드·필터로 확인.
  // 상품은 상품 유형 설정 목록에서만 골라 표기를 통일(차감·유입플 분류처럼 배분 전용 항목 제외).
  // 이미 요청 중인 건은 새 요청으로 덮어씀. 실제 강제종료는 사람이 하고, 재접수 캠페인이 요청 상품을 이어받음(hi-store forceStopMid)
  const CHANGE_STATUSES = ['active','split'];
  const NOT_PRODUCTS = new Set(['deduct','yupflc','yupfl','yupfl2']);
  const FIXED_PRODUCTS = new Set(['charlie','delta','navy']); // 상품 유형 설정의 '고정' 줄(차감·유입플 분류는 상품 아님)
  window.openTypeChangeModal = async function() {
    const keys = [...document.querySelectorAll('.s-check:checked')].map(c => c.dataset.key);
    const targets = keys.map(k => allSlots.find(s => s._key === k)).filter(Boolean);
    const ok = targets.filter(s => CHANGE_STATUSES.includes(s.status));
    if (!targets.length) { alert('변경 요청할 캠페인을 체크해 주세요.'); return; }
    if (!ok.length) { alert('진행·예약 중인 캠페인만 변경 요청할 수 있습니다.'); return; }
    const prods = await HI.getProdsOnce().catch(() => null);
    // 상품 유형 설정과 같은 두 줄(일반/고정). X3·X4 같은 빈 자리 상품명 제외
    const list = (Array.isArray(prods) ? prods : Object.values(prods || {}))
      .filter(p => p && p.name && !NOT_PRODUCTS.has(p.id) && !/^X\d*$/i.test(p.name.trim()));
    const namesOf = fixed => [...new Set(list.filter(p => FIXED_PRODUCTS.has(p.id) === fixed).map(p => p.name))];
    const chip = n => `<button type="button" data-name="${esc(n)}" style="padding:4px 12px;border:1px solid var(--border);border-radius:14px;background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">${esc(n)}</button>`;
    const row = (label, names) => names.length ? `<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;"><span style="flex:0 0 28px;font-size:11px;font-weight:700;color:var(--muted);padding-top:6px;">${label}</span><div style="display:flex;flex-wrap:wrap;gap:6px;">${names.map(chip).join('')}</div></div>` : '';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:14px;width:min(94vw,460px);padding:22px 24px;">
        <div style="font-size:16px;font-weight:800;margin-bottom:6px;">타입 변경 요청</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:12px;">대상 ${ok.length}건${targets.length > ok.length ? ` <span style="color:var(--muted);">(진행·예약이 아닌 ${targets.length - ok.length}건 제외)</span>` : ''}${ok.some(s => s.changeRequest) ? ' · <span style="color:#b91c1c;">이미 요청 중인 건은 새 요청으로 바뀝니다</span>' : ''}</div>
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;">바꿀 상품</div>
        <div id="tc-prods" style="margin-bottom:8px;">${row('일반', namesOf(false))}${row('고정', namesOf(true))}</div>
        <div style="font-size:12px;margin-top:10px;color:var(--text2);">요청 내용: <b id="tc-preview" style="color:#b91c1c;">-</b></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
          <button type="button" id="tc-close" style="padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;">닫기</button>
          <button type="button" id="tc-submit" style="padding:8px 16px;border:none;border-radius:8px;background:#dc2626;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">요청</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const picked = [];
    const toText = () => picked.join('/');
    const refresh = () => {
      overlay.querySelectorAll('#tc-prods button').forEach(b => {
        const on = picked.includes(b.dataset.name);
        b.style.background = on ? '#dc2626' : '#fff'; b.style.color = on ? '#fff' : ''; b.style.borderColor = on ? '#dc2626' : '';
      });
      overlay.querySelector('#tc-preview').textContent = toText() || '-';
    };
    overlay.querySelector('#tc-prods').onclick = e => {
      const n = e.target.dataset?.name; if (!n) return;
      const i = picked.indexOf(n); i < 0 ? picked.push(n) : picked.splice(i, 1);
      refresh();
    };
    overlay.querySelector('#tc-close').onclick = () => overlay.remove();
    overlay.querySelector('#tc-submit').onclick = async e => {
      const to = toText();
      if (!to) { alert('바꿀 상품을 골라 주세요.'); return; }
      e.target.disabled = true;
      const cu = HI.getCurrentUser() || {};
      const req = { to, by: cu.username || '-', byName: cu.name || cu.username || '', at: new Date().toISOString() };
      try {
        await Promise.all(ok.map(s => HI.updateCampaign(s._key, { changeRequest: req })));
      } catch (err) { e.target.disabled = false; alert('요청 저장 실패: ' + err.message); return; }
      ok.forEach(s => { s.changeRequest = req; });
      overlay.remove();
      renderSlots(false);
    };
  };

  // ── 순위표 다운로드 (대상: 전체 캠페인) ──
  // 기준순위가 같은 MID의 직전 종료건까지 보므로 종료 전체 포함. kimpro-premium /rank-table은 종료 상태를 'ended'로 판정
  window.downloadRankTable = async function() {
    const btn = document.getElementById('rank-table-btn');
    const label = btn?.querySelector('span') || btn;
    const original = label ? label.textContent : '';
    if (btn) { btn.disabled = true; label.textContent = '다운로드 중...'; }
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    try {
      const all = await HI.getAll();
      const midEntries = all.filter(s => s.mid).map(s => ({
        mid: s.mid,
        startDate: s.startDate || '',
        endDate: s.endDate || '',
        dailyTarget: s.dailyTarget || 0,
        agency: s.agencyId || '',
        createdDate: s.createdAt ? ymd(new Date(s.createdAt)) : '',
        status: s.status === 'expired' ? 'ended' : (s.status || ''),
        isRequeue: !!s.isRequeue,
        grade: [...typeLabels(s), ...yupflLabels(s)].join(', '),
      }));
      const res = await fetch('https://kimpro-premium-938928195180.asia-northeast3.run.app/rank-table', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ memo: '1test', midEntries }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `요청 실패 (${res.status})`);
      }
      const blob = await res.blob();
      const match = (res.headers.get('Content-Disposition') || '').match(/filename="?([^"]+)"?/);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = match ? match[1] : `순위표_${ymd(new Date())}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert(`다운로드 실패: ${e.message}`);
      console.error(e);
    } finally {
      if (btn) { btn.disabled = false; label.textContent = original; }
    }
  };

  // 상단 카드 클릭 = 상태 필터(전체 목표·진행 일 목표 카드는 합계라 필터 없음)
  window.filterByCard = function(status) {
    document.getElementById('f-status').value = status;
    renderSlots();
  };

  window.goP = n => { page=n; renderSlots(false); };
  // » = 이전 기록(종료 30일+)까지 이 메뉴에 불러온 뒤 전체 목록의 마지막 페이지로
  window.goLastP = async function() {
    await loadSlotsHistory();
    page = Math.ceil(getFiltered().length / PER) || 1;
    renderSlots(false);
  };
  window.resetFilter = () => {
    document.getElementById('f-status').value='';
    document.getElementById('f-kw').value='';
    document.getElementById('ef-range').value='all';
    page=1; renderSlots(false);
  };

  // ── 순위 팝업 열기 ────────────────────────────────────────
  window.openRankPopup = async function(slotKey) {
    const s = allSlots.find(x => x._key === slotKey);
    const { openRankPopup: _openRankPopup } = await import(new URL('rank-popup.js', document.baseURI).href);
    await _openRankPopup(s);
  };


  renderSlots(false);

  // ── 휴지통 ─────────────────────────────────────────────────
  // 한 벌 저장소라 탭 없이 하나로
  const TRASH_DAYS = 30;

  function _trashRemaining(deletedAt) {
    if (!deletedAt) return TRASH_DAYS;
    const expire = new Date(deletedAt).getTime() + TRASH_DAYS * 86400000;
    return Math.max(0, Math.ceil((expire - Date.now()) / 86400000));
  }

  function _fmtDateOnly(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  window.openTrashView = async function() {
    if (document.getElementById('trash-modal')) return;
    const overlay = document.createElement('div');
    overlay.id = 'trash-modal';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px;width:100%;max-width:1100px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;">
        <div style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:17px;font-weight:700;">휴지통</span>
            <span id="trash-count" style="font-size:13px;font-weight:600;color:var(--text2);"></span>
            <span style="font-size:12px;color:var(--muted);">삭제 후 ${TRASH_DAYS}일간 보관 · 기간 만료 시 자동 영구삭제</span>
          </div>
          <div style="display:flex;gap:8px;">
            <button onclick="emptyTrash()" style="padding:7px 14px;border:none;border-radius:6px;background:#ef4444;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">전체 영구삭제</button>
            <button onclick="document.getElementById('trash-modal').remove()" style="padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;">닫기</button>
          </div>
        </div>
        <div id="trash-table-area" style="min-height:200px;">
          <div class="loading-wrap"><div class="spinner"></div> 불러오는 중...</div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    await _renderTrashContent();
  };

  // 이미 받아둔 allSlots 재사용 — 삭제/복구 시 각 함수가 allSlots를 직접 patch해 최신 유지
  async function _renderTrashContent() {
    const area = document.getElementById('trash-table-area');
    if (!area) return;
    // 종료일이 오래된 캠페인도 최근에 삭제됐을 수 있어 종료 전체를 받은 뒤 찾음
    await loadSlotsHistory();
    const trashed = allSlots.filter(s => s.status === 'deleted');

    // 30일 초과 항목 자동 영구삭제
    const now = Date.now();
    const expired = trashed.filter(s => s.deletedAt && now > new Date(s.deletedAt).getTime() + TRASH_DAYS * 86400000);
    if (expired.length) {
      await Promise.all(expired.map(s => HI.permanentDelete(s._key)));
      const expiredKeys = new Set(expired.map(s => s._key));
      allSlots = allSlots.filter(s => !expiredKeys.has(s._key));
    }
    const active = trashed.filter(s => !expired.includes(s));
    const cnt = document.getElementById('trash-count');
    if (cnt) cnt.textContent = `${active.length}건`;

    if (!active.length) {
      area.innerHTML = `<div style="padding:60px 0;text-align:center;color:var(--muted);font-size:13px;">휴지통이 비어 있습니다.</div>`;
      return;
    }

    area.innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead>
          <tr>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">접수일시</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">대행사</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">비율</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">플레이스명</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">MID</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">삭제일시</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;border-right:1px solid #2d3f55;">남은 기간</th>
            <th style="background:#1e293b;color:#fff;padding:10px;font-weight:500;text-align:center;white-space:nowrap;">액션</th>
          </tr>
        </thead>
        <tbody>
          ${active.map(s => {
            const rem = _trashRemaining(s.deletedAt);
            const remCls = rem > 14 ? 'trash-days-ok' : rem > 7 ? 'trash-days-warn' : 'trash-days-bad';
            return `<tr style="border-bottom:1px solid var(--border);">
              <td style="padding:10px;text-align:center;color:var(--text2);">${_fmtDateOnly(s.createdAt)}</td>
              <td style="padding:10px;text-align:center;font-weight:600;">${s.agencyId||'-'}</td>
              <td style="padding:10px;text-align:center;">${HI.ratioBadgeHtml(s.yupflRatio)}</td>
              <td style="padding:10px;text-align:center;">${s.storeName||'-'}</td>
              <td style="padding:10px;text-align:center;font-size:11px;color:var(--text2);">${s.mid||'-'}</td>
              <td style="padding:10px;text-align:center;color:var(--text2);">${_fmtDateOnly(s.deletedAt)}</td>
              <td style="padding:10px;text-align:center;"><span class="${remCls}">${rem}일</span></td>
              <td style="padding:10px;text-align:center;">
                <div style="display:flex;gap:5px;justify-content:center;">
                  <button onclick="restoreFromTrash('${s._key}')" style="padding:4px 10px;border-radius:5px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:rgba(16,185,129,.15);color:#059669;font-family:inherit;">복구</button>
                  <button onclick="permanentDeleteFromTrash('${s._key}')" style="padding:4px 10px;border-radius:5px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:rgba(239,68,68,.1);color:#dc2626;font-family:inherit;">영구삭제</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  window.restoreFromTrash = async function(key) {
    if (!confirm('이 캠페인을 복구하시겠습니까?')) return;
    const slot = allSlots.find(s => s._key === key);
    await HI.restore(key);
    if (slot) { slot.status = slot.originalStatus || 'pending'; delete slot.deletedAt; delete slot.originalStatus; }
    await _renderTrashContent();
    renderSlots(false); // allSlots를 이미 위에서 patch했으므로 강제 재조회 불필요
  };

  window.permanentDeleteFromTrash = async function(key) {
    if (!confirm('영구 삭제하면 복구가 불가능합니다.\n정산 데이터도 함께 삭제됩니다. 계속하시겠습니까?')) return;
    await HI.permanentDelete(key);
    allSlots = allSlots.filter(s => s._key !== key);
    await _renderTrashContent();
  };

  window.emptyTrash = async function() {
    const trashed = allSlots.filter(s => s.status === 'deleted');
    if (!trashed.length) { alert('휴지통이 이미 비어 있습니다.'); return; }
    if (!confirm(`휴지통의 항목 ${trashed.length}건을 영구 삭제합니다.\n복구할 수 없으며, 정산 데이터도 함께 삭제됩니다. 계속하시겠습니까?`)) return;
    const trashedKeys = new Set(trashed.map(s => s._key));
    await Promise.all(trashed.map(s => HI.permanentDelete(s._key)));
    allSlots = allSlots.filter(s => !trashedKeys.has(s._key));
    await _renderTrashContent();
  };

})();
</script>
</div>
