  async function executeYoupflSubmit(rows, overlay, gate=null) {
    const applyBtn = overlay.querySelector('#youpfl-apply-btn');
    const closeBtn = overlay.querySelector('#youpfl-close-btn');
    const subEl    = overlay.querySelector('#youpfl-sub');

    // 슬롯 하나가 여러 행(유입플 1개 + 분할 미션별 N개)으로 나뉠 수 있어, "슬롯 완료"는
    // 그 슬롯에서 나온 행이 전부(이미완료 또는 이번에 성공) 끝났을 때만 인정한다.
    const rowsBySlot = new Map();
    rows.forEach(r => {
      if (!rowsBySlot.has(r._slotKey)) rowsBySlot.set(r._slotKey, []);
      rowsBySlot.get(r._slotKey).push(r);
    });
    const slotDone = (slotKey, succeededRowKeys) =>
      (rowsBySlot.get(slotKey) || []).every(r => r._fixedSubmitted || succeededRowKeys.has(r._rowKey));

    // 이전에 이미 접수 완료된 행(일반만 남아 모달을 닫았다가 재오픈한 경우)은 재제출하지 않음
    const alreadyRows = rows.filter(r => r._fixedSubmitted);
    const pendingRows = rows.filter(r => !r._fixedSubmitted);
    alreadyRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; });

    if (!pendingRows.length) {
      // 전부 이미 완료된 경우 — 업로드 없이 게이트만 마무리
      subEl.innerHTML = '<span style="color:var(--accent);font-weight:600;">✅ 이미 모두 접수 완료된 항목입니다.</span>';
      applyBtn.disabled = true; applyBtn.textContent = `✅ 완료 (${rows.length}건)`; applyBtn.style.background = '#475569'; applyBtn.style.cursor = 'default';
      if (gate) {
        gate.fixedKeys = new Set(rows.map(r => r._slotKey).filter(Boolean));
        await gate.tryApprove();
      }
      closeBtn.disabled = false; closeBtn.onclick = () => { overlay.remove(); if (!gate) renderReceipts(false); };
      return;
    }

    // 유효성 검사 — 키워드 미입력
    pendingRows.forEach(r => {
      if (!r.workKw) {
        r._kwFail = true;
        if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);" title="키워드 미입력">❌ 키워드 미입력</span>';
      }
    });
    const validRows = pendingRows.filter(r => !r._kwFail);

    if (!validRows.length) {
      subEl.innerHTML = '<span style="color:var(--danger);font-weight:600;">전체 유효성 검사 실패 (키워드 미입력)</span>';
      applyBtn.disabled = true; applyBtn.textContent = '❌ 실패'; applyBtn.style.background = '#b91c1c'; applyBtn.style.cursor = 'default';
      if (gate) {
        gate.fixedKeys = new Set([...rowsBySlot.keys()].filter(k => slotDone(k, new Set())));
        await gate.tryApprove();
      }
      closeBtn.disabled = false; closeBtn.onclick = () => overlay.remove();
      return;
    }

    const missionByKey = new Map();
    for (const r of validRows) {
      const el = overlay.querySelector(`.ag-mission-input[data-key="${CSS.escape(r._rowKey||'')}"]`);
      const val = el?.value;
      if (val === '' || val === null || val === undefined) {
        alert(`"${r.storeName||r._rowKey}" 항목의 미션 번호를 지정해주세요.`);
        return;
      }
      missionByKey.set(r._rowKey, Math.max(0, parseInt(val, 10) || 0));
    }

    applyBtn.disabled = true; applyBtn.textContent = '⏳ 업로드 중...'; applyBtn.style.background = '#6b7280';
    closeBtn.disabled = true;
    window.bizfitSubmitting = true;
    const normalBtn = overlay.querySelector('#submit-apply-btn');
    const csubBtn   = overlay.querySelector('#csub-apply-btn');
    if (normalBtn) normalBtn.disabled = true;
    if (csubBtn)   csubBtn.disabled   = true;

    function calcIkil(startDate) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const start = startDate ? new Date(startDate) : today; start.setHours(0, 0, 0, 0);
      return Math.max(0, Math.round((start - today) / 86400000));
    }

    let result;
    try {
      result = await callBizfitProxy('/youpfl-upload', {
        rows: validRows.map(r => ({ rankKw: r.rankKw, workKw: r.workKw, placeId: r.placeId, target: r.target, days: r.days, mission: missionByKey.get(r._rowKey), ikil: calcIkil(r.startDate) })),
      });
    } catch(e) {
      result = { success: false, message: '서버 호출 실패: ' + e.message };
    }

    if (result.success) {
      validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; });
      subEl.innerHTML = `<span style="color:var(--accent);font-weight:600;">✅ ${escProd(result.message||'업로드 완료')}</span>`;

      const slotMap = new Map(allSlots.map(s => [s._key, s]));
      const succeededRowKeys = new Set(validRows.map(r => r._rowKey));

      // 이번에 성공한 유입플 행 → 슬롯에 fixedSubmitted 저장
      const yupflDoneSlots = [...new Set(validRows.filter(r => r._prodId === 'yupfl').map(r => r._slotKey))];
      await Promise.all(yupflDoneSlots.map(k => HA.updateSlot(k, { fixedSubmitted: true })));
      yupflDoneSlots.forEach(k => { const s = slotMap.get(k); if (s) s.fixedSubmitted = true; });

      // 이번에 성공한 분할 행 → 슬롯별로 splitFixedSubmitted[미션]을 병합 저장
      const splitDoneBySlot = new Map();
      validRows.filter(r => r._prodId === 'yupfl2').forEach(r => {
        const mission = r._rowKey.split('__')[1];
        if (!splitDoneBySlot.has(r._slotKey)) splitDoneBySlot.set(r._slotKey, []);
        splitDoneBySlot.get(r._slotKey).push(mission);
      });
      await Promise.all([...splitDoneBySlot.entries()].map(async ([slotKey, missions]) => {
        const s = slotMap.get(slotKey);
        const merged = { ...(s?.splitFixedSubmitted || {}) };
        missions.forEach(m => { merged[m] = true; });
        await HA.updateSlot(slotKey, { splitFixedSubmitted: merged });
        if (s) s.splitFixedSubmitted = merged;
      }));

      // 슬롯 완료 판정 — 그 슬롯에서 나온 모든 행(유입플+분할)이 이미완료 또는 이번에 성공했는지
      const allDoneSlotKeys = [...rowsBySlot.keys()].filter(k => slotDone(k, succeededRowKeys));

      if (gate) {
        gate.fixedKeys = new Set(allDoneSlotKeys);
        await gate.tryApprove();
      } else {
        const failed = await approveSlotsWithBizfit(allDoneSlotKeys, slotMap);
        if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
      }
      applyBtn.textContent = `✅ 완료 (${rows.length}건)`; applyBtn.style.background = '#475569'; applyBtn.style.cursor = 'default';
      window.bizfitSubmitting = false;
      closeBtn.disabled = false; closeBtn.onclick = () => { overlay.remove(); if (!gate) renderReceipts(false); };
      // 일반/찰리 탭 잠금 해제 — 이 탭을 먼저 끝낸 뒤 계속 열어둔 채로 나머지도 마저 접수할 수 있어야 함
      if (normalBtn) normalBtn.disabled = false;
      if (csubBtn)   csubBtn.disabled   = false;
    } else {
      validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(result.message||'')}">❌ 실패</span>`; });
      subEl.innerHTML = `<span style="color:var(--danger);font-weight:600;">❌ ${escProd(result.message||'업로드 실패')}</span>`;
      applyBtn.textContent = '❌ 실패'; applyBtn.style.background = '#b91c1c'; applyBtn.style.cursor = 'default';
      window.bizfitSubmitting = false;
      if (normalBtn) normalBtn.disabled = false;
      if (csubBtn)   csubBtn.disabled   = false;
      // 이미 완료된 것만이라도 게이트에 반영 (새로 실패한 것은 제외)
      if (gate) {
        gate.fixedKeys = new Set([...rowsBySlot.keys()].filter(k => slotDone(k, new Set())));
        await gate.tryApprove();
      }
      closeBtn.disabled = false; closeBtn.onclick = () => overlay.remove();
    }
  }

  // legKey: 게이트 기록 필드('normalKeys'|'charlieKeys'|'deltaKeys'|'navyKeys') — 일반/찰리/블로그(델타+네이비) 탭이 이 로직을 공유
  // adrole: 지정 시 grade-info/register를 해당 adrole로만 조회 — 등급명이 겹쳐도 원하는 메뉴로만 정확히 접수
  const ALL_SUBMIT_PREFIXES = ['submit', 'csub', 'bsub'];
  const SUBMIT_TAB_PREFIX = { normalKeys: 'submit', charlieKeys: 'csub' };

  // NP위치저장(adrole=100) 계열(찰리/델타)은 ajax.excel_version.php 동적 조회가 빈 값을 반환해 기본
  // 폴백 버전과 어긋나 "버전체크 실패"로 거부됨(실측) — 상품 설정에 저장된 ver를 그대로 넘겨 우회한다.
  // 네이비도 동일 증상이 있어 포함(등록 시 이 override가 없으면 상품 설정의 ver를 바꿔도 전혀 전송되지 않음).
  // ap()(활성 상품만)이 아니라 prods 전체에서 찾는다 — 등급 자동매칭은 비활성 상품도 매칭해 접수시키므로
  // ap()로 찾으면 찰리/델타/네이비가 비활성일 때 undefined가 되어 버전 override가 안 실려 "버전체크 실패"로 이어짐.
  // submitPlanRows(즉시)/submitPlanRowsScheduled(예약) 공용.
  function productVerFor(legKey) {
    const verSourceId = legKey === 'charlieKeys' ? 'charlie' : legKey === 'deltaKeys' ? 'delta' : legKey === 'navyKeys' ? 'navy' : null;
    return verSourceId ? prods.find(p => p.id === verSourceId)?.ver : undefined;
  }

  // 검색키워드 50개 초과 시 앞 50개만 남기고 자름(사이드이펙트로 r.검색키워드 갱신) + 유효성 판정 —
  // submitPlanRows(즉시)/submitPlanRowsScheduled(예약) 공용. 통과하면 null, 실패하면 사유 반환(DOM 표시는 호출부 몫).
  function truncateAndValidateRow(r) {
    const kwList = (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k);
    if (kwList.length > 50) r.검색키워드 = kwList.slice(0, 50).join(',');
    const kwCount = (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k).length;
    if (kwCount === 0) return { title: '검색키워드 미입력', label: '❌ 키워드 미입력' };
    if ((r.일목표||0) < 10) return { title: `일목표 ${r.일목표||0}개 — 10 미만`, label: '❌ 일목표 미달' };
    if (r._requiresBlogUrl && !r.블로그URL) return { title: '블로그 URL 미입력', label: '❌ URL 미입력' };
    return null;
  }

  // 한 plan(대행사별 rows)을 실제로 비즈핏에 등록 — UI(버튼/탭잠금)는 손대지 않고 결과 집계만 반환.
  // executeSubmit(단일 탭)과 executeBlogSubmit(델타+네이비 동시 제출)이 공유한다.
  // 대행사 1곳 처리 — 같은 BizFit 계정은 동시 요청 시 세션 충돌 위험이 있으므로 grade 단위는 순차
  async function submitPlanRows(plan, overlay, gate, legKey, adrole) {
    const productVer = productVerFor(legKey);
    let okTotal = 0, failTotal = 0;
    const slotMap = new Map(allSlots.map(s => [s._key, s]));
    const approvedKeys = gate ? new Set() : null;

    async function processAgency(p) {
      if (!p.rows.length) return;

      // 한 캠페인(슬롯)에 활성 상품이 여러 개면 상품별로 행이 나뉘어 각각 성공/실패가 갈릴 수 있음.
      // 슬롯의 모든 상품행이 성공(또는 기존에 이미 완료)한 경우에만 그 슬롯을 승인 처리한다 — 일부라도 실패하면 승인 보류.
      async function finalizeSlotApprovals() {
        const bySlot = new Map();
        p.rows.forEach(r => {
          if (!r._slotKey) return;
          if (!bySlot.has(r._slotKey)) bySlot.set(r._slotKey, []);
          bySlot.get(r._slotKey).push(r);
        });
        const okSlots = [...bySlot.entries()]
          .filter(([, rs]) => rs.every(r => r._normalSubmitted || r._rowOk === true))
          .map(([k]) => k);
        if (!okSlots.length) return;
        if (gate) {
          okSlots.forEach(k => approvedKeys.add(k));
        } else {
          const failed = await approveSlotsWithBizfit(okSlots, slotMap);
          if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
        }
      }

      // 이전에 이미 접수 완료된 행(유입플만 남아 모달을 닫았다가 재오픈한 경우)은 재제출하지 않고 완료 표시만 유지
      const alreadyRows = p.rows.filter(r => r._normalSubmitted);
      const pendingRows = p.rows.filter(r => !r._normalSubmitted);
      alreadyRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; });
      okTotal += alreadyRows.length;

      if (!pendingRows.length) {
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--accent);font-size:11px;">✅ 전체 접수 완료</span>';
        await finalizeSlotApprovals();
        return;
      }

      pendingRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--info);">⏳</span>'; });

      // 유효성 검사 — 키워드 50개 초과 시 앞 50개만 남기고 자동으로 잘라서 접수 / 일목표 10 미만
      pendingRows.forEach(r => {
        const fail = truncateAndValidateRow(r);
        if (fail) {
          r._kwFail = true;
          if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${fail.title}">${fail.label}</span>`;
          failTotal++;
        }
      });

      const validRows = pendingRows.filter(r => !r._kwFail);

      if (!validRows.length) {
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--danger);font-size:11px;">전체 유효성 검사 실패 (키워드 초과 또는 일목표 미달)</span>';
        await finalizeSlotApprovals();
        return;
      }

      const account = p.realAg ? await fetchBizfitAccount(p.realAg) : null;
      if (!account) {
        validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);">❌ 계정 미등록</span>'; });
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--danger);font-size:11px;">비즈핏 계정 정보 미등록 (회원 관리에서 BizFit ID/PW 등록 필요)</span>';
        failTotal += validRows.length;
        await finalizeSlotApprovals();
        return;
      }

      let gi;
      try {
        gi = await callBizfitProxy('/grade-info', { domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB, adrole: adrole || undefined, rawData: validRows.map(({_slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, ...rest}) => rest) });
      } catch(e) { gi = { success:false, message: '서버 호출 실패: '+e.message }; }

      if (!gi.success || !gi.gradeGroups || !gi.gradeGroups.length) {
        const msg = gi.message || '전송 가능한 등급이 없습니다.';
        validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(msg)}">❌ 등급조회 실패</span>`; });
        if (p.msgEl) p.msgEl.innerHTML = `<span style="color:var(--danger);font-size:11px;">${escProd(msg)}</span>`;
        failTotal += validRows.length;
        await finalizeSlotApprovals();
        return;
      }

      const matchedGrades = new Set();
      let agencyFail = 0;
      for (const g of gi.gradeGroups) {
        const grpRows = validRows.filter(r => r.상품등급명 === g.gradeName);
        if (!grpRows.length) continue;
        matchedGrades.add(g.gradeName);
        const payloadRows = grpRows.map(({_slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, ...rest}) => rest);
        let result;
        try {
          result = await callBizfitProxy('/register', {
            domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw,
            tab: g.actualTab || BIZFIT_TAB, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType,
            version: productVer, rowData: payloadRows,
          });
        } catch(e) { result = { success:false, message: e.message }; }
        if (result.success) {
          // 배치 내 일부 행만 결제 제외될 수 있어 서버가 반환한 행 인덱스로 매칭(payloadRows는 grpRows를 순서대로 map함)
          // PID로 매칭 안 하는 이유: 같은 업체가 슬롯 2개에 걸쳐 같은 배치에 들어오면 PID만으론 실패 행을 구분 못 함
          const failByIdx = new Map((result.fail_rows || []).map(f => [f.index, f.reason]));
          let okCount = 0;
          grpRows.forEach((r, i) => {
            const reason = failByIdx.get(i);
            if (reason === undefined) {
              r._rowOk = true; okCount++;
              if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>';
            } else if (r._statusTd) {
              r._statusTd.innerHTML = `<span style="color:var(--danger);" title="비즈핏 결제 제외 (${escProd(reason||'데이터 검증 실패')})">❌ 실패</span>`;
            }
          });
          okTotal += okCount;
          const failCount = grpRows.length - okCount;
          if (failCount) { failTotal += failCount; agencyFail += failCount; }
        } else {
          failTotal += grpRows.length;
          agencyFail += grpRows.length;
          grpRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(result.message||'')}">❌ 실패</span>`; });
        }
      }
      // 비즈핏 등급맵과 매칭 안 된 등급명 (유효 행 기준)
      const validGradeNames = new Set(validRows.map(r => r.상품등급명));
      validGradeNames.forEach(name => {
        if (!matchedGrades.has(name)) {
          const unmatchedRows = validRows.filter(r => r.상품등급명 === name);
          unmatchedRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);">❌ 등급 불일치</span>'; });
          failTotal += unmatchedRows.length;
          agencyFail += unmatchedRows.length;
        }
      });
      // 이번 회차에 성공한 상품만 슬롯별로 개별 기록 — 실패한 상품만 다음 재접수 때 다시 시도되도록
      const newlyOkBySlot = new Map();
      p.rows.forEach(r => {
        if (r._rowOk !== true || !r._slotKey) return;
        if (!newlyOkBySlot.has(r._slotKey)) newlyOkBySlot.set(r._slotKey, []);
        newlyOkBySlot.get(r._slotKey).push(r._doneKey || r.상품등급명);
      });
      await Promise.all([...newlyOkBySlot.entries()].map(async ([slotKey, names]) => {
        const s = slotMap.get(slotKey);
        const merged = [...new Set([...(s?.normalDoneProducts || []), ...names])];
        await HA.updateSlot(slotKey, { normalDoneProducts: merged });
        if (s) s.normalDoneProducts = merged;
      }));
      // 슬롯 단위 승인 판정 — 이 슬롯에 걸린 모든 상품행이 성공해야 승인 (일부 실패 시 보류)
      await finalizeSlotApprovals();
      if (p.msgEl) {
        const kwFailCount = p.rows.filter(r => r._kwFail).length;
        const parts = [kwFailCount ? `유효성 실패 ${kwFailCount}건` : '', agencyFail ? '일부 등급 실패 — 상태 칸에서 사유 확인(마우스오버)' : ''].filter(Boolean);
        p.msgEl.innerHTML = parts.length
          ? `<span style="color:var(--danger);font-size:11px;">${parts.join(' / ')}</span>`
          : `<span style="color:var(--accent);font-size:11px;">✅ 전체 접수 완료</span>`;
      }
    }

    // 대행사(계정)별로 병렬 처리
    await Promise.all(plan.map(p => processAgency(p)));

    if (gate) {
      // 상품별 완료 기록(normalDoneProducts)은 processAgency에서 이미 개별 저장됨 —
      // 여기서는 슬롯 전체(모든 활성 상품)가 완료된 키만 게이트에 반영
      gate[legKey] = approvedKeys;
      await gate.tryApprove();
    }

    return { okTotal, failTotal };
  }

  // submitPlanRows(즉시 접수)와 같은 검증·등급매칭을 거치되, /register 호출 대신 완성된 페이로드를
  // ha/scheduled_dispatch에 저장한다. 승인(status→active)은 서버가 scheduled_batches 카운터로 그룹 전체
  // 완료를 확인한 뒤 처리하지만, 캐시차감은 그걸 기다리지 않고 initScheduledBatches가 예약 시점에 바로
  // 실행한다 — 실패하면 기존 deduct-fail 배너에 반영. 유입플이 필요한 슬롯은 renderSubmitModal의
  // scheduleBlocked 판정이 이미 걸러서(사람이 유입플 탭 접수 버튼을 먼저 눌러 완료해야 예약 토글이 풀림)
  // 여기 도달하는 시점엔 유입플이 남아있지 않다고 가정한다.
  async function submitPlanRowsScheduled(plan, overlay, legKey, adrole, schedule) {
    const productVer = productVerFor(legKey);
    const batchGroupId = `sch_${genId()}`;
    let scheduledCount = 0, failTotal = 0;
    const dispatchEntries = [];
    const slotKeyCounts = new Map();

    async function scheduleAgency(p) {
      if (!p.rows.length) return;
      const pendingRows = p.rows.filter(r => !r._normalSubmitted);
      if (!pendingRows.length) return;

      pendingRows.forEach(r => { if (truncateAndValidateRow(r)) r._kwFail = true; });
      const validRows = pendingRows.filter(r => !r._kwFail);
      if (!validRows.length) { failTotal += pendingRows.length; return; }

      const account = p.realAg ? await fetchBizfitAccount(p.realAg) : null;
      if (!account) { failTotal += validRows.length; return; }

      let gi;
      try {
        gi = await callBizfitProxy('/grade-info', { domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB, adrole: adrole || undefined, rawData: [] });
      } catch(e) { gi = { success:false }; }
      if (!gi.success || !gi.gradeGroups || !gi.gradeGroups.length) { failTotal += validRows.length; return; }

      const expanded = validRows.flatMap(r => splitRowBySchedule(r, schedule));
      if (!expanded.length) return;

      for (const g of gi.gradeGroups) {
        const grpRows = expanded.filter(r => r.상품등급명 === g.gradeName);
        grpRows.forEach(r => {
          const { _slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, _sendAt, ...rowData } = r;
          dispatchEntries.push({
            slotKey: _slotKey, batchGroupId, sendAt: _sendAt, endpoint: '/register', agency: p.agency || '', adrole: adrole ?? null,
            payload: {
              domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw,
              tab: g.actualTab || BIZFIT_TAB, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType,
              // productVer는 일반(normalKeys) 탭에선 undefined(찰리/델타/네이비 전용 override) — 이 payload는
              // saveScheduledDispatch가 그대로 Firebase set()에 넘기는데, RTDB는 undefined 값을 허용하지
              // 않아 set()이 예외를 던진다(호출부에 catch가 없어 "처리 중" 버튼이 안 풀리는 결과로 이어짐).
              version: productVer ?? null, rowData: [rowData],
            },
          });
          slotKeyCounts.set(_slotKey, (slotKeyCounts.get(_slotKey) || 0) + 1);
          scheduledCount++;
        });
      }
    }

    await Promise.all(plan.map(p => scheduleAgency(p)));
    if (dispatchEntries.length) {
      const deductFailures = await initScheduledBatches(slotKeyCounts, batchGroupId);
      if (deductFailures.length && overlay) {
        overlay._deductFailures.push(...deductFailures);
        overlay._renderDeductFailures();
      }
      await Promise.all(dispatchEntries.map(saveScheduledDispatch));
    }
    return { scheduledCount, failTotal };
  }

  // ════════════════════════════════════════════════════════
  // 분할접수 현황 — ha/scheduled_dispatch 조회. 서버(bizfit-direct-proxy)가 sendAt 시각에
  // 맞춰 전송한 뒤 항목을 지우지 않고 status만 'pending' → 'done'으로 바꿔두므로, 완료된 항목도
  // 계속 이 경로에 남아 함께 조회된다(수정은 'pending'인 항목만 가능하게 막아둠). kimpro/reception.html과
  // 동일 구현(경로만 kimpro/→ha/) — 저쪽을 고치면 여기도 확인할 것.
  // ════════════════════════════════════════════════════════

  let _ssEntries = {};   // key -> entry, 등급 변경 시 저장된 계정정보(loginId/pwd) 조회용
  let _ssCollapsed = new Set(); // 접힌 그룹의 gid(slotKey 기준) 집합
  let _ssLastGroups = []; // 직전 렌더의 그룹 배열(펼치기/접기 클릭이 index로 이 배열을 참조)
  let _ssResplit = {}; // slotKey -> { open, loading, gradeGroups, sel:{gradeName:pct} } — 잔여 재분류 패널 상태

  function fmtScheduleTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${mm}.${dd} ${hh}:${mi}`;
  }

  async function reloadScheduleEntries() {
    const snap = await fbGet('ha/scheduled_dispatch');
    const val = snap.exists() ? snap.val() : {};
    _ssEntries = {};
    Object.entries(val).forEach(([k, v]) => { _ssEntries[k] = { ...v, _key: k }; });
    renderSplitScheduleList();
  }

  window.openSplitScheduleModal = async function() {
    const modal = document.getElementById('split-schedule-modal');
    modal.style.display = 'flex';
    document.getElementById('ss-search').value = '';
    document.getElementById('ss-status-filter').value = 'all';
    document.getElementById('ss-list').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>불러오는 중...</div>';
    document.getElementById('ss-count').textContent = '';
    _ssCollapsed = new Set();
    _ssResplit = {};

    await reloadScheduleEntries(); // _ssLastGroups 채우기
    _ssCollapsed = new Set(_ssLastGroups.map(g => g.gid)); // 처음엔 전체 접힌 상태로
    renderSplitScheduleList();
  };

  window.closeSplitScheduleModal = function() {
    document.getElementById('split-schedule-modal').style.display = 'none';
  };

  // 저장 시점엔 항상 'pending'이고(saveScheduledDispatch), 서버는 전송을 마쳐도 항목을 지우지 않고
  // status만 pending → done으로 바꿔두므로, pending이 아니면 완료로 간주한다.
  function isScheduleDone(status) {
    return !!status && status !== 'pending';
  }
  function scheduleStatusLabel(status) {
    if (status === 'cancelled') return `<span style="color:var(--muted);font-weight:600;">취소됨</span>`;
    const done = isScheduleDone(status);
    return `<span style="color:${done?'#ef4444':'#3b82f6'};font-weight:600;">${done?'완료':'대기중'}</span>`;
  }

  // 검색(업체명/PID/검색키워드/순위키워드 부분일치) + 상태 필터
  function filterScheduleEntries(entries) {
    const q = (document.getElementById('ss-search')?.value || '').trim().toLowerCase();
    const statusFilter = document.getElementById('ss-status-filter')?.value || 'all';
    return entries.filter(e => {
      const done = isScheduleDone(e.status);
      if (statusFilter === 'pending' && done) return false;
      if (statusFilter === 'done' && !done) return false;
      if (!q) return true;
      const row = (e.payload?.rowData || [])[0] || {};
      return [row.업체명, row.PID번호, row.검색키워드, row.순위키워드]
        .some(v => String(v||'').toLowerCase().includes(q));
    });
  }

  // slotKey(=한 번의 예약 등록 단위) 기준으로 묶는다 — PID/업체명으로 묶으면 같은 업체를 서로 다른
  // 시점에 두 번 예약했을 때 남은 수량 계산(잔여 재분류)이 두 배치를 섞어버리므로 slotKey가 맞다.
  // 보통 업체 하나 = slotKey 하나라 화면상 묶임새는 기존과 거의 같다.
  function groupScheduleEntries(entries) {
    const groups = new Map();
    entries.forEach(e => {
      const row = (e.payload?.rowData || [])[0] || {};
      const gid = e.slotKey || row.PID번호 || row.업체명 || 'unknown';
      if (!groups.has(gid)) groups.set(gid, { gid, store: row.업체명||'', pid: row.PID번호||'', agency: e.agency||'', items: [] });
      groups.get(gid).items.push(e);
    });
    const list = [...groups.values()];
    list.forEach(g => g.items.sort((a,b) => (a.sendAt||'').localeCompare(b.sendAt||'')));
    // 정렬 기준은 필터링 전 전체(_ssEntries)의 최소 sendAt으로 고정 — entries(필터된 부분집합)
    // 기준으로 정렬하면 상태 필터를 바꿀 때마다 남는 항목이 달라져 그 최솟값도 같이 바뀌면서
    // 그룹 순서 자체가 흔들린다(예: 대기중만 보면 이미 완료된 이른 시각 항목이 빠져 최솟값이 뒤로 밀림).
    const minSendAtByGid = new Map();
    Object.values(_ssEntries).forEach(e => {
      const row = (e.payload?.rowData || [])[0] || {};
      const gid = e.slotKey || row.PID번호 || row.업체명 || 'unknown';
      const cur = minSendAtByGid.get(gid);
      if (cur === undefined || (e.sendAt||'') < cur) minSendAtByGid.set(gid, e.sendAt||'');
    });
    list.sort((a,b) => (minSendAtByGid.get(a.gid)||'').localeCompare(minSendAtByGid.get(b.gid)||''));
    return list;
  }

  window.toggleScheduleGroupAt = function(i) {
    const g = _ssLastGroups[i];
    if (!g) return;
    if (_ssCollapsed.has(g.gid)) _ssCollapsed.delete(g.gid); else _ssCollapsed.add(g.gid);
    renderSplitScheduleList();
  };

  window.toggleAllScheduleGroups = function() {
    const allCollapsed = _ssLastGroups.length > 0 && _ssLastGroups.every(g => _ssCollapsed.has(g.gid));
    if (allCollapsed) _ssCollapsed.clear();
    else _ssLastGroups.forEach(g => _ssCollapsed.add(g.gid));
    renderSplitScheduleList();
  };

  // 검색/필터는 그룹을 걸러낼 뿐 펼침 상태는 건드리지 않는다 — 펼쳐둔 그룹은 펼쳐진 채로 필터링되고,
  // 접힌 그룹은 헤더의 건수 배지로만 결과가 보인다(펼쳐야 상세 확인).
  window.runScheduleSearch = function() {
    renderSplitScheduleList();
  };

  window.clearScheduleSearch = function() {
    document.getElementById('ss-search').value = '';
    renderSplitScheduleList();
  };

  function ssKwCountBadge(str) {
    const list = String(str||'').split(',').map(k=>k.trim()).filter(Boolean);
    if (!list.length) return '<span style="color:#c0c8d4;font-size:11px;">-</span>';
    return `<span title="${escProd(list.join(', '))}" style="display:inline-block;padding:1px 7px;border-radius:100px;font-size:10px;font-weight:700;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;cursor:default;">${list.length}개</span>`;
  }

  // 검색키워드 입력칸 옆 개수 배지 — 저장(blur) 전에도 타이핑에 맞춰 즉시 갱신
  window.updateScheduleKwCount = function(key, val) {
    const el = document.getElementById(`ss-kwcnt-${key}`);
    if (el) el.innerHTML = ssKwCountBadge(val);
  };

  function renderSplitScheduleList() {
    const listEl = document.getElementById('ss-list');
    const total = Object.keys(_ssEntries).length;
    const filtered = filterScheduleEntries(Object.values(_ssEntries));
    const groups = groupScheduleEntries(filtered);
    _ssLastGroups = groups;

    if (!groups.length) {
      listEl.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);font-size:13px;">조건에 맞는 항목이 없습니다.</div>';
    } else {
      listEl.innerHTML = groups.map((g, i) => {
        const collapsed = _ssCollapsed.has(g.gid);
        const doneCount = g.items.filter(e => isScheduleDone(e.status)).length;
        const pendCount = g.items.length - doneCount;
        const selCount = (_ssResplit[g.gid]?.selectedKeys || new Set()).size;
        return `
        <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f8fafc;">
            <div onclick="toggleScheduleGroupAt(${i})" style="display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;flex:1;">
              <span style="font-size:10px;color:var(--muted);flex-shrink:0;">${collapsed?'▶':'▼'}</span>
              <span style="font-size:11px;color:#4338ca;font-weight:600;flex-shrink:0;">${escProd(g.agency||'대행사 미지정')}</span>
              <span style="color:var(--muted);flex-shrink:0;">/</span>
              <span style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escProd(g.store||'-')}</span>
              <span style="color:var(--muted);flex-shrink:0;">/</span>
              <span style="font-size:11px;color:var(--text2);font-family:monospace;flex-shrink:0;">${escProd(g.pid||'-')}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
              ${pendCount
                ? `<button onclick="event.stopPropagation();toggleScheduleResplit('${g.gid}')" style="padding:3px 9px;border:1px solid #c7d2fe;border-radius:100px;background:#eef2ff;color:#4338ca;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;">🔀 ${selCount ? `선택 ${selCount}건 재분류` : '잔여 재분류'}</button>`
                : `<button style="padding:3px 9px;border:1px solid transparent;border-radius:100px;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;visibility:hidden;">🔀 잔여 재분류</button>`}
              <div onclick="toggleScheduleGroupAt(${i})" style="font-size:11px;color:var(--text2);white-space:nowrap;cursor:pointer;">
                전체 ${g.items.length}건 · <span style="color:#3b82f6;">대기중 ${pendCount}</span> · <span style="color:#ef4444;">완료 ${doneCount}</span>
              </div>
            </div>
          </div>
          ${renderScheduleResplitPanel(g)}
          ${collapsed ? '' : `
          <table class="ag-table" style="table-layout:fixed;">
            <thead><tr>
              <th style="text-align:center;width:3%"></th>
              <th style="text-align:center;width:11%">전송예정</th>
              <th style="text-align:center;width:9%">PID</th>
              <th style="text-align:center;width:8%">대행사</th>
              <th style="text-align:center;width:11%">등급</th><th style="text-align:center;width:25%">검색키워드</th>
              <th style="text-align:center;width:7%">키워드 수</th>
              <th style="text-align:center;width:6%">일 목표</th><th style="text-align:center;width:5%">일 수</th>
              <th style="text-align:center;width:8%">예약일</th><th style="text-align:center;width:7%">상태</th>
            </tr></thead>
            <tbody>
              ${g.items.map(e => {
                const row = (e.payload?.rowData || [])[0] || {};
                const done = isScheduleDone(e.status);
                const checked = (_ssResplit[g.gid]?.selectedKeys || new Set()).has(e._key);
                return `
                <tr>
                  <td style="text-align:center">${done ? '' : `<input type="checkbox" ${checked?'checked':''} onchange="onScheduleRowCheck('${g.gid}','${e._key}',this.checked)">`}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);white-space:nowrap;">${fmtScheduleTime(e.sendAt)}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);">${escProd(row.PID번호||'-')}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);">${escProd(e.agency||'-')}</td>
                  <td id="ss-grade-${e._key}" style="text-align:center">
                    <span>${escProd(e.payload?.gradeName || row.상품등급명 || '-')}</span>
                    ${done ? '' : `<button onclick="editScheduleGrade('${e._key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`}
                  </td>
                  <td style="text-align:center" title="순위키워드: ${escProd(row.순위키워드||'-')}">
                    <input type="text" value="${escProd(row.검색키워드||'')}" placeholder="검색키워드" ${done?'disabled':''}
                      oninput="updateScheduleKwCount('${e._key}',this.value)"
                      onblur="saveScheduleKeyword('${e._key}',this)" onkeydown="if(event.key==='Enter')this.blur()"
                      style="width:100%;font-size:12px;font-family:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:5px;text-align:center;box-sizing:border-box;${done?'background:#f8fafc;color:var(--text2);':''}">
                  </td>
                  <td style="text-align:center"><span id="ss-kwcnt-${e._key}">${ssKwCountBadge(row.검색키워드)}</span></td>
                  <td style="text-align:center">${(row.일목표||0).toLocaleString()}</td>
                  <td style="text-align:center">${row.일수||0}</td>
                  <td style="text-align:center">${escProd(row.예약일||'-')}</td>
                  <td style="text-align:center">
                    ${scheduleStatusLabel(e.status)}
                    ${(isScheduleDone(e.status) && e.status !== 'cancelled') ? `<button onclick="cancelScheduleEntry('${e._key}')" title="이 건만 취소하고 슬롯을 되돌리기" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">↩️</button>` : ''}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`}
        </div>`;
      }).join('');
    }

    document.getElementById('ss-count').textContent = filtered.length === total ? `전체 ${total}건` : `${filtered.length}건 표시 / 전체 ${total}건`;
  }

  // ── 잔여 재분류 — 슬롯의 남은(pending) 항목을 취소하고 등급별 비율(직접입력)로 다시 나눠 재생성 ──
  // 대상은 아직 서버에 안 나간 pending뿐이라 bizfit 쪽 취소 API가 필요없고, Firebase에서 지우고
  // 다시 쓰면 끝(등급변경과 동일하게 계정으로 grade-info 재조회해 실재하는 등급만 고르게 함).
  function idSafe(s) { return encodeURIComponent(String(s)); }
  function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  // 등급명이 트래픽(NP트래픽, adrole 없음)/저장(NP위치저장, adrole='100') 계열끼리 겹칠 수 있어서
  // (찰리/델타가 이 계열) gradeName만으론 구분이 안 됨 — 계열까지 합친 조합키로 고유하게 식별한다.
  function scheduleGradeCkey(adrole, gradeName) { return (adrole ? 'storage' : 'traffic') + '::' + gradeName; }

  // 계정의 등급을 트래픽/저장 두 계열 다 조회해 합쳐서 반환 — 등급변경/잔여재분류 공용.
  // 하나만 조회하면(예전 방식) 반대 계열 등급(예: 찰리/델타의 NP위치저장)이 아예 선택지에 안 뜬다.
  async function fetchScheduleGradeGroups(sample) {
    const base = { domain: sample.payload?.domain || BIZFIT_DOMAIN, loginId: sample.payload?.loginId, pwd: sample.payload?.pwd, tab: BIZFIT_TAB, rawData: [] };
    const [giTraffic, giStorage] = await Promise.all([
      callBizfitProxy('/grade-info', base).catch(() => ({ success:false })),
      callBizfitProxy('/grade-info', { ...base, adrole: '100' }).catch(() => ({ success:false })),
    ]);
    const traffic = (giTraffic.success && giTraffic.gradeGroups) ? giTraffic.gradeGroups.map(g => ({ ...g, adrole: null,  category: '트래픽' })) : [];
    const storage = (giStorage.success && giStorage.gradeGroups) ? giStorage.gradeGroups.map(g => ({ ...g, adrole: '100', category: '저장'   })) : [];
    return [...traffic, ...storage].map(g => ({ ...g, ckey: scheduleGradeCkey(g.adrole, g.gradeName) }));
  }

  // 그룹당 하나만 존재하는 재분류 상태 — 패널 열기 전에 행 체크박스를 먼저 누를 수도 있어서
  // toggleScheduleResplit뿐 아니라 onScheduleRowCheck에서도 필요할 때 만든다.
  function ensureResplitState(slotKey) {
    return _ssResplit[slotKey] || (_ssResplit[slotKey] = { open:false, loading:false, gradeGroups:null, sel:{}, selectedKeys:new Set() });
  }

  // 행 체크박스 — 하나 이상 체크하면 그 항목들만 대상으로, 아무것도 안 체크하면(기본) 전체(잔여 전부) 대상으로
  // 재분류한다(applyScheduleResplitClick 참고). 체크만으로는 아무 요청도 안 나가고 버튼 라벨만 바뀐다.
  window.onScheduleRowCheck = function(slotKey, entryKey, checked) {
    const st = ensureResplitState(slotKey);
    if (checked) st.selectedKeys.add(entryKey); else st.selectedKeys.delete(entryKey);
    renderSplitScheduleList();
  };

  window.toggleScheduleResplit = async function(slotKey) {
    const st = ensureResplitState(slotKey);
    st.open = !st.open;
    if (st.open && !st.gradeGroups && !st.loading) {
      st.loading = true;
      renderSplitScheduleList();
      const items = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
      const targetItems = st.selectedKeys.size ? items.filter(e => st.selectedKeys.has(e._key)) : items;
      const sample = targetItems[0] || items[0];
      st.gradeGroups = sample ? await fetchScheduleGradeGroups(sample) : [];
      st.loading = false;
      // 시작점 제공 — 대상(선택했으면 선택분, 아니면 전체)이 지금 쓰고 있는 등급들을 기본 체크해두고
      // 등급 수만큼 균등 비율을 미리 채워줌(그대로 써도 되고 고쳐도 됨)
      const curKeys = [...new Set(targetItems.map(e => scheduleGradeCkey(e.adrole, e.payload?.gradeName)).filter(k => k && !k.endsWith('::')))];
      if (curKeys.length) {
        const pct = Math.round(100 / curKeys.length);
        curKeys.forEach(k => { st.sel[k] = pct; });
      }
    }
    renderSplitScheduleList();
  };

  window.onScheduleResplitCheck = function(slotKey, ckey, checked) {
    const st = _ssResplit[slotKey]; if (!st) return;
    const pctInput = document.getElementById(`ss-resplit-pct-${slotKey}-${idSafe(ckey)}`);
    if (checked) {
      if (st.sel[ckey] == null) st.sel[ckey] = 0;
      if (pctInput) pctInput.disabled = false;
    } else {
      delete st.sel[ckey];
      if (pctInput) pctInput.disabled = true;
    }
    updateScheduleResplitSum(slotKey);
  };

  window.onScheduleResplitPctInput = function(slotKey, ckey, val) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.sel[ckey] = Math.max(0, parseInt(val)||0);
    updateScheduleResplitSum(slotKey);
  };

  // 최소 접수 수량 — 비즈핏 최소 수량 기준, splitRowBySchedule과 동일
  const SCHEDULE_MIN_PORTION = 10;

  // 같은 sendAt(=같은 시각에 나갈 조각)끼리 묶어 그 시점의 일목표 합을 비율대로 나눈다. 조각 하나가
  // 최소수량 미만이 되면(예: 남은 양이 적은데 너무 잘게 쪼갬) 그 조각만 조용히 버리지 않고 violations로
  // 보고해 실행 자체를 막는다 — 안 그러면 그 등급분만 수량이 통째로 증발해도 아무 표시가 안 남는다.
  function computeResplitBuckets(slotKey, grades, targetKeys) {
    const allItems = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    const items = targetKeys ? allItems.filter(e => targetKeys.has(e._key)) : allItems;
    const byTime = new Map();
    items.forEach(e => {
      const t = e.sendAt || '';
      if (!byTime.has(t)) byTime.set(t, []);
      byTime.get(t).push(e);
    });

    const buckets = [];
    const violations = [];
    byTime.forEach((bucket, sendAt) => {
      const totalTarget = bucket.reduce((s,e) => s + ((e.payload?.rowData||[])[0]?.일목표 || 0), 0);
      const amounts = lrm(grades.map(g => ({ id: g.ckey, ratio: g.pct })), totalTarget);
      grades.forEach(g => {
        const amt = amounts[g.ckey] || 0;
        if (amt > 0 && amt < SCHEDULE_MIN_PORTION) violations.push({ sendAt, gradeName: g.gradeName, amt });
      });
      buckets.push({ sendAt, bucket, amounts });
    });
    return { buckets, violations };
  }

  // 체크박스로 일부 항목만 골랐을 때, 같은 시각(sendAt)에 다른 등급과 함께 묶여 있던 항목을 그중
  // 일부만 재분류하면 그 시각의 원래 목표가 반쪽만 재분배돼 수량이 어긋난다 — 그 시각 전체가
  // 선택되거나 전체가 빠지거나 둘 중 하나여야 하므로, 걸치는 시각이 있으면 실행 자체를 막는다.
  function scheduleResplitPartialSendAts(slotKey, targetKeys) {
    const allItems = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    const bySendAt = new Map();
    allItems.forEach(e => {
      const t = e.sendAt || '';
      if (!bySendAt.has(t)) bySendAt.set(t, []);
      bySendAt.get(t).push(e);
    });
    const partial = [];
    bySendAt.forEach((list, sendAt) => {
      const selectedCount = list.filter(e => targetKeys.has(e._key)).length;
      if (selectedCount > 0 && selectedCount < list.length) partial.push(sendAt);
    });
    return partial;
  }

  // 재분류 패널의 모든 방어 로직을 한곳에 모음 — alert 팝업 대신 적용 버튼 위에 바로 보여주기 위해
  // 체크박스/비율 입력이 바뀔 때마다(렌더 시점 포함) 이 함수로 다시 계산해서 경고문+버튼 상태를 맞춘다.
  function computeResplitValidity(slotKey) {
    const st = _ssResplit[slotKey];
    if (!st) return null;
    const grades = Object.entries(st.sel).filter(([,pct]) => pct > 0).map(([ckey,pct]) => {
      const gg = (st.gradeGroups||[]).find(x => x.ckey === ckey);
      return gg ? { ckey, gradeName: gg.gradeName, classType: gg.classType, gradeType: gg.gradeType, actualTab: gg.actualTab, adrole: gg.adrole, pct } : null;
    }).filter(Boolean);
    const pctSum = grades.reduce((a,g) => a+g.pct, 0);
    const targetKeys = st.selectedKeys && st.selectedKeys.size ? st.selectedKeys : null;
    const partialSendAts = targetKeys ? scheduleResplitPartialSendAts(slotKey, targetKeys) : [];
    const { violations } = grades.length ? computeResplitBuckets(slotKey, grades, targetKeys) : { violations: [] };

    const messages = [];
    if (pctSum > 100) messages.push(`비율 합계가 ${pctSum}%로 100%를 초과했습니다`);
    if (partialSendAts.length) {
      const times = [...new Set(partialSendAts)].map(t => fmtScheduleTime(t)).join(', ');
      messages.push(`같은 시각(${times})에 여러 등급으로 묶인 항목은 전체 선택/전체 해제만 가능합니다`);
    }
    if (violations.length) {
      const detail = [...new Set(violations.map(v => `${v.gradeName}(${v.amt})`))].join(', ');
      messages.push(`최소 접수 수량(${SCHEDULE_MIN_PORTION}) 미만 조각 발생: ${detail}`);
    }
    return { grades, pctSum, targetKeys, partialSendAts, violations, messages, blocked: messages.length > 0 || !grades.length };
  }

  function updateScheduleResplitSum(slotKey) {
    const v = computeResplitValidity(slotKey);
    if (!v) return;
    const sumEl = document.getElementById(`ss-resplit-sum-${slotKey}`);
    if (sumEl) { sumEl.textContent = v.pctSum; sumEl.style.color = v.pctSum>100 ? 'var(--danger)' : (v.pctSum===100 ? 'var(--accent)' : '#b45309'); }
    const warnEl = document.getElementById(`ss-resplit-warn-${slotKey}`);
    if (warnEl) {
      if (v.messages.length) { warnEl.style.display = 'block'; warnEl.textContent = '⚠ ' + v.messages.join(' · '); }
      else { warnEl.style.display = 'none'; warnEl.textContent = ''; }
    }
    const btnEl = document.getElementById(`ss-resplit-apply-${slotKey}`);
    if (btnEl) {
      btnEl.disabled = v.blocked;
      btnEl.style.background = v.blocked ? 'var(--muted)' : '#4338ca';
      btnEl.style.cursor = v.blocked ? 'not-allowed' : 'pointer';
    }
  }

  function renderScheduleResplitPanel(g) {
    const st = _ssResplit[g.gid];
    if (!st || !st.open) return '';
    const slotKey = g.gid;
    let body;
    if (st.loading) {
      body = '<span style="font-size:12px;color:var(--muted);">등급 조회 중...</span>';
    } else if (!st.gradeGroups || !st.gradeGroups.length) {
      body = '<span style="font-size:12px;color:var(--danger);">등급 조회 실패 — 계정 정보를 확인해주세요.</span>';
    } else {
      const categories = [...new Set(st.gradeGroups.map(gg => gg.category))];
      const v = computeResplitValidity(slotKey);
      body = `
        ${categories.map(cat => `
        <div style="margin-bottom:8px;">
          <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;">${escProd(cat)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px 18px;">
            ${st.gradeGroups.filter(gg => gg.category === cat).map(gg => {
              const checked = st.sel[gg.ckey] != null;
              return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;">
                <input type="checkbox" ${checked?'checked':''} onchange="onScheduleResplitCheck('${slotKey}','${escJs(gg.ckey)}',this.checked)">
                <span style="min-width:60px;">${escProd(gg.gradeName)}</span>
                <input type="number" id="ss-resplit-pct-${slotKey}-${idSafe(gg.ckey)}" value="${checked?st.sel[gg.ckey]:''}" ${checked?'':'disabled'}
                  oninput="onScheduleResplitPctInput('${slotKey}','${escJs(gg.ckey)}',this.value)" min="0" max="100"
                  style="width:56px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;">%
              </label>`;
            }).join('')}
          </div>
        </div>`).join('')}
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span style="font-size:11px;color:var(--text2);">
            <span style="color:#ef4444;font-weight:700;">대기중 항목 취소 후 재생성</span>
            · 합계 <span id="ss-resplit-sum-${slotKey}" style="font-weight:700;color:${v.pctSum>100?'var(--danger)':v.pctSum===100?'var(--accent)':'#b45309'};">${v.pctSum}</span>%
          </span>
          <button id="ss-resplit-apply-${slotKey}" onclick="applyScheduleResplitClick('${slotKey}')" ${v.blocked?'disabled':''}
            style="padding:6px 14px;border:none;border-radius:7px;background:${v.blocked?'var(--muted)':'#4338ca'};color:#fff;cursor:${v.blocked?'not-allowed':'pointer'};font-size:12px;font-weight:700;font-family:inherit;">적용</button>
        </div>
        <div id="ss-resplit-warn-${slotKey}" style="margin-top:6px;font-size:11px;color:var(--danger);font-weight:600;${v.messages.length?'':'display:none;'}">${v.messages.length?'⚠ '+escProd(v.messages.join(' · ')):''}</div>`;
    }
    return `<div style="padding:12px 14px;background:#eef2ff;border-top:1px solid #c7d2fe;border-bottom:1px solid #c7d2fe;">${body}</div>`;
  }

  window.applyScheduleResplitClick = async function(slotKey) {
    const v = computeResplitValidity(slotKey);
    if (!v || v.blocked) return; // 적용 버튼이 이미 막혀있어 정상 흐름에서 도달 안 함 — 방어적으로만 남겨둠(팝업 없음)
    const scopeLabel = v.targetKeys ? `선택한 ${v.targetKeys.size}건` : '남은 예약 항목';
    if (!confirm(`${scopeLabel}을 취소하고 ${v.grades.map(g=>`${g.gradeName} ${g.pct}%`).join(' / ')} 비율로 다시 나눕니다. 계속할까요?`)) return;

    try {
      const result = await applyScheduleResplit(slotKey, v.grades, v.targetKeys);
      delete _ssResplit[slotKey];
      await reloadScheduleEntries();
      alert(`재분류 완료 — 기존 ${result.removed}건 취소, 새로 ${result.created}건 생성됐습니다.`);
    } catch(e) {
      alert('재분류 실패: ' + (e.message||e));
    }
  };

  async function applyScheduleResplit(slotKey, grades, targetKeys) {
    const { buckets, violations } = computeResplitBuckets(slotKey, grades, targetKeys);
    if (!buckets.length) return { created: 0, removed: 0 };
    if (violations.length) throw new Error('최소 접수 수량 미만인 조각이 있어 중단했습니다.'); // applyScheduleResplitClick에서 이미 막지만 방어적으로 재확인

    const patch = {};
    let removed = 0, created = 0;

    buckets.forEach(({ sendAt, bucket, amounts }) => {
      const sample = bucket[0];
      const sampleRow = (sample.payload?.rowData || [])[0] || {};

      bucket.forEach(e => { patch[`scheduled_dispatch/${e._key}`] = null; removed++; });

      grades.forEach(g => {
        const amt = amounts[g.ckey] || 0;
        if (amt <= 0) return;
        const key = genId();
        patch[`scheduled_dispatch/${key}`] = {
          slotKey, batchGroupId: sample.batchGroupId, sendAt, endpoint: sample.endpoint, agency: sample.agency || '', adrole: g.adrole ?? null,
          payload: {
            ...sample.payload, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType, tab: g.actualTab || BIZFIT_TAB,
            rowData: [{ ...sampleRow, 일목표: amt, 상품등급명: g.gradeName }],
          },
          status: 'pending', createdAt: new Date().toISOString(),
        };
        created++;
      });
    });

    const batchSnap = await fbGet(`ha/scheduled_batches/${slotKey}`);
    const batch = batchSnap.exists() ? batchSnap.val() : { total: 0 };
    patch[`scheduled_batches/${slotKey}/total`] = Math.max(0, (batch.total||0) - removed + created);

    await fbUpdate('ha', patch);
    return { created, removed };
  }

  // 검색키워드 변경 — 실제 접수 시 서버에 그대로 전송되는 값이라 payload.rowData[0]만 patch하면 충분
  window.saveScheduleKeyword = async function(key, inputEl) {
    if (isScheduleDone(_ssEntries[key]?.status)) { inputEl.disabled = true; return; } // 완료된 항목은 수정 불가
    const val = inputEl.value.trim();
    inputEl.disabled = true;
    try {
      await fbUpdate(`ha/scheduled_dispatch/${key}/payload/rowData/0`, { 검색키워드: val });
      if (_ssEntries[key]) {
        const row = (_ssEntries[key].payload.rowData || [])[0]; if (row) row.검색키워드 = val;
      }
      inputEl.style.borderColor = 'var(--accent)';
      setTimeout(() => { inputEl.style.borderColor = 'var(--border)'; }, 800);
    } catch(e) {
      alert('키워드 저장 실패: ' + (e.message||e));
    } finally {
      inputEl.disabled = false;
    }
  };

  // 상품 등급 변경 — gradeName만 바꾸면 안 되고(classType/gradeType/tab이 그 등급 전용 값과 짝을 이뤄야
  // 서버 /register가 올바른 등급으로 접수함) 저장된 계정으로 grade-info를 다시 조회해 그 계정에 실제로
  // 존재하는 등급 중에서만 고르게 한다(트래픽/저장 두 계열 다 조회 — fetchScheduleGradeGroups 참고).
  // select로 고른 등급의 4개 필드 + adrole을 한 번에 갱신.
  window.editScheduleGrade = async function(key) {
    const e = _ssEntries[key];
    const cell = document.getElementById(`ss-grade-${key}`);
    if (!e || !cell || isScheduleDone(e.status)) return; // 완료된 항목은 수정 불가
    cell.innerHTML = '<span style="font-size:11px;color:var(--muted);">불러오는 중...</span>';
    const groups = await fetchScheduleGradeGroups(e);
    if (!groups.length) {
      cell.innerHTML = '<span style="color:var(--danger);font-size:11px;">등급 조회 실패</span>';
      return;
    }
    const curName = e.payload?.gradeName || '';
    const curCkey = scheduleGradeCkey(e.adrole, curName);
    const categories = [...new Set(groups.map(g => g.category))];
    cell.innerHTML = `<select style="font-size:12px;font-family:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:5px;max-width:100%;">
      ${categories.map(cat => `<optgroup label="${escProd(cat)}">
        ${groups.filter(g => g.category === cat).map(g => `<option value="${escProd(g.ckey)}" ${g.ckey===curCkey?'selected':''}>${escProd(g.gradeName)}</option>`).join('')}
      </optgroup>`).join('')}
    </select>`;
    cell.querySelector('select').onchange = async (ev) => {
      const g = groups.find(x => x.ckey === ev.target.value);
      if (!g) return;
      ev.target.disabled = true;
      try {
        await fbUpdate(`ha/scheduled_dispatch/${key}`, {
          adrole: g.adrole ?? null,
          'payload/gradeName':  g.gradeName,
          'payload/classType':  g.classType,
          'payload/gradeType':  g.gradeType,
          'payload/tab':        g.actualTab || BIZFIT_TAB,
          'payload/rowData/0/상품등급명': g.gradeName,
        });
        e.adrole = g.adrole ?? null;
        e.payload.gradeName = g.gradeName; e.payload.classType = g.classType;
        e.payload.gradeType = g.gradeType; e.payload.tab = g.actualTab || BIZFIT_TAB;
        const row = (e.payload.rowData||[])[0]; if (row) row.상품등급명 = g.gradeName;
        cell.innerHTML = `<span>${escProd(g.gradeName)}</span> <button onclick="editScheduleGrade('${key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`;
      } catch(err) {
        alert('등급 변경 실패: ' + (err.message||err));
        cell.innerHTML = `<span>${escProd(curName||'-')}</span> <button onclick="editScheduleGrade('${key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`;
      }
    };
  };

  // 완료(done)된 한 건만 취소 — 실수로 접수했거나(예: 일반만 접수했는데 되돌려야 할 때) 되돌리는 용도.
  // bizfit-direct-proxy /cleanup-cancel은 MID 단위로 취소한다(Pcode 구분이 없음 — tools/macro/bizfit_cleanup.html과
  // 동일 API) — 그 MID에 이 계정으로 걸린 활성 캠페인이 여러 개면 전부 취소되니, 그 MID에 다른 상품도
  // 살아있다면 그것까지 같이 취소될 수 있음(confirm 문구로 안내). 취소 성공 시 이 로그 항목은 'cancelled'로
  // 표시만 바꾸고(재사용 안 함), 슬롯의 normalDoneProducts에서 이 등급명을 빼고 status가 승인(active)이었으면
  // accepted로 되돌려 재접수 가능하게 한다 — 접수 확인 팝업의 "초기화" 버튼과 같은 되돌리기, 대상만 이 한 건.
  window.cancelScheduleEntry = async function(key) {
    const e = _ssEntries[key];
    if (!e || !isScheduleDone(e.status) || e.status === 'cancelled') return;
    const row = (e.payload?.rowData || [])[0] || {};
    const mid = row.PID번호;
    const gradeName = e.payload?.gradeName || row.상품등급명 || '';
    if (!mid || !e.payload?.loginId || !e.payload?.pwd) { alert('취소에 필요한 계정 정보가 없습니다.'); return; }
    if (!confirm(`${row.업체명||mid} — ${gradeName} 등급 접수를 취소합니다.\n※ 비즈핏 취소는 Pcode 구분 없이 이 MID 단위로 처리돼, 같은 MID에 걸린 다른 상품이 있으면 그것도 같이 취소될 수 있습니다.\n계속할까요?`)) return;

    try {
      const res = await callBizfitProxy('/cleanup-cancel', { loginId: e.payload.loginId, pwd: e.payload.pwd, mids: [mid] });
      const rows = (res.results || []).filter(r => r.mid === mid);
      const ok = res.success && rows.length > 0 && rows.every(r => r.success);
      if (!ok) {
        alert('취소 실패: ' + (rows.length ? rows.map(r => r.message).join(' / ') : (res.message || '알 수 없는 오류')));
        return;
      }

      await fbUpdate(`ha/scheduled_dispatch/${key}`, { status: 'cancelled' });
      e.status = 'cancelled';

      if (e.slotKey) {
        const slotSnap = await fbGet(`ha/slots/${e.slotKey}`);
        if (slotSnap.exists()) {
          const slot = slotSnap.val();
          const patch = {};
          if (Array.isArray(slot.normalDoneProducts) && slot.normalDoneProducts.includes(gradeName)) {
            patch.normalDoneProducts = slot.normalDoneProducts.filter(n => n !== gradeName);
          }
          if (slot.status === 'active') patch.status = 'accepted';
          if (Object.keys(patch).length) await HA.updateSlot(e.slotKey, patch);
        }
      }

      renderSplitScheduleList();
      alert('취소 완료 — 슬롯이 되돌려졌습니다.');
    } catch(err) {
      alert('취소 처리 중 오류: ' + (err.message||err));
    }
  };

  function lockOtherSubmitTabs(overlay, btnPrefix) {
    const youpflBtn = overlay.querySelector('#youpfl-apply-btn');
    if (youpflBtn) youpflBtn.disabled = true;
    // 슬롯 상태를 동시에 건드릴 수 있는 다른 탭(일반/찰리/블로그)도 진행 중엔 잠가둔다
    const otherBtns = ALL_SUBMIT_PREFIXES
      .filter(pfx => pfx !== btnPrefix)
      .map(pfx => overlay.querySelector(`#${pfx}-apply-btn`))
      .filter(Boolean);
    otherBtns.forEach(b => { b.disabled = true; });
    return { youpflBtn, otherBtns };
  }

  // 접수 신청/예약 저장 공용 마무리 — 버튼 문구/색/닫기 동작만 호출부가 정하고 나머지 잠금 해제는 여기서 공통 처리
  function finishTabUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, { text, color, onClose }) {
    window.bizfitSubmitting = false;
    applyBtn.textContent = text;
    applyBtn.style.background = color;
    applyBtn.style.cursor = 'default';
    closeBtn.disabled = false;
    closeBtn.onclick = onClose;
    // 유입플/다른 탭 잠금 해제 — 이 탭을 먼저 끝낸 뒤 계속 열어둔 채로 나머지도 마저 접수할 수 있어야 함
    if (youpflBtn) youpflBtn.disabled = false;
    otherBtns.forEach(b => { b.disabled = false; });
  }

  function finishSubmitUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, gate, okTotal, failTotal) {
    finishTabUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, {
      text: failTotal ? `완료 — 성공 ${okTotal} / 실패 ${failTotal}` : `✅ 전체 완료 (${okTotal}건)`,
      color: failTotal ? '#b91c1c' : '#475569',
      onClose: () => { overlay.remove(); if (!gate) renderReceipts(false); },
    });
  }

  // submitPlanRowsScheduled(예약 저장) 결과 표시 — 캐시차감은 이미 실행됐고(실패 시 상단 배너), 승인(상태 전환)만
  // 서버가 예약 그룹 완료 시 처리하므로 여기선 "예약됨"까지만
  function finishScheduleUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, scheduledCount, failTotal) {
    finishTabUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, {
      text: failTotal ? `⏰ 예약 ${scheduledCount}건 (실패 ${failTotal})` : `⏰ 예약 완료 (${scheduledCount}건)`,
      color: failTotal ? '#b91c1c' : '#f59e0b',
      onClose: () => { overlay.remove(); renderReceipts(false); },
    });
  }

  async function executeSubmit(plan, overlay, gate=null, legKey='normalKeys', adrole=null) {
    const btnPrefix = SUBMIT_TAB_PREFIX[legKey] || 'submit';
    const applyBtn = overlay.querySelector(`#${btnPrefix}-apply-btn`);
    const closeBtn = overlay.querySelector(`#${btnPrefix}-close-btn`);
    window.bizfitSubmitting = true;
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 처리 중...'; applyBtn.style.background = '#6b7280';
    closeBtn.disabled = true;
    const { youpflBtn, otherBtns } = lockOtherSubmitTabs(overlay, btnPrefix);

    if (scheduleConfig && scheduleConfig.length) {
      const { scheduledCount, failTotal } = await submitPlanRowsScheduled(plan, overlay, legKey, adrole, scheduleConfig);
      finishScheduleUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, scheduledCount, failTotal);
      return;
    }

    const { okTotal, failTotal } = await submitPlanRows(plan, overlay, gate, legKey, adrole);

    finishSubmitUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, gate, okTotal, failTotal);
  }

  // 블로그 탭 제출 — 델타(NP 위치저장, adrole=100)와 네이비(NP트래픽, adrole 없음)는 등급 체계가 달라
  // grade-info/register를 한 번에 묶어 부를 수 없다 — 각자 submitPlanRows로 따로 접수하고 결과만 합쳐 보여준다.
  async function executeBlogSubmit(deltaPlan, navyPlan, overlay, gate=null) {
    const btnPrefix = 'bsub';
    const applyBtn = overlay.querySelector(`#${btnPrefix}-apply-btn`);
    const closeBtn = overlay.querySelector(`#${btnPrefix}-close-btn`);
    window.bizfitSubmitting = true;
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 처리 중...'; applyBtn.style.background = '#6b7280';
    closeBtn.disabled = true;
    const { youpflBtn, otherBtns } = lockOtherSubmitTabs(overlay, btnPrefix);

    if (scheduleConfig && scheduleConfig.length) {
      const [d, n] = await Promise.all([
        submitPlanRowsScheduled(deltaPlan, overlay, 'deltaKeys', DELTA_ADROLE, scheduleConfig),
        submitPlanRowsScheduled(navyPlan, overlay, 'navyKeys', null, scheduleConfig),
      ]);
      finishScheduleUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, d.scheduledCount + n.scheduledCount, d.failTotal + n.failTotal);
      return;
    }

    const [d, n] = await Promise.all([
      submitPlanRows(deltaPlan, overlay, gate, 'deltaKeys', DELTA_ADROLE),
      submitPlanRows(navyPlan, overlay, gate, 'navyKeys', null),
    ]);

    finishSubmitUI(overlay, applyBtn, closeBtn, youpflBtn, otherBtns, gate, d.okTotal + n.okTotal, d.failTotal + n.failTotal);
  }

  // 최초 로드
  renderReceipts(false).then(attachSlotsLiveSync);
  (async () => {
    await loadProdSettings();
    if (!document.getElementById('receipt-page')) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단
    saveProdDefault();
    renderPS();
  })();

  // Firebase SDK 미리 로드 — 첫 상세 클릭 딜레이 제거
  import('https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js').catch(() => {});

  // lock 전체 상태 프리페치 — TCP 예열 + 캐시 초기화로 첫 상세 클릭 시 네트워크 없이 즉시 확인
  fetch(`${LOCK_FB}.json`).then(r => r.ok ? r.json() : null).then(data => {
    if (!data || typeof data !== 'object') return;
    const cu   = window.HA?.getCurrentUser?.() || {};
    const myId = cu.username || cu.id || 'unknown';
    Object.entries(data).forEach(([key, lock]) => {
      if (!lock) return;
      const age = Date.now() - new Date(lock.lockedAt).getTime();
      if (lock.staffId !== myId && age < LOCK_TTL_MS) {
        LOCK_CHECK_CACHE.set(key, { conflict: true, by: lock.staffName || lock.staffId, ts: Date.now() });
      }
    });
  }).catch(() => {});

})();
</script>

  <div style="background:#fff;border-radius:14px;width:1100px;max-width:100%;padding:24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="font-size:15px;font-weight:700;">⏰ 분할접수 현황</div>
        <span id="ss-count" style="font-size:12px;color:var(--text2);"></span>
      </div>
      <button onclick="closeSplitScheduleModal()" style="border:none;background:#f1f5f9;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;">✕</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
      <select id="ss-status-filter" onchange="runScheduleSearch()"
        style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;">
        <option value="all" selected>전체</option>
        <option value="done">완료</option>
        <option value="pending">대기중</option>
      </select>
      <div style="position:relative;flex:1;min-width:200px;">
        <input type="text" id="ss-search" placeholder="🔍 업체명 / PID / 키워드 검색" onkeydown="if(event.key==='Enter')runScheduleSearch()"
          style="width:100%;box-sizing:border-box;padding:7px 28px 7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;">
        <button onclick="clearScheduleSearch()" title="검색어 지우기" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 4px;line-height:1;">✕</button>
      </div>
      <button onclick="runScheduleSearch()" style="padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;">검색</button>
      <button onclick="toggleAllScheduleGroups()" style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;">펼치기/접기</button>
    </div>
    <div id="ss-list"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
      <button onclick="closeSplitScheduleModal()" style="padding:9px 20px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;">닫기</button>
    </div>
  </div>
</div>
</div>
