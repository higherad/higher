  }

  // /cleanup-cancel은 NDJSON 스트림(줄마다 JSON 한 개)으로 응답한다 — {type:"log"}는 버리고
  // 마지막 {type:"result", success, results|message} 한 줄만 취한다(tools/macro/bizfit_cleanup.html과 동일 파싱).
  async function callBizfitCleanupCancel(body) {
    const res = await fetch(`${BIZFIT_PROXY}/cleanup-cancel`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', final = null;
    const consume = line => { if (!line.trim()) return; const evt = JSON.parse(line); if (evt.type !== 'log') final = evt; };
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      lines.forEach(consume);
    }
    if (buf) consume(buf);
    return final || { success: false, message: '서버 응답 없음' };
  }

  // 일반 상품 배분 — 등록 페이로드 행 생성.
  // 찰리는 등급/가격 체계가 달라 별도 메뉴(NP 위치저장)로 접수해야 해서 prodFilter로 charlie만 뽑아 별도 호출
  function buildNormalRows(slots, prodFilter = p => !FIXED_PROD_IDS.has(p.id)) {
    const deductProd = ap().find(p => p.deductOnly);
    const rows = [];
    let deductTarget = 0, deductAmount = 0;
    slots.forEach(r => {
      const { alloc, prods: slotProds, gradeProds } = allocRowsForSlot(r);
      if (deductProd) {
        const dAmt = alloc[deductProd.id] || 0;
        if (dAmt > 0) {
          const unitPrice = (r.unitPrice!=null && r.unitPrice>0) ? r.unitPrice : (userPriceMap.get(r.userId) || 0);
          deductTarget += dAmt * (r.days||0);
          deductAmount += dAmt * (r.days||0) * unitPrice;
        }
      }
      slotProds.filter(prodFilter).forEach(prod => {
        const pp = alloc[prod.id] ?? 0;
        if (pp <= 0) return;
        const daysVal = prod.daysMultiplied ? pp*(r.days||0) : (r.days||0);
        const kw = gradeProds ? kwForGradeProd(r.searchKeyword||'', prod, gradeProds) : kwForProd(r.searchKeyword||'', prod);
        rows.push({
          _slotKey:   r._key,
          _doneKey:   prod.name,
          _normalSubmitted: !!r.scheduleHold || !!(r.normalDoneProducts && r.normalDoneProducts.includes(prod.name)),
          _days:            r.days||0,
          _daysMultiplied:  !!prod.daysMultiplied,
          상품등급명: prod.name,
          업체명:     r.storeName||'',
          업체URL:    r.url||'',
          PID번호:    r.mid||'',
          순위키워드: r.rankKeyword||'',
          일목표:     pp,
          일수:       daysVal,
          예약일:     r.startDate||'',
          검색키워드: kw,
        });
      });
    });
    return { rows, deductTarget, deductAmount };
  }

  // total을 n개로 최대한 고르게(나머지는 앞쪽부터 +1) 나눔 — 델타 블로그 URL 분할용
  function splitEven(total, n) {
    if (n <= 0) return [];
    const base = Math.floor(total / n);
    const rem  = total - base * n;
    return Array.from({length: n}, (_, i) => base + (i < rem ? 1 : 0));
  }

  // 델타/네이비 공용 — "분할" 설정값(N)만큼 일 목표를 쪼개 블로그 URL 1개씩 매칭한 N개 행을 만듦(1슬롯=N행, buildNormalRows와 별도 함수)
  // _doneKey에 분할 순번을 붙여 완료 여부를 행 단위로 추적. daysMultiplied는 상품별로 다름(델타=true, 네이비=false).
  function buildDeltaRows(slots, prodId = 'delta') {
    const baseProd = prods.find(p => p.id === prodId);
    if (!baseProd) return [];
    const n = Math.max(1, parseInt(baseProd.blogSplit, 10) || 1);
    const rows = [];
    slots.forEach(r => {
      const { alloc, gradeProds } = allocRowsForSlot(r);
      // 등급 매칭이 있으면 그 슬롯은 매칭 결과에서만(비활성이어도) 델타/네이비를 찾고, 없으면 기존처럼 활성 상품만 대상으로 한다.
      const prod = gradeProds ? gradeProds.find(p => p.name === baseProd.name) : ap().find(p => p.id === prodId);
      if (!prod) return;
      const pp = alloc[prod.id] ?? 0;
      if (pp <= 0) return;
      const urls = (r.deltaBlogUrl||'').split(',').map(u=>u.trim()).filter(Boolean);
      // 델타는 검색키워드를 별도로 나누지 않고 순위키워드와 동일한 값을 그대로 쓴다(사용자 지정 규칙) — 네이비는 일반 검색키워드 그대로 사용.
      const kw = prodId === 'delta' ? (r.rankKeyword||'') : (gradeProds ? kwForGradeProd(r.searchKeyword||'', prod, gradeProds) : kwForProd(r.searchKeyword||'', prod));
      splitEven(pp, n).forEach((partTarget, i) => {
        if (partTarget <= 0) return;
        const doneKey = `${prod.name}#${i+1}`;
        rows.push({
          _slotKey:   r._key,
          _doneKey:   doneKey,
          _normalSubmitted: !!r.scheduleHold || !!(r.normalDoneProducts && r.normalDoneProducts.includes(doneKey)),
          _requiresBlogUrl: true,
          _days:            r.days||0,
          _daysMultiplied:  !!prod.daysMultiplied,
          상품등급명: prod.name,
          업체명:     r.storeName||'',
          업체URL:    r.url||'',
          PID번호:    r.mid||'',
          순위키워드: r.rankKeyword||'',
          일목표:     partTarget,
          일수:       prod.daysMultiplied ? partTarget*(r.days||0) : (r.days||0),
          예약일:     r.startDate||'',
          검색키워드: kw,
          블로그URL:  urls[i] || '',
        });
      });
    });
    return rows;
  }

  // daysMultiplied 상품(찰리)은 "일수" 칸에 실제 일수 대신 일목표×일수(전체목표)가 들어있으므로
  // 그 값을 그대로 합산, 아니면 일목표×일수로 계산 — buildSubmitAgencyBlock과 탭 요약에서 공유
  function daysMultipliedSum(rows, daysMultiplied) {
    return daysMultiplied
      ? rows.reduce((a,r)=>a+(r.일수||0), 0)
      : rows.reduce((a,r)=>a+(r.일목표||0)*(r.일수||0), 0);
  }


  window.submitDirect = function() {
    const checkedKeys = getCheckedKeys();
    const keySet = new Set(checkedKeys);
    const base   = checkedKeys.length ? allSlots.filter(s => keySet.has(s._key)) : filteredAll;
    // 체크 선택 시 active도 대상 포함(초기화 재진입용). 기본 동작은 accepted만.
    const allowedStatuses = checkedKeys.length ? ['accepted', 'active'] : ['accepted'];
    const target = base.filter(s => allowedStatuses.includes(s.status));
    if (!target.length) { alert('접수 상태인 캠페인이 없습니다.'); return; }
    const hasNormal  = ap().some(p => !FIXED_PROD_IDS.has(p.id));
    const hasCharlie = ap().some(p => p.id === 'charlie');
    const hasDelta   = ap().some(p => p.id === 'delta');
    const hasNavy    = ap().some(p => p.id === 'navy');
    // 상품 1개 이상 켜기는 비고가 '리워드'·비율(리워드 몫 있음)인 캠페인이 섞였을 때만 — 업체명(전부 유입플)·비고 없음은 확인 안 함
    const needsReward = target.some(s => noteRatio(s)?.reward > 0);
    if (needsReward && !hasNormal && !hasCharlie && !hasDelta && !hasNavy) {
      alert('활성화된 상품이 없습니다.\n상품 유형 설정에서 최소 1개를 켜주세요.');
      return;
    }
    openSubmitModal(target);
  };

  // "접수 신청" 버튼을 완료 상태로 잠금 — wireSubmitTab/lockDoneButtons 공용
  function markApplyBtnDone(btn) {
    btn.disabled = true; btn.textContent = '✅ 전체 완료'; btn.style.background = '#475569'; btn.style.cursor = 'default';
  }

  // 접수 신청 전 사전검사(executeSubmit과 동일 조건) — 오류 있으면 버튼 비활성화. 상태칸은 안 건드림(오류 배지 중복).
  function validateNormalRowsForSubmit(rows) {
    let anyFail = false;
    rows.forEach(r => {
      if (r._normalSubmitted) return;
      const kwCount = (r.검색키워드 || '').split(',').map(k => k.trim()).filter(k => k).length;
      let fail = kwCount === 0 || (r.일목표 || 0) < 10 || (r._requiresBlogUrl && !r.블로그URL);
      if (fail) { r._kwFail = true; anyFail = true; }
    });
    return anyFail;
  }

  // 검색키워드 미입력/일목표 10미만/블로그URL 미입력 건수 — 대행사 헤더 배지, 탭 상단 요약에 공용으로 씀
  function rowIssueCounts(rows, checkBlogUrl=false) {
    const kwEmptyCount = rows.filter(r => (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k).length === 0).length;
    const lowTargetCount = rows.filter(r => (r.일목표||0) < 10).length;
    const blogUrlEmptyCount = checkBlogUrl ? rows.filter(r => !r.블로그URL).length : 0;
    return { kwEmptyCount, lowTargetCount, blogUrlEmptyCount };
  }

  // 탭 상단에 "OO대행사 - 검색키워드 0개 N건 / 일 목표 10 미만 N건 / 블로그 URL 미입력 N건" 식으로 대행사별 문제 요약
  function agencyIssueSummaryHtml(plan, label='', checkBlogUrl=false) {
    const prefix = label ? `[${escProd(label)}] ` : '';
    return plan.map(p => {
      const { kwEmptyCount, lowTargetCount, blogUrlEmptyCount } = rowIssueCounts(p.rows, checkBlogUrl);
      if (!kwEmptyCount && !lowTargetCount && !blogUrlEmptyCount) return '';
      const parts = [];
      if (kwEmptyCount) parts.push(`검색키워드 0개 ${kwEmptyCount}건`);
      if (lowTargetCount) parts.push(`일 목표 10 미만 ${lowTargetCount}건`);
      if (blogUrlEmptyCount) parts.push(`블로그 URL 미입력 ${blogUrlEmptyCount}건`);
      return `<div style="color:#dc2626;font-size:11px;margin-top:2px;">⚠️ ${prefix}${escProd(p.agency)} - ${parts.join(' / ')}</div>`;
    }).join('');
  }


  // 반환값 { anyFail } — 세부 경고는 이 함수가 이미 subEl에 그대로 띄우고, 여기선 유무만 모아 상단 공용 경고박스/탭 아이콘에 씀(전체 접수 신청 비활성화는 fillBody에서 탭 통합 판단)
  function wireSubmitTab({ has, plan, bodyEl, subEl, applyBtn, label, daysMultiplied=false, blogUrl=false, target, emptyMsg, onSubmit }) {
    if (!has) {
      if (emptyMsg) { subEl.textContent = emptyMsg; applyBtn.disabled = true; }
      return { anyFail: false };
    }
    let totalSlots = 0, totalTarget = 0;
    plan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, label, daysMultiplied, blogUrl);
      if (block) bodyEl.appendChild(block);
      // 업체명 기준으로 세면 동명 업체가 있는 슬롯이 하나로 뭉개져 실제 슬롯 수보다 적게 표시됨 — _slotKey로 세야 함
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, daysMultiplied);
    });
    subEl.innerHTML = `<span style="color:var(--muted)">대행사 ${plan.length}곳 · ${label} ${totalSlots}건 · 목표 합계 ${totalTarget.toLocaleString()}</span>${agencyIssueSummaryHtml(plan)}`;
    const allRows = plan.flatMap(p => p.rows);
    // 이 탭 행이 전부 이미 완료(_normalSubmitted)면 슬롯이 active 아니어도 완료 표시
    if (target.every(s => s.status === 'active') || (allRows.length && allRows.every(r => r._normalSubmitted))) {
      markApplyBtnDone(applyBtn);
      return { anyFail: false };
    }
    const anyFail = validateNormalRowsForSubmit(allRows);
    if (anyFail) {
      applyBtn.title = '오류가 있는 항목을 먼저 수정해주세요';
    } else {
      applyBtn.onclick = onSubmit;
    }
    return { anyFail };
  }

  // 블로그 탭 — 델타(NP 위치저장)와 네이비(NP트래픽)를 한 탭에 같이 보여주되, 접수는 각자의 등급/adrole 경로로 따로 나간다.
  // 표는 상품별로 분리해서 붙이므로(상품등급명 칸이 델타/네이비로 구분됨) 헤더의 "일수 vs 전체목표" 라벨도 각자 정확하게 유지된다.
  function wireBlogSubmitTab({ hasDelta, hasNavy, deltaPlan, navyPlan, bodyEl, subEl, applyBtn, target, onSubmit }) {
    if (!hasDelta && !hasNavy) {
      subEl.textContent = '블로그 배분 대상 슬롯이 없습니다.';
      applyBtn.disabled = true;
      return { anyFail: false };
    }
    let totalSlots = 0, totalTarget = 0;
    // 델타/네이비는 같이 접수될 필요 없는 독립 상품 — 비활성인 쪽, 그리고 배분 0인 대행사는 블록 자체를 안 그린다.
    if (hasDelta) deltaPlan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, '델타', true, true);
      if (block) bodyEl.appendChild(block);
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, true);
    });
    if (hasNavy) navyPlan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, '네이비', false, true);
      if (block) bodyEl.appendChild(block);
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, false);
    });
    const issueSummary = (hasDelta ? agencyIssueSummaryHtml(deltaPlan, '', true) : '') + (hasNavy ? agencyIssueSummaryHtml(navyPlan, '', true) : '');
    subEl.innerHTML = `<span style="color:var(--muted)">대행사 ${deltaPlan.length}곳 · 블로그 ${totalSlots}건 · 목표 합계 ${totalTarget.toLocaleString()}</span>${issueSummary}`;
    const allRows = [...deltaPlan.flatMap(p => p.rows), ...navyPlan.flatMap(p => p.rows)];
    if (target.every(s => s.status === 'active') || (allRows.length && allRows.every(r => r._normalSubmitted))) {
      markApplyBtnDone(applyBtn);
      return { anyFail: false };
    }
    const anyFail = validateNormalRowsForSubmit(allRows);
    if (anyFail) {
      applyBtn.title = '오류가 있는 항목을 먼저 수정해주세요';
    } else {
      applyBtn.onclick = onSubmit;
    }
    return { anyFail };
  }

  // 레그별 "접수 신청" 버튼 셀렉터 — openSubmitModal 안 여러 곳(lockDoneButtons, 자동승인 레이스 가드)에서 공용.
  // 델타/네이비는 "블로그" 탭 하나(#bsub-apply-btn)를 공유 — 등급 체계가 달라도 UI 버튼은 하나.
  const LEG_BTN_SEL = { normalKeys: '#submit-apply-btn', charlieKeys: '#csub-apply-btn', deltaKeys: '#bsub-apply-btn', navyKeys: '#bsub-apply-btn', fullstackKeys: '#fsub-apply-btn' };

  // 진짜 신규 오픈("접수" 버튼)만 이 진입점을 타서 토글을 항상 on으로 초기화 — 토글 버튼 자체의 재오픈은
  // 방금 뒤집은 값을 유지해야 하므로 renderSubmitModal()을 직접 호출한다(아래 gmBtn.onclick 참고).
  async function openSubmitModal(target) {
    gradeMatchOn = true;
    adlogAutoOn = true;
    scheduleConfig = null;
    // 가이드_접수면 시간 분할 편집기 기본값 = 가이드 시간 분배
    scheduleDraftRows = guideModeOn && guideTimes.length ? guideTimes.map(t => ({ ...t })) : [{ time: '10:00', pct: 100 }];
    scheduleKwSplit = false;
    scheduleKwSplitDraft = { on:false };
    if (FULLSTACK_ON && !guideRules.length) { try { await loadGuide(); } catch (e) { console.warn('가이드 불러오기 실패 — 풀스택 탭 비율 없음:', e); } }
    return renderSubmitModal(target);
  }

  // ── 풀스택 탭 — work/fullstack_macro/auto_order.py와 같은 규칙 ──
  // 일 건수 = 유입플 중 풀스택 몫(승인 전이면 지금 배분), 방식 % = 가이드 풀스택 탭(분류 × 일 목표 구간), 시작일이 지났으면 오늘부터·종료일 그대로(서버가 계산)
  const FS_PRESETS = { '기본': 'basic', '둘러보고': 'browse', '카톡(길찾기)': 'kakao_route', '카톡(공유)': 'kakao_share' };
  const FS_LOGIN = new Set(['basic', 'browse']); // 가이드 "네이버에 로그인 한 사람" — 검색 유입 방식만 로그인 가능
  function fullstackVariants(rule) {
    // 시트 분류 엑셀처럼 상품별 %를 정수로 반올림한 뒤 합 100으로 다시 나눔(반올림 차이는 마지막 방식에)
    const pctOf = k => { const it = (rule?.full || []).find(p => shortFull(p.name) === k); return it ? Math.round(it.ratio * 100) : 0; };
    const mix = Object.keys(FS_PRESETS).map(k => [FS_PRESETS[k], pctOf(k)]).filter(([, v]) => v > 0);
    const total = mix.reduce((a, [, v]) => a + v, 0);
    const shares = mix.map(([, v]) => Math.round(v * 100 / total));
    if (shares.length) shares[shares.length - 1] += 100 - shares.reduce((a, b) => a + b, 0);
    return mix.map(([preset], i) => ({ key: 'ABCDEFGH'[i], preset, share: shares[i], ...(FS_LOGIN.has(preset) ? { scenario: { login: 'login' } } : {}) }));
  }
  function buildFullstackRows(slots) {
    if (!FULLSTACK_ON) return [];
    return slots.flatMap(s => {
      const f = s.yupflTarget != null ? s : yupflFieldsFor(s);
      const daily = f.yupflByVendor ? (f.yupflByVendor['풀스택'] || 0) : (f.yupflTarget || 0);
      if (daily <= 0) return [];
      const cat = s.category || HI.kwCategoryOf(s.rankKeyword, guideCats);
      const rule = cat ? pickGuideRule(guideRules, cat, s.dailyTarget || 0) : null;
      const variants = rule ? fullstackVariants(rule) : [];
      return [{ _slotKey: s._key, _slot: s, _fsSubmitted: !!s.fullstackOrder, agencyId: s.agencyId || '', storeName: s.storeName || '', mid: s.mid || '',
        url: s.url || '', rankKeyword: s.rankKeyword || '',
        daily, days: s.days || 0, start: s.startDate || '', variants,
        err: !rule ? '가이드 분류·구간 없음' : !variants.length ? '가이드 풀스택 비율 없음' : '' }];
    });
  }
  const fsVariantText = vs => vs.map(v => `${Object.keys(FS_PRESETS).find(k => FS_PRESETS[k] === v.preset)} ${v.share}%${v.scenario ? '(로그인)' : ''}`).join(' · ');
  // 일반 탭 검색키워드 칸과 같은 개수 배지 — 마우스를 올리면 키워드 전부
  const fsKwBadge = kws => `<span title="${escProd(kws.join(', '))}" style="font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:${kws.length?'#eff6ff':'#fee2e2'};color:${kws.length?'#1d4ed8':'#dc2626'};border:1px solid ${kws.length?'#bfdbfe':'#fca5a5'};white-space:nowrap;cursor:help">${kws.length}개</span>`;
  const fsReq = r => ({ mid: r.mid, daily: r.daily, days: r.days, start: r.start, variants: r.variants });

  // 표 + 미리보기(사이트에 commit:false — 접수 안 됨) + 접수 신청(행마다 1건씩 실제 접수). 같은 MID·기간이 이미 사이트에 있으면 건너뛰고 완료로 침(로컬 매크로로 넣은 것 포함)
  function wireFullstackTab({ rows, bodyEl, subEl, applyBtn, closeBtn, overlay, gate, onDone }) {
    if (!rows.length) { bodyEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">풀스택 몫이 있는 캠페인이 없습니다.</div>'; applyBtn.disabled = true; return; }
    // 일반 탭(buildSubmitAgencyBlock)과 같은 대행사별 블록·표
    const ell = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0';

        if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
      }
      finishSubmitUI(overlay, applyBtn, closeBtn, otherBtns, gate, okTotal, failTotal);
      if (onDone) onDone();

  // 각 탭의 plan/rows만 계산하는 순수 데이터 빌더 — renderSubmitModal의 최초 렌더/토글 재계산 양쪽에서 재사용.
  function computeSubmitData(target) {
    const agencies   = getAgencies(target);
    const normalPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      ...buildNormalRows(slotsByAgency(target, ag)),
    }));
    // 찰리는 등급/가격 체계가 일반 상품(NP트래픽)과 다른 별도 메뉴(NP 위치저장)로 접수해야 하므로
    // 같은 상품등급명이 겹쳐도(가격은 다름) 절대 같은 grade-info 호출에 섞이지 않게 완전히 분리한다.
    const charliePlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      ...buildNormalRows(slotsByAgency(target, ag), p => p.id === 'charlie'),
    }));
    // 델타/네이비 둘 다 찰리와 마찬가지로 별도 탭 — buildNormalRows(슬롯당 1행)와 달리 "분할" 설정값만큼
    // 슬롯당 여러 행(블로그 URL 1개씩)이 나올 수 있어 전용 buildDeltaRows를 쓴다(daysMultiplied 여부만 상품별로 다름).
    const deltaPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      rows: buildDeltaRows(slotsByAgency(target, ag), 'delta'),
    }));
    const navyPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      rows: buildDeltaRows(slotsByAgency(target, ag), 'navy'),
    }));
    // hasNormal을 사이트 전체 설정(ap())으로 판단하면 일반 상품이 없어도 true가 되어 normalKeys가 빈 채로
    // 교집합이 영원히 안 채워져 찰리·블로그만 쓰는 대상이 승인으로 못 넘어가므로, hasCharlie처럼 실제 제출 행 유무로 판단
    const hasNormal  = normalPlan.some(p => p.rows.length > 0);
    const hasCharlie = charliePlan.some(p => p.rows.length > 0);
    const hasDelta   = deltaPlan.some(p => p.rows.length > 0);
    const hasNavy    = navyPlan.some(p => p.rows.length > 0);
    const fullstackRows = buildFullstackRows(target);
    const hasFullstack = fullstackRows.length > 0;
    const defaultTab = hasNormal ? 'normal' : (hasCharlie ? 'charlie' : ((hasDelta||hasNavy) ? 'blog' : (hasFullstack ? 'fullstack' : 'normal')));
    return { normalPlan, charliePlan, deltaPlan, navyPlan, fullstackRows, hasNormal, hasCharlie, hasDelta, hasNavy, hasFullstack, defaultTab };
  }

            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button class="btn-cancel" id="fsub-close-btn">닫기</button>
              <button id="fsub-apply-btn" style="background:#0d9488;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">접수 신청</button>
            </div>
          </div>
          <div id="fsub-body"></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    // 캐시차감 실패는 콘솔뿐 아니라 모달이 열려있는 동안 배너+재시도 버튼으로 표시 — 대상은 "이 모달에서 시도한 것"만
    // (목록 전체를 훑으면 레거시 active 슬롯도 bizfitDeducted 없어 오탐). executeSubmit 등 최상위 함수도 갱신할 수 있게 overlay에 상태를 매달아둠
    overlay._deductFailures = []; // [{bizfitUid, slots, ded, yup}]
    overlay._renderDeductFailures = function() {
      const banner = overlay.querySelector('#deduct-fail-banner');
      const failures = overlay._deductFailures;
      if (!failures.length) { banner.style.display = 'none'; return; }
      const total = failures.reduce((s, g) => s + g.ded + (YUPFL_CASH_DEDUCT ? g.yup : 0), 0);
      banner.style.display = 'flex';
      banner.innerHTML = `<span style="color:#b91c1c;font-weight:700;font-size:12px;">⚠️ 비즈핏 캐시차감 필요 ${failures.length}건(${total.toLocaleString()}원) — 접수는 완료됨, 재시도 필요</span>
        <button id="deduct-retry-btn" style="background:#b91c1c;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">재시도</button>`;
      banner.querySelector('#deduct-retry-btn').onclick = async () => {
        const btn = banner.querySelector('#deduct-retry-btn');
        btn.disabled = true; btn.textContent = '재시도 중...';
        const retrying = overlay._deductFailures;
        overlay._deductFailures = [];
        for (const g of retrying) {
          // 다른 창에서 이미 차감됐으면 건너뜀(그룹은 한 번에 차감되므로 하나라도 완료면 그룹 전체 완료) — 재시도는 선점을 덮어씀
          let fresh;
          try { fresh = await Promise.all(g.slots.map(s => HI.getCampaign(s._key).then(v => v || {}))); }
          catch (e) { alert('차감 재시도를 중단했습니다.\n' + e.message); overlay._deductFailures.push(g); continue; }
          if (fresh.some(f => f.bizfitDeducted)) { g.slots.forEach(s => updateLocalSlot(s._key, { bizfitDeducted: true })); continue; }
          const ok = await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup, true);
          if (!ok) overlay._deductFailures.push(g);
        }
        overlay._renderDeductFailures();
      };
    };

    // "초기화" — 이 탭 몫만 취소+완료기록 삭제, 탭별 독립 버튼이라 다른 탭은 안 건드림. 대상 판정은
    // slot.status가 아니라 이 탭 몫(_normalSubmitted 등) 기준 — 다른 레그를 기다리는 중이어도 이
    // 탭만 나갔으면 되돌릴 수 있어야 함. bizfitDeducted(차감)는 안 건드림(정산은 사람이 처리).

    // /register로 나가는 탭(일반/찰리/블로그) 공용 — /cleanup-cancel은 MID 단위 취소라 같은 MID의
    // 다른 상품도 같이 취소될 수 있음을 confirm에서 미리 알림.
    function wireBizfitTabReset(btn, resetKeys, doneNames) {
      const candidates = target.filter(s => resetKeys.has(s._key));
      if (!candidates.length) { btn.style.display = 'none'; return; }
      btn.style.display = '';
      btn.disabled = false; btn.textContent = '초기화';
      btn.onclick = async () => {
        if (!confirm(`${candidates.length}건 취소·초기화합니다.\n※ MID 단위 취소라 같은 MID의 다른 상품도 같이 취소될 수 있습니다.`)) return;
        btn.disabled = true; btn.textContent = '초기화 중...';
        window.bizfitSubmitting = true; // 진행 중 팝업 닫기 방지(기존 가드 재사용)

        const byAgency = new Map(); // agencyId -> Set(mid)
        candidates.forEach(s => {
          if (!s.mid) return;
          const ag = s.agencyId || '';
          if (!byAgency.has(ag)) byAgency.set(ag, new Set());
          byAgency.get(ag).add(s.mid);
        });

        const okMids = new Set();
        const errors = [];
        try {
          for (const [agencyId, midSet] of byAgency) {
            const account = await fetchBizfitAccount(agencyId);
            if (!account || !account.id || !account.pw) {
              errors.push(`${agencyId || '(대행사 미지정)'}: 비즈핏 계정 정보 없음`);
              continue;
            }
            try {
              const res = await callBizfitCleanupCancel({ loginId: account.id, pwd: account.pw, mids: [...midSet] });
              if (!res.success) { errors.push(`${agencyId}: ${res.message || '실패'}`); continue; }
              res.results.forEach(r => {
                if (r.success) okMids.add(r.mid);
                else errors.push(`${agencyId}/${r.mid}: ${r.message}`);
              });
            } catch (e) {
              errors.push(`${agencyId}: ${e.message}`);
            }
          }
        } finally {
          window.bizfitSubmitting = false;
        }

        // "관련 캠페인 없음"은 이미 okMids에 들어감 — 여기 남는 실패는 진짜 취소불가/계정오류거나
        // 관리자가 비즈핏에서 직접 이미 지운 경우라 취소 시도 없이 로그만 지운다.
        let logOnlySlots = [];
        const failedSlots = candidates.filter(s => s.mid && !okMids.has(s.mid));
        if (failedSlots.length && confirm(`${failedSlots.length}건 취소 실패.${errors.length ? `\n${errors.join('\n')}` : ''}\n\n캠페인이 이미 삭제된 경우라면 로그만 지울 수 있습니다(재접수 시 중복등록 주의). 로그만 지울까요?`)) {
          logOnlySlots = failedSlots;
        }

        const resetSlots = [...candidates.filter(s => okMids.has(s.mid)), ...logOnlySlots];
        await Promise.all(resetSlots.map(async s => {
          // 이 탭 몫의 이름만 normalDoneProducts에서 빼고, 다른 탭(찰리/블로그 등) 완료기록은 그대로 둔다.
          const remaining = (s.normalDoneProducts || []).filter(n => !doneNames.has(n));
          const patch = { normalDoneProducts: remaining.length ? remaining : null };
          if (s.status === 'active') patch.status = 'accepted';
          await HI.updateCampaign(s._key, patch);
          // target(모달 스냅샷)의 객체를 직접 고쳐야 재렌더에 반영됨(allSlots는 실시간 리스너가 통째로
          // 교체해버려 target과 참조가 어긋날 수 있음) — updateLocalSlot(allSlots)도 배경 목록용으로 같이 갱신.
          Object.assign(s, patch);
          updateLocalSlot(s._key, patch);
        }));

        // 팝업은 닫지 않고 데이터만 재계산해 이 탭 상태만 갱신
        renderReceipts(false);
        const keepTab = ['normal','charlie','blog','fullstack'].find(k => overlay.querySelector(`#stab-panel-${k}`)?.style.display === 'block');
        data = computeSubmitData(target);
        scheduleValidationRows = flattenScheduleRows(data);
        applyTabState(keepTab);
        fillBody();
        const stillFailed = failedSlots.length - logOnlySlots.length;
        alert(`초기화 완료: ${resetSlots.length}건` + (logOnlySlots.length ? ` (로그만 ${logOnlySlots.length}건)` : '')
          + (stillFailed > 0 ? `\n실패: ${stillFailed}건` : ''));
      };
    }


    const submitBodyEl = overlay.querySelector('#submit-body');
    const csubBodyEl   = overlay.querySelector('#csub-body');
    const bsubBodyEl   = overlay.querySelector('#bsub-body');
    const submitApplyBtn = overlay.querySelector('#submit-apply-btn');
    const csubApplyBtn   = overlay.querySelector('#csub-apply-btn');
    const bsubApplyBtn   = overlay.querySelector('#bsub-apply-btn');
    const fsubBodyEl     = overlay.querySelector('#fsub-body');
    const fsubApplyBtn   = overlay.querySelector('#fsub-apply-btn');

    // 탭 버튼 disabled/노출 상태 갱신 — keepTab이 갱신 후에도 여전히 존재하면 유지, 아니면 새 defaultTab으로.
    function applyTabState(keepTab) {
      overlay.querySelector('#stab-normal').disabled = !data.hasNormal;
      overlay.querySelector('#stab-charlie').style.display = data.hasCharlie ? '' : 'none';
      overlay.querySelector('#stab-blog').style.display    = (data.hasDelta||data.hasNavy) ? '' : 'none';
      overlay.querySelector('#stab-fullstack').style.display = data.hasFullstack ? '' : 'none';
      const avail = { normal: data.hasNormal, charlie: data.hasCharlie, blog: data.hasDelta||data.hasNavy, fullstack: data.hasFullstack };
      window.switchSubmitTab((keepTab && avail[keepTab]) ? keepTab : data.defaultTab);
    }
    // 재계산마다 재사용되는 버튼을 매번 초기 상태(활성화·기본 문구·원래 색)로 되돌려둔 뒤 wireSubmitTab 등이 다시 채움
    function resetApplyBtn(btn, bg) {
      btn.disabled = false; btn.title = ''; btn.textContent = '접수 신청';
      btn.style.background = bg; btn.style.cursor = 'pointer'; btn.onclick = null;
    }


    // 탭 본문(plan/rows에 의존하는 부분)만 다시 그림 — 모달 뼈대(overlay/탭바)는 그대로 두고 데이터만 갱신할 때 재호출.
    function fillBody() {
      submitBodyEl.innerHTML = ''; csubBodyEl.innerHTML = ''; bsubBodyEl.innerHTML = ''; fsubBodyEl.innerHTML = '';
      resetApplyBtn(fsubApplyBtn, '#0d9488');
      resetApplyBtn(submitApplyBtn, '#16a34a');
      resetApplyBtn(csubApplyBtn,   '#d946ef');
      resetApplyBtn(bsubApplyBtn,   '#22c55e');

      // 2개 이상 레그 동시 활성 시 승인 게이트 — 탭 전체 완료가 아니라 슬롯별 requiredLegsByKey 기준
      const rowsBySlotOf = rows => {
        const m = new Map();
        rows.forEach(r => { if (!r._slotKey) return; if (!m.has(r._slotKey)) m.set(r._slotKey, []); m.get(r._slotKey).push(r); });
        return m;
      };
      const alreadyDoneOf = (rowsBySlot, doneField) => new Set(
        [...rowsBySlot.entries()].filter(([, rs]) => rs.every(r => r[doneField])).map(([k]) => k)
      );
      const normalAlreadyDone  = alreadyDoneOf(rowsBySlotOf(data.normalPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const charlieAlreadyDone = alreadyDoneOf(rowsBySlotOf(data.charliePlan.flatMap(p => p.rows)), '_normalSubmitted');
      const deltaAlreadyDone   = alreadyDoneOf(rowsBySlotOf(data.deltaPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const navyAlreadyDone    = alreadyDoneOf(rowsBySlotOf(data.navyPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const fullstackAlreadyDone = alreadyDoneOf(rowsBySlotOf(data.fullstackRows), '_fsSubmitted');

      // "초기화" 버튼 대상 — every(전부 완료)가 아니라 some(하나라도 완료)으로 판단. 초기화는 실수를
      // 되돌리는 용도라 이 탭에 뭔가 이미 나간 게 있으면(전부는 아니어도) 되돌릴 수 있어야 한다.
      const anyDoneOf = (rowsBySlot, doneField) => new Set(
        [...rowsBySlot.entries()].filter(([, rs]) => rs.some(r => r[doneField])).map(([k]) => k)
      );
      const tabDoneNames = rows => new Set(rows.map(r => r._doneKey || r.상품등급명));
      wireBizfitTabReset(
        overlay.querySelector('#reset-normal-btn'),
        anyDoneOf(rowsBySlotOf(data.normalPlan.flatMap(p => p.rows)), '_normalSubmitted'),
        tabDoneNames(data.normalPlan.flatMap(p => p.rows)),
      );
      wireBizfitTabReset(
        overlay.querySelector('#reset-charlie-btn'),
        anyDoneOf(rowsBySlotOf(data.charliePlan.flatMap(p => p.rows)), '_normalSubmitted'),
        tabDoneNames(data.charliePlan.flatMap(p => p.rows)),
      );
      wireBizfitTabReset(
        overlay.querySelector('#reset-blog-btn'),
        new Set([
          ...anyDoneOf(rowsBySlotOf(data.deltaPlan.flatMap(p => p.rows)), '_normalSubmitted'),
          ...anyDoneOf(rowsBySlotOf(data.navyPlan.flatMap(p => p.rows)), '_normalSubmitted'),
        ]),
        new Set([...tabDoneNames(data.deltaPlan.flatMap(p => p.rows)), ...tabDoneNames(data.navyPlan.flatMap(p => p.rows))]),
      );

      // 슬롯별로 실제 쓰는 레그 집합 — rows에 그 슬롯(_slotKey)이 등장하는지로 판단
      const requiredLegsByKey = new Map(); // slotKey -> Set('normalKeys'|'charlieKeys'|'deltaKeys'|'navyKeys')
      const addRequired = (rows, leg) => rows.forEach(r => {
        if (!r._slotKey) return;
        if (!requiredLegsByKey.has(r._slotKey)) requiredLegsByKey.set(r._slotKey, new Set());
        requiredLegsByKey.get(r._slotKey).add(leg);
      });
      addRequired(data.normalPlan.flatMap(p => p.rows), 'normalKeys');
      addRequired(data.charliePlan.flatMap(p => p.rows), 'charlieKeys');
      addRequired(data.deltaPlan.flatMap(p => p.rows), 'deltaKeys');
      addRequired(data.navyPlan.flatMap(p => p.rows), 'navyKeys');
      addRequired(data.fullstackRows, 'fullstackKeys');

      // 게이트 유무와 상관없이 쓰는 판정 — doneSets를 받아 슬롯이 필요 레그를 전부 채웠는지로 승인 대상을 고름(조회 전용, 실행 안 함)
      const slotMapAll = new Map(allSlots.map(s => [s._key, s]));
      function readyKeysOf(doneSets) {
        return [...requiredLegsByKey.entries()]
          .filter(([k, req]) => slotMapAll.get(k)?.status !== 'active'
            && [...req].every(leg => doneSets[leg] && doneSets[leg].has(k)))
          .map(([k]) => k);
      }

      // 다 완료된 슬롯은 승인(상태 전환)만 창 열자마자 자동 처리 — 차감(실제 돈)은 자동 시도 안 하고 배너 "재시도"로만 실행.
      // 탭 버튼은 렌더 시점 스냅샷이라 비동기 완료를 자동 반영 못 하므로 승인 끝나는 즉시 여기서 잠금.
      const legHas = { normalKeys: data.hasNormal, charlieKeys: data.hasCharlie, deltaKeys: data.hasDelta, navyKeys: data.hasNavy, fullstackKeys: data.hasFullstack };
      function lockDoneButtons() {
        Object.entries(LEG_BTN_SEL).forEach(([leg, sel]) => {
          if (!legHas[leg]) return;
          const btn = overlay.querySelector(sel);
          if (btn && !btn.disabled && target.every(s => s.status === 'active')) markApplyBtnDone(btn);
        });
      }

      const activeLegs = [];
      if (data.hasNormal)  activeLegs.push('normalKeys');
      if (data.hasCharlie) activeLegs.push('charlieKeys');
      if (data.hasDelta)   activeLegs.push('deltaKeys');
      if (data.hasNavy)    activeLegs.push('navyKeys');
      if (data.hasFullstack) activeLegs.push('fullstackKeys');
      const gate = (activeLegs.length > 1) ? {
        normalKeys:  normalAlreadyDone.size  ? normalAlreadyDone  : null,
        charlieKeys: charlieAlreadyDone.size ? charlieAlreadyDone : null,
        deltaKeys:   deltaAlreadyDone.size   ? deltaAlreadyDone   : null,
        navyKeys:    navyAlreadyDone.size    ? navyAlreadyDone    : null,
        fullstackKeys: fullstackAlreadyDone.size ? fullstackAlreadyDone : null,
        slotMap: slotMapAll,
        // 이 캠페인이 풀스택 탭을 아직 기다리는지 — 분할 예약 때 상태 변경을 보류할지 판단
        fsPending(k) { return !!requiredLegsByKey.get(k)?.has('fullstackKeys') && !(this.fullstackKeys && this.fullstackKeys.has(k)); },
        async tryApprove() {
          // 호출부가 try/catch 없이 await만 하므로, 내부 예외가 밖으로 새면 등록 성공해도
          // 승인/화면갱신이 통째로 스킵됨 — 여기서 막는다.
          try {
            const keys = readyKeysOf(this);
            // normalDoneProducts는 접수 완료 이력이므로 승인 후에도 계속 보관(삭제하지 않음)
            if (keys.length) {
              const failed = await finishReadySlots(keys, this.slotMap);
              if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
            }
            renderReceipts(false);
            lockDoneButtons();
          } catch (e) {
            console.error('승인 게이트 처리 오류(다음 완료 시 또는 팝업 재오픈 시 재시도됨):', e);
          }
        }
      } : null;

      // 서버는 승인 게이트를 모르므로 예약은 레그 2개 이상이 동시에 필요한 슬롯이 섞이면 막음.
      // 풀스택은 예약 대상이 아님 — 분할 예약을 켜도 풀스택 탭은 접수 신청 즉시 접수(예약은 일반 등 등록 탭에만)
      const registerLegs = activeLegs.filter(l => l !== 'fullstackKeys');
      const refreshScheduleToggle = () => {
        const scheduleBlocked = registerLegs.length > 1;
        const scheduleBtn = overlay.querySelector('#schedule-toggle-btn');
        if (!scheduleBtn) return;
        scheduleBtn.disabled = scheduleBlocked;
        scheduleBtn.style.opacity = scheduleBlocked ? '0.4' : '1';
        scheduleBtn.style.cursor = scheduleBlocked ? 'not-allowed' : 'pointer';
        scheduleBtn.title = scheduleBlocked
          ? '일반/찰리/델타/네이비 중 2개 이상이 동시에 필요한 슬롯이 섞여 있어 시간대 분할 예약을 쓸 수 없습니다'
          : '';
        if (scheduleBlocked && scheduleConfig) window.clearScheduleConfig();
      };
      refreshScheduleToggle();

      // 팝업 여는 시점 스냅샷으로 딱 한 번 판단 — 이후 실제 클릭(gate.tryApprove 등)에서 갱신되는
      // 완료 집합은 그 클릭 흐름이 알아서 처리하므로 여기서 다시 계산할 필요 없음.
      const initialReady = readyKeysOf({ normalKeys: normalAlreadyDone, charlieKeys: charlieAlreadyDone, deltaKeys: deltaAlreadyDone, navyKeys: navyAlreadyDone, fullstackKeys: fullstackAlreadyDone });
      if (initialReady.length) {
        // 자동 승인 도는 틈에 관리자가 같은 레그 "접수 신청"을 누르면 이중 차감 가능 — 처리 끝날 때까지 그 레그 버튼만 잠금
        const legsInvolved = new Set();
        initialReady.forEach(k => (requiredLegsByKey.get(k) || []).forEach(leg => legsInvolved.add(leg)));
        legsInvolved.forEach(leg => {
          const btn = overlay.querySelector(LEG_BTN_SEL[leg]);
          if (btn && !btn.disabled) { btn.disabled = true; btn.textContent = '⏳ 처리 중...'; btn.dataset.autoLocking = '1'; }
        });
        const heldReady = initialReady.filter(k => slotMapAll.get(k)?.scheduleHold);
        Promise.all([approveReadySlots(initialReady.filter(k => !heldReady.includes(k)), slotMapAll),
          heldReady.length ? releaseScheduleHold(heldReady, slotMapAll) : []]).then(([a, b]) => [...a, ...b]).then(pending => {
          if (pending.length) { overlay._deductFailures.push(...pending); overlay._renderDeductFailures(); }
          renderReceipts(false);
          lockDoneButtons();
          // 위에서 잠근 버튼이 lockDoneButtons로도 "완료" 처리 안 됐다면(같은 탭에 아직 안 끝난
          // 다른 슬롯이 남은 경우) 원래대로 눌러야 하는 상태로 복구한다.
          legsInvolved.forEach(leg => {
            const btn = overlay.querySelector(LEG_BTN_SEL[leg]);
            if (btn && btn.dataset.autoLocking) {
              delete btn.dataset.autoLocking;
              if (btn.disabled && btn.textContent === '⏳ 처리 중...') { btn.disabled = false; btn.textContent = '접수 신청'; }
            }
          });
        });
      }

      // 일반 탭 구성
      const normalResult = wireSubmitTab({
        has: data.hasNormal, plan: data.normalPlan, target,
        bodyEl: submitBodyEl,
        subEl:  overlay.querySelector('#submit-sub'),
        applyBtn: submitApplyBtn,
        label: '일반 상품',
        onSubmit: () => executeSubmit(data.normalPlan, overlay, gate, 'normalKeys', null),
      });

      // 찰리 탭 구성 — NP 위치저장(adrole=100) 전용, 일반 탭과 동일한 표/제출 로직을 재사용하되
      // grade-info/register 호출에 adrole을 강제 지정해 NP트래픽 등급과 절대 섞이지 않게 한다.
      const charlieResult = wireSubmitTab({
        has: data.hasCharlie, plan: data.charliePlan, target,
        bodyEl: csubBodyEl,
        subEl:  overlay.querySelector('#csub-sub'),
        applyBtn: csubApplyBtn,
        label: '찰리', daysMultiplied: true,
        emptyMsg: '찰리 배분 대상 슬롯이 없습니다.',
        onSubmit: () => executeSubmit(data.charliePlan, overlay, gate, 'charlieKeys', CHARLIE_ADROLE),
      });

      // 블로그 탭 구성 — 델타(NP 위치저장)+네이비(NP트래픽)를 한 탭에 같이 표시, 접수는 executeBlogSubmit이 각자 등급으로 나눠 처리.
      const blogResult = wireBlogSubmitTab({
        hasDelta: data.hasDelta, hasNavy: data.hasNavy, deltaPlan: data.deltaPlan, navyPlan: data.navyPlan, target,
        bodyEl: bsubBodyEl,
        subEl:  overlay.querySelector('#bsub-sub'),
        applyBtn: bsubApplyBtn,
        onSubmit: () => executeBlogSubmit(data.deltaPlan, data.navyPlan, overlay, gate),
      });

      // 풀스택 탭 구성 — 미리보기는 열 때 자동(사이트에 접수 안 됨), 접수 신청을 눌러야 실제 접수
      if (data.hasFullstack) wireFullstackTab({
        rows: data.fullstackRows, bodyEl: fsubBodyEl, subEl: overlay.querySelector('#fsub-sub'),
        applyBtn: fsubApplyBtn, closeBtn: overlay.querySelector('#fsub-close-btn'), overlay, gate, onDone: refreshScheduleToggle,
      });

      // 탭 통합 — 하나라도 경고가 있으면 전체 탭의 접수 신청을 비활성화. 세부 경고는 각 탭 서브헤더에 이미 뜨므로,
      // 타이틀 아래 공용 박스에는 어느 탭인지만 간략히 표시. 각 탭 버튼에는 빨간 경고 아이콘 표시.
      const tabNames = { normal: '일반', charlie: '찰리', blog: '블로그' };
      const tabResults = [
        { key: 'normal',  ...normalResult },
        { key: 'charlie', ...charlieResult },
        { key: 'blog',    ...blogResult },
      ];
      tabResults.forEach(t => {
        const ico = overlay.querySelector(`#stab-warn-${t.key}`);
        if (ico) ico.style.display = t.anyFail ? 'inline' : 'none';
      });
      const warnBox = overlay.querySelector('#submit-warn-box');
      const combinedWarnHtml = tabResults.filter(t => t.anyFail)
        .map(t => `<div style="color:#dc2626;font-size:11px;margin-top:2px;">⚠️ [${tabNames[t.key]}] 상품을 확인해주세요.</div>`).join('');
      warnBox.innerHTML = combinedWarnHtml;
      warnBox.style.display = combinedWarnHtml ? 'block' : 'none';
      if (tabResults.some(t => t.anyFail)) {
        [submitApplyBtn, csubApplyBtn, bsubApplyBtn].forEach(btn => {
          if (btn.disabled) return; // 이미 대상없음/전체완료로 비활성인 버튼은 그대로 둠
          btn.disabled = true;
          btn.title = '경고가 있는 탭을 먼저 수정해야 접수 신청이 가능합니다';
          btn.style.background = '#9ca3af'; btn.style.cursor = 'not-allowed';
          btn.onclick = null;
        });
      }
    }

    // 애드로그 자동등록 토글 — 데이터 재계산 필요 없이 플래그만 뒤집음(approveReadySlots가 읽음)
    const adlogBtn  = overlay.querySelector('#adlog-auto-toggle');
    const adlogIcon = overlay.querySelector('#adlog-auto-toggle-icon');
    const adlogLabel = overlay.querySelector('#adlog-auto-toggle-label');
    if (adlogBtn) adlogBtn.onclick = () => {
      adlogAutoOn = !adlogAutoOn;
      if (adlogIcon) adlogIcon.style.background = adlogAutoOn ? '#16a34a' : '#94a3b8';
      if (adlogLabel) adlogLabel.style.color = adlogAutoOn ? '#16a34a' : 'var(--text2)';
    };

    // 등급 자동매칭 토글 — 모달을 새로 열지 않고 데이터만 재계산해 탭 본문만 다시 채움
    const gmBtn   = overlay.querySelector('#grade-match-toggle');
    const gmIcon  = overlay.querySelector('#grade-match-toggle-icon');
    const gmLabel = overlay.querySelector('#grade-match-toggle-label');
    if (gmBtn) gmBtn.onclick = () => {
      gradeMatchOn = !gradeMatchOn;
      if (gmIcon) gmIcon.style.background = gradeMatchOn ? '#16a34a' : '#94a3b8';
      if (gmLabel) gmLabel.style.color = gradeMatchOn ? '#16a34a' : 'var(--text2)';
      const keepTab = ['normal','charlie','blog','fullstack'].find(k => overlay.querySelector(`#stab-panel-${k}`)?.style.display === 'block');
      data = computeSubmitData(target);
      scheduleValidationRows = flattenScheduleRows(data);
      applyTabState(keepTab);
      fillBody();
    };

    // 블로그URL 미입력 슬롯만 골라 applyDeltaBlogUrls와 동일한 프록시로 자동조회해 채움(기존 값은 안 건드림).
    const bsubBulkBtn = overlay.querySelector('#bsub-bulk-blogurl-btn');
    if (bsubBulkBtn) bsubBulkBtn.onclick = async () => {
      const rows = [...data.deltaPlan.flatMap(p => p.rows), ...data.navyPlan.flatMap(p => p.rows)];
      const slotKeys = [...new Set(rows.filter(r => r._requiresBlogUrl && !r.블로그URL).map(r => r._slotKey))];
      if (!slotKeys.length) { alert('블로그 URL 미입력 항목이 없습니다.'); return; }
      bsubBulkBtn.disabled = true; bsubBulkBtn.textContent = '조회 중...';
      let ok = 0, fail = 0;
      for (const key of slotKeys) {
        // target(모달 스냅샷)에서 찾아 직접 고쳐야 반영됨 — allSlots는 실시간 리스너가 객체를 통째로
        // 교체하므로 allSlots.find로 고치면 target엔 반영 안 될 수 있음.
        const s = target.find(x => x._key === key);
        if (!s || !s.url) { fail++; continue; }
        const splitProd = prods.find(p => p.id === 'delta' && p.active) || prods.find(p => p.id === 'navy' && p.active) || prods.find(p => p.id === 'delta');
        const n = Math.max(1, parseInt(splitProd?.blogSplit, 10) || 1);
        try {
          const res = await fetch(`${BLOG_TAG_SEARCH_PROXY}/place-blog?url=${encodeURIComponent(s.url)}&count=${n}`);
          const d = await res.json();
          if (!d.success || !d.urls || !d.urls.length) { fail++; continue; }
          const joined = d.urls.join(',');
          await HI.updateCampaign(key, { deltaBlogUrl: joined });
          s.deltaBlogUrl = joined;
          const live = allSlots.find(x => x._key === key);
          if (live) live.deltaBlogUrl = joined;
          ok++;
        } catch (e) { fail++; }
      }
      bsubBulkBtn.disabled = false; bsubBulkBtn.textContent = '🔗 블로그URL 일괄조회';
      const keepTab = ['normal','charlie','blog','fullstack'].find(k => overlay.querySelector(`#stab-panel-${k}`)?.style.display === 'block');
      data = computeSubmitData(target);
      scheduleValidationRows = flattenScheduleRows(data);
      applyTabState(keepTab);
      fillBody();
    };

    applyTabState(data.defaultTab);
    fillBody();

    overlay.querySelector('#submit-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.querySelector('#csub-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.querySelector('#bsub-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.querySelector('#fsub-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
  }

  window.switchSubmitTab = function(tab) {
    ['normal','charlie','blog','fullstack'].forEach(k => {
      const panel = document.getElementById(`stab-panel-${k}`);
      const btn   = document.getElementById(`stab-${k}`);
      if (panel) panel.style.display = k === tab ? 'block' : 'none';
      if (btn)   btn.classList.toggle('active', k === tab);
    });
  };

  // ── 시간대 분할 예약 편집기 (접수 확인 모달 상단, kimpro/reception.html과 동일 구현) ────────────
  let scheduleDraftRows = [{ time: '10:00', pct: 100 }];
  // 키워드 분할 설정 — 켜져 있으면 검색키워드를 (일수×시간대 수)만큼 나눠 하루씩 다른 그룹 배정
  // (splitRowBySchedule 참고, 필요 그룹 수만큼 자동 역산). scheduleKwSplit=커밋된 값,
  // scheduleKwSplitDraft=편집 중인 체크박스(적용 전)
  let scheduleKwSplit = false;
  let scheduleKwSplitDraft = { on:false };
  // 이 설정을 적용하면 총 몇 건으로 나뉘어 접수되는지 미리보기(시간대 수 × 각 행의 일수 합) — 최소수량
  // 미달 조각은 scheduleMinViolations가 applyScheduleConfig에서 이미 막아 항상 100%대로 되므로 정확한 값.
  function scheduleSplitCount() {
    // 오늘 시작하는 행은 첫날이 1건(바로 접수)
    const today = scheduleDateForOffset(null, 0);
    return scheduleValidationRows.reduce((a, r) => {
      const days = Math.max(1, r._days || 0);
      return a + (scheduleDateForOffset(r.예약일, 0) === today ? 1 + (days - 1) * scheduleDraftRows.length : days * scheduleDraftRows.length);
    }, 0);
  }
  // 키워드 목록을 "그룹당 개수"만큼 순서대로 잘라 그룹 배열로 반환
  function chunkKeywords(kwText, chunk) {
    const kws = (kwText||'').split(',').map(k=>k.trim()).filter(Boolean);
    const c = Math.max(1, parseInt(chunk)||0);
    if (!kws.length) return [];
    const groups = [];
    for (let i=0; i<kws.length; i+=c) groups.push(kws.slice(i, i+c));
    return groups;
  }
  // 그룹당 개수를 직접 받는 대신 "몇 개 그룹이 필요한지"만 받아 그룹 크기를 역산(ceil)해서 자름 —
  // 시간대 분할 편집기 키워드 분할과 동일한 자동계산 방식
  function autoChunkKeywords(kwText, neededGroups) {
    const kws = (kwText||'').split(',').map(k=>k.trim()).filter(Boolean);
    if (!kws.length || neededGroups <= 0) return [];
    return chunkKeywords(kwText, Math.max(1, Math.ceil(kws.length / neededGroups)));
  }
  // "적용" 시점에 최소 수량 위반을 미리 막기 위한 검증 대상 행 — renderSubmitModal이 data를 계산/재계산할 때마다 갱신
  let scheduleValidationRows = [];
  function flattenScheduleRows(data) {
    return [...data.normalPlan, ...data.charliePlan, ...data.deltaPlan, ...data.navyPlan].flatMap(p => p.rows);
  }
  // schedule 시간을 각 행의 실제 예약일 기준 첫 회차로 계산했을 때 이미 지난 시각인 조합을 찾음 —
  // 예약일이 미래면 오늘 기준 지난 시각이라도 유효하므로 "오늘"만 보고 일괄 차단하면 안 된다.
  function schedulePastViolations(rows, schedule) {
    const now = new Date();
    const violations = [];
    const today = scheduleDateForOffset(null, 0);
    rows.forEach(r => {
      if (!(r.일목표 > 0)) return;
      if (scheduleDateForOffset(r.예약일, 0) === today) return; // 오늘 시작분은 나누지 않고 바로 보냄(splitRowBySchedule)
      schedule.forEach(s => {
        if (new Date(scheduleTimeToIso(s.time, r.예약일, 0)) <= now) {
          violations.push({ name: r.상품등급명, time: s.time, date: r.예약일 || scheduleDateForOffset() });
        }
      });
    });
    return violations;
  }

  // schedule 설정대로 쪼갰을 때 한 조각이라도 비즈핏 최소 수량(일반 10 / NP위치저장 100) 미만이 되는 행을 찾음 —
  // 접수 시점에 조용히 버려지는 대신(목표 미달) 여기서 미리 막는다.
  function scheduleMinViolations(rows, schedule) {
    const violations = [];
    rows.forEach(r => {
      if (!(r.일목표 > 0)) return;
      const min = r._daysMultiplied ? 100 : 10;
      const portions = lrm(schedule.map((s, i) => ({ id: i, ratio: s.pct })), r.일목표);
      schedule.forEach((s, i) => {
        const p = portions[i] || 0;
        if (p > 0 && p < min) violations.push({ name: r.상품등급명, time: s.time, portion: p, min });
      });
    });
    return violations;
  }

  // %만 바뀌었을 때(updateScheduleRow) 행 전체를 다시 그리면 입력 중인 포커스/커서가 끊기므로,
  // 합계 표시만 따로 갱신하는 헬퍼로 분리 — renderScheduleRows(행 추가/삭제 시)와 공유.
  function updateScheduleSumNote() {
    const sum = scheduleDraftRows.reduce((a,r) => a + (Number(r.pct)||0), 0);
    const note = document.getElementById('schedule-sum-note');
    if (note) { note.textContent = `합계 ${sum}%`; note.style.color = sum === 100 ? 'var(--accent)' : 'var(--danger)'; }
    const countEl = document.getElementById('schedule-split-count');
    if (countEl) countEl.textContent = `· 분할 수량 ${scheduleSplitCount()}개`;
    const warnEl = document.getElementById('schedule-editor-warn');
    if (warnEl) {
      if (sum !== 100) { warnEl.style.display = 'block'; warnEl.textContent = `⚠ 비율 합계는 100%여야 합니다 (현재 ${sum}%)`; }
      else { warnEl.style.display = 'none'; warnEl.textContent = ''; }
    }
    const btn = document.getElementById('schedule-apply-btn');
    if (btn) {
      const blocked = sum !== 100;
      btn.disabled = blocked;
      btn.style.background = blocked ? 'var(--muted)' : '#f59e0b';
      btn.style.cursor = blocked ? 'not-allowed' : 'pointer';
    }
  }

  // <input type="time">의 네이티브 피커는 lang 속성이 아니라 브라우저/OS 언어를 따라가 크롬에선
  // ko-KR일 때 오전/오후로 뜬다(우회 불가) — 대신 시/분 select 두 개로 대체해 24시간 표기를 강제한다.
  function scheduleTimeSelectOptions(max, selected) {
    return Array.from({length: max}, (_, n) => String(n).padStart(2, '0'))
      .map(v => `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`).join('');
  }
  function renderScheduleRows() {
    const wrap = document.getElementById('schedule-rows');
    if (!wrap) return;
    const selStyle = 'padding:3px 4px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;';
    wrap.innerHTML = scheduleDraftRows.map((r, i) => {
      const [hh, mm] = (r.time || '10:00').split(':');
      return `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <select id="sch-hh-${i}" onchange="updateScheduleRow(${i},'time',this.value+':'+document.getElementById('sch-mm-${i}').value)" style="${selStyle}">${scheduleTimeSelectOptions(24, hh)}</select>
        :
        <select id="sch-mm-${i}" onchange="updateScheduleRow(${i},'time',document.getElementById('sch-hh-${i}').value+':'+this.value)" style="${selStyle}">${scheduleTimeSelectOptions(60, mm)}</select>
        <input type="number" min="1" max="100" value="${r.pct}" oninput="updateScheduleRow(${i},'pct',this.value)" style="width:36px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;text-align:center;">%
        ${scheduleDraftRows.length > 1 ? `<button type="button" onclick="removeScheduleRow(${i})" style="border:none;background:transparent;color:var(--danger);cursor:pointer;font-size:14px;">✕</button>` : ''}
      </div>`;
    }).join('');
    updateScheduleSumNote();
  }

  window.toggleScheduleEditor = function() {
    const panel = document.getElementById('schedule-editor');
    if (!panel) return;
    const show = panel.style.display === 'none';
    panel.style.display = show ? 'block' : 'none';
    if (show) renderScheduleRows();
  };

  window.addScheduleRow = function() {
    scheduleDraftRows.push({ time: '12:00', pct: 0 });
    renderScheduleRows();
  };

  window.removeScheduleRow = function(i) {
    scheduleDraftRows.splice(i, 1);
    renderScheduleRows();
  };

  window.updateScheduleRow = function(i, field, value) {
    scheduleDraftRows[i][field] = field === 'time' ? value : (Number(value) || 0);
    if (field === 'pct') updateScheduleSumNote();
  };

  window.onScheduleKwSplitToggle = function(checked) {
    scheduleKwSplitDraft.on = checked;
    const note = document.getElementById('sch-kwsplit-note');
    if (note) note.style.display = checked ? 'block' : 'none';
  };

  window.applyScheduleConfig = function() {
    const sum = scheduleDraftRows.reduce((a,r) => a + (Number(r.pct)||0), 0);
    if (sum !== 100) return; // 적용 버튼이 이미 막혀있어 정상 흐름에서 도달 안 함 — 방어적으로만 남겨둠(팝업 없음)
    const pastViolations = schedulePastViolations(scheduleValidationRows, scheduleDraftRows);
    if (pastViolations.length) {
      const lines = pastViolations.slice(0, 5).map(v => `- ${v.name} ${v.date} ${v.time}`);
      if (pastViolations.length > 5) lines.push(`외 ${pastViolations.length - 5}건`);
      alert(`이미 지난 시각으로는 설정할 수 없습니다.\n${lines.join('\n')}`);
      return;
    }
    const violations = scheduleMinViolations(scheduleValidationRows, scheduleDraftRows);
    if (violations.length) {
      const lines = violations.slice(0, 5).map(v => `- ${v.name} ${v.time} → ${v.portion}개 (최소 ${v.min})`);
      if (violations.length > 5) lines.push(`외 ${violations.length - 5}건`);
      alert(`최소 수량 미만으로 쪼개져 적용할 수 없습니다. 시간 개수를 줄이거나 비율을 조정해주세요.\n${lines.join('\n')}`);
      return;
    }
    scheduleConfig = scheduleDraftRows.map(r => ({ time: r.time, pct: Number(r.pct)||0 }));
    scheduleKwSplit = scheduleKwSplitDraft.on;
    const icon = document.getElementById('schedule-toggle-icon');
    if (icon) icon.style.background = '#f59e0b';
    const label = document.getElementById('schedule-toggle-label');
    if (label) label.style.color = '#f59e0b';
    alert(`시간대 분할 예약이 설정되었습니다. 이제 각 탭의 "접수 신청" 버튼을 누르면 즉시 전송 대신 예약 저장됩니다(일수만큼 매일 이 시각에 나눠 접수).${scheduleKwSplit ? ' 키워드도 시간대별로 나눠 배정됩니다.' : ''}`);
  };

  window.clearScheduleConfig = function() {
    scheduleConfig = null;
    scheduleKwSplit = false;
    const icon = document.getElementById('schedule-toggle-icon');
    if (icon) icon.style.background = '#94a3b8';
    const label = document.getElementById('schedule-toggle-label');
    if (label) label.style.color = 'var(--text2)';
    const panel = document.getElementById('schedule-editor');
    if (panel) panel.style.display = 'none';
  };

  // 대행사 1곳 미리보기 블록 — 충전 신청 팝업(정산관리)과 동일한 agency-block/ag-table 스타일. 행 = (업체명, 등급) 쌍.
  // daysMultiplied: 찰리처럼 "일수" 칸에 일목표×일수(전체목표)를 넣는 상품이면 true — 헤더/합계 계산을 "전체목표" 그대로 써서 이중곱 방지
  function buildSubmitAgencyBlock(p, label='일반 상품', daysMultiplied=false, blogUrl=false) {
    if (!p.rows.length) return null;
    const block = document.createElement('div');
    block.className = 'agency-block';

    const totalTarget = daysMultipliedSum(p.rows, daysMultiplied);
    const deductNote = p.deductTarget ? ` · 차감 ${p.deductTarget.toLocaleString()} (${(p.deductAmount||0).toLocaleString()}원)` : '';
    const { kwEmptyCount, lowTargetCount, blogUrlEmptyCount } = rowIssueCounts(p.rows, blogUrl);
    const issueCount = kwEmptyCount + lowTargetCount + blogUrlEmptyCount;
    const issueBadge = issueCount ? ` <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;">⚠️ 오류 ${issueCount}건</span>` : '';
    const hd = document.createElement('div');
    hd.className = 'agency-hd';
    hd.innerHTML = `<div><div class="aname">${escProd(p.agency)}${issueBadge}</div><div class="ameta">총 ${p.rows.length}건 · 목표 합계 ${totalTarget.toLocaleString()}${deductNote}</div></div>`;
    block.appendChild(hd);

    const wrap = document.createElement('div'); wrap.style.width = '100%';
    const tbl  = document.createElement('table'); tbl.className = 'ag-table ag-table-tight';
    tbl.style.cssText = 'table-layout:fixed;width:100%';
    tbl.innerHTML = `<thead><tr>
      <th style="width:64px">등급</th>
      <th style="width:98px">업체명</th>
      <th style="width:108px">URL</th>
      <th style="width:96px">MID</th>
      <th style="width:84px">순위키워드</th>
      <th style="width:56px;text-align:right">일목표</th>
      <th style="width:44px;text-align:center">${daysMultiplied ? '전체목표' : '일수'}</th>
      <th style="width:74px">예약일</th>
      <th style="width:56px;text-align:center">검색키워드</th>
      ${blogUrl ? '<th style="width:74px">블로그URL</th>' : ''}
      <th style="width:76px;text-align:center">상태</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    const ell = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0';
    p.rows.forEach(r => {
      const kwCount = (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k).length;
      // 시간대 분할 예약 + 키워드 분할이 켜져 있으면 여기서 50개로 잘리지 않고 조각마다 나눠 배정되니(splitRowBySchedule)
      // "✂️50 잘림" 경고 대신 실제 전체 개수를 그대로 보여줘 확인하기 쉽게 함
      const kwTrim = kwCount > 50 && !scheduleKwSplit;
      const kwEmpty = kwCount === 0;
      const targetLow = (r.일목표||0) < 10;
      const tr = document.createElement('tr');
      const statusTd = document.createElement('td');
      statusTd.style.cssText = 'text-align:center;white-space:nowrap';
      statusTd.innerHTML = r._normalSubmitted ? '<span style="color:var(--accent);">✅ 완료</span>' : '-';
      tr.innerHTML = `
        <td style="${ell};font-weight:700" title="${escProd(r.상품등급명)}">${escProd(r.상품등급명)}</td>
        <td style="${ell}" title="${escProd(r.업체명)}">${escProd(r.업체명)}</td>
        <td style="${ell}" title="${escProd(r.업체URL||'')}"><a href="${escProd(r.업체URL||'')}" target="_blank" style="color:var(--info);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escProd(r.업체URL||'-')}</a></td>
        <td style="${ell};font-size:11px;color:var(--text2)" title="${escProd(r.PID번호||r.업체PID번호||'')}">${escProd(r.PID번호||r.업체PID번호||'-')}</td>
        <td style="${ell}" title="${escProd(r.순위키워드||'')}">${escProd(r.순위키워드||'-')}</td>
        <td style="text-align:right;white-space:nowrap">${targetLow ? `<span style="font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;white-space:nowrap">${(r.일목표||0).toLocaleString()} ⚠️</span>` : (r.일목표||0).toLocaleString()}</td>
        <td style="white-space:nowrap">${r.일수||0}</td>
        <td style="white-space:nowrap">${escProd(r.예약일||'-')}</td>
        <td style="text-align:center" title="${escProd(r.검색키워드||'')}${kwTrim?' (접수 시 앞 50개만 사용)':''}"><span style="font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:${kwEmpty?'#fee2e2':(kwTrim?'#fef3c7':'#eff6ff')};color:${kwEmpty?'#dc2626':(kwTrim?'#b45309':'#1d4ed8')};border:1px solid ${kwEmpty?'#fca5a5':(kwTrim?'#fde68a':'#bfdbfe')};white-space:nowrap">${kwTrim?'✂️50':(kwCount+'개'+(kwEmpty?' ⚠️':''))}</span></td>
        ${blogUrl ? `<td style="${ell};font-size:11px;${r.블로그URL?'':'color:var(--danger);'}" title="${escProd(r.블로그URL||'')}">${escProd(r.블로그URL||'미입력 ⚠️')}</td>` : ''}
      `;
      tr.appendChild(statusTd);
      tbody.appendChild(tr);
      r._statusTd = statusTd;
    });
    tbl.appendChild(tbody); wrap.appendChild(tbl); block.appendChild(wrap);

    const ft = document.createElement('div');
    ft.className = 'agency-ft';
    ft.innerHTML = '<div class="totals"></div>';
    block.appendChild(ft);
    p.msgEl = ft.querySelector('.totals');

    return block;
  }


  // legKey: 게이트 기록 필드('normalKeys'|'charlieKeys'|'deltaKeys'|'navyKeys') — 일반/찰리/블로그(델타+네이비) 탭이 이 로직을 공유
  // adrole: 지정 시 grade-info/register를 해당 adrole로만 조회 — 등급명이 겹쳐도 원하는 메뉴로만 정확히 접수
  const ALL_SUBMIT_PREFIXES = ['submit', 'csub', 'bsub', 'fsub'];
  const SUBMIT_TAB_PREFIX = { normalKeys: 'submit', charlieKeys: 'csub' };

  // 찰리/델타/네이비는 동적 버전조회가 빈 값을 반환해 "버전체크 실패"로 거부됨(실측) — 상품 설정 ver로
  // override. ap()(활성만)가 아니라 prods 전체에서 찾음 — 등급 자동매칭이 비활성 상품도 접수시키므로.
  function productVerFor(legKey) {
    const verSourceId = legKey === 'charlieKeys' ? 'charlie' : legKey === 'deltaKeys' ? 'delta' : legKey === 'navyKeys' ? 'navy' : null;
    return verSourceId ? prods.find(p => p.id === verSourceId)?.ver : undefined;
  }

  // 검색키워드 50개 초과 시 앞 50개만 남기고 자름 + 유효성 판정 — 즉시/예약 제출 공용. 통과하면
  // null, 실패하면 사유 반환. skipCap: 시간대 분할 키워드분할이 켜져 있으면 여기서 자르면 안 됨 —
  // 원본 키워드 풀을 그대로 둬야 splitRowBySchedule이 나눈 뒤 각 조각에 50개 캡을 적용함
  function truncateAndValidateRow(r, skipCap) {
    const kwList = (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k);
    if (!skipCap && kwList.length > 50) r.검색키워드 = kwList.slice(0, 50).join(',');
    const kwCount = (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k).length;
    if (kwCount === 0) return { title: '검색키워드 미입력', label: '❌ 키워드 미입력' };
    if ((r.일목표||0) < 10) return { title: `일목표 ${r.일목표||0}개 — 10 미만`, label: '❌ 일목표 미달' };
    if (r._requiresBlogUrl && !r.블로그URL) return { title: '블로그 URL 미입력', label: '❌ URL 미입력' };
    return null;
  }

  // 한 plan(대행사별 rows)을 실제로 비즈핏에 등록 — UI는 손대지 않고 결과 집계만 반환.
  // executeSubmit(단일 탭)과 executeBlogSubmit(델타+네이비 동시 제출)이 공유. 같은 BizFit 계정은
  // 동시 요청 시 세션 충돌 위험이 있어 grade 단위는 순차
  // 같은 캠페인을 다른 창/직원이 동시에 접수하면 비즈핏에 두 번 등록·결제됨 — 선점 못 한 행은 빼고 표시(HI.claimRegisterRows)
  async function claimRowsForRegister(rows, leg) {
    let blocked = 0;
    const ok = await HI.claimRegisterRows(rows, leg, r => {
      blocked++;
      if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);" title="다른 창 또는 다른 직원이 같은 캠페인을 접수 중입니다">⛔ 다른 창에서 접수 중</span>';
    });
    return { ok, blocked };
  }

  async function submitPlanRows(plan, overlay, gate, legKey, adrole) {
    const productVer = productVerFor(legKey);
    let okTotal = 0, failTotal = 0;
    const slotMap = new Map(allSlots.map(s => [s._key, s]));
    const approvedKeys = gate ? new Set() : null;

    async function processAgency(p) {
      if (!p.rows.length) return;

      // 한 캠페인(슬롯)에 활성 상품이 여러 개면 상품별로 행이 나뉘어 각각 성공/실패가 갈릴 수 있음.
      // 슬롯의 모든 상품행이 성공(또는 기존에 이미 완료)한 경우에만 그 슬롯을 승인 처리한다 — 일부라도 실패하면 승인 보류.
      async function finalizeSlotApprovals() {
        const bySlot = new Map();
        p.rows.forEach(r => {
          if (!r._slotKey) return;
          if (!bySlot.has(r._slotKey)) bySlot.set(r._slotKey, []);
          bySlot.get(r._slotKey).push(r);
        });
        const okSlots = [...bySlot.entries()]
          .filter(([, rs]) => rs.every(r => r._normalSubmitted || r._rowOk === true))
          .map(([k]) => k);
        if (!okSlots.length) return;
        if (gate) {
          okSlots.forEach(k => approvedKeys.add(k));
        } else {
          const failed = await approveSlotsWithBizfit(okSlots, slotMap);
          if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
        }
      }

      // 이전에 이미 접수 완료된 행(다른 탭만 남아 모달을 닫았다가 재오픈한 경우)은 재제출하지 않고 완료 표시만 유지
      const alreadyRows = p.rows.filter(r => r._normalSubmitted);
      const pendingRows = p.rows.filter(r => !r._normalSubmitted);
      alreadyRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; });
      okTotal += alreadyRows.length;

      if (!pendingRows.length) {
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--accent);font-size:11px;">✅ 전체 접수 완료</span>';
        await finalizeSlotApprovals();
        return;
      }

      pendingRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--info);">⏳</span>'; });

      // 유효성 검사 — 키워드 50개 초과 시 앞 50개만 남기고 자동으로 잘라서 접수 / 일목표 10 미만
      pendingRows.forEach(r => {
        const fail = truncateAndValidateRow(r);
        if (fail) {
          r._kwFail = true;
          if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${fail.title}">${fail.label}</span>`;
          failTotal++;
        }
      });

      const { ok: validRows, blocked } = await claimRowsForRegister(pendingRows.filter(r => !r._kwFail), legKey);
      failTotal += blocked;

      if (!validRows.length) {
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--danger);font-size:11px;">전체 유효성 검사 실패 (키워드 초과 또는 일목표 미달)</span>';
        await finalizeSlotApprovals();
        return;
      }

      const account = p.realAg ? await fetchBizfitAccount(p.realAg) : null;
      if (!account) {
        validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);">❌ 계정 미등록</span>'; });
        if (p.msgEl) p.msgEl.innerHTML = '<span style="color:var(--danger);font-size:11px;">비즈핏 계정 정보 미등록 (회원 관리에서 BizFit ID/PW 등록 필요)</span>';
        failTotal += validRows.length;
        await finalizeSlotApprovals();
        return;
      }

      let gi;
      try {
        gi = await callBizfitProxy('/grade-info', { domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB, adrole: adrole || undefined, rawData: validRows.map(({_slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, ...rest}) => rest) });
      } catch(e) { gi = { success:false, message: '서버 호출 실패: '+e.message }; }

      if (!gi.success || !gi.gradeGroups || !gi.gradeGroups.length) {
        const msg = gi.message || '전송 가능한 등급이 없습니다.';
        validRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(msg)}">❌ 등급조회 실패</span>`; });
        if (p.msgEl) p.msgEl.innerHTML = `<span style="color:var(--danger);font-size:11px;">${escProd(msg)}</span>`;
        failTotal += validRows.length;
        await finalizeSlotApprovals();
        return;
      }

      const matchedGrades = new Set();
      let agencyFail = 0;
      for (const g of gi.gradeGroups) {
        const grpRows = validRows.filter(r => r.상품등급명 === g.gradeName);
        if (!grpRows.length) continue;
        matchedGrades.add(g.gradeName);
        const payloadRows = grpRows.map(({_slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, ...rest}) => rest);
        let result;
        try {
          result = await callBizfitProxy('/register', {
            domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw,
            tab: g.actualTab || BIZFIT_TAB, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType,
            version: productVer, rowData: payloadRows,
          });
        } catch(e) { result = { success:false, message: e.message }; }
        if (result.success) {
          // 배치 내 일부 행만 결제 제외될 수 있어 서버가 반환한 행 인덱스로 매칭(payloadRows는 grpRows를 순서대로 map함)
          // PID로 매칭 안 하는 이유: 같은 업체가 슬롯 2개에 걸쳐 같은 배치에 들어오면 PID만으론 실패 행을 구분 못 함
          const failByIdx = new Map((result.fail_rows || []).map(f => [f.index, f.reason]));
          let okCount = 0;
          grpRows.forEach((r, i) => {
            const reason = failByIdx.get(i);
            if (reason === undefined) {
              r._rowOk = true; okCount++;
              if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>';
            } else if (r._statusTd) {
              r._statusTd.innerHTML = `<span style="color:var(--danger);" title="비즈핏 결제 제외 (${escProd(reason||'데이터 검증 실패')})">❌ 실패</span>`;
            }
          });
          okTotal += okCount;
          const failCount = grpRows.length - okCount;
          if (failCount) { failTotal += failCount; agencyFail += failCount; }
        } else {
          failTotal += grpRows.length;
          agencyFail += grpRows.length;
          grpRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(result.message||'')}">❌ 실패</span>`; });
        }
      }
      // 비즈핏 등급맵과 매칭 안 된 등급명 (유효 행 기준)
      const validGradeNames = new Set(validRows.map(r => r.상품등급명));
      validGradeNames.forEach(name => {
        if (!matchedGrades.has(name)) {
          const unmatchedRows = validRows.filter(r => r.상품등급명 === name);
          unmatchedRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--danger);">❌ 등급 불일치</span>'; });
          failTotal += unmatchedRows.length;
          agencyFail += unmatchedRows.length;
        }
      });
      // 이번 회차에 성공한 상품만 슬롯별로 개별 기록 — 실패한 상품만 다음 재접수 때 다시 시도되도록
      const newlyOkBySlot = new Map();
      p.rows.forEach(r => {
        if (r._rowOk !== true || !r._slotKey) return;
        if (!newlyOkBySlot.has(r._slotKey)) newlyOkBySlot.set(r._slotKey, []);
        newlyOkBySlot.get(r._slotKey).push(r._doneKey || r.상품등급명);
      });
      await Promise.all([...newlyOkBySlot.entries()].map(async ([slotKey, names]) => {
        const s = slotMap.get(slotKey);
        const merged = [...new Set([...(s?.normalDoneProducts || []), ...names])];
        await HI.updateCampaign(slotKey, { normalDoneProducts: merged });
        if (s) s.normalDoneProducts = merged;
        await addCampaignType(slotKey, names, s);
      }));
      // 슬롯 단위 승인 판정 — 이 슬롯에 걸린 모든 상품행이 성공해야 승인 (일부 실패 시 보류)
      await finalizeSlotApprovals();
      if (p.msgEl) {
        const kwFailCount = p.rows.filter(r => r._kwFail).length;
        const parts = [kwFailCount ? `유효성 실패 ${kwFailCount}건` : '', agencyFail ? '일부 등급 실패 — 상태 칸에서 사유 확인(마우스오버)' : ''].filter(Boolean);
        p.msgEl.innerHTML = parts.length
          ? `<span style="color:var(--danger);font-size:11px;">${parts.join(' / ')}</span>`
          : `<span style="color:var(--accent);font-size:11px;">✅ 전체 접수 완료</span>`;
      }
    }

    // 대행사(계정)별로 병렬 처리
    await Promise.all(plan.map(p => processAgency(p)));

    if (gate) {
      // 상품별 완료 기록(normalDoneProducts)은 processAgency에서 이미 개별 저장됨 —
      // 여기서는 슬롯 전체(모든 활성 상품)가 완료된 키만 게이트에 반영
      gate[legKey] = approvedKeys;
      await gate.tryApprove();
    }

    return { okTotal, failTotal };
  }

  // submitPlanRows와 같은 검증·등급매칭을 거치되 /register 대신 schedule/dispatch에 저장 —
  // 승인은 서버가 그룹 완료 확인 후 처리, 캐시차감은 예약 시점에 바로 실행.
  async function submitPlanRowsScheduled(plan, overlay, legKey, adrole, schedule, gate = null) {
    const productVer = productVerFor(legKey);
    const batchGroupId = `sch_${genId()}`;
    let scheduledCount = 0, failTotal = 0;
    const scheduledRows = [];
    const dispatchEntries = [];
    const slotKeyCounts = new Map();

    async function scheduleAgency(p) {
      if (!p.rows.length) return;
      // 행 상태 칸 — 일반 접수(submitPlanRows)와 같은 표시. 예약 성공 표시는 예약 저장이 끝난 뒤(아래 scheduledRows)
      const mark = (rows, html) => rows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = html; });
      const fail = (label, title = '') => `<span style="color:var(--danger);" title="${escProd(title)}">${label}</span>`;
      mark(p.rows.filter(r => r._normalSubmitted), '<span style="color:var(--accent);">✅ 완료</span>');
      const pendingRows = p.rows.filter(r => !r._normalSubmitted);
      if (!pendingRows.length) return;
      mark(pendingRows, '<span style="color:var(--info);">⏳</span>');

      pendingRows.forEach(r => {
        const f = truncateAndValidateRow(r, scheduleKwSplit);
        if (f) { r._kwFail = true; mark([r], fail(f.label, f.title)); }
      });
      const { ok: validRows, blocked } = await claimRowsForRegister(pendingRows.filter(r => !r._kwFail), legKey);
      if (!validRows.length) { failTotal += pendingRows.length; return; }
      failTotal += blocked;

      const account = p.realAg ? await fetchBizfitAccount(p.realAg) : null;
      if (!account) { failTotal += validRows.length; mark(validRows, fail('❌ 계정 미등록')); return; }

      let gi;
      try {
        gi = await callBizfitProxy('/grade-info', { domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB, adrole: adrole || undefined, rawData: [] });
      } catch(e) { gi = { success:false }; }
      if (!gi.success || !gi.gradeGroups || !gi.gradeGroups.length) { failTotal += validRows.length; mark(validRows, fail('❌ 등급조회 실패', gi.message || '')); return; }

      const gradeNames = new Set(gi.gradeGroups.map(g => g.gradeName));
      const unmatched = validRows.filter(r => !gradeNames.has(r.상품등급명));
      mark(unmatched, fail('❌ 등급 불일치'));
      failTotal += unmatched.length;
      scheduledRows.push(...validRows.filter(r => gradeNames.has(r.상품등급명)));

      const expanded = validRows.flatMap(r => splitRowBySchedule(r, schedule));
      if (!expanded.length) return;

      for (const g of gi.gradeGroups) {
        const grpRows = expanded.filter(r => r.상품등급명 === g.gradeName);
        grpRows.forEach(r => {
          const { _slotKey, _statusTd, _kwFail, _normalSubmitted, _doneKey, _requiresBlogUrl, _days, _daysMultiplied, _sendAt, ...rowData } = r;
          dispatchEntries.push({
            slotKey: _slotKey, batchGroupId, sendAt: _sendAt, endpoint: '/register', agency: p.agency || '', adrole: adrole ?? null,
            payload: {
              domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw,
              tab: g.actualTab || BIZFIT_TAB, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType,
              // productVer는 normalKeys에선 undefined인데, RTDB set()은 undefined 값을 허용 안 해 던짐(catch 없어 "처리 중" 무한대기) — null로 치환.
              version: productVer ?? null, rowData: [rowData],
            },
          });
          slotKeyCounts.set(_slotKey, (slotKeyCounts.get(_slotKey) || 0) + 1);
          scheduledCount++;
        });
      }
    }

    await Promise.all(plan.map(p => scheduleAgency(p)));
    if (dispatchEntries.length) {
      // 예약한 상품을 캠페인타입으로 저장(실제 등록은 서버가 나중에 하지만 상품은 지금 확정)
      const typeBySlot = new Map();
      dispatchEntries.forEach(e => { if (!typeBySlot.has(e.slotKey)) typeBySlot.set(e.slotKey, new Set()); typeBySlot.get(e.slotKey).add(e.payload.gradeName); });
      await Promise.all([...typeBySlot].map(([k, names]) => addCampaignType(k, [...names]).catch(err => console.error('캠페인타입 저장 실패:', k, err))));
      const holdKeys = new Set([...slotKeyCounts.keys()].filter(k => gate?.fsPending(k)));
      const deductFailures = await initScheduledBatches(slotKeyCounts, batchGroupId, holdKeys);
      // 보류 건은 이 탭은 끝난 것으로 게이트에 기록 — 풀스택이 끝나면 tryApprove가 releaseScheduleHold로 넘김
      if (gate && holdKeys.size) gate[legKey] = new Set([...(gate[legKey] || []), ...holdKeys]);
      if (deductFailures.length && overlay) {
        overlay._deductFailures.push(...deductFailures);
        overlay._renderDeductFailures();
      }
      await Promise.all(dispatchEntries.map(saveScheduledDispatch));
      scheduledRows.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 예약 완료</span>'; });
      // adlog.kr은 서버가 만든 xlsx를 거부해서(브라우저 SheetJS 파일만 통과) 서버가 나중에 처리하는
      // 예약 완료(active 전환) 시점엔 등록 불가 — 그래서 지금(접수 신청 클릭 시점) 미리 등록해둠.
      if (adlogAutoOn) await autoRegisterAdlog([...slotKeyCounts.keys()].map(k => allSlots.find(s => s._key === k)));
      await autoStampSettlement([...slotKeyCounts.keys()].map(k => allSlots.find(s => s._key === k)));
    }
    return { scheduledCount, failTotal };
  }

  // ════════════════════════════════════════════════════════
  // 분할접수 현황 — schedule/dispatch 조회. 서버가 status만 pending→done으로 바꿔 완료
  // 항목도 계속 남음(수정은 pending만 가능). kimpro와 동일 구현.
  // ════════════════════════════════════════════════════════

  let _ssEntries = {};   // key -> entry, 등급 변경 시 저장된 계정정보(loginId/pwd) 조회용
  let _ssCollapsed = new Set(); // 접힌 그룹의 gid(slotKey 기준) 집합
  let _ssLastGroups = []; // 직전 렌더에 실제로 표시된 그룹 배열(카드 클릭이 index로 이 배열을 참조) — 대기/완료 뷰 중 현재 보이는 쪽만 담김
  let _ssShowDone = false; // false=대기 항목 있는 캠페인만, true=전부 완료된 캠페인만(완료 목록)
  let _ssResplit = {}; // slotKey -> { open, loading, gradeGroups, sel:{gradeName:pct} } — 잔여 재분류 패널 상태
  // 일괄 잔여 재분류 — 여러 그룹에 같은 등급/비율 설정 하나를 한 번에 적용. 키워드는
  // 항상 각 그룹 자신의 상세 키워드를 이 등급 비율 그대로 재분할(그룹별 개별 % 없음, 사용자 확정).
  let _ssBulkSelected = new Set(); // 일괄 재분류 대상으로 체크된 그룹 gid 집합
  // sel: ckey -> 목표%, kwPct: ckey -> 키워드%(개별 패널과 동일하게 분리) — 실제 적용은 항상
  // 각 그룹 자신의 상세값으로 함(apply 시점에 새로 읽음). 미리보기 텍스트영역은 안 둠(다 못 보여줘서 의미 없음).
  let _ssBulk = { open:false, loading:false, gradeGroups:null, sel:{}, kwMode:false, timeMode:false, timeRows:[{time:'10:00',pct:100}] };

  // ── 예약 분할 현황 — 한 벌(schedule/dispatch·batches). 옛 김프로 메뉴에서 만든 항목만 src 'kp'(_src)로
  // 표시돼 재분할·등급 판정 때 옛 김프로 상품 설정을 씀. 저장 경로는 출처와 무관하게 같음
  function scheduleDispatchSuffix(src) { return 'dispatch'; }
  function scheduleBatchSuffix(src)    { return 'batches'; }
  async function batchSnapOf(slotKey) {
    const v = await HI.getScheduleBatch(slotKey);
    return { exists: () => v != null, val: () => v };
  }

  function fmtScheduleTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return `${mm}.${dd} ${hh}:${mi}`;
  }

  // 예약(split) 카드 전용 — 팝업의 groupScheduleEntries와 동일한 계산을 DOM 렌더 없이 반환.
  // hi-store의 onValue 공유 캐시 구독 사용 — 매번 통째로 받으면 무관한 캠페인 변경마다
  // 이 테이블(수백KB~1MB)을 재다운로드함
  function scheduleEntriesFrom(val) {
    const out = {};
    Object.entries(val || {}).forEach(([k, v]) => { out[k] = { ...v, _key: k, _src: v.src === 'kp' ? 'kp' : 'ha' }; });
    return out;
  }
  async function computeScheduleGroupCount() {
    const entries = scheduleEntriesFrom(await HI.getScheduleDispatchOnce());
    // 완료(모든 조각 done)된 캠페인은 카드에서 제외 — 대기중 남은 캠페인 수만 표시
    return groupScheduleEntries(Object.values(entries)).filter(g => !g.items.every(e => isScheduleDone(e.status))).length;
  }

  async function reloadScheduleEntries() {
    _ssEntries = scheduleEntriesFrom(await HI.getScheduleDispatchOnce());
    renderSplitScheduleList();
  }

  window.openSplitScheduleModal = async function() {
    const modal = document.getElementById('split-schedule-modal');
    modal.style.display = 'flex';
    document.getElementById('ss-search').value = '';
    document.getElementById('ss-status-filter').value = 'all';
    document.getElementById('ss-list').innerHTML = '<div class="loading-wrap"><div class="spinner"></div>불러오는 중...</div>';
    document.getElementById('ss-count').textContent = '';
    _ssCollapsed = new Set();
    _ssResplit = {};
    _ssShowDone = false;

    await reloadScheduleEntries(); // _ssLastGroups 채우기
    _ssCollapsed = new Set(_ssLastGroups.map(g => g.gid)); // 처음엔 전체 접힌 상태로
    renderSplitScheduleList();
  };

  window.closeSplitScheduleModal = function() {
    document.getElementById('split-schedule-modal').style.display = 'none';
  };

  // 저장 시점엔 항상 'pending'이고(saveScheduledDispatch), 서버는 전송을 마쳐도 항목을 지우지 않고
  // status만 pending → done으로 바꿔두므로, pending이 아니면 완료로 간주한다.
  function isScheduleDone(status) {
    return !!status && status !== 'pending';
  }
  function scheduleStatusLabel(status) {
    if (status === 'cancelled') return `<span style="color:var(--muted);font-weight:600;">취소됨</span>`;
    const done = isScheduleDone(status);
    return `<span style="color:${done?'#ef4444':'#3b82f6'};font-weight:600;">${done?'완료':'대기중'}</span>`;
  }

  // 검색(업체명/PID/검색키워드/순위키워드 부분일치) + 상태 필터
  function filterScheduleEntries(entries) {
    const qTerms = (document.getElementById('ss-search')?.value || '')
      .split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    const statusFilter = document.getElementById('ss-status-filter')?.value || 'all';
    return entries.filter(e => {
      const done = isScheduleDone(e.status);
      if (statusFilter === 'pending' && done) return false;
      if (statusFilter === 'done' && !done) return false;
      if (!qTerms.length) return true;
      const row = (e.payload?.rowData || [])[0] || {};
      const fields = [row.업체명, row.PID번호, row.검색키워드, row.순위키워드].map(v => String(v||'').toLowerCase());
      return qTerms.some(t => fields.some(v => v.includes(t)));
    });
  }

  // slotKey 기준 그룹핑 — PID/업체명으로 묶으면 같은 업체를 다른 시점에 두 번 예약했을 때
  // 잔여 재분류 계산이 두 배치를 섞어버림.
  function groupScheduleEntries(entries) {
    const groups = new Map();
    entries.forEach(e => {
      const row = (e.payload?.rowData || [])[0] || {};
      const gid = e.slotKey || row.PID번호 || row.업체명 || 'unknown';
      if (!groups.has(gid)) groups.set(gid, { gid, store: row.업체명||'', pid: row.PID번호||'', agency: e.agency||'', items: [] });
      groups.get(gid).items.push(e);
    });
    const list = [...groups.values()];
    list.forEach(g => g.items.sort((a,b) => (a.sendAt||'').localeCompare(b.sendAt||'')));
    // 정렬 기준은 필터링 전 전체(_ssEntries)의 최소 sendAt으로 고정 — 필터된 부분집합 기준이면
    // 상태 필터를 바꿀 때마다 그룹 순서가 흔들림.
    const minSendAtByGid = new Map();
    Object.values(_ssEntries).forEach(e => {
      const row = (e.payload?.rowData || [])[0] || {};
      const gid = e.slotKey || row.PID번호 || row.업체명 || 'unknown';
      const cur = minSendAtByGid.get(gid);
      if (cur === undefined || (e.sendAt||'') < cur) minSendAtByGid.set(gid, e.sendAt||'');
    });
    list.sort((a,b) => (minSendAtByGid.get(a.gid)||'').localeCompare(minSendAtByGid.get(b.gid)||''));
    return list;
  }

  window.toggleScheduleGroupAt = function(i) {
    const g = _ssLastGroups[i];
    if (!g) return;
    if (_ssCollapsed.has(g.gid)) _ssCollapsed.delete(g.gid); else _ssCollapsed.add(g.gid);
    renderSplitScheduleList();
  };

  window.toggleScheduleDoneView = function() {
    _ssShowDone = !_ssShowDone;
    renderSplitScheduleList(); // _ssLastGroups를 전환된 뷰 기준으로 채움
    _ssCollapsed = new Set(_ssLastGroups.map(g => g.gid)); // 뷰 전환 시 항상 접힌 상태로 시작
    renderSplitScheduleList();
  };

  // 검색/필터는 그룹을 걸러낼 뿐 펼침 상태는 건드리지 않는다 — 펼쳐둔 그룹은 펼쳐진 채로 필터링되고,
  // 접힌 그룹은 헤더의 건수 배지로만 결과가 보인다(펼쳐야 상세 확인).
  window.runScheduleSearch = function() {
    renderSplitScheduleList();
  };

  window.clearScheduleSearch = function() {
    document.getElementById('ss-search').value = '';
    renderSplitScheduleList();
  };

  function ssKwCountBadge(str) {
    const list = String(str||'').split(',').map(k=>k.trim()).filter(Boolean);
    if (!list.length) return '<span style="color:#c0c8d4;font-size:11px;">-</span>';
    return `<span title="${escProd(list.join(', '))}" style="display:inline-block;padding:1px 7px;border-radius:100px;font-size:10px;font-weight:700;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;cursor:default;">${list.length}개</span>`;
  }

  // 검색키워드 입력칸 옆 개수 배지 — 저장(blur) 전에도 타이핑에 맞춰 즉시 갱신
  window.updateScheduleKwCount = function(key, val) {
    const el = document.getElementById(`ss-kwcnt-${key}`);
    if (el) el.innerHTML = ssKwCountBadge(val);
  };

  function renderSplitScheduleList() {
    const listEl = document.getElementById('ss-list');
    const filtered = filterScheduleEntries(Object.values(_ssEntries));
    const allGroups = groupScheduleEntries(filtered);
    // 캠페인(그룹) 전체가 완료됐는지 기준으로 대기/완료 뷰를 나눔 — 대기 항목이 하나라도 남아있으면 대기 뷰,
    // 전부 완료면 완료 목록으로 분리해 기본 화면에서 안 보이게 함(사용자 요청)
    const doneGroups   = allGroups.filter(g => g.items.every(e => isScheduleDone(e.status)));
    const activeGroups = allGroups.filter(g => !g.items.every(e => isScheduleDone(e.status)));
    const groups = _ssShowDone ? doneGroups : activeGroups;
    _ssLastGroups = groups;

    const doneBtn = document.getElementById('ss-done-toggle-btn');
