            <div class="modal-title" style="margin-bottom:0;">접수 확인</div>
            <button id="grade-match-toggle" type="button" title="진행중인 MID가 있으면 동일한 상품으로 접수 — 끄면 상품 유형 설정값 그대로 배분"
              style="display:flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;font-family:inherit;padding:2px;">
              <span style="font-size:12px;color:var(--text2);font-weight:600;">등급 자동매칭</span>
              <span id="grade-match-toggle-icon" style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:${gradeMatchOn?'#16a34a':'#94a3b8'};flex-shrink:0;">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
            </button>
            <button id="schedule-toggle-btn" type="button" onclick="toggleScheduleEditor()"
              style="display:flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;font-family:inherit;padding:2px;">
              <span style="font-size:12px;color:var(--text2);font-weight:600;">⏰ 시간대 분할 예약</span>
              <span id="schedule-toggle-icon" style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#94a3b8;flex-shrink:0;">
                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
            </button>
          </div>
          <button id="reset-submission-btn" style="display:none;background:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted);">초기화</button>
        </div>
        <div id="schedule-editor" style="display:none;margin-bottom:10px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);">
          <div id="schedule-rows"></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
            <button type="button" onclick="addScheduleRow()" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:var(--panel);cursor:pointer;">+ 시간 추가</button>
            <span id="schedule-sum-note" style="font-size:12px;color:var(--muted);"></span>
            <button type="button" onclick="applyScheduleConfig()" style="margin-left:auto;padding:5px 12px;border:none;border-radius:6px;font-size:12px;font-weight:700;font-family:inherit;background:#f59e0b;color:#fff;cursor:pointer;">적용</button>
            <button type="button" onclick="clearScheduleConfig()" style="padding:5px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--panel);cursor:pointer;">끄기</button>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px;">비율 합계는 100%여야 하며, 일수만큼 매일 하루 단위(일수:1)로 나눠 이 시각에 접수됩니다. 다중 상품(승인 게이트) 슬롯이 섞여 있으면 사용할 수 없습니다.</div>
        </div>
        <div id="deduct-fail-banner" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;margin-bottom:10px;align-items:center;gap:8px;flex-wrap:wrap;"></div>
        <div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:14px;">
          <button id="stab-normal" class="submit-tab${data.defaultTab==='normal'?' active':''}"
            onclick="switchSubmitTab('normal')"${!data.hasNormal?' disabled':''}>일반</button>
          <button id="stab-fixed" class="submit-tab${data.defaultTab==='fixed'?' active':''}"
            onclick="switchSubmitTab('fixed')" style="${data.hasFixed?'':'display:none;'}">유입플</button>
          <button id="stab-charlie" class="submit-tab${data.defaultTab==='charlie'?' active':''}"
            onclick="switchSubmitTab('charlie')" style="${data.hasCharlie?'':'display:none;'}">찰리</button>
          <button id="stab-blog" class="submit-tab${data.defaultTab==='blog'?' active':''}"
            onclick="switchSubmitTab('blog')" style="${(data.hasDelta||data.hasNavy)?'':'display:none;'}">블로그</button>
        </div>
        <div id="stab-panel-normal" style="display:${data.defaultTab==='normal'?'block':'none'}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <div style="font-size:12px;" id="submit-sub"></div>
            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button class="btn-cancel" id="submit-close-btn">닫기</button>
              <button id="submit-apply-btn" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">접수 신청</button>
            </div>
          </div>
          <div id="submit-body"></div>
        </div>
        <div id="stab-panel-fixed" style="display:${data.defaultTab==='fixed'?'block':'none'}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <div style="font-size:12px;" id="youpfl-sub"></div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:12px;color:var(--text2);white-space:nowrap;">미션번호 일괄 적용</span>
                <input type="number" min="0" id="youpfl-mission-bulk-input" placeholder="예: 12" style="width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;">
                <button type="button" onclick="applyYoupflMissionBulk(this)" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:var(--bg);cursor:pointer;white-space:nowrap;">적용</button>
              </div>
              <div style="display:flex;gap:8px;">
                <button class="btn-cancel" id="youpfl-close-btn">닫기</button>
                <button id="youpfl-apply-btn" style="background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">접수 신청</button>
              </div>
            </div>
          </div>
          <div id="youpfl-body"></div>
        </div>
        <div id="stab-panel-charlie" style="display:${data.defaultTab==='charlie'?'block':'none'}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <div style="font-size:12px;" id="csub-sub"></div>
            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button class="btn-cancel" id="csub-close-btn">닫기</button>
              <button id="csub-apply-btn" style="background:#d946ef;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">접수 신청</button>
            </div>
          </div>
          <div id="csub-body"></div>
        </div>
        <div id="stab-panel-blog" style="display:${data.defaultTab==='blog'?'block':'none'}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
            <div style="font-size:12px;" id="bsub-sub"></div>
            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button type="button" id="bsub-bulk-blogurl-btn" title="블로그 URL 미입력 항목에 대해 플레이스 URL에서 자동으로 조회해 채웁니다" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg);cursor:pointer;white-space:nowrap;">🔗 블로그URL 일괄조회</button>
              <button class="btn-cancel" id="bsub-close-btn">닫기</button>
              <button id="bsub-apply-btn" style="background:#22c55e;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">접수 신청</button>
            </div>
          </div>
          <div id="bsub-body"></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    // 캐시차감 실패는 콘솔뿐 아니라 모달이 열려있는 동안 배너+재시도 버튼으로 표시 — 대상은 "이 모달에서 시도한 것"만
    // (목록 전체를 훑으면 레거시 active 슬롯도 bizfitDeducted 없어 오탐). executeSubmit 등 최상위 함수도 갱신할 수 있게 overlay에 상태를 매달아둠
    overlay._deductFailures = []; // [{bizfitUid, slots, ded, yup}]
    overlay._renderDeductFailures = function() {
      const banner = overlay.querySelector('#deduct-fail-banner');
      const failures = overlay._deductFailures;
      if (!failures.length) { banner.style.display = 'none'; return; }
      const total = failures.reduce((s, g) => s + g.ded + g.yup, 0);
      banner.style.display = 'flex';
      banner.innerHTML = `<span style="color:#b91c1c;font-weight:700;font-size:12px;">⚠️ 비즈핏 캐시차감 필요 ${failures.length}건(${total.toLocaleString()}원) — 접수는 완료됨, 재시도 필요</span>
        <button id="deduct-retry-btn" style="background:#b91c1c;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">재시도</button>`;
      banner.querySelector('#deduct-retry-btn').onclick = async () => {
        const btn = banner.querySelector('#deduct-retry-btn');
        btn.disabled = true; btn.textContent = '재시도 중...';
        const retrying = overlay._deductFailures;
        overlay._deductFailures = [];
        for (const g of retrying) {
          const ok = await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup);
          if (!ok) overlay._deductFailures.push(g);
        }
        overlay._renderDeductFailures();
      };
    };

    // "초기화" — 캠페인 취소/반려/삭제 + 완료기록(normalDoneProducts) 삭제, 재접수 가능하게.
    // 대상: status==='active'면 전부(bizfitDeducted 무관). 차감/메모 자동화는 안 함(사람이 처리).
    const resetCandidates = target.filter(s => s.status === 'active');
    const resetBtn = overlay.querySelector('#reset-submission-btn');
    if (resetCandidates.length) {
      resetBtn.style.display = '';
      resetBtn.onclick = async () => {
        if (!confirm(`${resetCandidates.length}건의 캠페인을 취소/삭제하고 접수 기록을 초기화합니다.`)) return;
        resetBtn.disabled = true; resetBtn.textContent = '초기화 중...';
        window.bizfitSubmitting = true; // 진행 중 팝업 닫기 방지(기존 가드 재사용)

        const byAgency = new Map(); // agencyId -> Set(mid)
        resetCandidates.forEach(s => {
          if (!s.mid) return;
          const ag = s.agencyId || '';
          if (!byAgency.has(ag)) byAgency.set(ag, new Set());
          byAgency.get(ag).add(s.mid);
        });

        const okMids = new Set();
        const errors = [];
        try {
          for (const [agencyId, midSet] of byAgency) {
            const account = await fetchBizfitAccount(agencyId);
            if (!account || !account.id || !account.pw) {
              errors.push(`${agencyId || '(대행사 미지정)'}: 비즈핏 계정 정보 없음`);
              continue;
            }
            try {
              const res = await callBizfitProxy('/cleanup-cancel', { loginId: account.id, pwd: account.pw, mids: [...midSet] });
              if (!res.success) { errors.push(`${agencyId}: ${res.message || '실패'}`); continue; }
              res.results.forEach(r => {
                if (r.success) okMids.add(r.mid);
                else errors.push(`${agencyId}/${r.mid}: ${r.message}`);
              });
            } catch (e) {
              errors.push(`${agencyId}: ${e.message}`);
            }
          }
          // 유입플 슬롯 환불(premiumset.shop) — 비즈핏 쪽이 진행중 등으로 막힌 mid는 아예 스킵.
          const okMidsForPremium = [...okMids];
          if (okMidsForPremium.length) {
            try {
              const premRes = await callBizfitProxy('/cleanup-youpfl-refund', { mids: okMidsForPremium });
              if (premRes.success) {
                premRes.results.forEach(r => { if (!r.success) { okMids.delete(r.mid); errors.push(`[유입플] ${r.mid}: ${r.message}`); } });
              } else {
                okMidsForPremium.forEach(m => okMids.delete(m));
                errors.push(`유입플 환불 요청 실패: ${premRes.message || ''}`);
              }
            } catch (e) {
              okMidsForPremium.forEach(m => okMids.delete(m));
              errors.push(`유입플 환불 요청 실패: ${e.message}`);
            }
          }
        } finally {
          window.bizfitSubmitting = false;
        }

        const resetSlots = resetCandidates.filter(s => okMids.has(s.mid));
        // bizfitDeducted는 안 건드림 — 차감/메모 정산은 사람이 처리(자동화 안 함). status만 accepted로 복귀.
        const clearFields = { status: 'accepted', normalDoneProducts: null, fixedSubmitted: null, splitFixedSubmitted: null };
        await Promise.all(resetSlots.map(s => HA.updateSlot(s._key, clearFields)));
        resetSlots.forEach(s => updateLocalSlot(s._key, clearFields));

        overlay.remove();
        renderReceipts(false);
        alert(`초기화 완료: ${resetSlots.length}건` + (errors.length ? `\n실패:\n${errors.join('\n')}` : ''));
      };
    }

    const submitBodyEl = overlay.querySelector('#submit-body');
    const csubBodyEl   = overlay.querySelector('#csub-body');
    const bsubBodyEl   = overlay.querySelector('#bsub-body');
    const youpflBodyEl = overlay.querySelector('#youpfl-body');
    const submitApplyBtn = overlay.querySelector('#submit-apply-btn');
    const csubApplyBtn   = overlay.querySelector('#csub-apply-btn');
    const bsubApplyBtn   = overlay.querySelector('#bsub-apply-btn');
    const youpflApplyBtn = overlay.querySelector('#youpfl-apply-btn');

    // 탭 버튼 disabled/노출 상태 갱신 — keepTab이 갱신 후에도 여전히 존재하면 유지, 아니면 새 defaultTab으로.
    function applyTabState(keepTab) {
      overlay.querySelector('#stab-normal').disabled = !data.hasNormal;
      overlay.querySelector('#stab-fixed').style.display   = data.hasFixed   ? '' : 'none';
      overlay.querySelector('#stab-charlie').style.display = data.hasCharlie ? '' : 'none';
      overlay.querySelector('#stab-blog').style.display    = (data.hasDelta||data.hasNavy) ? '' : 'none';
      const avail = { normal: data.hasNormal, fixed: data.hasFixed, charlie: data.hasCharlie, blog: data.hasDelta||data.hasNavy };
      window.switchSubmitTab((keepTab && avail[keepTab]) ? keepTab : data.defaultTab);
    }
    // 재계산마다 재사용되는 버튼을 매번 초기 상태(활성화·기본 문구·원래 색)로 되돌려둔 뒤 wireSubmitTab 등이 다시 채움
    function resetApplyBtn(btn, bg) {
      btn.disabled = false; btn.title = ''; btn.textContent = '접수 신청';
      btn.style.background = bg; btn.style.cursor = 'pointer'; btn.onclick = null;
    }

    // 탭 본문(plan/rows에 의존하는 부분)만 다시 그림 — 모달 뼈대(overlay/탭바)는 그대로 두고 데이터만 갱신할 때 재호출.
    function fillBody() {
      submitBodyEl.innerHTML = ''; csubBodyEl.innerHTML = ''; bsubBodyEl.innerHTML = ''; youpflBodyEl.innerHTML = '';
      resetApplyBtn(submitApplyBtn, '#16a34a');
      resetApplyBtn(csubApplyBtn,   '#d946ef');
      resetApplyBtn(bsubApplyBtn,   '#22c55e');
      resetApplyBtn(youpflApplyBtn, '#f59e0b');

      // 일반/유입플/찰리 2개 이상 동시 활성 시 승인 게이트 — "탭 전체 완료"가 아닌 슬롯별로 "그 슬롯이 쓰는 레그들만" 다 끝나면 바로 승인
      // (requiredLegsByKey로 계산). 탭 전체 완료를 기준으로 하면 유입플만 쓰는 슬롯은 영원히 승인되지 않는다.
      // 재계산 시점에 이전에 이미 완료된 탭은 저장된 플래그로 미리 채움(일반/찰리는 모든 상품행 완료 시에만 "이미 완료")
      const rowsBySlotOf = rows => {
        const m = new Map();
        rows.forEach(r => { if (!r._slotKey) return; if (!m.has(r._slotKey)) m.set(r._slotKey, []); m.get(r._slotKey).push(r); });
        return m;
      };
      const alreadyDoneOf = (rowsBySlot, doneField) => new Set(
        [...rowsBySlot.entries()].filter(([, rs]) => rs.every(r => r[doneField])).map(([k]) => k)
      );
      const normalAlreadyDone  = alreadyDoneOf(rowsBySlotOf(data.normalPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const charlieAlreadyDone = alreadyDoneOf(rowsBySlotOf(data.charliePlan.flatMap(p => p.rows)), '_normalSubmitted');
      const deltaAlreadyDone   = alreadyDoneOf(rowsBySlotOf(data.deltaPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const navyAlreadyDone    = alreadyDoneOf(rowsBySlotOf(data.navyPlan.flatMap(p => p.rows)), '_normalSubmitted');
      const fixedAlreadyDone   = alreadyDoneOf(rowsBySlotOf(data.yupflRows), '_fixedSubmitted');

      // 슬롯별로 실제 쓰는 레그 집합 — rows에 그 슬롯(_slotKey)이 등장하는지로 판단
      const requiredLegsByKey = new Map(); // slotKey -> Set('normalKeys'|'fixedKeys'|'charlieKeys'|'deltaKeys'|'navyKeys')
      const addRequired = (rows, leg) => rows.forEach(r => {
        if (!r._slotKey) return;
        if (!requiredLegsByKey.has(r._slotKey)) requiredLegsByKey.set(r._slotKey, new Set());
        requiredLegsByKey.get(r._slotKey).add(leg);
      });
      addRequired(data.normalPlan.flatMap(p => p.rows), 'normalKeys');
      addRequired(data.charliePlan.flatMap(p => p.rows), 'charlieKeys');
      addRequired(data.deltaPlan.flatMap(p => p.rows), 'deltaKeys');
      addRequired(data.navyPlan.flatMap(p => p.rows), 'navyKeys');
      addRequired(data.yupflRows, 'fixedKeys');

      // 게이트 유무와 상관없이 쓰는 판정 — doneSets를 받아 슬롯이 필요 레그를 전부 채웠는지로 승인 대상을 고름(조회 전용, 실행 안 함)
      const slotMapAll = new Map(allSlots.map(s => [s._key, s]));
      function readyKeysOf(doneSets) {
        return [...requiredLegsByKey.entries()]
          .filter(([k, req]) => slotMapAll.get(k)?.status !== 'active'
            && [...req].every(leg => doneSets[leg] && doneSets[leg].has(k)))
          .map(([k]) => k);
      }

      // 다 완료된 슬롯은 승인(상태 전환)만 창 열자마자 자동 처리 — 차감(실제 돈)은 자동 시도 안 하고 배너 "재시도"로만 실행.
      // 탭 버튼은 렌더 시점 스냅샷이라 비동기 완료를 자동 반영 못 하므로 승인 끝나는 즉시 여기서 잠금.
      const legHas = { normalKeys: data.hasNormal, fixedKeys: data.hasFixed, charlieKeys: data.hasCharlie, deltaKeys: data.hasDelta, navyKeys: data.hasNavy };
      function lockDoneButtons() {
        Object.entries(LEG_BTN_SEL).forEach(([leg, sel]) => {
          if (!legHas[leg]) return;
          const btn = overlay.querySelector(sel);
          if (btn && !btn.disabled && target.every(s => s.status === 'active')) markApplyBtnDone(btn);
        });
      }

      const activeLegs = [];
      if (data.hasNormal)  activeLegs.push('normalKeys');
      if (data.hasFixed)   activeLegs.push('fixedKeys');
      if (data.hasCharlie) activeLegs.push('charlieKeys');
      if (data.hasDelta)   activeLegs.push('deltaKeys');
      if (data.hasNavy)    activeLegs.push('navyKeys');
      const gate = (activeLegs.length > 1) ? {
        normalKeys:  normalAlreadyDone.size  ? normalAlreadyDone  : null,
        fixedKeys:   fixedAlreadyDone.size   ? fixedAlreadyDone   : null,
        charlieKeys: charlieAlreadyDone.size ? charlieAlreadyDone : null,
        deltaKeys:   deltaAlreadyDone.size   ? deltaAlreadyDone   : null,
        navyKeys:    navyAlreadyDone.size    ? navyAlreadyDone    : null,
        slotMap: slotMapAll,
        async tryApprove() {
          const keys = readyKeysOf(this);
          // normalDoneProducts/fixedSubmitted는 접수 완료 이력이므로 승인 후에도 계속 보관(삭제하지 않음)
          if (keys.length) {
            const failed = await approveSlotsWithBizfit(keys, this.slotMap);
            if (failed.length) { overlay._deductFailures.push(...failed); overlay._renderDeductFailures(); }
          }
          renderReceipts(false);
          lockDoneButtons();
        }
      } : null;

      // 시간대 분할 예약은 서버가 승인 게이트를 모르므로, 예약 그룹이 끝나면 곧장 승인해도 안전한 경우에만
      // 허용한다 — 일반/찰리/델타/네이비 중 2개 이상이 동시에 필요(진짜 다중 register-leg)하면 막고,
      // 유입플(fixedKeys)이 필요한데 아직 완료 전이어도 막는다(사람이 유입플 탭에서 접수를 먼저 완료해야 풀림).
      const registerLegs = activeLegs.filter(l => l !== 'fixedKeys');
      const yupflPending = data.hasFixed && !(data.yupflRows.length && data.yupflRows.every(r => r._fixedSubmitted));
      const scheduleBlocked = registerLegs.length > 1 || yupflPending;
      const scheduleBtn = overlay.querySelector('#schedule-toggle-btn');
      if (scheduleBtn) {
        scheduleBtn.disabled = scheduleBlocked;
        scheduleBtn.style.opacity = scheduleBlocked ? '0.4' : '1';
        scheduleBtn.style.cursor = scheduleBlocked ? 'not-allowed' : 'pointer';
        scheduleBtn.title = registerLegs.length > 1
          ? '일반/찰리/델타/네이비 중 2개 이상이 동시에 필요한 슬롯이 섞여 있어 시간대 분할 예약을 쓸 수 없습니다'
          : yupflPending
            ? '유입플 탭에서 접수를 먼저 완료해야 시간대 분할 예약을 쓸 수 있습니다'
            : '';
        if (scheduleBlocked && scheduleConfig) window.clearScheduleConfig();
      }

      // 팝업 여는 시점 스냅샷으로 딱 한 번 판단 — 이후 실제 클릭(gate.tryApprove 등)에서 갱신되는
      // 완료 집합은 그 클릭 흐름이 알아서 처리하므로 여기서 다시 계산할 필요 없음.
      const initialReady = readyKeysOf({ normalKeys: normalAlreadyDone, fixedKeys: fixedAlreadyDone, charlieKeys: charlieAlreadyDone, deltaKeys: deltaAlreadyDone, navyKeys: navyAlreadyDone });
      if (initialReady.length) {
        // 자동 승인 도는 틈에 관리자가 같은 레그 "접수 신청"을 누르면 이중 차감 가능 — 처리 끝날 때까지 그 레그 버튼만 잠금
        const legsInvolved = new Set();
        initialReady.forEach(k => (requiredLegsByKey.get(k) || []).forEach(leg => legsInvolved.add(leg)));
        legsInvolved.forEach(leg => {
          const btn = overlay.querySelector(LEG_BTN_SEL[leg]);
          if (btn && !btn.disabled) { btn.disabled = true; btn.textContent = '⏳ 처리 중...'; btn.dataset.autoLocking = '1'; }
        });
        approveReadySlots(initialReady, slotMapAll).then(pending => {
          if (pending.length) { overlay._deductFailures.push(...pending); overlay._renderDeductFailures(); }
          renderReceipts(false);
          lockDoneButtons();
          // 위에서 잠근 버튼이 lockDoneButtons로도 "완료" 처리 안 됐다면(같은 탭에 아직 안 끝난
          // 다른 슬롯이 남은 경우) 원래대로 눌러야 하는 상태로 복구한다.
          legsInvolved.forEach(leg => {
            const btn = overlay.querySelector(LEG_BTN_SEL[leg]);
            if (btn && btn.dataset.autoLocking) {
              delete btn.dataset.autoLocking;
              if (btn.disabled && btn.textContent === '⏳ 처리 중...') { btn.disabled = false; btn.textContent = '접수 신청'; }
            }
          });
        });
      }

      // 일반 탭 구성
      wireSubmitTab({
        has: data.hasNormal, plan: data.normalPlan, target,
        bodyEl: submitBodyEl,
        subEl:  overlay.querySelector('#submit-sub'),
        applyBtn: submitApplyBtn,
        label: '일반 상품',
        onSubmit: () => executeSubmit(data.normalPlan, overlay, gate, 'normalKeys', null),
      });

      // 고정 탭 구성
      if (data.hasFixed) {
        const yupflAgencies = [...new Set(data.yupflRows.map(r => r.agencyId))];
        yupflAgencies.forEach(ag => {
          const agRows = data.yupflRows.filter(r => r.agencyId === ag);
          const block = buildYoupflTableBlock(agRows, ag);
          if (block) youpflBodyEl.appendChild(block);
        });
        const totalTarget = data.yupflRows.reduce((a,r) => a+(r.target||0)*(r.days||0), 0);
        overlay.querySelector('#youpfl-sub').innerHTML =
          `<span style="color:var(--muted)">대행사 ${yupflAgencies.length}곳 · 유입플 ${data.yupflRows.length}건 · 목표 합계 ${totalTarget.toLocaleString()}</span>`;
        // 이 탭 행이 전부 이미 완료(_fixedSubmitted)면 슬롯이 active 아니어도 완료로 표시.
        if (target.every(s => s.status === 'active') || (data.yupflRows.length && data.yupflRows.every(r => r._fixedSubmitted))) {
          markApplyBtnDone(youpflApplyBtn);
        } else if (validateYoupflRowsForSubmit(data.yupflRows)) {
          youpflApplyBtn.disabled = true;
          youpflApplyBtn.title = '오류가 있는 항목을 먼저 수정해주세요';
          youpflApplyBtn.style.background = '#9ca3af'; youpflApplyBtn.style.cursor = 'not-allowed';
        } else {
          youpflApplyBtn.onclick = () => executeYoupflSubmit(data.yupflRows, overlay, gate);
        }
      } else {
        overlay.querySelector('#youpfl-sub').textContent = '유입플 배분 대상 슬롯이 없습니다.';
        youpflApplyBtn.disabled = true;
      }

      // 찰리 탭 구성 — NP 위치저장(adrole=100) 전용, 일반 탭과 동일한 표/제출 로직을 재사용하되
      // grade-info/register 호출에 adrole을 강제 지정해 NP트래픽 등급과 절대 섞이지 않게 한다.
      wireSubmitTab({
        has: data.hasCharlie, plan: data.charliePlan, target,
        bodyEl: csubBodyEl,
        subEl:  overlay.querySelector('#csub-sub'),
        applyBtn: csubApplyBtn,
        label: '찰리', daysMultiplied: true,
        emptyMsg: '찰리 배분 대상 슬롯이 없습니다.',
        onSubmit: () => executeSubmit(data.charliePlan, overlay, gate, 'charlieKeys', CHARLIE_ADROLE),
      });

      // 블로그 탭 구성 — 델타(NP 위치저장)+네이비(NP트래픽)를 한 탭에 같이 표시, 접수는 executeBlogSubmit이 각자 등급으로 나눠 처리.
      wireBlogSubmitTab({
        hasDelta: data.hasDelta, hasNavy: data.hasNavy, deltaPlan: data.deltaPlan, navyPlan: data.navyPlan, target,
        bodyEl: bsubBodyEl,
        subEl:  overlay.querySelector('#bsub-sub'),
        applyBtn: bsubApplyBtn,
        onSubmit: () => executeBlogSubmit(data.deltaPlan, data.navyPlan, overlay, gate),
      });
    }

    // 등급 자동매칭 토글 — 모달을 새로 열지 않고 데이터만 재계산해 탭 본문만 다시 채움
    const gmBtn  = overlay.querySelector('#grade-match-toggle');
    const gmIcon = overlay.querySelector('#grade-match-toggle-icon');
    if (gmBtn) gmBtn.onclick = () => {
      gradeMatchOn = !gradeMatchOn;
      if (gmIcon) gmIcon.style.background = gradeMatchOn ? '#16a34a' : '#94a3b8';
      const keepTab = ['normal','fixed','charlie','blog'].find(k => overlay.querySelector(`#stab-panel-${k}`)?.style.display === 'block');
      data = computeSubmitData(target);
      scheduleValidationRows = flattenScheduleRows(data);
      applyTabState(keepTab);
      fillBody();
    };

    // 블로그URL 일괄조회 — 블로그탭에 보이는 슬롯 중 블로그URL 미입력인 것만 골라 플레이스 URL에서
    // 자동조회(applyDeltaBlogUrls와 동일한 프록시)해 채움. 이미 값이 있는 슬롯은 건드리지 않고,
    // 조회 실패한 슬롯은 건너뛰고 마지막에 성공/실패 건수만 알림.
    const bsubBulkBtn = overlay.querySelector('#bsub-bulk-blogurl-btn');
    if (bsubBulkBtn) bsubBulkBtn.onclick = async () => {
      const rows = [...data.deltaPlan.flatMap(p => p.rows), ...data.navyPlan.flatMap(p => p.rows)];
      const slotKeys = [...new Set(rows.filter(r => r._requiresBlogUrl && !r.블로그URL).map(r => r._slotKey))];
      if (!slotKeys.length) { alert('블로그 URL 미입력 항목이 없습니다.'); return; }
      bsubBulkBtn.disabled = true; bsubBulkBtn.textContent = '조회 중...';
      let ok = 0, fail = 0;
      for (const key of slotKeys) {
        // target(모달이 연 시점의 스냅샷)에서 직접 찾아 그 객체를 그대로 고쳐야 computeSubmitData(target) 재계산에
        // 반영됨 — allSlots는 실시간 리스너가 child_changed 때 같은 인덱스를 새 객체로 통째로 교체해버려서
        // allSlots.find로 얻은 객체를 고쳐도 target 쪽엔 반영 안 되는 경우가 있었음.
        const s = target.find(x => x._key === key);
        if (!s || !s.url) { fail++; continue; }
        const splitProd = prods.find(p => p.id === 'delta' && p.active) || prods.find(p => p.id === 'navy' && p.active) || prods.find(p => p.id === 'delta');
        const n = Math.max(1, parseInt(splitProd?.blogSplit, 10) || 1);
        try {
          const res = await fetch(`${BLOG_TAG_SEARCH_PROXY}/place-blog?url=${encodeURIComponent(s.url)}&count=${n}`);
          const d = await res.json();
          if (!d.success || !d.urls || !d.urls.length) { fail++; continue; }
          const joined = d.urls.join(',');
          await HA.updateSlot(key, { deltaBlogUrl: joined });
          s.deltaBlogUrl = joined;
          const live = allSlots.find(x => x._key === key);
          if (live) live.deltaBlogUrl = joined;
          ok++;
        } catch (e) { fail++; }
      }
      bsubBulkBtn.disabled = false; bsubBulkBtn.textContent = '🔗 블로그URL 일괄조회';
      const keepTab = ['normal','fixed','charlie','blog'].find(k => overlay.querySelector(`#stab-panel-${k}`)?.style.display === 'block');
      data = computeSubmitData(target);
      scheduleValidationRows = flattenScheduleRows(data);
      applyTabState(keepTab);
      fillBody();
    };

    applyTabState(data.defaultTab);
    fillBody();

    overlay.querySelector('#submit-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.querySelector('#youpfl-close-btn').onclick = () => overlay.remove();
    overlay.querySelector('#csub-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.querySelector('#bsub-close-btn').onclick = () => { if (!window.bizfitSubmitting) overlay.remove(); };
    overlay.addEventListener('click', e => { if (e.target === overlay && !window.bizfitSubmitting) overlay.remove(); });
  }

  window.switchSubmitTab = function(tab) {
    ['normal','fixed','charlie','blog'].forEach(k => {
      const panel = document.getElementById(`stab-panel-${k}`);
      const btn   = document.getElementById(`stab-${k}`);
      if (panel) panel.style.display = k === tab ? 'block' : 'none';
      if (btn)   btn.classList.toggle('active', k === tab);
    });
  };

  // ── 시간대 분할 예약 편집기 (접수 확인 모달 상단, kimpro/reception.html과 동일 구현) ────────────
  let scheduleDraftRows = [{ time: '10:00', pct: 100 }];
  // "적용" 시점에 최소 수량 위반을 미리 막기 위한 검증 대상 행 — renderSubmitModal이 data를 계산/재계산할 때마다 갱신
  let scheduleValidationRows = [];
  function flattenScheduleRows(data) {
    return [...data.normalPlan, ...data.charliePlan, ...data.deltaPlan, ...data.navyPlan].flatMap(p => p.rows);
  }
  // schedule 시간을 각 행의 실제 예약일(row.예약일, 없으면 오늘) 기준 첫 회차(dayOffset 0)로 계산했을 때
  // 이미 지난 시각이 되는 조합을 찾음 — 예약일이 미래(예: 9/3)면 오늘 기준으로는 지난 시각이라도 유효하므로
  // "오늘"만 보고 일괄 차단하면 안 된다.
  function schedulePastViolations(rows, schedule) {
    const now = new Date();
    const violations = [];
    rows.forEach(r => {
      if (!(r.일목표 > 0)) return;
      schedule.forEach(s => {
        if (new Date(scheduleTimeToIso(s.time, r.예약일, 0)) <= now) {
          violations.push({ name: r.상품등급명, time: s.time, date: r.예약일 || scheduleDateForOffset() });
        }
      });
    });
    return violations;
  }

  // schedule 설정대로 쪼갰을 때 한 조각이라도 비즈핏 최소 수량(일반 10 / NP위치저장 100) 미만이 되는 행을 찾음 —
  // 접수 시점에 조용히 버려지는 대신(목표 미달) 여기서 미리 막는다.
  function scheduleMinViolations(rows, schedule) {
    const violations = [];
    rows.forEach(r => {
      if (!(r.일목표 > 0)) return;
      const min = r._daysMultiplied ? 100 : 10;
      const portions = lrm(schedule.map((s, i) => ({ id: i, ratio: s.pct })), r.일목표);
      schedule.forEach((s, i) => {
        const p = portions[i] || 0;
        if (p > 0 && p < min) violations.push({ name: r.상품등급명, time: s.time, portion: p, min });
      });
    });
    return violations;
  }

  // %만 바뀌었을 때(updateScheduleRow) 행 전체를 다시 그리면 입력 중인 포커스/커서가 끊기므로,
  // 합계 표시만 따로 갱신하는 헬퍼로 분리 — renderScheduleRows(행 추가/삭제 시)와 공유.
  function updateScheduleSumNote() {
    const sum = scheduleDraftRows.reduce((a,r) => a + (Number(r.pct)||0), 0);
    const note = document.getElementById('schedule-sum-note');
    if (note) { note.textContent = `합계 ${sum}%`; note.style.color = sum === 100 ? 'var(--accent)' : 'var(--danger)'; }
  }

  // <input type="time">의 네이티브 피커는 lang 속성이 아니라 브라우저/OS 언어를 따라가 크롬에선
  // ko-KR일 때 오전/오후로 뜬다(우회 불가) — 대신 시/분 select 두 개로 대체해 24시간 표기를 강제한다.
  function scheduleTimeSelectOptions(max, selected) {
    return Array.from({length: max}, (_, n) => String(n).padStart(2, '0'))
      .map(v => `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`).join('');
  }
  function renderScheduleRows() {
    const wrap = document.getElementById('schedule-rows');
    if (!wrap) return;
    const selStyle = 'padding:3px 4px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;';
    wrap.innerHTML = scheduleDraftRows.map((r, i) => {
      const [hh, mm] = (r.time || '10:00').split(':');
      return `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <select id="sch-hh-${i}" onchange="updateScheduleRow(${i},'time',this.value+':'+document.getElementById('sch-mm-${i}').value)" style="${selStyle}">${scheduleTimeSelectOptions(24, hh)}</select>
        :
        <select id="sch-mm-${i}" onchange="updateScheduleRow(${i},'time',document.getElementById('sch-hh-${i}').value+':'+this.value)" style="${selStyle}">${scheduleTimeSelectOptions(60, mm)}</select>
        <input type="number" min="1" max="100" value="${r.pct}" oninput="updateScheduleRow(${i},'pct',this.value)" style="width:56px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;">%
        ${scheduleDraftRows.length > 1 ? `<button type="button" onclick="removeScheduleRow(${i})" style="border:none;background:transparent;color:var(--danger);cursor:pointer;font-size:14px;">✕</button>` : ''}
      </div>`;
    }).join('');
    updateScheduleSumNote();
  }

  window.toggleScheduleEditor = function() {
    const panel = document.getElementById('schedule-editor');
    if (!panel) return;
    const show = panel.style.display === 'none';
    panel.style.display = show ? 'block' : 'none';
    if (show) renderScheduleRows();
  };

  window.addScheduleRow = function() {
    scheduleDraftRows.push({ time: '12:00', pct: 0 });
    renderScheduleRows();
  };

  window.removeScheduleRow = function(i) {
    scheduleDraftRows.splice(i, 1);
    renderScheduleRows();
  };

  window.updateScheduleRow = function(i, field, value) {
    scheduleDraftRows[i][field] = field === 'time' ? value : (Number(value) || 0);
    if (field === 'pct') updateScheduleSumNote();
  };

  window.applyScheduleConfig = function() {
    const sum = scheduleDraftRows.reduce((a,r) => a + (Number(r.pct)||0), 0);
    if (sum !== 100) { alert(`시간대 비율 합계는 100%여야 합니다. (현재 ${sum}%)`); return; }
    const pastViolations = schedulePastViolations(scheduleValidationRows, scheduleDraftRows);
    if (pastViolations.length) {
      const lines = pastViolations.slice(0, 5).map(v => `- ${v.name} ${v.date} ${v.time}`);
      if (pastViolations.length > 5) lines.push(`외 ${pastViolations.length - 5}건`);
      alert(`이미 지난 시각으로는 설정할 수 없습니다.\n${lines.join('\n')}`);
      return;
    }
    const violations = scheduleMinViolations(scheduleValidationRows, scheduleDraftRows);
    if (violations.length) {
      const lines = violations.slice(0, 5).map(v => `- ${v.name} ${v.time} → ${v.portion}개 (최소 ${v.min})`);
      if (violations.length > 5) lines.push(`외 ${violations.length - 5}건`);
      alert(`최소 수량 미만으로 쪼개져 적용할 수 없습니다. 시간 개수를 줄이거나 비율을 조정해주세요.\n${lines.join('\n')}`);
      return;
    }
    scheduleConfig = scheduleDraftRows.map(r => ({ time: r.time, pct: Number(r.pct)||0 }));
    const icon = document.getElementById('schedule-toggle-icon');
    if (icon) icon.style.background = '#f59e0b';
    alert(`시간대 분할 예약이 설정되었습니다. 이제 각 탭의 "접수 신청" 버튼을 누르면 즉시 전송 대신 예약 저장됩니다(일수만큼 매일 이 시각에 나눠 접수).`);
  };
