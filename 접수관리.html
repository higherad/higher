    prodGroups.forEach(g => { g.state = g.state.filter(s => s.id !== id); });
    if(activeProdGroupId) updateActiveProdGroup(); else { saveProdDefault(); saveProdSettings(); }
    renderPS();
  };

  // ── 분배 로직 ─────────────────────────────────────────────────

  function yupflAlloc(target, pct) { return Math.round(target * ((pct ?? 30) / 100)); }

  // 승인 시점에 차감 비율로 배분되는 수량/금액을 스냅샷으로 남겨 정산관리에서 조회 가능하게 함
  function deductFieldsFor(slot) {
    if (!slot) return {};
    const dp = ap().find(p => p.deductOnly);
    if (!dp) return {};
    const dTarget = yupflAlloc(slot.dailyTarget||0, dp.fixedPct);
    if (dTarget <= 0) return {};
    const unitPrice = (slot.unitPrice!=null && slot.unitPrice>0) ? slot.unitPrice : (userPriceMap.get(slot.userId)||0);
    const totalTarget = dTarget * (slot.days||0); // 전체 목표 차감(일수 반영) — buildNormalRows와 동일 기준으로 맞춰 차감 금액과 일치시킴
    // 재접수는 원 캠페인 승인 때 전체 기간 몫을 이미 캐시 차감함 — 수량은 같게 두고 금액만 0(이중 차감 방지)
    return { deductTarget: totalTarget, deductAmount: slot.isRequeue ? 0 : totalTarget * unitPrice };
  }


  // 승인 시점 유입플 분류 몫(일 목표)·금액을 캠페인에 고정 — 정산관리 유입플 금액 열·캐시 차감에 씀(allocRowsForSlot 배분 그대로)
  function yupflFieldsFor(slot) {
    if (!slot) return {};
    const yupfl = prods.find(p => p.classifyOnly);
    const target = yupfl ? allocRowsForSlot(slot).alloc[yupfl.id] || 0 : 0;  // 접수 배분과 같은 계산(가이드_접수면 가이드 비율)
    if (target <= 0) return { yupflTarget: 0 };  // 리워드만 — 0도 기록해야 일반·유입플로 나뉜 건(목록 분할 표시·엑셀·시트 분류)
    const yupflByVendor = vendorSplit(target, slot);
    // 유입플 금액(캐시 차감용) = 유입플 수량 × 일수 × 리워드 단가 — 광고주는 전체를 리워드 단가로 충전했고 비즈핏엔 리워드 몫만 등록돼
    // 유입플 몫만큼 캐시가 남으므로 그만큼 빼서 잔액을 맞춤(업체 실제 단가와 무관). 정산관리 유입플 열은 업체 단가로 따로 계산(HI.slotBill)
    const unitPrice = (slot.unitPrice!=null && slot.unitPrice>0) ? slot.unitPrice : (userPriceMap.get(slot.userId)||0);
    // 가이드_접수로 승인하면 수량이 있는 업체의 가이드 상품을 배지(vendorProducts)로 같이 기록
    const rule = guideModeOn && !slot.changeTo ? guideRuleFor(slot) : null;
    return { yupflTarget: target, yupflByVendor, yupflAmount: slot.isRequeue ? 0 : target * (slot.days||0) * unitPrice, ...(rule ? vendorProductFields(rule, yupflByVendor) : {}) };
  }
  // 수량 있는 업체마다 가이드 그 업체 탭 상품(짧은 이름) — vendorProducts {업체: [상품]}, 풀스택은 fullstackType에도(시트 분류 엑셀·풀스택 매크로)
  function vendorProductFields(rule, byVendor) {
    const vp = {};
    Object.entries(byVendor || {}).forEach(([v, n]) => {
      const list = rule.vendors?.[v] || [];
      if (n > 0 && list.length) vp[v] = [...list].sort((a, b) => fullRank(a.name) - fullRank(b.name)).map(p => shortFull(p.name));
    });
    return Object.keys(vp).length ? { vendorProducts: vp, ...(vp['풀스택'] ? { fullstackType: vp['풀스택'] } : {}) } : {};
  }

  // 승인·예약 때 캠페인에 고정하는 배분 값 전부(차감·유입플)
  const allocFieldsFor = s => withAutoRatio(s, { ...deductFieldsFor(s), ...yupflFieldsFor(s) });
  // 엑셀 비고 배지가 없는 캠페인은 나뉜 일 목표로 배지를 붙임 — 일반만 '리워드', 유입플만 업체명(여럿이면 '풀스택·제이엔'), 섞이면 일반%:유입플%.
  // auto = 표시용(배분은 noteRatio로 비고 배지만), 승인·예약 때마다 그때 배분으로 다시 계산, 승인 취소 때 지움
  function withAutoRatio(s, f) {
    if (!s || noteRatio(s) || f.yupflTarget == null) return f;
    const yup = f.yupflTarget, normal = Math.max(0, (s.dailyTarget || 0) - yup - Math.round((f.deductTarget || 0) / (s.days || 1)));
    if (!(normal + yup > 0)) return f;
    const vendors = Object.keys(f.yupflByVendor || {});
    const reward = Math.round(normal / (normal + yup) * 100);
    const r = !yup ? { reward: 100, yupfl: 0 }
      : !normal ? { reward: 0, yupfl: 100, ...(vendors.length ? { vendor: vendors.join('·') } : {}) }
      : { reward: Math.min(99, Math.max(1, reward)), yupfl: 100 - Math.min(99, Math.max(1, reward)) };
    return { ...f, yupflRatio: { ...r, auto: true } };
  }

  // 대행사(bizfitUid)당 여러 슬롯 차감을 합쳐 /bizfit-refund 한 번만 호출 — 슬롯마다 부르면 캐시사용내역이 승인 건수만큼 쪼개짐
  // 미매핑 대행사는 조용히 스킵. 실패해도 승인은 이미 끝났으므로 던지지 않고 boolean 반환(팝업 재시도 배너용)
  // 유입플 분류 몫의 비즈핏 캐시 차감·"[환불] 유입플 금액" 메모 — 풀스택 웹 접수(FULLSTACK_ON)와 같이 켜짐.
  // 켜지면 승인·예약·재시도 모두 유입플 금액(유입플 수량 × 일수 × 리워드 단가, 승인 때 고정한 yupflAmount)을 차감 몫과 합쳐 차감하고 메모에도 남김
  const YUPFL_CASH_DEDUCT = FULLSTACK_ON;
  async function settleBizfitCashBatch(bizfitUid, slots, deductAmount, yupflAmount, force = false) {
    if (!YUPFL_CASH_DEDUCT) yupflAmount = 0;
    const targets = slots.filter(s => s && !s.bizfitDeducted);
    if (!targets.length) return true;
    const amount = deductAmount + yupflAmount;
    if (amount <= 0) return true;
    // 다른 창/중복 호출이 이미 차감 중이면 건너뜀 — 그쪽 결과(성공/실패 표시)가 실시간으로 반영됨
    const keys = targets.map(s => s._key);
    if (!(await HI.claimBizfitDeduct(keys, force))) {
      console.warn('비즈핏 캐시 차감: 다른 창/요청이 이미 처리 중이라 건너뜀', keys);
      return true;
    }
    // bizfitDeductAttempted(레거시 슬롯 오탐 방지 마커)를 호출 전에 미리 쓰면 성공 케이스도 배지가 깜빡이므로
    // 성공 시 attempted+deducted를 한 번에, 실패 시만 attempted 단독으로 남긴다
    try {
      const res = await callBizfitProxy('/bizfit-refund', { uid: bizfitUid, amount });
      if (res && res.success) {
        await Promise.all(targets.map(s => HI.updateCampaign(s._key, { bizfitDeductAttempted: true, bizfitDeducted: true })));
        targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true, bizfitDeducted: true }));
        // 최근 입금완료 건에 "[환불] 차감 금액"·"[환불] 유입플 금액" 메모를 항목별로 누적 기록(서버가 합산) — 차감과 별개라 실패해도 콘솔에만 남김
        const agencyId = targets[0].agencyId;
        if (deductAmount > 0 || yupflAmount > 0) {
          callBizfitProxy('/bizfit-charge-memo', { company: agencyId, deductAmount, yupflAmount })
            .then(mres => { if (!mres || !mres.success) console.error('비즈핏 충전 메모 실패:', agencyId, mres && mres.message); })
            .catch(e => console.error('비즈핏 충전 메모 오류:', agencyId, e));
        }
        return true;
      }
      await Promise.all(targets.map(s => HI.updateCampaign(s._key, { bizfitDeductAttempted: true })));
      targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true }));
      await HI.releaseBizfitDeduct(keys); // 확실한 실패 — 재시도 가능하게 선점 해제
      console.error('비즈핏 캐시 차감 실패:', targets.map(s => s._key), bizfitUid, amount, res && res.message);
      return false;
    } catch (e) {
      // 결과 불명(타임아웃 등 — 서버는 차감했을 수 있음): 선점을 유지해 자동 재호출을 막고, 사람이 '재시도'로만 다시 차감
      await Promise.all(targets.map(s => HI.updateCampaign(s._key, { bizfitDeductAttempted: true })));
      targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true }));
      console.error('비즈핏 캐시 차감 오류:', targets.map(s => s._key), bizfitUid, amount, e);
      return false;
    }
  }

  // 단건 승인용 — 슬롯 1개짜리 배치로 취급해 settleBizfitCashBatch 재사용(매핑 없어 스킵한 경우도 true)
  async function settleBizfitCash(slot, fields, force = false) {
    if (!slot) return true;
    await userBizfitUidReady;
    const bizfitUid = userBizfitUidMap.get(slot.userId);
    if (!bizfitUid) return true;
    return await settleBizfitCashBatch(bizfitUid, [slot], fields.deductAmount || 0, fields.yupflAmount || 0, force);
  }

  // 승인됐지만 차감 시도(bizfitDeductAttempted)했다 실패한(!bizfitDeducted) 슬롯만 필터 — bizfitDeducted만 보면
  // 이 필드가 없는 레거시 active 슬롯까지 걸리므로 attempted를 같이 요구(레거시엔 이 필드 자체가 없음)
  function bizfitDeductPending(s) {
    return !!(s && s.status === 'active' && s.bizfitDeductAttempted && !s.bizfitDeducted);
  }

  window.retryBizfitDeduct = async function(key, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '재시도 중...'; }
    const slot = allSlots.find(s => s._key === key);
    if (!slot) return;
    // 다른 창에서 이미 성공했을 수 있으니 DB 최신값으로 한 번 더 확인 후 차감(재시도는 선점을 덮어씀).
    // 확인 조회가 제대로 안 되면 차감하지 않음 — 이미 차감된 건을 또 차감할 수 있음
    let fresh;
    try { fresh = (await HI.getCampaign(key)) || {}; }
    catch (e) {
      alert('차감 재시도를 중단했습니다.\n' + e.message);
      if (btn) { btn.disabled = false; btn.textContent = '⚠️ 차감 재시도'; }
      return;
    }
    if (fresh.bizfitDeducted) { updateLocalSlot(key, { bizfitDeducted: true }); renderReceipts(false); return; }
    await settleBizfitCash(slot, { deductAmount: slot.deductAmount || 0, yupflAmount: slot.yupflAmount || 0 }, true);
    renderReceipts(false);
  };

  // 슬롯별 차감 필드를 bizfitUid별로 묶어 반환(조회 전용) — approveReadySlots/initScheduledBatches 공용.
  // 이미 차감·매핑 없음·차감액 0인 건은 스킵.
  async function groupFieldsByBizfitUid(slots, fieldsBySlotKey) {
    await userBizfitUidReady;
    const byUid = new Map();
    for (const s of slots) {
      if (!s || s.bizfitDeducted) continue;
      const fields = fieldsBySlotKey.get(s._key);
      if (!fields) continue;
      const amount = (fields.deductAmount || 0) + (fields.yupflAmount || 0);
      if (amount <= 0) continue;
      const bizfitUid = userBizfitUidMap.get(s.userId);
      if (!bizfitUid) continue;
      if (!byUid.has(bizfitUid)) byUid.set(bizfitUid, { bizfitUid, slots: [], ded: 0, yup: 0 });
      const g = byUid.get(bizfitUid);
      g.slots.push(s);
      g.ded += fields.deductAmount || 0;
      g.yup += fields.yupflAmount || 0;
    }
    return [...byUid.values()];
  }

  // 슬롯 승인 확정(status→active) 후 남은 차감 대상을 대행사별로 묶어 반환(실행은 안 함, 조회 전용) —
  // 멀티레그 게이트 완료/단일완료/팝업 자동승인 전부 이 함수로 승인 처리 후 필요에 따라 차감 실행 또는 팝업 배너로 미룸
  async function approveReadySlots(keys, slotMap) {
    if (!keys.length) return [];
    await userBizfitUidReady; // 유입플 업체 단가(userById) 로드 후 금액 계산
    const fieldsByKey = new Map(keys.map(k => [k, allocFieldsFor(slotMap.get(k))]));
    await Promise.all(keys.map(k => HI.approve(k, fieldsByKey.get(k))));
    keys.forEach(k => { const s = slotMap.get(k); if (s) s.status = 'active'; });
    if (adlogAutoOn) await autoRegisterAdlog(keys.map(k => slotMap.get(k)));
    await autoStampSettlement(keys.map(k => slotMap.get(k) && { ...slotMap.get(k), ...fieldsByKey.get(k) }));
    return groupFieldsByBizfitUid(keys.map(k => slotMap.get(k)), fieldsByKey);
  }

  // 보류(scheduleHold) 캠페인의 모든 탭이 끝났을 때 — 예약 조각이 다 나갔으면(서버가 남긴 scheduleResult) 승인, 아직이면 '분할',
  // 전부 실패했으면 보류만 풀고 상태 유지(목록 ⚠️ 예약실패로 확인). 반환: 차감 실패 그룹
  // ponytail: 마지막 조각 완료와 이 처리 사이(1초 안쪽)가 겹치면 '분할'로 남을 수 있음 — 생기면 서버 완료 처리를 트랜잭션으로
  async function releaseScheduleHold(keys, slotMap) {
    const fresh = await Promise.all(keys.map(k => HI.getCampaign(k)));
    const toActive = [], toSplit = [];
    await Promise.all(keys.map(async (k, i) => {
      const c = fresh[i];
      if (!c?.scheduleHold) return;
      if (c.scheduleResult === 'active') toActive.push(k);
      else if (!c.scheduleResult) { toSplit.push(k); return; }
      await HI.updateCampaign(k, { scheduleHold: null, scheduleResult: null });
      updateLocalSlot(k, { scheduleHold: null, scheduleResult: null });
    }));
    return [...(toActive.length ? await approveSlotsWithBizfit(toActive, slotMap) : []), ...await markScheduledSplit(toSplit)];
  }
  // 모든 탭이 끝난 캠페인 — 보류 중인 분할 예약은 releaseScheduleHold, 나머지는 승인+차감
  async function finishReadySlots(keys, slotMap) {
    const held = keys.filter(k => slotMap.get(k)?.scheduleHold);
    const rest = keys.filter(k => !slotMap.get(k)?.scheduleHold);
    return [...(rest.length ? await approveSlotsWithBizfit(rest, slotMap) : []), ...(held.length ? await releaseScheduleHold(held, slotMap) : [])];
  }

  // 승인+차감 연속 실행 — 멀티레그 게이트/단일완료 3곳에서 공용. 승인·그룹핑은 approveReadySlots에 위임,
  // 차감은 그룹당 한 번만 호출. 실패한 그룹만 반환해 호출부가 팝업 재시도 배너에 넘김.
  async function approveSlotsWithBizfit(keys, slotMap) {
    const groups = await approveReadySlots(keys, slotMap);
    // await 없이 던지면 닫기 버튼이 차감 완료 전 활성화돼 요청이 취소될 수 있음 — 전부 끝난 뒤 resolve
    const results = await Promise.all(groups.map(async g => {
      const ok = await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup);
      return { ...g, ok };
    }));
    return results.filter(r => !r.ok).map(({ ok, ...g }) => g);
  }

  function lrm(items, total) {
    if (!items.length) return {};
    const totalW = items.reduce((s, p) => s + p.ratio, 0) || 1;
    const exact  = items.map(p => total * p.ratio / totalW);
    const floors = exact.map(v => Math.floor(v));
    const rems   = exact.map((v, i) => v - floors[i]);
    let leftover = total - floors.reduce((s, v) => s + v, 0);
    const order  = rems.map((_, i) => i).sort((a, b) => rems[b] - rems[a]);
    for (let i = 0; i < leftover; i++) floors[order[i]]++;
    return items.reduce((m, p, i) => (m[p.id] = floors[i], m), {});
  }

  // 고정 몫(차감·유입플 분류, fixedAlloc)을 먼저 떼고, 남은 걸 일반 상품끼리 비율로 나눈다.
  function allocate(asgn, target) {
    if (!asgn.length) return {};
    const fixedProds = asgn.filter(p => p.fixedAlloc);
    if (fixedProds.length) {
      // 차감은 배열 순서와 무관하게 최우선 적용 — 유입플 분류 %는 차감하고 남은 수량을 기준으로 계산한다
      const ordered = [...fixedProds.filter(p => p.deductOnly), ...fixedProds.filter(p => !p.deductOnly)];
      const result = {};
      let remaining = target;
      ordered.forEach(p => {
        const amt = Math.max(0, Math.min(yupflAlloc(remaining, p.fixedPct), remaining));
        result[p.id] = amt;
        remaining -= amt;
      });
      return { ...result, ...lrm(asgn.filter(p => !p.fixedAlloc), Math.max(0, remaining)) };
    }
    return lrm(asgn, target);
  }

  function kwForProd(keywords, prod) {
    if (!keywords) return '';
    const parts = keywords.split(',').map(k => k.trim()).filter(k => k);
    if (!parts.length) return '';
    const activeOthers = ap().filter(p => !p.fixedAlloc);
    const totalPct = activeOthers.reduce((s, p) => s + (p.kwPct || 0), 0);
    if (totalPct === 0) return parts.join(',');
    const counts = lrm(activeOthers.map(p => ({id: p.id, ratio: p.kwPct || 0})), parts.length);
    let offset = 0;
    for (const p of activeOthers) {
      if (p.id === prod.id) return parts.slice(offset, offset + (counts[p.id] || 0)).join(',');
      offset += counts[p.id] || 0;
    }
    return '';
  }

  // ── 가이드_접수 프리셋 ──────────────────────────────────────────
  // 켜면 캠페인마다 분류 × 일 목표 구간으로 구글시트 '접수 가이드'의 리워드 상품·비율(시트 분류와 같은 규칙)을 골라 그 상품들로 배분.
  // 변경 요청 상품(changeTo)이 있는 재접수는 그쪽이 우선, 분류·구간을 못 찾은 캠페인은 원래 방식(등급 매칭/상품 설정)으로.
  let guideModeOn = false, guideRules = [], guideCats = [], guideTimes = [];
  // 풀스텍 상품 순서(기본 → 둘러보고 나감 → 카톡 길찾기 → 카톡 공유, 그 밖은 뒤)와 배지용 짧은 이름 — 시트 분류·가이드_접수 공용
  const FULL_ORDER = ['기본', '둘러보고', '길찾기', '공유'];
  const fullRank = n => { const i = FULL_ORDER.findIndex(k => n.includes(k)); return i < 0 ? FULL_ORDER.length : i; };
  const shortFull = n => { const k = FULL_ORDER.find(k => n.includes(k)); return !k ? n : n.includes('카톡') && k !== '기본' && k !== '둘러보고' ? `카톡(${k})` : k; };
  const fullstackOf = rule => [...rule.full].sort((a, b) => fullRank(a.name) - fullRank(b.name)).map(p => shortFull(p.name));
  function guideRuleFor(r) {
    const cat = r.category || HI.kwCategoryOf(r.rankKeyword, guideCats);
    return cat ? pickGuideRule(guideRules, cat, r.dailyTarget || 0) : null;
  }
  function guideProdsFor(r) {
    const rule = guideRuleFor(r);
    if (!rule || !rule.reward.length) return [];
    const out = rule.reward.map(g => {
      const known = prods.find(p => p.name === g.name && !p.fixedAlloc);
      return known ? { ...known, ratio: g.ratio, kwPct: g.ratio }
        : { id: `grade_${g.name}`, name: g.name, color: '#94a3b8', ver: 'ver.5.0/3.2', ratio: g.ratio, kwPct: g.ratio, daysMultiplied: false };
    });
    // 리워드:유입플 = 엑셀 비고 비율, 없으면 50:50 고정('유입플' 상품 설정 켜짐·%는 무시) — 리워드 상품끼리는 가이드 비율
    return applyGuideRatio(out, noteRatio(r) || GUIDE_SPLIT);
  }
  // 리워드·유입플 두 묶음 합계를 주어진 비율로 맞춤 — 묶음 안 상품끼리 비율은 가이드 그대로
  const GUIDE_SPLIT = { reward: 50, yupfl: 50 };
  // 가이드_접수로 나눈 캠페인인지(유입플 몫은 전부 풀스택 — vendorSplit)
  const guideAllocOf = slot => guideModeOn && !(slot?.changeTo) && guideProdsFor(slot).length > 0;
  function applyGuideRatio(items, { reward, yupfl }) {
    const isY = p => p.classifyOnly;
    const rSum = items.filter(p => !isY(p)).reduce((a, p) => a + p.ratio, 0);
    let out = items.filter(p => isY(p) || reward > 0)
      .map(p => isY(p) ? { ...p, ratio: yupfl } : { ...p, ratio: p.ratio / rSum * reward, kwPct: p.ratio / rSum * reward });
    const y = prods.find(p => p.classifyOnly);
    if (yupfl > 0 && y && !out.some(isY)) out.push({ ...y, fixedAlloc: false, ratio: yupfl, kwPct: 0 });
    if (!(yupfl > 0)) out = out.filter(p => !isY(p));
    return out;
  }
  async function loadGuide() {
    const [{ sheets }, cats] = await Promise.all([HI.getGuideSheet(), HI.getKwCategories()]);
    guideRules = parseGuide(sheets || []);
    guideTimes = parseGuideTimes(sheets || []);
    guideCats = cats;
  }
  window.toggleGuidePreset = async function() {
    if (guideModeOn) { guideModeOn = false; renderPS(); return; }
    try { await loadGuide(); } catch (e) { alert('가이드를 불러오지 못했습니다: ' + e.message); return; }
    if (activeProdGroupId) deactivateProdGroup();
    guideModeOn = true; renderPS();
  };

  // ── MID의 기존 진행중 등급으로 접수(등급 자동매칭) ──────────────
  // 같은 MID의 진행 중 캠페인에 저장된 상품(gradeLabelsOf)이 있으면 상품 유형 설정 ratio 무시하고 그 상품(들)로만 접수.
  // 팝업 토글(기본 on) 끄면 상품 유형 설정값 그대로 배분.
  let gradeMatchOn = true;

  // 접수 확인 팝업 토글(기본 on) — 끄면 이 팝업발 승인(approveReadySlots)에서 애드로그 자동등록을 스킵.
  // 행 단위 단건 승인 버튼(approveOne)은 이 토글과 무관하게 항상 자동등록.
  let adlogAutoOn = true;


  // ── 시간대 분할 예약 접수 (kimpro와 동일 구현 + higher 전용 캐시차감 스냅샷) ──
  // /register 대신 schedule/dispatch에 페이로드만 저장, 서버가 지정 시각에 재생. 다중leg
  // 슬롯은 서버가 게이트를 모르므로 미지원(gate 있으면 토글 막음).
  let scheduleConfig = null; // null=끔, 아니면 [{time:'10:00', pct:34}, ...]

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }


  // baseDateStr 형식이 이상해도(자릿수 오류 등) new Date().toISOString()이 던지지 않게 오늘로 폴백 —
  // 호출부(submitPlanRowsScheduled)에 catch가 없어 던지면 "처리 중" 버튼이 영원히 안 풀림.
  function scheduleParseBaseDate(baseDateStr) {
    if (baseDateStr) {
      const d = new Date(`${String(baseDateStr).slice(0, 10)}T00:00:00`);
      if (!isNaN(d.getTime())) return d;
    }
    return new Date();
  }

  // "HH:MM" → baseDateStr+dayOffset일 그 시각의 ISO(브라우저 로컬=KST 가정) — 기준일 없으면 오늘,
  // "오늘"로 고정하면 미래 예약일이 잘못 계산된다.
  function scheduleTimeToIso(timeStr, baseDateStr, dayOffset = 0) {
    const [h, m] = (timeStr || '00:00').split(':').map(Number);
    const d = scheduleParseBaseDate(baseDateStr);
    d.setDate(d.getDate() + dayOffset);
    d.setHours(h || 0, m || 0, 0, 0);
    return d.toISOString();
  }

  // baseDateStr+dayOffset일의 로컬 날짜("YYYY-MM-DD") — 날짜분할 조각마다 예약일을 실제 접수일에 맞춤.
  function scheduleDateForOffset(baseDateStr, dayOffset = 0) {
    const d = scheduleParseBaseDate(baseDateStr);
    d.setDate(d.getDate() + dayOffset);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // 일목표를 schedule 비율로 쪼갠 뒤 일수(_days)만큼 하루 1건씩 반복 생성(비즈핏 자체 반복에 안 맡김).
  // daysMultiplied 상품(찰리/델타)은 "일수" 칸이 총목표라 그날 portionTotal 그대로 넣음(곱하지 않음).
  function splitRowBySchedule(row, schedule) {
    const portions = lrm(schedule.map((s, i) => ({ id: i, ratio: s.pct })), row.일목표 || 0);
    const minPortion = row._daysMultiplied ? 100 : 10; // 비즈핏 최소 수량 — NP위치저장은 전체목표 100, 그 외는 10
    const days = Math.max(1, row._days || 0);
    // 키워드 분할 켜져 있으면 검색키워드를 (일수×시간대 수)만큼 그룹 개수를 역산해 잘라 매일·매
    // 시간대 조합마다 하나씩 배정. 키워드가 필요 그룹 수보다 적으면 처음부터 순환 재사용.
    const neededGroups = schedule.length * days;
    const kwGroups = scheduleKwSplit
      ? chunkKeywords(row.검색키워드, Math.max(1, Math.ceil((row.검색키워드||'').split(',').filter(k=>k.trim()).length / neededGroups) || 1))
      : null;
    const out = [];
    // 예약일이 오늘이면 그날은 지난 시간대를 못 쓰니 나누지 않고 일목표 전체를 지금 바로 보냄(디스패처가 5분 안에 등록)
    const today = scheduleDateForOffset(null, 0);
    const isToday = d => scheduleDateForOffset(row.예약일, d) === today;
    if (isToday(0)) {
      const kwOverride = kwGroups && kwGroups.length ? { 검색키워드: kwGroups[0].slice(0,50).join(',') } : {};
      out.push({ ...row, ...kwOverride, 일목표: row.일목표, 일수: row._daysMultiplied ? row.일목표 : 1,
        예약일: today, _sendAt: new Date().toISOString() });
    }
    schedule.forEach((s, i) => {
      const portionTotal = portions[i] || 0;
      if (portionTotal < minPortion) return; // 최소값 미만이면 그 조각은 버림
      for (let d = isToday(0) ? 1 : 0; d < days; d++) {
        // 그룹 수가 적어 한 조각이 50개를 넘을 수 있어(예: 키워드 500개를 2그룹으로만 나누면 250개/조각)
        // 비즈핏 1회 등록 한도(50개)를 여기서 최종 방어 — kwGroups 자체는 원본 그대로 유지
        const kwOverride = kwGroups && kwGroups.length ? { 검색키워드: kwGroups[(i*days+d) % kwGroups.length].slice(0,50).join(',') } : {};
        out.push({
          ...row, ...kwOverride,
          일목표: portionTotal,
          일수: row._daysMultiplied ? portionTotal : 1,
          예약일: scheduleDateForOffset(row.예약일, d),
          _sendAt: scheduleTimeToIso(s.time, row.예약일, d),
        });
      }
    });
    return out;
  }

  async function saveScheduledDispatch(entry) {
    await HI.addScheduleDispatch(entry); // status 'pending'·createdAt은 hi-store가 채움
  }

  // 슬롯별 예약 조각 개수를 기록(서버가 그룹 완료 판정에 씀). 캐시차감은 그룹 완료를 안 기다리고
  // 예약 시점에 즉시 실행(status는 'split', 원래 상태는 preScheduleStatus 보관 — 'active' 전환은
  // 여전히 서버 디스패처가 실제 등록 완료 후). 반환: 차감 실패 그룹(호출부가 deduct-fail 배너에 반영).
  // holdKeys = 풀스택 탭이 아직 남은 캠페인 — 예약(조각)은 지금 저장하지만 상태·차감은 보류(scheduleHold),
  // 풀스택까지 끝나면 releaseScheduleHold가 '분할'(조각이 다 나갔으면 '승인')로 바꾸고 차감
  async function initScheduledBatches(slotKeyCounts, batchGroupId, holdKeys = new Set()) {
    const slotKeys = [...slotKeyCounts.keys()];
    await Promise.all(slotKeys.map(slotKey => HI.setScheduleBatch(slotKey, { total: slotKeyCounts.get(slotKey), batchGroupId })));
    const hold = slotKeys.filter(k => holdKeys.has(k));
    await Promise.all(hold.map(async k => { await HI.updateCampaign(k, { scheduleHold: true }); updateLocalSlot(k, { scheduleHold: true }); }));
    return markScheduledSplit(slotKeys.filter(k => !holdKeys.has(k)));
  }

  // 예약한 캠페인을 '분할'로 바꾸고(원래 상태는 preScheduleStatus) 배분 고정 + 캐시 차감. 반환: 차감 실패 그룹
  async function markScheduledSplit(slotKeys) {
    if (!slotKeys.length) return [];
    await userBizfitUidReady;
    const fieldsByKey = new Map();
    const slotsByKey = new Map(); // 이후 그룹핑에서 같은 slotKey로 allSlots를 다시 스캔하지 않도록 1회만 조회해 공유

    await Promise.all(slotKeys.map(async slotKey => {
      const s = allSlots.find(x => x._key === slotKey);
      slotsByKey.set(slotKey, s);
      const preStatus = s && s.status !== 'split' ? s.status : (s?.preScheduleStatus || 'pending');
      const fields = s ? allocFieldsFor(s) : {};
      fieldsByKey.set(slotKey, fields);
      const patch = { status: 'split', preScheduleStatus: preStatus, scheduleHold: null, scheduleResult: null, ...fields };
      await HI.updateCampaign(slotKey, patch);
      if (s) Object.assign(s, patch);
    }));

    // bizfitUid별 그룹핑은 approveReadySlots와 동일 로직 재사용(groupFieldsByBizfitUid) — 대행사별 차감은 서로
    // 독립이라 settleBizfitCashBatch가 순차일 이유 없음(approveSlotsWithBizfit과 동일하게 병렬)
    const groups = await groupFieldsByBizfitUid(slotKeys.map(k => slotsByKey.get(k)), fieldsByKey);
    const results = await Promise.all(groups.map(async g => ({ g, ok: await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup) })));
    return results.filter(r => !r.ok).map(r => r.g);
  }

  // 같은 MID에서 지금 진행 중(승인·분할)인 캠페인들에 저장된 상품 — 등급 자동매칭의 기준
  function gradeLabelsOf(mid) {
    return [...new Set(allSlots.filter(s => s.mid === mid && (s.status === 'active' || s.status === 'split')).flatMap(typeLabels))];
  }

  function matchedGradeProds(mid) {
    if (!mid) return [];
    return gradeProdsFromLabels(gradeLabelsOf(mid));
  }

  // 등급명 목록 → 배분용 상품(설정에 있는 상품이면 그 상품, 없으면 가상 상품) — MID 등급 매칭·변경 요청 상품 공용
  function gradeProdsFromLabels(labels) {
    if (!labels.length) return [];
    const seen = new Set();
    const result = [];
    labels.forEach(label => {
      if (seen.has(label)) return;
      seen.add(label);
      const known = prods.find(p => p.name === label && !p.fixedAlloc);
      result.push(known
        ? { ...known, ratio: 1, kwPct: 1 }
        : { id: `grade_${label}`, name: label, color: '#94a3b8', ver: 'ver.5.0/3.2', ratio: 1, kwPct: 1, daysMultiplied: false });
    });
    return result;
  }

  // buildNormalRows/buildDeltaRows가 공유하는 슬롯별 배분 — 매칭된 등급 있으면 고정 항목은 그대로
  // 두고 나머지만 균등분배, 없으면 기존 ratio 배분. 재접수는 변경 요청 상품(changeTo)이 있으면 그 상품, 없으면 매칭 안 함.
  function allocRowsForSlot(r) {
    // 엑셀 비고 비율(yupflRatio)이 있으면 유입플 분류 % 대신 그 비율(가이드_접수면 가이드 비율 대신)
    const R = noteRatio(r);
    const AP = !R ? ap() : (() => {
      const pct = R.yupfl / (R.reward + R.yupfl) * 100, y = prods.find(p => p.classifyOnly);
      const list = ap().map(p => p.classifyOnly ? { ...p, fixedPct: pct } : p);
      return y && !list.some(p => p.classifyOnly) ? [...list, { ...y, fixedPct: pct }] : list;
    })();
    // 변경 요청으로 생긴 재접수(changeTo)는 요청한 상품으로, 그 외 재접수는 매칭 안 함
    const changeTo = (r.changeTo || '').split('/').map(x => x.trim()).filter(Boolean);
    const guideProds = guideModeOn && !changeTo.length ? guideProdsFor(r) : [];
    const gradeProds = guideProds.length ? guideProds
      : !gradeMatchOn ? []
      : changeTo.length ? gradeProdsFromLabels(changeTo)
      : !r.isRequeue ? matchedGradeProds(r.mid) : [];
    if (!gradeProds.length) {
      return { alloc: allocate(AP.slice(), r.dailyTarget||0), prods: AP, gradeProds: null };
    }
    // 가이드는 유입플 분류를 비율 항목으로 넣으므로 고정 몫에서는 뺌(차감만 먼저)
    const asgn = [...AP.filter(p => p.fixedAlloc && !(guideProds.length && p.classifyOnly)), ...gradeProds];
    return { alloc: allocate(asgn, r.dailyTarget||0), prods: asgn, gradeProds };
  }

  // kwForProd와 동일한 largest-remainder 방식이지만, 전역 활성상품 kwPct 대신 매칭된 등급끼리 ratio대로(등급 매칭은 모두 1 = 균등, 가이드는 가이드 비율) 나눈다.
  function kwForGradeProd(keywords, prod, gradeProds) {
    if (!keywords) return '';
    const parts = keywords.split(',').map(k => k.trim()).filter(k => k);
    if (!parts.length) return '';
    const kwProds = gradeProds.filter(p => !p.classifyOnly);  // 유입플 분류는 등록 안 하므로 키워드 몫 없음
    const counts = lrm(kwProds.map(p => ({ id: p.id, ratio: p.ratio || 1 })), parts.length);
    let offset = 0;
    for (const p of kwProds) {
      if (p.id === prod.id) return parts.slice(offset, offset + (counts[p.id] || 0)).join(',');
      offset += counts[p.id] || 0;
    }
    return '';
  }

  // ── XLSX 헬퍼 ─────────────────────────────────────────────────

  function sc(ws, r, c, v, s) {
    if (v === undefined || v === null) return;
    s = s || {};
    const addr = window.XLSX.utils.encode_cell({r, c});
    ws[addr] = {
      t: typeof v === 'number' ? 'n' : 's', v,
      s: {
        font:      { name: '맑은 고딕', sz: 10, ...s.font },
        alignment: { horizontal: s.align || 'center', vertical: 'center', wrapText: false },
        ...(s.fill ? {fill:{fgColor:{rgb:s.fill},patternType:'solid'}} : {}),
        border: { top:{style:'thin',color:{rgb:'D0D0D0'}}, bottom:{style:'thin',color:{rgb:'D0D0D0'}}, left:{style:'thin',color:{rgb:'D0D0D0'}}, right:{style:'thin',color:{rgb:'D0D0D0'}} },
      },
    };
  }
  function scDate(ws, r, c, dateStr) {
    if (!dateStr) return;
    const [y, m, d] = String(dateStr).split('-').map(Number);
    const serial = Math.round((new Date(y, m-1, d) - new Date(1899, 11, 30)) / (86400 * 1000));
    const addr = window.XLSX.utils.encode_cell({r, c});
    ws[addr] = {
      t: 'n', v: serial, z: 'YYYY-MM-DD',
      s: {
        font: { name:'맑은 고딕', sz:10 }, alignment: { horizontal:'center', vertical:'center' }, numFmt:'YYYY-MM-DD',
        border: { top:{style:'thin',color:{rgb:'D0D0D0'}}, bottom:{style:'thin',color:{rgb:'D0D0D0'}}, left:{style:'thin',color:{rgb:'D0D0D0'}}, right:{style:'thin',color:{rgb:'D0D0D0'}} },
      },
    };
  }

  const agencyLabel = s => (s.agencyId||'').trim() || '(대행사 미지정)';
  function getAgencies(slots) {
    const seen = new Set(), list = [];
    slots.forEach(s => { const ag=agencyLabel(s); if(!seen.has(ag)){seen.add(ag);list.push(ag);} });
    return list;
  }
  function slotsByAgency(slots, ag) { return slots.filter(s => agencyLabel(s) === ag); }

  // ── 엑셀 다운로드 (접수 리스트) ────────────────────────────
  window.downloadExcelList = async function() {
    const btn = document.getElementById('dl-single-btn');
    if (btn?.disabled) return;
    const label = btn?.querySelector('span') || btn;
    const original = label ? label.textContent : '';
    if (btn) { btn.disabled = true; label.textContent = '다운로드 중...'; }
    try { await runExcelDownload(); }
    catch (e) { alert('엑셀 다운로드 실패: ' + e.message); }
    finally { if (btn) { btn.disabled = false; label.textContent = original; } }
  };

  async function runExcelDownload() {
    const checkedKeys = getCheckedKeys();
    // 선택 없이 목록 전체를 받을 땐 종료 30일+ 이전 기록까지 포함(공유 캐시 기본값엔 없음)
    if (!checkedKeys.length && !_withArchive) {
      await includeArchive();
      filteredAll = getFiltered();
    }
    const filtered = checkedKeys.length ? allSlots.filter(s => checkedKeys.includes(s._key)) : filteredAll;
    if (!filtered.length) return alert('다운로드할 데이터가 없습니다.');
    try { await HI.ensureKeywords(filtered); } catch (e) { return alert('키워드를 불러오지 못했습니다. 다시 시도해 주세요.\n' + e.message); }

    // 캠페인타입 = 목록 칸과 같은 값(저장된 상품 + 풀스텍 배지)
    const campaignType = s => [...typeLabels(s), ...fullstackLabels(s)].join(', ');

    async function buildAndDownload() {
      const XLSX = window.XLSX;
      const wb = XLSX.utils.book_new();
      const statusText = { pending:'대기', accepted:'접수', active:'승인', expired:'종료', split:'분할', requeue:'재접수', force_stopped:'강제종료' };
      // 일 목표를 하루 몫으로 나눔: 리워드 = 실제 접수한 수량(일반 몫), 유입플·차감 = 승인 때 고정한 값 — 목록의 일반·유입플·차감 줄과 같은 값
      const dedDaily = s => s.deductTarget ? Math.round(s.deductTarget / (s.days || 1)) : '';
      // 유입플·차감으로 나뉘지 않은 건(승인 전 등)은 리워드도 빈칸
      const rewardDaily = s => (s.yupflTarget != null || s.deductTarget) ? Math.max(0, (s.dailyTarget||0) - (s.yupflTarget||0) - (Number(dedDaily(s))||0)) : '';
      const header = ['접수일시','대행사','캠페인타입','업체명','URL','MID','순위키워드','분류','일 수','시작일','일 목표','리워드','유입플','차감','상태','검색키워드'];
      const rows = filtered.map(s => [
        s.createdAt ? ymd(new Date(s.createdAt)) : '',
        s.agencyId||'', campaignType(s), s.storeName||'', s.url||'', s.mid||'',
        s.rankKeyword||'', s.category||'', s.days||'', s.startDate||'', s.dailyTarget||'', rewardDaily(s), s.yupflTarget||'', dedDaily(s), statusText[s.status]||s.status||'-', s.searchKeyword||'',
      ]);
      const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
      ws['!cols'] = [{wch:12},{wch:16},{wch:18},{wch:22},{wch:48},{wch:14},{wch:14},{wch:8},{wch:6},{wch:12},{wch:10},{wch:10},{wch:8},{wch:8},{wch:8},{wch:20}];
      XLSX.utils.book_append_sheet(wb, ws, '접수');

      // MID별 검색키워드 히스토리(히스토리 모달과 같은 소스) — 같은 MID는 한 번만 조회
      const midRows = [...new Map(filtered.filter(s => s.mid).map(s => [s.mid, s])).values()];
      const histHeader = ['MID','업체명','날짜','키워드'];
      const kwHistRows = [];
      const kwHistories = await Promise.all(midRows.map(s => fullKeywordHistory(s.mid)));
      midRows.forEach((s, i) => {
        kwHistories[i].forEach(h => {
          kwHistRows.push([s.mid, s.storeName || '', h.createdAt ? ymd(new Date(h.createdAt)) : '', h.searchKeyword]);
        });
      });
      if (kwHistRows.length) {
        const kwHistWs = XLSX.utils.aoa_to_sheet([histHeader, ...kwHistRows]);
        kwHistWs['!cols'] = [{wch:14},{wch:22},{wch:12},{wch:40}];
        XLSX.utils.book_append_sheet(wb, kwHistWs, '검색키워드 히스토리');
      }

      const today = new Date();
      const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
      XLSX.writeFile(wb, `접수_${dateStr}.xlsx`);
    }

    if (!window.XLSX) await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('엑셀 라이브러리를 불러오지 못했습니다.'));
      document.head.appendChild(s);
    });
    await buildAndDownload();
  }

  // ── 대기 슬롯 히스토리 재접수 (같은 MID의 최근 N일 키워드 히스토리로 자동 접수) ──
  window.openReacceptModal = function() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="width:min(96vw,440px);">
        <div class="modal-title" style="display:flex;align-items:center;gap:6px;">🔁 대기 히스토리 재접수<span id="reaccept-help-btn" title="도움말" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--border);color:var(--text2);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;cursor:pointer;flex-shrink:0;position:relative;top:1px;">i</span></div>
        <div id="reaccept-help" style="display:none;font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:16px;">검색키워드가 ①일 이내 이력이 있으면 그 키워드로 채우고 접수로 전환합니다.</div>
        <div class="pmf" style="margin-bottom:12px;">
          <label>① 검색키워드 히스토리 검색 일자 (일)</label>
          <input type="number" id="reaccept-days-kw" value="7" min="1" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;">
        </div>
        <div id="reaccept-result" style="font-size:12px;margin-top:14px;"></div>
        <div class="modal-footer">
          <button class="btn-cancel" id="reaccept-close-btn">닫기</button>
          <button id="reaccept-run-btn" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">실행</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#reaccept-close-btn').onclick = () => { if (!window.reacceptRunning) overlay.remove(); };
    overlay.querySelector('#reaccept-run-btn').onclick = () => runReaccept(overlay);
    overlay.querySelector('#reaccept-help-btn').onclick = () => {
      const el = overlay.querySelector('#reaccept-help');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

  async function runReaccept(overlay) {
    const runBtn   = overlay.querySelector('#reaccept-run-btn');
    const closeBtn = overlay.querySelector('#reaccept-close-btn');
    const resultEl = overlay.querySelector('#reaccept-result');
    const daysKw = parseInt(overlay.querySelector('#reaccept-days-kw').value, 10);
    if (!Number.isInteger(daysKw) || daysKw < 1) {
      alert('검색키워드 히스토리 검색 일자를 1 이상의 숫자로 입력해주세요.');
      return;
    }

    const pending = allSlots.filter(s => s.status === 'pending' && s.mid);
    if (!pending.length) { resultEl.innerHTML = '<span style="color:var(--muted)">대기 상태인 슬롯이 없습니다.</span>'; return; }

    runBtn.disabled = true; runBtn.textContent = '⏳ 히스토리 조회 중...';
    closeBtn.disabled = true;
    window.reacceptRunning = true;
    resultEl.innerHTML = '';

    // 같은 MID는 한 번만 조회 (엑셀 다운로드의 키워드 히스토리 시트와 동일 방식)
    const uniqueMids = [...new Set(pending.map(s => s.mid))];
    const histMap = new Map();
    await Promise.all(uniqueMids.map(async mid => { histMap.set(mid, await fullKeywordHistory(mid)); }));

    const cutoffDayKw = ymd(new Date(Date.now() - daysKw * 24 * 3600 * 1000));
    const withinCutoff = (h, cutoffDay) => !!(h && h.createdAt && ymd(new Date(h.createdAt)) >= cutoffDay);
    // 히스토리 원본(과거 수기입력·외부연동 등)엔 "1, 2, 3"처럼 콤마 뒤 공백이 섞여있을 수 있어
    // 재접수로 새로 채우는 시점에 정규화 — "1,2,3" 형태로 고정
    const normKw = kw => (kw || '').split(',').map(k => k.trim()).filter(Boolean).join(',');
    const rows = pending.map(s => {
      const kwTop = (histMap.get(s.mid) || [])[0];
      const kwMatched = withinCutoff(kwTop, cutoffDayKw);
      return {
        slot: s,
        matched: kwMatched,
        newStatus: 'accepted',
        matchKeyword: kwMatched ? normKw(kwTop.searchKeyword) : '',
      };
    });
    const matched = rows.filter(r => r.matched);

    if (!matched.length) {
      resultEl.innerHTML = `<span style="color:var(--muted)">대기 ${pending.length}건 중 최근 ${daysKw}일 검색키워드 히스토리가 있는 건이 없습니다.</span>`;
      runBtn.disabled = false; runBtn.textContent = '실행';
      closeBtn.disabled = false;
      window.reacceptRunning = false;
      return;
    }

    if (!confirm(`대기 ${matched.length}건을 최근 검색키워드로 채우고 접수로 전환합니다. 계속할까요?`)) {
      runBtn.disabled = false; runBtn.textContent = '실행';
      closeBtn.disabled = false;
      window.reacceptRunning = false;
      return;
    }

    runBtn.textContent = `⏳ 처리 중... (0/${matched.length})`;
    let done = 0;
    for (const r of matched) {
      const updates = { searchKeyword: r.matchKeyword, status: r.newStatus };
      await HI.updateCampaign(r.slot._key, updates);
      updateLocalSlot(r.slot._key, updates);
      done++;
      runBtn.textContent = `⏳ 처리 중... (${done}/${matched.length})`;
    }
    renderReceipts(false);

    resultEl.innerHTML = `<span style="color:var(--accent);font-weight:600;">✅ 접수 전환 ${matched.length}건 처리 완료</span>`;
    runBtn.textContent = '✅ 완료'; runBtn.disabled = true;
    closeBtn.disabled = false;
    window.reacceptRunning = false;
  }

  // ── 엑셀 접수 (higher_user 포털 user-apply.html과 동일한 디자인/흐름으로 이식) ──
  let rexUsers    = [];
  let rexSelected = null;   // 선택된 영업점(대행사) — 단건/엑셀 공통으로 사용
  let rexRows     = [];
  let rexDropdownOpen = false;

  function rexFmt(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function rexNormalizeUrl(url) {
    const clean = String(url||'').split('?')[0].trim();
    const match = clean.match(/(https?:\/\/(?:m\.)?place\.naver\.com\/(?:restaurant|hospital|place|hairshop|nailshop|accommodation)\/\d+)/);
    return match ? match[1] : clean;
  }
  const REX_PLACE_URL_REGEX = /(?:place\.naver\.com|m\.place\.naver\.com)\/(?:restaurant|hospital|place|hairshop|nailshop|accommodation)\/([0-9]+)/;
  function rexExtractMid(url) {
    const m = rexNormalizeUrl(url).match(REX_PLACE_URL_REGEX);
    return m ? m[1] : '';
  }
  function rexNormalizeDate(value) {
    if (typeof value === 'number' && value > 0) {
      const d = new Date(Math.round((value - 25569) * 86400 * 1000));
      return Number.isNaN(d.getTime()) ? '' : rexFmt(d);
    }
    const raw = String(value||'').trim();
    if (!raw) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
    const nums = raw.replace(/[^\d]/g,'-').split('-').filter(Boolean);
    if (nums.length === 3) {
      let [y,m,d] = nums;
      if (y.length === 2) y = `20${y}`;
      if (y.length !== 4) return '';
      return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    if (nums.length === 2) {
      const y = String(new Date().getFullYear());
      const [m,d] = nums;
      return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    return '';
  }

  // ── 초성 검색(영업점 드롭다운용) — user-apply.html과 동일 ──
  const REX_CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function rexToChoseong(str) {
    return [...str].map(ch => {
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) return REX_CHOSEONG[Math.floor((code - 0xAC00) / 588)];
      return ch;
    }).join('');
  }
  function rexMatchSearch(target, q) {
    const t = target.toLowerCase();
    return t.includes(q) || rexToChoseong(t).includes(q);
  }

        <div id="rex-branch-list" class="rex-branch-list">

        </div>
      </div>`;
    document.body.appendChild(overlay);
    lucide.createIcons();

    const closeModal = () => overlay.remove();
    overlay.querySelector('#rex-close-btn').onclick = closeModal;
    overlay.querySelector('#rex-tab-single').onclick = () => rexSwitchTab(overlay, 'single');
    overlay.querySelector('#rex-tab-excel').onclick  = () => rexSwitchTab(overlay, 'excel');
    overlay.querySelector('#rex-s-submit-btn').onclick = () => rexSubmitSingle(overlay);

    const todayStr = rexFmt(new Date());
    overlay.querySelector('#rex-s-start').value = todayStr;

    // 영업점 검색 드롭다운
    const inputWrap  = overlay.querySelector('#rex-branch-input-wrap');
    const searchEl   = overlay.querySelector('#rex-branch-search');
    const clearBtn   = overlay.querySelector('#rex-branch-clear');

      }).join('');
      lucide.createIcons();
    }
    function openDropdown() {
      if (rexDropdownOpen) return;
      rexDropdownOpen = true;
      setFocusStyle(true);
      renderBranchList(searchEl.value);
      positionBranchList();
      listEl.style.display = 'block';
    }
    function closeDropdown() {
      rexDropdownOpen = false;
      listEl.style.display = 'none';
      setFocusStyle(false);
    }
    function selectBranch(username) {
      rexSelected = rexUsers.find(u => u.username === username) || null;
      closeDropdown();
      const infoEl = overlay.querySelector('#rex-branch-info');
      const infoText = overlay.querySelector('#rex-branch-info-text');
      if (rexSelected) {
        const label = rexSelected.agency || rexSelected.username;
        searchEl.value = `${label}  (${rexSelected.username})`;
        searchEl.style.color = 'var(--text)';
        clearBtn.style.display = 'block';
        infoEl.style.display = 'flex';
        infoText.textContent = `${label}(으)로 접수됩니다`;
      }
    }
    inputWrap.addEventListener('click', openDropdown);
    searchEl.addEventListener('focus', openDropdown);
    searchEl.addEventListener('input', () => renderBranchList(searchEl.value));
    clearBtn.addEventListener('click', e => {
      e.stopPropagation();
      rexSelected = null;
      searchEl.value = '';
      clearBtn.style.display = 'none';
      overlay.querySelector('#rex-branch-info').style.display = 'none';
      setFocusStyle(false);
    });
    listEl.addEventListener('click', e => {
      const opt = e.target.closest('.rex-branch-option');
      if (opt) selectBranch(opt.dataset.username);
    });
    overlay.addEventListener('click', e => {
      if (rexDropdownOpen && !inputWrap.contains(e.target) && !listEl.contains(e.target)) closeDropdown();
    });

    const zone = overlay.querySelector('#rex-zone');
    zone.addEventListener('click', () => overlay.querySelector('#rex-file').click());
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag');
      const f = e.dataTransfer.files[0];
      if (f) rexProcessExcel(overlay, f);
    });
  };

  function rexProcessExcel(overlay, file) {
    const reader = new FileReader();
    reader.onload = async e => {
      // 비고 업체명 판정용 유입플 업체 목록(가이드 시트 탭 이름, 저장값)
      const vendors = await HI.getGuideItems().then(x => x.vendors).catch(() => ['풀스택']);
      try {
        const uploadTodayStr = rexFmt(new Date());
        const wb = XLSX.read(e.target.result, { type:'array', cellDates:false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        // 서식만 적용된 빈 셀 때문에 !ref가 A1:N1048576처럼 부풀려질 수 있음 — defval:''로 100만 행을
        // 순회하면 그것만으로 몇 초씩 걸려 멈춘 것처럼 보임. 범위를 넉넉히 잘라서 읽는다(user-apply.html과 동일).
        const MAX_EXCEL_ROWS = 5000;
        const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
        if (range.e.r > MAX_EXCEL_ROWS) range.e.r = MAX_EXCEL_ROWS;
        const raw = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range });
        if (!raw.length) { alert('빈 파일입니다.'); return; }

        // 컬럼 위치를 고정 순서 대신 첫 행(헤더) 텍스트로 자동 인식 — 줄바꿈/공백/예시문구가 섞여도
        // 공백류를 지우고 부분일치로 찾음(user-apply.html과 동일 방식)
        const hdr = raw[0].map(h => String(h||'').replace(/\s+/g, ''));
        const storeCol  = hdr.findIndex(h => /업체명|상호명/.test(h));
        const urlCol    = hdr.findIndex(h => /url/i.test(h));
        const midCol    = hdr.findIndex(h => /mid|pid/i.test(h));
        const kwCol     = hdr.findIndex(h => /키워드/.test(h));
        const daysCol   = hdr.findIndex(h => /일수/.test(h));
        const targetCol = hdr.findIndex(h => /일목표/.test(h));
        const startCol  = hdr.findIndex(h => /시작일/.test(h));
        const noteCol   = hdr.findIndex(h => /비고/.test(h));  // 선택 — 리워드:유입플 비율(parseRatioNote)
        const missing = [];
        if (storeCol  < 0) missing.push('업체명/상호명');
        if (urlCol    < 0) missing.push('URL');
        if (midCol    < 0) missing.push('MID/PID');
        if (kwCol     < 0) missing.push('순위키워드');
        if (daysCol   < 0) missing.push('일 수');
        if (targetCol < 0) missing.push('일 목표');
        if (startCol  < 0) missing.push('시작일');
        if (missing.length) {
          alert(`엑셀 첫 행(헤더)에서 다음 항목을 찾을 수 없습니다: ${missing.join(', ')}\n헤더에 해당 항목명이 포함돼 있는지 확인해주세요.`);
          return;
        }

        const dataRows = raw.slice(1).filter(r => r[storeCol] || r[urlCol]);
        rexRows = dataRows.map(r => {
          const storeName    = String(r[storeCol] || '').trim();
          const url          = rexNormalizeUrl(r[urlCol]) || null;
          const mid          = String(r[midCol] ?? '').trim();
          const rankKeyword  = String(r[kwCol] ?? '').trim().replace(/\s+/g,'');
          const daysRaw      = String(r[daysCol] ?? '').trim();
          const days         = daysRaw !== '' ? Number(daysRaw) : null;
          const startDate    = rexNormalizeDate(r[startCol]) || null;
          const targetRaw    = String(r[targetCol] ?? '').trim();
          const dailyTarget  = targetRaw !== '' ? Number(targetRaw) : null;
          let endDate = null;
          if (startDate && days !== null && !isNaN(days) && days > 0) {
            const endD = new Date(startDate); endD.setDate(endD.getDate()+days-1); endDate = rexFmt(endD);
          }
          // 엑셀이 '50:50'을 시간(50시간 50분 = 일 단위 소수)으로 바꿔 저장한 경우 시:분으로 되돌림
          const noteRaw      = noteCol >= 0 ? r[noteCol] : '';
          const noteMin      = typeof noteRaw === 'number' && noteRaw > 0 && !Number.isInteger(noteRaw) ? Math.round(noteRaw * 1440) : null;
          const note         = noteMin != null ? `${Math.floor(noteMin / 60)}:${noteMin % 60}` : String(noteRaw ?? '').trim();
          const yupflRatio   = parseRatioNote(note, vendors);
          const errors = [];
          const urlMid = url ? rexExtractMid(url) : null;
          if (!storeName)       errors.push('업체명 누락');
          if (!url)             errors.push('URL 누락'); else if (!urlMid) errors.push('유효하지 않은 플레이스 주소');
          if (!rankKeyword)     errors.push('순위키워드 누락');
          if (days === null || isNaN(days) || days <= 0) errors.push('일 수 오류');
          else if (days >= 50)  errors.push('일 수 50 이상');
          if (!startDate)       errors.push('시작일 형식 오류');
          else if (startDate < uploadTodayStr) errors.push('오늘 이전 시작일');
          if (!mid)             errors.push('MID 누락');
          if (note && !yupflRatio) errors.push(`비고는 리워드/${vendors.join('/')}/비율(예 50:50)만`);
          if (mid && urlMid && mid !== urlMid) errors.push('URL MID와 입력 MID 불일치');
          if (dailyTarget === null || isNaN(dailyTarget) || dailyTarget < 10) errors.push('일 목표 오류(10 미만)');
          return { storeName, url, mid, rankKeyword, days, startDate, endDate, dailyTarget, note, yupflRatio, valid: errors.length===0, error: errors.join(' / ') };
        });
        HI.markDuplicateRows(rexRows);
        rexRenderPreview(overlay);
      } catch (err) {
        alert('파일을 읽는 중 오류가 발생했습니다. 양식을 확인해주세요.');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function rexRenderPreview(overlay) {

        <td style="color:var(--text2)">${escProd(r.mid)||'-'}</td>
        <td>${escProd(r.rankKeyword)||'-'}</td>
        <td style="color:var(--text2)">${r.days ?? '-'}</td>
        <td style="color:var(--text2)">${r.startDate||'-'}</td>
        <td style="color:var(--text2)">${r.dailyTarget!=null ? r.dailyTarget.toLocaleString() : '-'}</td>
        <td>${r.yupflRatio ? HI.ratioBadgeHtml(r.yupflRatio) : '-'}</td>
        <td>${r.valid ? '<span class="rex-row-status rex-row-ok">정상</span>' : `<span class="rex-row-status rex-row-err">${escProd(r.error)}</span>`}</td>
      </tr>`).join('');
    overlay.querySelector('#rex-zone').style.display = 'none';
    overlay.querySelector('#rex-preview').style.display = 'block';
    lucide.createIcons();
  }

  window.rexResetExcel = function(overlay) {
    rexRows = [];
    overlay.querySelector('#rex-file').value = '';
    overlay.querySelector('#rex-zone').style.display = 'block';
    overlay.querySelector('#rex-preview').style.display = 'none';

  async function rexSubmitExcel(overlay) {
    if (!rexSelected) { alert('영업점을 먼저 선택해주세요.'); return; }
    if (rexRows.some(r => !r.valid)) { alert('오류가 있는 행이 있습니다. 오류를 수정한 후 다시 업로드해주세요.'); return; }
    const validRows = rexRows.filter(r => r.valid);
    if (!validRows.length) { alert('접수 가능한 데이터가 없습니다.'); return; }
    const btn = overlay.querySelector('#rex-e-submit-btn');
    btn.disabled = true; btn.innerHTML = '처리 중...';
    const agencyId = rexSelected.agency || rexSelected.username;
    const userId   = rexSelected.username;

    // 행마다 HI.addCampaign이 RTDB 왕복이라 순차 대기면 건수만큼 지연이 쌓여 병렬로 한 번에 쏨. 병렬이면
    // 서버 완료 순서가 엑셀 행 순서와 달라지므로 행 인덱스로 어긋낸 createdAt을 미리 만들어 정렬 고정.
    const excelBaseTs = Date.now();
    const results = await Promise.allSettled(validRows.map((row, i) => HI.addCampaign({
      agencyId, userId,
      storeName: row.storeName, rankKeyword: row.rankKeyword, url: row.url, mid: row.mid,
      startDate: row.startDate, endDate: row.endDate, days: row.days, dailyTarget: row.dailyTarget, memo: '',
      ...(row.yupflRatio ? { yupflRatio: row.yupflRatio } : {}),
      createdAt: new Date(excelBaseTs + i).toISOString(),
    })));

    const succeededSlots = results.filter(r => r.status === 'fulfilled').map(r => r.value);
    if (succeededSlots.length) HI.notifyExcelBatch(succeededSlots).catch(() => {});
    renderReceipts(true, true);
    alert(`총 ${succeededSlots.length}건 접수 완료`);
    overlay.remove();
  }

  function downloadRexTemplate() {
    const wb = XLSX.utils.book_new();
    const todayStr = rexFmt(new Date());
    const ws = XLSX.utils.aoa_to_sheet([
      ['업체명','URL','MID','순위키워드','일 수','시작일','일 목표','비고'],
      ['예시: 테스트 맛집','https://m.place.naver.com/restaurant/123456789','123456789','강남 맛집',7,todayStr,1000,''],
    ]);
    ws['!cols'] = [{wch:20},{wch:50},{wch:13},{wch:18},{wch:8},{wch:12},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws, '접수');
    XLSX.writeFile(wb, '엑셀접수_양식.xlsx');
  }

  // ── 애드로그 대량등록 접수 (그룹/키워드/URL/메모) ────────────
  // 프론트(SheetJS) xlsx를 그대로 릴레이 — 서버에서 새로 생성한 xlsx(openpyxl 등)는 adlog.kr이 거부함(실측 확인)
  window.submitAdlog = function() {
    const checkedKeys = getCheckedKeys();
    const keySet = new Set(checkedKeys);
    // 체크박스로 직접 선택한 경우 — 승인(active)·대기(pending) 상태도 예외적으로 허용 (재등록 목적)
    const target = checkedKeys.length
      ? allSlots.filter(s => keySet.has(s._key) && (s.status === 'accepted' || s.status === 'active' || s.status === 'pending'))
      : filteredAll.filter(s => s.status === 'accepted');
    if (!target.length) { alert('접수 상태인 캠페인이 없습니다.\n(체크박스 선택시 승인/대기 항목도 등록 가능)'); return; }
    openAdlogModal(target);
  };

  // 애드로그 메모 기본값 — 상세보기에서 애드로그 메모칸을 비워둔 채 저장하면 이 값으로 채워짐(시작일 기준 "1test m/d")
  function defaultAdlogMemo(s) {
    if (!s.startDate) return '';
    const [, m, d] = s.startDate.split('-').map(Number);
    return `1test ${m}/${d}`;
  }

  function buildAdlogRows(slots) {
    return slots.map(s => {
      const memo = s.adlogMemo || defaultAdlogMemo(s);
      return { _slotKey: s._key, group: s.agencyId||'(대행사 미지정)', keyword: s.rankKeyword||'', mid: s.mid||'', memo, _statusTd: null };
    });
  }

  // ── 캠페인 타입 변경 요청 ─────────────────────────────────────
  // 신청은 진행현황(체크 후 변경 요청, 승인·예약 건만) → 여기선 등급 아래 빨간 배지·'변경' 카드 집계. 표시는 원 캠페인이 종료(closed)될
  // 때까지 유지 — 상태를 접수·대기로 바꾸거나 강제종료 당일이어도 그대로. 실제 강제종료는 사람이 직접 하고, 강제종료로 생기는
  // 재접수 캠페인이 요청 상품(changeTo)을 이어받아 빨간 배지·등급 매칭에 씀. 완료·취소 단계 없음. 광고주에겐 서버가 이 필드를 안 보냄
  const isTypeChangeReq = s => !!(s && s.changeRequest && !['expired','deleted'].includes(s.status));
  // 등급 배지 아래 빨간 배지 — 변경 요청 중인 원 캠페인, 그리고 요청 상품을 이어받은 재접수 캠페인(진행 중 상태 동안)
  const typeChangeTo = s => isTypeChangeReq(s) ? s.changeRequest.to
    : (s.changeTo && ['requeue','pending','accepted','active','split'].includes(s.status)) ? s.changeTo : '';
  function typeChangeLine(s) {
    const to = typeChangeTo(s);
    if (!to) return '';
    return `<div style="margin-top:3px;"><span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;" title="변경 요청 상품">${escProd(to)}</span></div>`;
  }
  // 상단 카드 클릭 = 상태 필터(분할 카드만 예약 분할 현황 팝업)
  window.filterByCard = function(status) {
    document.getElementById('filter-status').value = status;
    renderReceipts();
  };

  // ── 승인 시 정산 충전·입금 자동 도장 ─────────────────────────
  // 이 대행사 건은 승인(예약 신청 포함) 즉시 정산관리 충전·입금을 처리한 것으로 기록 — 실제 비즈핏 충전은 안 함,
  // 담당자 = 로그인 직원. 승인은 이미 끝난 뒤라 실패해도 막지 않고 알림만
  const AUTO_SETTLE_AGENCIES = new Set(['[단독]오렌지']);
  async function autoStampSettlement(slots) {
    const targets = (slots || []).filter(s => s && AUTO_SETTLE_AGENCIES.has(s.agencyId));
    if (!targets.length) return;
    try { await HI.stampChargeAndPaid(targets); }
    catch (e) {
      console.error('정산 자동 도장 실패:', e);
      alert('승인은 됐지만 [단독]오렌지 정산 충전·입금 자동 처리에 실패했습니다. 정산관리에서 직접 처리해 주세요.');
    }
  }

  // ── 접수(승인) 완료 시 애드로그 자동등록 ──────────────────────
  // 메모는 상세보기의 "애드로그" 전용 칸(s.adlogMemo) 사용. 이미 등록됐거나 키워드/MID 없는 슬롯,
  // 재접수(isRequeue, 이전 등록분 있다고 봄)는 건너뜀. 승인은 이미 끝난 뒤라 실패해도 로그만 남기고
  // 계속 진행 — 수동 "애드로그" 버튼으로 재시도 가능.
  async function autoRegisterAdlog(slots) {
    const targets = (slots||[]).filter(s => s && !s.adlogSubmitted && !s.isRequeue && s.rankKeyword && s.mid);
    if (!targets.length) return;
    const rows = buildAdlogRows(targets);
    try {
      for (let i = 0; i < rows.length; i += ADLOG_BATCH_SIZE) {
        const chunk = rows.slice(i, i + ADLOG_BATCH_SIZE);
        const fileBase64 = buildAdlogXlsxBase64(chunk);
        const result = await callBizfitProxy('/adlog-register', { fileBase64 });
        if (result.success) {
          const keys = chunk.map(r => r._slotKey);
          await Promise.all(keys.map(k => HI.updateCampaign(k, { adlogSubmitted: true })));
          keys.forEach(k => { const s = allSlots.find(x => x._key === k); if (s) s.adlogSubmitted = true; });
        } else {
          console.error('애드로그 자동등록 실패:', result.message);
        }
      }
    } catch (e) { console.error('애드로그 자동등록 오류:', e); }
  }

  // ag-table 스타일(비즈핏 접수 모달과 동일 클래스) — 대행사 열 포함 단일 테이블
  function buildAdlogTable(rows) {
    const block = document.createElement('div');
    block.className = 'agency-block';

    const ell = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0';
    const tbl = document.createElement('table');
    tbl.className = 'ag-table';
    tbl.style.cssText = 'table-layout:fixed;width:100%';
    tbl.innerHTML = `<thead><tr>
      <th style="width:120px">대행사</th>
      <th style="width:160px">순위키워드</th>
      <th style="width:140px">MID</th>
      <th style="width:110px">메모</th>
      <th style="width:76px;text-align:center">상태</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const statusTd = document.createElement('td');
      statusTd.style.cssText = 'text-align:center;white-space:nowrap';
      statusTd.textContent = '-';
      tr.innerHTML = `
        <td style="${ell};font-weight:700" title="${escProd(r.group)}">${escProd(r.group)}</td>
        <td style="${ell}" title="${escProd(r.keyword)}">${escProd(r.keyword||'-')}</td>
        <td style="${ell};font-size:11px;color:var(--text2)" title="${escProd(r.mid)}">${escProd(r.mid||'-')}</td>
        <td style="padding:2px 4px"><input type="text" value="${escProd(r.memo)}" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:4px;padding:3px 5px;font-size:12px;font-family:inherit;background:#fff;color:inherit"></td>
      `;
      tr.appendChild(statusTd);
      tbody.appendChild(tr);
      r._statusTd = statusTd;
      tr.querySelector('input').addEventListener('input', e => { r.memo = e.target.value; });
    });
    tbl.appendChild(tbody);
    block.appendChild(tbl);
    return block;
  }

  function buildAdlogXlsxBase64(rows) {
    const XLSX = window.XLSX;
    const header = ['그룹(띄어쓰기까지 일치해야됨)', '키워드(필수)', 'URL(필수)', '메모(미작성시 공란)'];
    const aoa = [header, ...rows.map(r => [r.group, r.keyword, r.mid, r.memo])];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:22},{wch:20},{wch:20},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws, '대량등록');
    const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const bytes = new Uint8Array(arr);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  const ADLOG_BATCH_SIZE = 100; // adlog.kr 대량등록 1회 최대 100건 제한

  async function executeAdlogSubmit(rows, overlay) {
    const applyBtn = overlay.querySelector('#adlog-apply-btn');
    const closeBtn = overlay.querySelector('#adlog-close-btn');
    const subEl    = overlay.querySelector('#adlog-sub');
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 등록 중...'; applyBtn.style.background = '#6b7280'; applyBtn.style.cursor = 'default';
    closeBtn.disabled = true;
    window.adlogSubmitting = true;

    async function run() {
      const chunks = [];
      for (let i = 0; i < rows.length; i += ADLOG_BATCH_SIZE) chunks.push(rows.slice(i, i + ADLOG_BATCH_SIZE));

      let totalCount = 0, totalRegistered = 0, hadFailure = false;
      const failMessages = [];
      const succeededSlotKeys = [];

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        if (chunks.length > 1) {
          applyBtn.textContent = `⏳ 등록 중... (${i+1}/${chunks.length}배치)`;
          subEl.innerHTML = `<span style="color:var(--muted)">배치 ${i+1}/${chunks.length} 전송 중 (${chunk.length}건)...</span>`;
        }

        let result;
        try {
          const fileBase64 = buildAdlogXlsxBase64(chunk);
          result = await callBizfitProxy('/adlog-register', { fileBase64 });
        } catch(e) {
          result = { success: false, message: '서버 호출 실패: ' + e.message };
        }

        if (result.success) {
          chunk.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; if (r._slotKey) succeededSlotKeys.push(r._slotKey); });
          totalCount      += (result.total ?? chunk.length);
          totalRegistered += (result.registered ?? chunk.length);
        } else {
          hadFailure = true;
          failMessages.push(result.message || '알 수 없는 오류');
          chunk.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(result.message||'')}">❌ 실패</span>`; });
        }
      }

      if (succeededSlotKeys.length) {
        // 목록에 배지 표시용 — 성공한 슬롯만 표시
        await Promise.all(succeededSlotKeys.map(k => HI.updateCampaign(k, { adlogSubmitted: true })));
        succeededSlotKeys.forEach(k => { const s = allSlots.find(x => x._key === k); if (s) s.adlogSubmitted = true; });
        renderReceipts(false);
      }

      if (!hadFailure) {
        const batchNote = chunks.length > 1 ? ` (${chunks.length}개 배치로 전송)` : '';
        subEl.innerHTML = `<span style="color:var(--accent);font-weight:600;">✅ 총${totalCount}개 중 ${totalRegistered}개 등록 되었습니다.${batchNote}</span>`;
        applyBtn.textContent = '✅ 등록 완료'; applyBtn.style.background = '#475569'; applyBtn.style.cursor = 'default';
      } else {
        subEl.innerHTML = `<span style="color:var(--danger);font-weight:600;">❌ 일부 배치 실패: ${escProd(failMessages.join(' / '))}</span>`;
        applyBtn.textContent = '❌ 등록 실패'; applyBtn.style.background = '#b91c1c'; applyBtn.style.cursor = 'default';
      }
      applyBtn.disabled = true;
      closeBtn.disabled = false;
      window.adlogSubmitting = false;
    }

    if (window.XLSX) { await run(); } else {
      await new Promise(resolve => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = resolve;
        document.head.appendChild(s);
      });
      await run();
    }
  }

  // ── 시트 분류: 구글시트 '접수 가이드'(탭 = 리워드 + 유입플 업체별, 분류 × 일 목표 구간 → 상품별 비율)로 캠페인마다 설정할 상품·% 엑셀
  // 탭마다 2행 헤더('총 타수'·'상품'·'비율' 쌍), 3행부터 데이터 · A열 구분은 병합이라 위 값을 이어 씀
  // → [{cat, range, min, max, reward:[{name,ratio}], vendors:{탭이름:[...]}, full: 풀스택 탭 상품}]
  function parseGuide(sheets) {
    const rewardTab = sheets.find(t => t.title.includes('리워드'));
    if (!rewardTab) throw new Error("가이드 시트에서 '리워드' 탭을 찾지 못했습니다.");
    const tabs = [rewardTab, ...sheets.filter(t => t !== rewardTab)].map(t => {
      const v = t.values || [], h = (v[1] || []).map(x => String(x).replace(/\s+/g, ''));
      return { title: t.title.trim(), v, rangeCol: h.indexOf('총타수'), prodCol: h.indexOf('상품') };
    });
    const ranged = tabs.find(t => t.rangeCol >= 0);
    if (!ranged) throw new Error("가이드 시트에서 '총 타수' 열이 있는 탭을 찾지 못했습니다.");
    const pairs = row => {
      const out = [];
      for (let c = 0; c + 1 < row.length; c += 2) {
        const name = String(row[c] ?? '').replace(/\s+/g, ' ').trim();
        const ratio = Number(row[c + 1]) || 0;
        if (name && ratio > 0) out.push({ name, ratio });
      }
      return out;
    };
    // ponytail: 탭끼리 같은 행 = 같은 분류·구간(리워드 탭엔 총 타수 열이 없어 행 위치로 맞춤) — 탭마다 행 순서가 달라지면 분류·구간 키로 매칭
    const of = (t, i) => t.prodCol < 0 ? [] : pairs((t.v[i] || []).slice(t.prodCol));
    const rules = [];
    let cat = '';
    ranged.v.forEach((row, i) => {
      if (i < 2) return;
      if (String(row[0] ?? '').trim()) cat = String(row[0]).trim();
      const range = String(row[ranged.rangeCol] ?? '').trim();
      const nums = (range.match(/\d+/g) || []).map(Number);
      if (!cat || !nums.length) return;
      const vendors = Object.fromEntries(tabs.slice(1).map(t => [t.title, of(t, i)]));
      rules.push({ cat, range, min: nums[0], max: range.includes('이상') || nums.length < 2 ? Infinity : nums[1],
        reward: of(tabs[0], i), vendors, full: vendors['풀스택'] || [] });
    });
    return rules;
  }
  // 리워드 탭 1행의 시간 분배(예: '시간 분배: 11:00(40%) / 17:30(60%)') → [{time:'11:00', pct:40}, ...]
  function parseGuideTimes(sheets) {
    const tab = sheets.find(t => t.title.includes('리워드'));
    const cell = String(((tab?.values || [])[0] || []).find(v => String(v).includes('시간')) || '');
    return [...cell.matchAll(/(\d{1,2}):(\d{2})\s*\(\s*(\d+)\s*%\s*\)/g)].map(m => ({ time: `${m[1].padStart(2, '0')}:${m[2]}`, pct: +m[3] }));
  }
  // 구간 사이 값(예: 10~99와 101 이상 사이의 100)은 바로 위 구간, 가장 낮은 구간보다 작으면 첫 구간
  function pickGuideRule(rules, cat, target) {
    const list = rules.filter(r => r.cat === cat).sort((a, b) => a.min - b.min);
    if (!list.length) return null;
    return list.find(r => target >= r.min && target <= r.max) || list.find(r => r.min > target) || list[list.length - 1];
  }

  window.downloadExcel = async function() {
    const checkedKeys = getCheckedKeys();
    const target = checkedKeys.length ? allSlots.filter(s => checkedKeys.includes(s._key)) : filteredAll;
    if (!target.length) { alert('다운로드할 데이터가 없습니다.'); return; }
    // 승인 때 리워드·유입플·차감으로 나뉜 건만 — 아직 안 나뉜 건이 섞여 있으면 받지 않음
    const unsplit = target.filter(s => s.yupflTarget == null && !s.deductTarget);
    if (unsplit.length) {
      const names = unsplit.slice(0, 5).map(s => `· ${s.storeName || s.mid}`).join('\n') + (unsplit.length > 5 ? `\n외 ${unsplit.length - 5}건` : '');
      alert(`승인 전 캠페인 ${unsplit.length}건이 있어요.\n승인된 캠페인만 체크해 주세요.\n\n${names}`);
      return;
    }
    const btn = document.getElementById('dl-main-btn');
    if (btn?.disabled) return;
    const original = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '다운로드 중...'; }
    try {
      const [{ sheets }] = await Promise.all([HI.getGuideSheet(), window.XLSX ? null : new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('엑셀 라이브러리를 불러오지 못했습니다.'));
        document.head.appendChild(s);
      })]);
      const rules = parseGuide(sheets || []);
      // 분류가 빈 캠페인(접수 뒤 키워드를 추가한 경우 등)은 지금 분류 설정으로 채워서 같이 저장
      const cats = await HI.getKwCategories();
      const fullNames = [...new Set(rules.flatMap(r => r.full.map(p => p.name)))].sort((a, b) => fullRank(a) - fullRank(b));
      const rewardNames = [...new Set(rules.flatMap(r => r.reward.map(p => p.name)))];
      const pct = (items, name) => { const it = items.find(p => p.name === name); return it ? `${Math.round(it.ratio * 100)}%` : ''; };
      // A~F 캠페인·분류·구간 → 리워드 하루 수량 + 리워드 상품 % → 유입플 하루 수량 + 풀스텍 상품 %(승인 때 나눈 값) → 일수·시작일(풀스텍 자동 접수 매크로가 씀)
      const header = ['대행사', '업체명', 'MID', '순위키워드', '분류', '구간',
        '리워드', ...rewardNames, '유입플', ...fullNames.map(shortFull), '일수', '시작일'];
      const typeUpdates = [];
      const rows = target.map(s => {
        const live = !['expired', 'deleted'].includes(s.status);
        const cat = s.category || HI.kwCategoryOf(s.rankKeyword, cats);
        const rule = cat ? pickGuideRule(rules, cat, s.dailyTarget || 0) : null;
        const fs = rule ? fullstackOf(rule) : [];
        const patch = {};
        if (live && cat && !s.category) patch.category = cat;
        if (live && fs.length && fs.join() !== fullstackLabels(s).join()) patch.fullstackType = fs;
        if (Object.keys(patch).length) typeUpdates.push([s, patch]);
        const ded = s.deductTarget ? Math.round(s.deductTarget / (s.days || 1)) : 0;
        const yup = s.yupflTarget || 0;
        const reward = Math.max(0, (s.dailyTarget || 0) - yup - ded);
        // 유입플 열 = 풀스텍 몫만(풀스텍 자동 접수 매크로가 이 수량으로 접수) — 업체 분할 전 캠페인은 유입플 전체
        const fsYup = s.yupflByVendor ? (s.yupflByVendor['풀스택'] || 0) : yup;
        return [s.agencyId || '', s.storeName || '', s.mid || '', s.rankKeyword || '', cat, rule ? rule.range : '',
          reward, ...rewardNames.map(n => rule ? pct(rule.reward, n) : ''), fsYup, ...fullNames.map(n => rule ? pct(rule.full, n) : ''),
          s.days || '', s.startDate || ''];
      });
      const XLSX = window.XLSX;
      const wb = XLSX.utils.book_new();
      // 가이드 탭은 구글시트 내용 그대로(비율 칸만 %로)
      (sheets || []).forEach(t => {
        const v = t.values || [], pc = (v[1] || []).findIndex(x => String(x).replace(/\s+/g, '') === '상품');
        const aoa = v.map((r, ri) => r.map((x, ci) => ri >= 2 && pc >= 0 && ci > pc && (ci - pc) % 2 === 1 && typeof x === 'number' ? `${Math.round(x * 100)}%` : x));
        const gws = XLSX.utils.aoa_to_sheet(aoa);
        gws['!cols'] = Array.from({ length: 14 }, (_, i) => ({ wch: i < pc ? 10 : (i - pc) % 2 ? 6 : 26 }));
        XLSX.utils.book_append_sheet(wb, gws, `가이드_${t.title}`.slice(0, 31));
      });
      const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
      ws['!cols'] = header.map((h, i) => ({ wch: i < 6 ? [14, 22, 12, 14, 6, 9][i] : 10 }));
      XLSX.utils.book_append_sheet(wb, ws, '분류');
      XLSX.writeFile(wb, `시트분류_${ymd(new Date()).replace(/-/g, '')}.xlsx`);
      await Promise.all(typeUpdates.map(([s, patch]) => HI.updateCampaign(s._key, patch).then(() => Object.assign(s, patch))));
      if (typeUpdates.length) renderReceipts(false);
    } catch (e) {
      alert('시트 분류 실패: ' + e.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = original; }
    }
  };

  async function callBizfitProxy(path, body) {
    const res = await fetch(`${BIZFIT_PROXY}${path}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    });
