    if (doneBtn) doneBtn.textContent = _ssShowDone ? `◀ 대기 목록으로` : `완료 목록 (${doneGroups.length})`;

    const bulkBarEl = document.getElementById('ss-bulk-bar');
    if (bulkBarEl) bulkBarEl.innerHTML = renderScheduleBulkBar(groups);

    if (!groups.length) {
      listEl.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);font-size:13px;">${_ssShowDone ? '완료된 캠페인이 없습니다.' : '조건에 맞는 항목이 없습니다.'}</div>`;
    } else {
      listEl.innerHTML = groups.map((g, i) => {
        const collapsed = _ssCollapsed.has(g.gid);
        const doneCount = g.items.filter(e => isScheduleDone(e.status)).length;
        const pendCount = g.items.length - doneCount;
        const editablePendCount = g.items.filter(e => !isScheduleDone(e.status)).length;
        const selCount = (_ssResplit[g.gid]?.selectedKeys || new Set()).size;
        return `
        <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f8fafc;">
            <div onclick="toggleScheduleGroupAt(${i})" style="display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;flex:1;">
              ${editablePendCount ? `<input type="checkbox" onclick="event.stopPropagation()" ${_ssBulkSelected.has(g.gid)?'checked':''} onchange="onBulkGroupCheck('${g.gid}',this.checked)">` : ''}
              <span style="font-size:10px;color:var(--muted);flex-shrink:0;">${collapsed?'▶':'▼'}</span>
              <span style="font-size:11px;color:#4338ca;font-weight:600;flex-shrink:0;">${escProd(g.agency||'대행사 미지정')}</span>
              <span style="color:var(--muted);flex-shrink:0;">/</span>
              <span style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escProd(g.store||'-')}</span>
              <span style="color:var(--muted);flex-shrink:0;">/</span>
              <span style="font-size:11px;color:var(--text2);font-family:monospace;flex-shrink:0;">${escProd(g.pid||'-')}</span>
              ${editablePendCount
                ? `<button onclick="event.stopPropagation();cancelAllSchedulePending('${g.gid}')" title="대기중 ${editablePendCount}건 일괄 취소" style="border:none;background:none;cursor:pointer;font-size:12px;color:var(--danger);padding:0;flex-shrink:0;">✕</button>`
                : ''}
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
              ${editablePendCount
                ? `<button onclick="event.stopPropagation();toggleScheduleResplit('${g.gid}')" style="padding:3px 9px;border:1px solid #c7d2fe;border-radius:100px;background:#eef2ff;color:#4338ca;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;">🔀 ${selCount ? `선택 ${selCount}건 재분류` : '재분류'}</button>`
                : `<button style="padding:3px 9px;border:1px solid transparent;border-radius:100px;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap;visibility:hidden;">🔀 재분류</button>`}
              <div onclick="toggleScheduleGroupAt(${i})" style="font-size:11px;color:var(--text2);white-space:nowrap;cursor:pointer;">
                전체 ${g.items.length}건 · <span style="color:#3b82f6;">대기중 ${pendCount}</span> · <span style="color:#ef4444;">완료 ${doneCount}</span>
              </div>
            </div>
          </div>
          ${renderScheduleResplitPanel(g)}
          ${collapsed ? '' : `
          <table class="ag-table" style="table-layout:fixed;">
            <thead><tr>
              <th style="text-align:center;width:3%"></th>
              <th style="text-align:center;width:11%">전송예정</th>
              <th style="text-align:center;width:9%">PID</th>
              <th style="text-align:center;width:8%">대행사</th>
              <th style="text-align:center;width:11%">등급</th><th style="text-align:center;width:25%">검색키워드</th>
              <th style="text-align:center;width:7%">키워드 수</th>
              <th style="text-align:center;width:6%">일 목표</th><th style="text-align:center;width:5%">일 수</th>
              <th style="text-align:center;width:8%">예약일</th><th style="text-align:center;width:7%">상태</th>
            </tr></thead>
            <tbody>
              ${g.items.map(e => {
                const row = (e.payload?.rowData || [])[0] || {};
                const done = isScheduleDone(e.status);
                const checked = (_ssResplit[g.gid]?.selectedKeys || new Set()).has(e._key);
                return `
                <tr>
                  <td style="text-align:center">${done ? '' : `<input type="checkbox" ${checked?'checked':''} onchange="onScheduleRowCheck('${g.gid}','${e._key}',this.checked)">`}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);white-space:nowrap;">${fmtScheduleTime(e.sendAt)}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);">${escProd(row.PID번호||'-')}</td>
                  <td style="text-align:center;font-size:11px;color:var(--text2);">${escProd(e.agency||'-')}</td>
                  <td id="ss-grade-${e._key}" style="text-align:center">
                    <span>${escProd(e.payload?.gradeName || row.상품등급명 || '-')}</span>
                    ${done ? '' : `<button onclick="editScheduleGrade('${e._key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`}
                  </td>
                  <td style="text-align:center" title="순위키워드: ${escProd(row.순위키워드||'-')}">
                    <input type="text" value="${escProd(row.검색키워드||'')}" placeholder="검색키워드" ${done?'disabled':''}
                      oninput="updateScheduleKwCount('${e._key}',this.value)"
                      onblur="saveScheduleKeyword('${e._key}',this)" onkeydown="if(event.key==='Enter')this.blur()"
                      style="width:100%;font-size:12px;font-family:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:5px;text-align:center;box-sizing:border-box;${done?'background:#f8fafc;color:var(--text2);':''}">
                  </td>
                  <td style="text-align:center"><span id="ss-kwcnt-${e._key}">${ssKwCountBadge(row.검색키워드)}</span></td>
                  <td style="text-align:center">${(row.일목표||0).toLocaleString()}</td>
                  <td style="text-align:center">${row.일수||0}</td>
                  <td style="text-align:center">${escProd(row.예약일||'-')}</td>
                  <td style="text-align:center">
                    ${scheduleStatusLabel(e.status)}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`}
        </div>`;
      }).join('');
    }

    // 완료된 건은 제외하고 대기중 남은 수량만 표시 — 카드(stat-split)의
    // computeScheduleGroupCount와 동일 기준
    const pendingCount = Object.values(_ssEntries).filter(e => !isScheduleDone(e.status)).length;
    const pendingFiltered = filtered.filter(e => !isScheduleDone(e.status));
    document.getElementById('ss-count').textContent = pendingFiltered.length === pendingCount
      ? `전체 ${activeGroups.length}건 예약 ${pendingCount}건`
      : `전체 ${activeGroups.length}건 예약 ${pendingCount}건 (검색결과 ${pendingFiltered.length}건)`;
  }

  // ── 잔여 재분류 — 슬롯의 남은(pending) 항목을 취소하고 등급별 비율(직접입력)로 다시 나눠 재생성 ──
  // 대상은 서버에 안 나간 pending뿐이라 bizfit 취소 API 불필요, Firebase에서 지우고 다시 쓰면 끝.
  function idSafe(s) { return encodeURIComponent(String(s)); }
  function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

  // 등급명이 트래픽(NP트래픽, adrole 없음)/저장(NP위치저장, adrole='100') 계열끼리 겹칠 수 있어서
  // (찰리/델타가 이 계열) gradeName만으론 구분이 안 됨 — 계열까지 합친 조합키로 고유하게 식별한다.
  function scheduleGradeCkey(adrole, gradeName) { return (adrole ? 'storage' : 'traffic') + '::' + gradeName; }

  // 옛 김프로 상품 설정(products_kp_legacy)은 접수관리 prods와 별도 — 옛 김프로 예약 항목의 등급
  // 구조 판정엔 반드시 이걸 써야 함(두 시스템 prods가 값이 다를 수 있어 섞어 쓰면 오판정 위험).
  let _kpProdsCache = null;
  async function getKpProdsForSchedule() {
    if (_kpProdsCache) return _kpProdsCache;
    try {
      const val = (await HI.getLegacyKpProds()) || [];
      _kpProdsCache = Array.isArray(val) ? val : Object.values(val||{});
    } catch (e) { _kpProdsCache = []; }
    return _kpProdsCache;
  }
  function prodsForSchedule(src, kpProds) { return src === 'kp' ? (kpProds || []) : prods; }

  // 등급별 요구값(rowData) 구조 시그니처 — daysMultiplied(일수 칸=총목표) · blogUrlProduct(블로그URL 필요) 중 하나라도 다르면
  // 저장돼 있는 rowData(일목표/일수/블로그URL 등)를 그대로 못 쓰므로 등급만 바꿔치기하면 접수가 깨진다. prods에 없는 이름(일반 등급 티어)은 둘 다 false로 간주.
  function gradeStructKey(gradeName, prodsList, adrole) {
    const list = prodsList || prods;
    const p = list.find(pr => pr.name === gradeName);
    // 총목표 방식(daysMultiplied: 찰리/델타)은 위치저장(adrole 있음) 등급에만 해당 — 트래픽에도 같은 이름의 등급(예: 트래픽 '찰리')이 있어 이름만 보면 위치저장으로 오인해 다른 트래픽 등급이 선택지에서 빠짐
    return (p?.daysMultiplied && adrole ? 'D' : '') + (p?.blogUrlProduct ? 'B' : '');
  }

  // 트래픽/저장 두 계열 다 조회해 합쳐서 반환 — 하나만 조회하면 반대 계열 등급이 선택지에 안 뜸.
  async function fetchScheduleGradeGroups(sample, prodsList) {
    const base = { domain: sample.payload?.domain || BIZFIT_DOMAIN, loginId: sample.payload?.loginId, pwd: sample.payload?.pwd, tab: BIZFIT_TAB, rawData: [] };
    const [giTraffic, giStorage] = await Promise.all([
      callBizfitProxy('/grade-info', base).catch(() => ({ success:false })),
      callBizfitProxy('/grade-info', { ...base, adrole: '100' }).catch(() => ({ success:false })),
    ]);
    const traffic = (giTraffic.success && giTraffic.gradeGroups) ? giTraffic.gradeGroups.map(g => ({ ...g, adrole: null,  category: '트래픽' })) : [];
    const storage = (giStorage.success && giStorage.gradeGroups) ? giStorage.gradeGroups.map(g => ({ ...g, adrole: '100', category: '저장'   })) : [];
    return [...traffic, ...storage].map(g => ({ ...g, ckey: scheduleGradeCkey(g.adrole, g.gradeName), structKey: gradeStructKey(g.gradeName, prodsList, g.adrole) }));
  }

  // 그룹당 하나만 존재하는 재분류 상태 — 패널 열기 전에 행 체크박스를 먼저 누를 수도 있어서
  // toggleScheduleResplit뿐 아니라 onScheduleRowCheck에서도 필요할 때 만든다.
  function ensureResplitState(slotKey) {
    return _ssResplit[slotKey] || (_ssResplit[slotKey] = { open:false, loading:false, gradeGroups:null, sel:{}, selectedKeys:new Set(), kwMode:false, kwLoading:false, kwText:'', timeMode:false, timeRows:[{time:'10:00',pct:100}] });
  }

  // 슬롯(상세)에 저장된 검색키워드를 그대로 가져옴 — 대기중 항목마다 흩어진 값이 아니라
  // 항상 원본 상세 값을 기준으로 재분할하기 위함
  async function fetchSourceKeyword(src, slotKey) {
    const s = allSlots.find(x => x._key === slotKey);
    if (s && 'searchKeyword' in s) return s.searchKeyword || '';
    return (await HI.getKeywords(slotKey)).search || '';
  }

  // 키워드 재분할: 1단계로 등급 수만큼 키워드 풀을 나눠 전용 슬라이스를 만들고(등급 수 < 그룹 수면
  // 순환), 2단계로 그 슬라이스를 bucketCount(회차 수)만큼 나눠 회차마다 다른 키워드 그룹을 쓰게
  // 함. 결과는 {ckey: [그룹,그룹,...]} — applyScheduleResplit이 버킷 순번으로 인덱싱.
  function assignKeywordsForResplit(kwList, grades, bucketCount) {
    if (!grades.length) return {};
    const outerGroups = autoChunkKeywords(kwList.join(','), grades.length);
    if (!outerGroups.length) return {};
    const result = {};
    grades.forEach((g, i) => {
      const gradeKw = outerGroups[i % outerGroups.length];
      result[g.ckey] = autoChunkKeywords(gradeKw.join(','), Math.max(1, bucketCount||1));
    });
    return result;
  }

  // ── 일괄 잔여 재분류 — 체크된 여러 그룹에 동일한 등급/비율 설정 하나를 한 번에 적용 ──
  window.onBulkGroupCheck = function(gid, checked) {
    if (checked) _ssBulkSelected.add(gid); else _ssBulkSelected.delete(gid);
    renderSplitScheduleList();
  };
  window.onBulkSelectAllToggle = function(checked) {
    const eligible = _ssLastGroups.filter(g => g.items.some(e => !isScheduleDone(e.status)));
    eligible.forEach(g => { if (checked) _ssBulkSelected.add(g.gid); else _ssBulkSelected.delete(g.gid); });
    renderSplitScheduleList();
  };
  // 그룹 등급 목록은 첫 선택 그룹의 계정 기준으로 조회(선택 UI용) — 실제 적용 시엔 그룹마다 자기
  // 계정으로 다시 조회해 이름이 일치하는 등급만 사용(applyBulkResplitClick 참고, 계정이 서로 달라도 안전)
  window.toggleBulkResplitPanel = async function() {
    _ssBulk.open = !_ssBulk.open;
    if (_ssBulk.open && !_ssBulk.gradeGroups && !_ssBulk.loading) {
      _ssBulk.loading = true;
      renderSplitScheduleList();
      const gid = [..._ssBulkSelected][0];
      const items = gid ? Object.values(_ssEntries).filter(e => e.slotKey === gid && !isScheduleDone(e.status)) : [];
      const sample = items[0];
      const groupSrc = sample?._src === 'kp' ? 'kp' : 'ha';
      const kpProds = groupSrc === 'kp' ? await getKpProdsForSchedule() : null;
      const prodsList = prodsForSchedule(groupSrc, kpProds);
      _ssBulk.gradeGroups = sample ? await fetchScheduleGradeGroups(sample, prodsList) : [];
      _ssBulk.loading = false;
    }
    renderSplitScheduleList();
  };
  window.onBulkResplitCheck = function(ckey, checked) {
    const pctInput = document.getElementById(`ss-bulk-pct-${idSafe(ckey)}`);
    if (checked) {
      if (_ssBulk.sel[ckey] == null) _ssBulk.sel[ckey] = 0;
      if (pctInput) pctInput.disabled = false;
    } else {
      delete _ssBulk.sel[ckey];
      if (pctInput) { pctInput.disabled = true; pctInput.value = ''; }
    }
    updateBulkResplitSum();
  };
  window.onBulkResplitPctInput = function(ckey, val) {
    _ssBulk.sel[ckey] = Math.max(0, parseInt(val)||0);
    updateBulkResplitSum();
  };
  window.onBulkKwModeToggle = function(checked) {
    _ssBulk.kwMode = checked;
    renderSplitScheduleList();
  };
  window.onBulkTimeModeToggle = function(checked) {
    _ssBulk.timeMode = checked;
    renderSplitScheduleList();
  };
  window.addBulkTimeRow = function() {
    _ssBulk.timeRows.push({ time:'12:00', pct:0 });
    renderSplitScheduleList();
  };
  window.removeBulkTimeRow = function(i) {
    _ssBulk.timeRows.splice(i, 1);
    renderSplitScheduleList();
  };
  window.onBulkTimeRowInput = function(i, field, val) {
    _ssBulk.timeRows[i][field] = field === 'time' ? val : (Number(val)||0);
    updateBulkResplitSum();
  };
  function computeBulkValidity() {
    const grades = Object.entries(_ssBulk.sel).filter(([,pct]) => pct > 0).map(([ckey,pct]) => {
      const gg = (_ssBulk.gradeGroups||[]).find(x => x.ckey === ckey);
      return gg ? { ckey, gradeName: gg.gradeName, pct } : null;
    }).filter(Boolean);
    const pctSum = grades.reduce((a,g) => a+g.pct, 0);
    const timeRows = _ssBulk.timeMode ? _ssBulk.timeRows : null;
    const timePctSum = timeRows ? timeRows.reduce((a,r) => a+(Number(r.pct)||0), 0) : null;
    const messages = [];
    if (grades.length && pctSum !== 100) messages.push(`비율 합계는 100%여야 합니다 (현재 ${pctSum}%)`);
    if (_ssBulk.timeMode && timePctSum !== 100) messages.push(`시각 비율 합계는 100%여야 합니다 (현재 ${timePctSum}%)`);
    return { grades, pctSum, timeRows, timePctSum, messages, blocked: messages.length > 0 || !grades.length };
  }
  function updateBulkResplitSum() {
    const v = computeBulkValidity();
    const sumEl = document.getElementById('ss-bulk-sum');
    if (sumEl) { sumEl.textContent = v.pctSum; sumEl.style.color = v.pctSum===100 ? 'var(--accent)' : 'var(--danger)'; }
    const timeSumEl = document.getElementById('ss-bulk-timesum');
    if (timeSumEl && v.timePctSum != null) { timeSumEl.textContent = v.timePctSum; timeSumEl.style.color = v.timePctSum===100 ? 'var(--accent)' : 'var(--danger)'; }
    const warnEl = document.getElementById('ss-bulk-warn');
    if (warnEl) {
      if (v.messages.length) { warnEl.style.display = 'block'; warnEl.textContent = '⚠ ' + v.messages.join(' · '); }
      else { warnEl.style.display = 'none'; warnEl.textContent = ''; }
    }
    const btnEl = document.getElementById('ss-bulk-apply-btn');
    if (btnEl) { btnEl.disabled = v.blocked; btnEl.style.background = v.blocked?'var(--muted)':'#4338ca'; btnEl.style.cursor = v.blocked?'not-allowed':'pointer'; }
  }
  function renderScheduleBulkBar(groups) {
    const eligible = groups.filter(g => g.items.some(e => !isScheduleDone(e.status)));
    if (!eligible.length) return '';
    const selCount = _ssBulkSelected.size;
    const allSelected = eligible.every(g => _ssBulkSelected.has(g.gid));
    let panel = '';
    if (_ssBulk.open) {
      if (_ssBulk.loading) {
        panel = '<div style="font-size:12px;color:var(--muted);margin-top:8px;">등급 조회 중...</div>';
      } else if (!_ssBulk.gradeGroups || !_ssBulk.gradeGroups.length) {
        panel = '<div style="font-size:12px;color:var(--danger);margin-top:8px;">등급 조회 실패 — 계정 정보를 확인해주세요.</div>';
      } else {
        const categories = [...new Set(_ssBulk.gradeGroups.map(gg => gg.category))];
        const v = computeBulkValidity();
        panel = `
        <div style="margin-top:10px;padding:10px;border:1px solid #c7d2fe;border-radius:8px;background:#eef2ff;">
          ${categories.map(cat => `
          <div style="margin-bottom:8px;">
            <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;">${escProd(cat)}</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px 18px;">
              ${_ssBulk.gradeGroups.filter(gg => gg.category === cat).map(gg => {
                const checked = _ssBulk.sel[gg.ckey] != null;
                return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;">
                  <input type="checkbox" ${checked?'checked':''} onchange="onBulkResplitCheck('${escJs(gg.ckey)}',this.checked)">
                  <span style="min-width:60px;">${escProd(gg.gradeName)}</span>
                  <span style="color:var(--muted);font-size:11px;">목표</span>
                  <input type="number" id="ss-bulk-pct-${idSafe(gg.ckey)}" value="${checked?_ssBulk.sel[gg.ckey]:''}" ${checked?'':'disabled'}
                    oninput="onBulkResplitPctInput('${escJs(gg.ckey)}',this.value)" min="0" max="100"
                    style="width:36px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;text-align:center;">%
                </label>`;
              }).join('')}
            </div>
          </div>`).join('')}
          <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#92400e;margin:8px 0 6px;">
            <span>🔀 키워드 분할</span>
            <span class="ha-switch"><input type="checkbox" ${_ssBulk.kwMode?'checked':''} onchange="onBulkKwModeToggle(this.checked)"><span class="ha-switch-track"></span></span>
          </label>
          ${_ssBulk.kwMode ? `<div style="font-size:11px;color:var(--text2);margin:-4px 0 6px;">※ 각 그룹 자신의 상세 키워드를 [등급 수×남은 일수]만큼 자동으로 나눠 배정</div>` : ''}
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#92400e;margin:8px 0 6px;">
            <span>⏰ 예약 시각 재설정</span>
            <span class="ha-switch"><input type="checkbox" ${_ssBulk.timeMode?'checked':''} onchange="onBulkTimeModeToggle(this.checked)"><span class="ha-switch-track"></span></span>
          </label>
          ${_ssBulk.timeMode ? `<div style="font-size:11px;color:var(--text2);margin:-4px 0 6px;">※ 설정시 선택한 그룹 전체 잔여를 [새 시각·비율]로 재구성</div>` : ''}
          ${_ssBulk.timeMode ? `
          <div style="padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin-bottom:8px;">
            ${_ssBulk.timeRows.map((r,i) => `
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
              <input type="time" value="${r.time}" onchange="onBulkTimeRowInput(${i},'time',this.value)" style="padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;">
              <input type="number" min="0" max="100" value="${r.pct}" oninput="onBulkTimeRowInput(${i},'pct',this.value)" style="width:36px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;text-align:center;">%
              ${_ssBulk.timeRows.length>1 ? `<button type="button" onclick="removeBulkTimeRow(${i})" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:13px;">✕</button>` : ''}
            </div>`).join('')}
            <div style="display:flex;align-items:center;gap:8px;">
              <button type="button" onclick="addBulkTimeRow()" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:#fff;cursor:pointer;">+ 시간 추가</button>
              <span style="font-size:12px;color:var(--text2);">합계 <span id="ss-bulk-timesum" style="font-weight:700;color:${v.timePctSum===100?'var(--accent)':'var(--danger)'};">${v.timePctSum}</span>%</span>
            </div>
          </div>` : ''}
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:11px;color:var(--text2);">합계 <b id="ss-bulk-sum" style="color:${v.pctSum===100?'var(--accent)':'var(--danger)'};">${v.pctSum}</b>%</span>
            <button id="ss-bulk-apply-btn" onclick="applyBulkResplitClick()" ${v.blocked?'disabled':''}
              style="padding:6px 14px;border:none;border-radius:7px;background:${v.blocked?'var(--muted)':'#4338ca'};color:#fff;cursor:${v.blocked?'not-allowed':'pointer'};font-size:12px;font-weight:700;font-family:inherit;">${selCount}개 일괄 재분류</button>
          </div>
          <div id="ss-bulk-warn" style="margin-top:6px;font-size:11px;color:var(--danger);font-weight:600;${v.messages.length?'':'display:none;'}">${v.messages.length?'⚠ '+escProd(v.messages.join(' · ')):''}</div>
        </div>`;
      }
    }
    return `
    <div style="padding:10px 14px;border:1.5px dashed #c7d2fe;border-radius:10px;background:#f8fafc;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#4338ca;">
          <input type="checkbox" ${allSelected?'checked':''} onchange="onBulkSelectAllToggle(this.checked)"> 전체 선택
        </label>
        <span style="font-size:12px;color:var(--text2);">${selCount}개 그룹 선택됨</span>
        <button onclick="toggleBulkResplitPanel()" ${selCount?'':'disabled'}
          style="margin-left:auto;padding:6px 14px;border:none;border-radius:7px;background:${selCount?'#4338ca':'var(--muted)'};color:#fff;cursor:${selCount?'pointer':'not-allowed'};font-size:12px;font-weight:700;font-family:inherit;">🔀 일괄 재분류</button>
      </div>
      ${panel}
    </div>`;
  }
  // 그룹마다 자기 계정으로 등급 재조회 → 이름 일치(같은 ckey) 등급만 채택, 하나라도 없으면 그
  // 그룹은 건너뜀(어중간한 결과 방지). 키워드 재분할 켜져 있으면 등급×일수 자동계산으로 재분할.
  window.applyBulkResplitClick = async function() {
    const v = computeBulkValidity();
    if (v.blocked) return;
    const targets = [..._ssBulkSelected];

    // 사전 검증 — 선택한 상품 조합 전부에 등급 매칭이 되는 그룹만 실행 대상으로 확정. 하나라도 등급
    // 설정이 안 맞으면 조용히 건너뛰지 않고 어떤 MID가 문제인지 알려준 뒤 전체 실행을 막는다(사용자 요청).
    const ready = [];
    const failed = [];
    for (const gid of targets) {
      const items = Object.values(_ssEntries).filter(e => e.slotKey === gid && !isScheduleDone(e.status));
      if (!items.length) { failed.push(`${gid} : 대상 없음`); continue; }
      const sample = items[0];
      const row = (sample.payload?.rowData || [])[0] || {};
      const label = `${row.업체명||gid} (${row.PID번호||gid})`;
      const groupSrc = sample._src === 'kp' ? 'kp' : 'ha';
      const kpProds = groupSrc === 'kp' ? await getKpProdsForSchedule() : null;
      const prodsList = prodsForSchedule(groupSrc, kpProds);
      const groupGrades = await fetchScheduleGradeGroups(sample, prodsList);
      const curStructs = new Set(items.map(e => gradeStructKey(e.payload?.gradeName || '', prodsList, e.adrole)));
      const applicable = v.grades.map(g => {
        const gg = groupGrades.find(x => x.ckey === g.ckey && curStructs.has(x.structKey));
        return gg ? { ckey: gg.ckey, gradeName: gg.gradeName, classType: gg.classType, gradeType: gg.gradeType, actualTab: gg.actualTab, adrole: gg.adrole, pct: g.pct } : null;
      }).filter(Boolean);
      if (applicable.length !== v.grades.length) { failed.push(`${label} : 등급 설정 필요`); continue; }
      ready.push({ gid, groupSrc, applicable });
    }
    if (failed.length) {
      alert(`아래 항목은 선택한 상품 조합에 등급이 매칭되지 않아 일괄 재분류를 실행하지 않았습니다.\n선택을 조정한 뒤 다시 시도해주세요.\n\n${failed.join('\n')}`);
      return;
    }

    const extra = [_ssBulk.kwMode && '키워드도 재분할', _ssBulk.timeMode && '시각도 재설정'].filter(Boolean).join(', ');
    if (!confirm(`선택한 ${targets.length}개 그룹을 다시 나눕니다${extra ? ` (${extra})` : ''}. 계속할까요?`)) return;

    let okCount = 0;
    const skipped = [];
    for (const { gid, groupSrc, applicable } of ready) {
      try {
        let kwList = null;
        if (_ssBulk.kwMode) {
          const kwText = await fetchSourceKeyword(groupSrc, gid);
          kwList = kwText.split(',').map(k=>k.trim()).filter(Boolean);
        }
        await applyScheduleResplit(gid, applicable, null, kwList, v.timeRows);
        okCount++;
      } catch(e) { skipped.push(gid); }
    }
    _ssBulk = { open:false, loading:false, gradeGroups:null, sel:{}, kwMode:false, timeMode:false, timeRows:[{time:'10:00',pct:100}] };
    _ssBulkSelected.clear();
    await reloadScheduleEntries();
    alert(`일괄 재분류 완료 — ${okCount}개 성공${skipped.length ? `, ${skipped.length}개 건너뜀` : ''}`);
  };

  // 행 체크박스 — 하나 이상 체크하면 그 항목들만 대상으로, 아무것도 안 체크하면(기본) 전체(잔여 전부) 대상으로
  // 재분류한다(applyScheduleResplitClick 참고). 체크만으로는 아무 요청도 안 나가고 버튼 라벨만 바뀐다.
  window.onScheduleRowCheck = function(slotKey, entryKey, checked) {
    const st = ensureResplitState(slotKey);
    if (checked) st.selectedKeys.add(entryKey); else st.selectedKeys.delete(entryKey);
    renderSplitScheduleList();
  };

  window.toggleScheduleResplit = async function(slotKey) {
    const st = ensureResplitState(slotKey);
    st.open = !st.open;
    if (st.open && !st.gradeGroups && !st.loading) {
      st.loading = true;
      renderSplitScheduleList();
      const items = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
      const targetItems = st.selectedKeys.size ? items.filter(e => st.selectedKeys.has(e._key)) : items;
      const sample = targetItems[0] || items[0];
      const groupSrc = sample?._src === 'kp' ? 'kp' : 'ha';
      const kpProds = groupSrc === 'kp' ? await getKpProdsForSchedule() : null;
      const prodsList = prodsForSchedule(groupSrc, kpProds);
      const allGroups = sample ? await fetchScheduleGradeGroups(sample, prodsList) : [];
      // rowData 구조가 이미 저장돼 있어 되돌릴 수 없으므로, 지금 대상들이 쓰는 등급과 요구값 구조(daysMultiplied/blogUrlProduct)가 같은 등급으로만 재분류를 제한한다
      const curStructs = new Set((targetItems.length ? targetItems : items).map(e => gradeStructKey(e.payload?.gradeName || '', prodsList, e.adrole)));
      st.gradeGroups = allGroups.filter(g => curStructs.has(g.structKey));
      st.loading = false;
      // 시작점 제공 — 대상(선택했으면 선택분, 아니면 전체)이 지금 쓰고 있는 등급들을 기본 체크해두고
      // 등급 수만큼 균등 비율을 미리 채워줌(그대로 써도 되고 고쳐도 됨)
      const curKeys = [...new Set(targetItems.map(e => scheduleGradeCkey(e.adrole, e.payload?.gradeName)).filter(k => k && !k.endsWith('::')))];
      if (curKeys.length) {
        const pct = Math.round(100 / curKeys.length);
        curKeys.forEach(k => { st.sel[k] = pct; });
      }
    }
    renderSplitScheduleList();
  };

  window.onScheduleResplitCheck = function(slotKey, ckey, checked) {
    const st = _ssResplit[slotKey]; if (!st) return;
    const pctInput = document.getElementById(`ss-resplit-pct-${slotKey}-${idSafe(ckey)}`);
    if (checked) {
      if (st.sel[ckey] == null) st.sel[ckey] = 0;
      if (pctInput) pctInput.disabled = false;
    } else {
      delete st.sel[ckey];
      if (pctInput) pctInput.disabled = true;
    }
    updateScheduleResplitSum(slotKey);
  };

  window.onScheduleResplitPctInput = function(slotKey, ckey, val) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.sel[ckey] = Math.max(0, parseInt(val)||0);
    updateScheduleResplitSum(slotKey);
  };

  // 끄면 원본 키워드를 그대로 복제(변경 없음), 켜면 상세 키워드를 불러와 등급별 "키워드" 비율
  // 입력을 노출(기본값 꺼짐). 입력칸이 새로 나타나야 해서 여기만 전체 재렌더.
  window.onScheduleResplitKwModeToggle = async function(slotKey, checked) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.kwMode = checked;
    if (checked && !st.kwText && !st.kwLoading) {
      st.kwLoading = true;
      renderSplitScheduleList();
      const items = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
      const targetItems = st.selectedKeys.size ? items.filter(e => st.selectedKeys.has(e._key)) : items;
      const sample = targetItems[0] || items[0];
      const src = sample?._src === 'kp' ? 'kp' : 'ha';
      try { st.kwText = await fetchSourceKeyword(src, slotKey); } catch(e) { st.kwText = ''; }
      st.kwLoading = false;
    }
    renderSplitScheduleList();
  };

  // 타이핑마다 리스트 전체를 다시 그리면 포커스가 끊기므로(스케줄 편집기와 동일 이유),
  // 상태만 갱신하고 미리보기·합계·버튼만 부분 갱신한다.
  window.onScheduleResplitKwTextInput = function(slotKey, val) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.kwText = val;
    updateScheduleResplitSum(slotKey);
  };

  // 예약 시각 재설정 — 켜면 원래 sendAt 대신 여기서 새로 정한 시각·비율로 전체 잔여를
  // 다시 나눔(부분선택 대상 아님). 편집기 UI/검증은 접수 확인 팝업의 #schedule-editor와 동일 패턴.
  window.onScheduleResplitTimeModeToggle = function(slotKey, checked) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.timeMode = checked;
    renderSplitScheduleList();
  };
  window.addResplitTimeRow = function(slotKey) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.timeRows.push({ time:'12:00', pct:0 });
    renderSplitScheduleList();
  };
  window.removeResplitTimeRow = function(slotKey, i) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.timeRows.splice(i, 1);
    renderSplitScheduleList();
  };
  window.onResplitTimeRowInput = function(slotKey, i, field, val) {
    const st = _ssResplit[slotKey]; if (!st) return;
    st.timeRows[i][field] = field === 'time' ? val : (Number(val)||0);
    updateScheduleResplitSum(slotKey);
  };

  // 최소 접수 수량 — 비즈핏 최소 수량 기준, splitRowBySchedule과 동일
  const SCHEDULE_MIN_PORTION = 10;

  // 같은 sendAt끼리 묶어 비율대로 나누고, 조각이 최소수량 미만이면 violations로 보고해 실행을 막는다
  // (안 그러면 그 등급분 수량이 표시 없이 증발). timeRows(선택) 있으면 원래 sendAt 무시하고 날짜별로
  // 묶어 새 시각·비율로 재구성 — buckets(새 조각)/cancelItems(취소할 원본)로 분리 반환.
  function computeResplitBuckets(slotKey, grades, targetKeys, timeRows) {
    const allItems = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    const items = targetKeys ? allItems.filter(e => targetKeys.has(e._key)) : allItems;
    const buckets = [];
    const violations = [];

    if (timeRows && timeRows.length) {
      const byDate = new Map();
      items.forEach(e => {
        const dateStr = (e.sendAt||'').slice(0,10) || scheduleDateForOffset(null,0);
        if (!byDate.has(dateStr)) byDate.set(dateStr, []);
        byDate.get(dateStr).push(e);
      });
      byDate.forEach((dateItems) => {
        const dateStr = (dateItems[0].sendAt||'').slice(0,10) || scheduleDateForOffset(null,0);
        const dateTotal = dateItems.reduce((s,e) => s + ((e.payload?.rowData||[])[0]?.일목표 || 0), 0);
        const sample = dateItems[0];
        const timeAmounts = lrm(timeRows.map((t,i) => ({ id:i, ratio:t.pct })), dateTotal);
        timeRows.forEach((t, ti) => {
          const timeAmt = timeAmounts[ti] || 0;
          if (timeAmt <= 0) return;
          const sendAt = scheduleTimeToIso(t.time, dateStr, 0);
          const amounts = lrm(grades.map(g => ({ id: g.ckey, ratio: g.pct })), timeAmt);
          grades.forEach(g => {
            const amt = amounts[g.ckey] || 0;
            if (amt > 0 && amt < SCHEDULE_MIN_PORTION) violations.push({ sendAt, gradeName: g.gradeName, amt });
          });
          buckets.push({ sendAt, sample, amounts });
        });
      });
    } else {
      const byTime = new Map();
      items.forEach(e => {
        const t = e.sendAt || '';
        if (!byTime.has(t)) byTime.set(t, []);
        byTime.get(t).push(e);
      });
      byTime.forEach((bucket, sendAt) => {
        const totalTarget = bucket.reduce((s,e) => s + ((e.payload?.rowData||[])[0]?.일목표 || 0), 0);
        const amounts = lrm(grades.map(g => ({ id: g.ckey, ratio: g.pct })), totalTarget);
        grades.forEach(g => {
          const amt = amounts[g.ckey] || 0;
          if (amt > 0 && amt < SCHEDULE_MIN_PORTION) violations.push({ sendAt, gradeName: g.gradeName, amt });
        });
        buckets.push({ sendAt, sample: bucket[0], amounts });
      });
    }
    return { buckets, violations, cancelItems: items };
  }

  // 같은 sendAt에 묶인 항목을 일부만 재분류하면 그 시각의 목표가 반쪽만 재분배돼 수량이 어긋남 —
  // 걸치는 시각이 있으면 실행 자체를 막는다.
  function scheduleResplitPartialSendAts(slotKey, targetKeys) {
    const allItems = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    const bySendAt = new Map();
    allItems.forEach(e => {
      const t = e.sendAt || '';
      if (!bySendAt.has(t)) bySendAt.set(t, []);
      bySendAt.get(t).push(e);
    });
    const partial = [];
    bySendAt.forEach((list, sendAt) => {
      const selectedCount = list.filter(e => targetKeys.has(e._key)).length;
      if (selectedCount > 0 && selectedCount < list.length) partial.push(sendAt);
    });
    return partial;
  }

  // 재분류 패널의 모든 방어 로직을 한곳에 모음 — alert 팝업 대신 적용 버튼 위에 바로 보여주기 위해
  // 체크박스/비율 입력이 바뀔 때마다(렌더 시점 포함) 이 함수로 다시 계산해서 경고문+버튼 상태를 맞춘다.
  function computeResplitValidity(slotKey) {
    const st = _ssResplit[slotKey];
    if (!st) return null;
    const grades = Object.entries(st.sel).filter(([,pct]) => pct > 0).map(([ckey,pct]) => {
      const gg = (st.gradeGroups||[]).find(x => x.ckey === ckey);
      return gg ? { ckey, gradeName: gg.gradeName, classType: gg.classType, gradeType: gg.gradeType, actualTab: gg.actualTab, adrole: gg.adrole, pct } : null;
    }).filter(Boolean);
    const pctSum = grades.reduce((a,g) => a+g.pct, 0);
    // 시간 재설정 켜면 전체 잔여를 대상으로 새 날짜×시각 그리드로 다시 만들므로 부분선택 개념 자체가
    // 없어짐 — targetKeys를 강제로 비워 "전체" 취급
    const timeRows = st.timeMode ? st.timeRows : null;
    const timePctSum = timeRows ? timeRows.reduce((a,r) => a+(Number(r.pct)||0), 0) : null;
    const targetKeys = st.timeMode ? null : (st.selectedKeys && st.selectedKeys.size ? st.selectedKeys : null);
    const partialSendAts = targetKeys ? scheduleResplitPartialSendAts(slotKey, targetKeys) : [];
    const { violations } = grades.length ? computeResplitBuckets(slotKey, grades, targetKeys, timeRows) : { violations: [] };

    const messages = [];
    if (grades.length && pctSum !== 100) messages.push(`비율 합계는 100%여야 합니다 (현재 ${pctSum}%)`);
    if (st.kwMode && !(st.kwText||'').trim()) messages.push('재분할할 키워드를 입력해주세요');
    if (st.timeMode && timePctSum !== 100) messages.push(`시각 비율 합계는 100%여야 합니다 (현재 ${timePctSum}%)`);
    if (partialSendAts.length) {
      const times = [...new Set(partialSendAts)].map(t => fmtScheduleTime(t)).join(', ');
      messages.push(`같은 시각(${times})에 여러 등급으로 묶인 항목은 전체 선택/전체 해제만 가능합니다`);
    }
    if (violations.length) {
      const detail = [...new Set(violations.map(v => `${v.gradeName}(${v.amt})`))].join(', ');
      messages.push(`최소 접수 수량(${SCHEDULE_MIN_PORTION}) 미만 조각 발생: ${detail}`);
    }
    return { grades, pctSum, timeRows, timePctSum, targetKeys, partialSendAts, violations, messages, blocked: messages.length > 0 || !grades.length };
  }

  function updateScheduleResplitSum(slotKey) {
    const v = computeResplitValidity(slotKey);
    if (!v) return;
    const st = _ssResplit[slotKey];
    const sumEl = document.getElementById(`ss-resplit-sum-${slotKey}`);
    if (sumEl) { sumEl.textContent = v.pctSum; sumEl.style.color = v.pctSum>100 ? 'var(--danger)' : (v.pctSum===100 ? 'var(--accent)' : '#b45309'); }
    const timeSumEl = document.getElementById(`ss-resplit-timesum-${slotKey}`);
    if (timeSumEl && v.timePctSum != null) { timeSumEl.textContent = v.timePctSum; timeSumEl.style.color = v.timePctSum===100 ? 'var(--accent)' : 'var(--danger)'; }
    const kwCountEl = document.getElementById(`ss-resplit-kwcount-${slotKey}`);
    const kwList0 = st && st.kwMode ? (st.kwText||'').split(',').map(k=>k.trim()).filter(Boolean) : [];
    if (kwCountEl) kwCountEl.textContent = kwList0.length;
    const warnEl = document.getElementById(`ss-resplit-warn-${slotKey}`);
    if (warnEl) {
      if (v.messages.length) { warnEl.style.display = 'block'; warnEl.textContent = '⚠ ' + v.messages.join(' · '); }
      else { warnEl.style.display = 'none'; warnEl.textContent = ''; }
    }
    const btnEl = document.getElementById(`ss-resplit-apply-${slotKey}`);
    if (btnEl) {
      btnEl.disabled = v.blocked;
      btnEl.style.background = v.blocked ? 'var(--muted)' : '#4338ca';
      btnEl.style.cursor = v.blocked ? 'not-allowed' : 'pointer';
    }
  }

  function renderScheduleResplitPanel(g) {
    const st = _ssResplit[g.gid];
    if (!st || !st.open) return '';
    const slotKey = g.gid;
    let body;
    if (st.loading) {
      body = '<span style="font-size:12px;color:var(--muted);">등급 조회 중...</span>';
    } else if (!st.gradeGroups || !st.gradeGroups.length) {
      body = '<span style="font-size:12px;color:var(--danger);">등급 조회 실패 — 계정 정보를 확인해주세요.</span>';
    } else {
      const categories = [...new Set(st.gradeGroups.map(gg => gg.category))];
      const v = computeResplitValidity(slotKey);
      body = `
        ${categories.map(cat => `
        <div style="margin-bottom:8px;">
          <div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;">${escProd(cat)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px 18px;">
            ${st.gradeGroups.filter(gg => gg.category === cat).map(gg => {
              const checked = st.sel[gg.ckey] != null;
              return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;">
                <input type="checkbox" ${checked?'checked':''} onchange="onScheduleResplitCheck('${slotKey}','${escJs(gg.ckey)}',this.checked)">
                <span style="min-width:60px;">${escProd(gg.gradeName)}</span>
                <span style="color:var(--muted);font-size:11px;">목표</span>
                <input type="number" id="ss-resplit-pct-${slotKey}-${idSafe(gg.ckey)}" value="${checked?st.sel[gg.ckey]:''}" ${checked?'':'disabled'}
                  oninput="onScheduleResplitPctInput('${slotKey}','${escJs(gg.ckey)}',this.value)" min="0" max="100"
                  style="width:36px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;text-align:center;">%
              </label>`;
            }).join('')}
          </div>
        </div>`).join('')}
        <hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#92400e;margin:8px 0 6px;">
          <span>🔀 키워드 분할</span>
          <span class="ha-switch"><input type="checkbox" ${st.kwMode?'checked':''} onchange="onScheduleResplitKwModeToggle('${slotKey}',this.checked)"><span class="ha-switch-track"></span></span>
        </label>
        ${st.kwMode ? (st.kwLoading ? '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">상세 키워드 불러오는 중...</div>' : `
        <div style="padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin-bottom:8px;">
          <div style="font-size:11px;color:var(--text2);margin-bottom:6px;">※ OFF - 원본 키워드를 복제, ON - [등급 수×남은 일수]만큼 자동으로 나눠 배정</div>
          <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">📋 상세에 저장된 키워드 <span id="ss-resplit-kwcount-${slotKey}" style="color:#1d4ed8;font-weight:700;">${(st.kwText||'').split(',').map(k=>k.trim()).filter(Boolean).length}</span>개</div>
          <textarea id="ss-resplit-kwtext-${slotKey}" oninput="onScheduleResplitKwTextInput('${slotKey}',this.value)"
            style="width:100%;height:44px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;resize:vertical;box-sizing:border-box;background:#f8fafc;">${escProd(st.kwText)}</textarea>
        </div>`) : ''}
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#92400e;margin:8px 0 6px;">
          <span>⏰ 예약 시각 재설정</span>
          <span class="ha-switch"><input type="checkbox" ${st.timeMode?'checked':''} onchange="onScheduleResplitTimeModeToggle('${slotKey}',this.checked)"><span class="ha-switch-track"></span></span>
        </label>
        ${st.timeMode ? `<div style="font-size:11px;color:var(--text2);margin:-4px 0 6px;">※ 설정시 전체 잔여 항목을 [새 시각·비율]로 재구성</div>` : ''}
        ${st.timeMode ? `
        <div style="padding:8px 10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin-bottom:8px;">
          ${st.timeRows.map((r,i) => `
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <input type="time" value="${r.time}" onchange="onResplitTimeRowInput('${slotKey}',${i},'time',this.value)" style="padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:12px;">
            <input type="number" min="0" max="100" value="${r.pct}" oninput="onResplitTimeRowInput('${slotKey}',${i},'pct',this.value)" style="width:36px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;text-align:center;">%
            ${st.timeRows.length>1 ? `<button type="button" onclick="removeResplitTimeRow('${slotKey}',${i})" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:13px;">✕</button>` : ''}
          </div>`).join('')}
          <div style="display:flex;align-items:center;gap:8px;">
            <button type="button" onclick="addResplitTimeRow('${slotKey}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:#fff;cursor:pointer;">+ 시간 추가</button>
            <span style="font-size:12px;color:var(--text2);">합계 <span id="ss-resplit-timesum-${slotKey}" style="font-weight:700;color:${v.timePctSum===100?'var(--accent)':'var(--danger)'};">${v.timePctSum}</span>%</span>
          </div>
        </div>` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span style="font-size:11px;color:var(--text2);">
            <span style="color:#ef4444;font-weight:700;">대기중 항목 취소 후 재생성</span>
            · 합계 <span id="ss-resplit-sum-${slotKey}" style="font-weight:700;color:${v.pctSum>100?'var(--danger)':v.pctSum===100?'var(--accent)':'#b45309'};">${v.pctSum}</span>%
          </span>
          <button id="ss-resplit-apply-${slotKey}" onclick="applyScheduleResplitClick('${slotKey}')" ${v.blocked?'disabled':''}
            style="padding:6px 14px;border:none;border-radius:7px;background:${v.blocked?'var(--muted)':'#4338ca'};color:#fff;cursor:${v.blocked?'not-allowed':'pointer'};font-size:12px;font-weight:700;font-family:inherit;">적용</button>
        </div>
        <div id="ss-resplit-warn-${slotKey}" style="margin-top:6px;font-size:11px;color:var(--danger);font-weight:600;${v.messages.length?'':'display:none;'}">${v.messages.length?'⚠ '+escProd(v.messages.join(' · ')):''}</div>`;
    }
    return `<div style="padding:12px 14px;background:#eef2ff;border-top:1px solid #c7d2fe;border-bottom:1px solid #c7d2fe;">${body}</div>`;
  }

  window.applyScheduleResplitClick = async function(slotKey) {
    const v = computeResplitValidity(slotKey);
    if (!v || v.blocked) return; // 적용 버튼이 이미 막혀있어 정상 흐름에서 도달 안 함 — 방어적으로만 남겨둠(팝업 없음)
    const st = _ssResplit[slotKey];
    const kwList = st?.kwMode ? (st.kwText||'').split(',').map(k=>k.trim()).filter(Boolean) : [];
    const scopeLabel = v.targetKeys ? `선택한 ${v.targetKeys.size}건` : '남은 예약 항목';
    const extra = [st?.kwMode && '키워드도 재분할', st?.timeMode && '시각도 재설정'].filter(Boolean).join(', ');
    if (!confirm(`${scopeLabel}을 다시 나눕니다${extra ? ` (${extra})` : ''}. 계속할까요?`)) return;

    try {
      const result = await applyScheduleResplit(slotKey, v.grades, v.targetKeys, kwList, v.timeRows);
      delete _ssResplit[slotKey];
      await reloadScheduleEntries();
      alert(`재분류 완료 — ${result.removed}건 취소, ${result.created}건 생성`);
    } catch(e) {
      alert('재분류 실패: ' + (e.message||e));
    }
  };

  // kwList: 재분할할 원본 키워드 배열 — 있으면 등급×버킷(일수)별로 자동 배정해 덮어씀, 없으면 원본
  // sampleRow 값 복제. timeRows 있으면 sendAt도 새로 계산, 없으면 원래 sendAt 유지.
  async function applyScheduleResplit(slotKey, grades, targetKeys, kwList, timeRows) {
    const { buckets, violations, cancelItems } = computeResplitBuckets(slotKey, grades, targetKeys, timeRows);
    if (!buckets.length) return { created: 0, removed: 0 };
    if (violations.length) throw new Error('최소 접수 수량 미만인 조각이 있어 중단했습니다.'); // applyScheduleResplitClick에서 이미 막지만 방어적으로 재확인
    // buckets(=재분류로 새로 만들 "일수")가 나온 다음에야 등급별로 몇 그룹이 필요한지 알 수 있어
    // 키워드 그룹 계산을 여기서 함(호출부에서 미리 만들어 넘기지 않음).
    const kwByGrade = kwList && kwList.length ? assignKeywordsForResplit(kwList, grades, buckets.length) : null;
    const bucketIdxByGrade = {};

    const src = cancelItems[0]?._src === 'kp' ? 'kp' : 'ha';
    const dispatchSuffix = scheduleDispatchSuffix(src);
    const batchSuffix = scheduleBatchSuffix(src);
    const patch = {};
    let removed = 0, created = 0;

    // 취소는 원본 항목 기준 1회씩만 — timeRows 켜져 있으면 같은 날짜가 여러 시간대 조각으로
    // 나뉘어도 취소 대상은 중복 없이 한 번만 잡힘(buckets를 그대로 순회하면 이중 카운트됨)
    cancelItems.forEach(e => { patch[`${dispatchSuffix}/${e._key}`] = null; removed++; });

    buckets.forEach(({ sendAt, sample, amounts }) => {
      const sampleRow = (sample.payload?.rowData || [])[0] || {};
      grades.forEach(g => {
        const amt = amounts[g.ckey] || 0;
        if (amt <= 0) return;
        const key = genId();
        let kwOverride = {};
        if (kwByGrade) {
          const dayGroups = kwByGrade[g.ckey] || [];
          if (dayGroups.length) {
            const idx = bucketIdxByGrade[g.ckey] || 0;
            kwOverride = { 검색키워드: (dayGroups[idx % dayGroups.length] || []).join(',') };
            bucketIdxByGrade[g.ckey] = idx + 1;
          }
        }
        patch[`${dispatchSuffix}/${key}`] = {
          slotKey, batchGroupId: sample.batchGroupId, sendAt, endpoint: sample.endpoint, agency: sample.agency || '', adrole: g.adrole ?? null,
          payload: {
            ...sample.payload, gradeName: g.gradeName, classType: g.classType, gradeType: g.gradeType, tab: g.actualTab || BIZFIT_TAB,
            rowData: [{ ...sampleRow, 일목표: amt, 상품등급명: g.gradeName, ...kwOverride }],
          },
          status: 'pending', createdAt: new Date().toISOString(),
        };
        created++;
      });
    });

    const batchSnap = await batchSnapOf(slotKey);
    const batch = batchSnap.exists() ? batchSnap.val() : { total: 0 };
    patch[`${batchSuffix}/${slotKey}/total`] = Math.max(0, (batch.total||0) - removed + created);

    await HI.updateSchedule(patch); // 예약 항목 추가·삭제 + 조각 수를 한 번에(원자적)
    return { created, removed };
  }

  // 대기중 일괄취소 — 전송 전이라 비즈핏 API 없이 예약 항목만 삭제, scheduled_batches/total도 같이
  // 줄여야 서버가 그룹 완료를 정확히 판정. 강제종료와 동일하게 실제로 나간 날짜만 인정해 일수/종료일 축소.
  // ✕는 항상 그 그룹의 대기중 전체를 취소(체크박스 선택과 무관 — 부분취소는 불필요하다는 사용자 판단).
  // 대기 조각 전부 취소 + 캠페인 종료(종료일만 재계산) — 예약 현황 '대기중 n건 취소'·강제종료 팝업 '취소' 탭 공용. _ssEntries가 최신이어야 함
  async function endSplitPending(slotKey) {
    const targets = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    if (!targets.length) return null;
    const src = targets[0]._src === 'kp' ? 'kp' : 'ha';
    const dispatchSuffix = scheduleDispatchSuffix(src);
    const batchSuffix = scheduleBatchSuffix(src);
    const pre = await HI.readScheduled(slotKey); // 못 읽으면 여기서 중단(아무것도 취소 안 됨)
    const patch = {};
    targets.forEach(e => { patch[`${dispatchSuffix}/${e._key}`] = null; });
    const batchSnap = await batchSnapOf(slotKey);
    if (batchSnap.exists()) {
      const batch = batchSnap.val();
      patch[`${batchSuffix}/${slotKey}/total`] = Math.max(0, (batch.total||0) - targets.length);
    }
    await HI.updateSchedule(patch);
    targets.forEach(e => { delete _ssEntries[e._key]; });

    // 캠페인 종료 + 종료일만 재계산(HI.endScheduled — 일수·정산 금액은 최초 접수 그대로)
    const dateOf = e => (e.payload?.rowData||[])[0]?.예약일;
    const kept = Object.values(_ssEntries).filter(e => e.slotKey === slotKey).map(dateOf);
    const fields = await HI.endScheduled(slotKey, targets.map(dateOf), kept, pre);
    const s = allSlots.find(x => x._key === slotKey);
    if (s && fields) Object.assign(s, fields, { status: 'expired' });
    return { count: targets.length, ...fields };
  }

  window.cancelAllSchedulePending = async function(slotKey) {
    const targets = Object.values(_ssEntries).filter(e => e.slotKey === slotKey && !isScheduleDone(e.status));
    if (!targets.length) return;
    if (!confirm(`대기중 ${targets.length}건을 취소합니다. 계속할까요?`)) return;
    try {
      await endSplitPending(slotKey);
      renderSplitScheduleList();
      renderReceipts(false);
    } catch(err) {
      alert('취소 처리 중 오류: ' + (err.message||err));
    }
  };


  // 검색키워드 변경 — 실제 접수 시 서버에 그대로 전송되는 값이라 payload.rowData[0]만 patch하면 충분
  window.saveScheduleKeyword = async function(key, inputEl) {
    const entry = _ssEntries[key];
    if (isScheduleDone(entry?.status)) { inputEl.disabled = true; return; } // 완료 항목은 수정 불가
    const val = inputEl.value.trim();
    inputEl.disabled = true;
    try {
      await HI.updateScheduleDispatch(`${key}/payload/rowData/0`, { 검색키워드: val });
      if (_ssEntries[key]) {
        const row = (_ssEntries[key].payload.rowData || [])[0]; if (row) row.검색키워드 = val;
      }
      inputEl.style.borderColor = 'var(--accent)';
      setTimeout(() => { inputEl.style.borderColor = 'var(--border)'; }, 800);
    } catch(e) {
      alert('키워드 저장 실패: ' + (e.message||e));
    } finally {
      inputEl.disabled = false;
    }
  };

  // 상품 등급 변경 — gradeName만 바꾸면 안 됨(classType/gradeType/tab이 짝을 이뤄야 /register가 정확)
  // 저장된 계정으로 grade-info 재조회해 실재하는 등급 중에서만 고르게 함.
  window.editScheduleGrade = async function(key) {
    const e = _ssEntries[key];
    const cell = document.getElementById(`ss-grade-${key}`);
    if (!e || !cell || isScheduleDone(e.status)) return; // 완료 항목은 수정 불가
    cell.innerHTML = '<span style="font-size:11px;color:var(--muted);">불러오는 중...</span>';
    const groupSrc = e._src === 'kp' ? 'kp' : 'ha';
    const kpProds = groupSrc === 'kp' ? await getKpProdsForSchedule() : null;
    const prodsList = prodsForSchedule(groupSrc, kpProds);
    const groups = await fetchScheduleGradeGroups(e, prodsList);
    if (!groups.length) {
      cell.innerHTML = '<span style="color:var(--danger);font-size:11px;">등급 조회 실패</span>';
      return;
    }
    const curName = e.payload?.gradeName || '';
    const curCkey = scheduleGradeCkey(e.adrole, curName);
    // rowData(일목표/일수/블로그URL 등)는 그대로 두고 등급 메타만 바꾸므로, 요구값 구조(daysMultiplied/blogUrlProduct)가 다른 등급은 고를 수 없게 막는다
    const curStruct = gradeStructKey(curName, prodsList, e.adrole);
    const compatGroups = groups.filter(g => g.structKey === curStruct);
    const categories = [...new Set(compatGroups.map(g => g.category))];
    cell.innerHTML = `<select style="font-size:12px;font-family:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:5px;max-width:100%;">
      ${categories.map(cat => `<optgroup label="${escProd(cat)}">
        ${compatGroups.filter(g => g.category === cat).map(g => `<option value="${escProd(g.ckey)}" ${g.ckey===curCkey?'selected':''}>${escProd(g.gradeName)}</option>`).join('')}
      </optgroup>`).join('')}
    </select>`;
    cell.querySelector('select').onchange = async (ev) => {
      const g = compatGroups.find(x => x.ckey === ev.target.value);
      if (!g) return;
      ev.target.disabled = true;
      try {
        await HI.updateScheduleDispatch(key, {
          adrole: g.adrole ?? null,
          'payload/gradeName':  g.gradeName,
          'payload/classType':  g.classType,
          'payload/gradeType':  g.gradeType,
          'payload/tab':        g.actualTab || BIZFIT_TAB,
          'payload/rowData/0/상품등급명': g.gradeName,
        });
        e.adrole = g.adrole ?? null;
        e.payload.gradeName = g.gradeName; e.payload.classType = g.classType;
        e.payload.gradeType = g.gradeType; e.payload.tab = g.actualTab || BIZFIT_TAB;
        const row = (e.payload.rowData||[])[0]; if (row) row.상품등급명 = g.gradeName;
        cell.innerHTML = `<span>${escProd(g.gradeName)}</span> <button onclick="editScheduleGrade('${key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`;
      } catch(err) {
        alert('등급 변경 실패: ' + (err.message||err));
        cell.innerHTML = `<span>${escProd(curName||'-')}</span> <button onclick="editScheduleGrade('${key}')" title="등급 변경" style="border:none;background:none;cursor:pointer;font-size:11px;margin-left:2px;padding:0;">✏️</button>`;
      }
    };
  };

  function lockOtherSubmitTabs(overlay, btnPrefix) {
    // 슬롯 상태를 동시에 건드릴 수 있는 다른 탭(일반/찰리/블로그)도 진행 중엔 잠가둔다
    const otherBtns = ALL_SUBMIT_PREFIXES
      .filter(pfx => pfx !== btnPrefix)
      .map(pfx => overlay.querySelector(`#${pfx}-apply-btn`))
      .filter(Boolean);
    otherBtns.forEach(b => { b.disabled = true; });
    return { otherBtns };
  }

  // 접수 신청/예약 저장 공용 마무리 — 버튼 문구/색/닫기 동작만 호출부가 정하고 나머지 잠금 해제는 여기서 공통 처리
  function finishTabUI(overlay, applyBtn, closeBtn, otherBtns, { text, color, onClose }) {
    window.bizfitSubmitting = false;
    applyBtn.textContent = text;
    applyBtn.style.background = color;
    applyBtn.style.cursor = 'default';
    closeBtn.disabled = false;
    closeBtn.onclick = onClose;
    // 다른 탭 잠금 해제 — 이 탭을 먼저 끝낸 뒤 계속 열어둔 채로 나머지도 마저 접수할 수 있어야 함
    otherBtns.forEach(b => { b.disabled = false; });
  }

  function finishSubmitUI(overlay, applyBtn, closeBtn, otherBtns, gate, okTotal, failTotal) {
    finishTabUI(overlay, applyBtn, closeBtn, otherBtns, {
      text: failTotal ? `완료 — 성공 ${okTotal} / 실패 ${failTotal}` : `✅ 전체 완료 (${okTotal}건)`,
      color: failTotal ? '#b91c1c' : '#475569',
      onClose: () => { overlay.remove(); if (!gate) renderReceipts(false); },
    });
  }

  // submitPlanRowsScheduled(예약 저장) 결과 표시 — 캐시차감은 이미 실행됐고(실패 시 상단 배너), 승인(상태 전환)만
  // 서버가 예약 그룹 완료 시 처리하므로 여기선 "예약됨"까지만
  function finishScheduleUI(overlay, applyBtn, closeBtn, otherBtns, scheduledCount, failTotal) {
    finishTabUI(overlay, applyBtn, closeBtn, otherBtns, {
      text: failTotal ? `⏰ 예약 ${scheduledCount}건 (실패 ${failTotal})` : `⏰ 예약 완료 (${scheduledCount}건)`,
      color: failTotal ? '#b91c1c' : '#f59e0b',
      onClose: () => { overlay.remove(); renderReceipts(false); },
    });
  }

  async function executeSubmit(plan, overlay, gate=null, legKey='normalKeys', adrole=null) {
    const btnPrefix = SUBMIT_TAB_PREFIX[legKey] || 'submit';
    const applyBtn = overlay.querySelector(`#${btnPrefix}-apply-btn`);
    const closeBtn = overlay.querySelector(`#${btnPrefix}-close-btn`);
    window.bizfitSubmitting = true;
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 처리 중...'; applyBtn.style.background = '#6b7280';
    closeBtn.disabled = true;
    const { otherBtns } = lockOtherSubmitTabs(overlay, btnPrefix);

    if (scheduleConfig && scheduleConfig.length) {
      const { scheduledCount, failTotal } = await submitPlanRowsScheduled(plan, overlay, legKey, adrole, scheduleConfig, gate);
      finishScheduleUI(overlay, applyBtn, closeBtn, otherBtns, scheduledCount, failTotal);
      return;
    }

    const { okTotal, failTotal } = await submitPlanRows(plan, overlay, gate, legKey, adrole);

    finishSubmitUI(overlay, applyBtn, closeBtn, otherBtns, gate, okTotal, failTotal);
  }

  // 블로그 탭 제출 — 델타(NP 위치저장, adrole=100)와 네이비(NP트래픽, adrole 없음)는 등급 체계가 달라
  // grade-info/register를 한 번에 묶어 부를 수 없다 — 각자 submitPlanRows로 따로 접수하고 결과만 합쳐 보여준다.
  async function executeBlogSubmit(deltaPlan, navyPlan, overlay, gate=null) {
    const btnPrefix = 'bsub';
    const applyBtn = overlay.querySelector(`#${btnPrefix}-apply-btn`);
    const closeBtn = overlay.querySelector(`#${btnPrefix}-close-btn`);
    window.bizfitSubmitting = true;
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 처리 중...'; applyBtn.style.background = '#6b7280';
    closeBtn.disabled = true;
    const { otherBtns } = lockOtherSubmitTabs(overlay, btnPrefix);

    if (scheduleConfig && scheduleConfig.length) {
      const [d, n] = await Promise.all([
        submitPlanRowsScheduled(deltaPlan, overlay, 'deltaKeys', DELTA_ADROLE, scheduleConfig, gate),
        submitPlanRowsScheduled(navyPlan, overlay, 'navyKeys', null, scheduleConfig, gate),
      ]);
      finishScheduleUI(overlay, applyBtn, closeBtn, otherBtns, d.scheduledCount + n.scheduledCount, d.failTotal + n.failTotal);
      return;
    }

    const [d, n] = await Promise.all([
      submitPlanRows(deltaPlan, overlay, gate, 'deltaKeys', DELTA_ADROLE),
      submitPlanRows(navyPlan, overlay, gate, 'navyKeys', null),
    ]);

    // 델타/네이비 중 먼저 끝난 쪽의 자체 tryApprove()가 아직 안 끝난 쪽을 못 볼 수 있어 안전망으로 한 번 더 호출
    // (이미 승인된 건 readyKeysOf가 걸러 중복 없음).
    if (gate) { try { await gate.tryApprove(); } catch (e) {} }

    finishSubmitUI(overlay, applyBtn, closeBtn, otherBtns, gate, d.okTotal + n.okTotal, d.failTotal + n.failTotal);
  }

  // ── 🛑 강제종료 (버튼은 index.html 상단, 순위표 오른쪽) ──

  // ── ↩️ 취소 탭(강제종료 팝업) — work/fullstack_macro/cancel_order.py와 같은 규칙. 환불파일양식(머리글에 대행사·MID, 시작일·환불 신청일) →
  //  ⓪ 접수관리 MID+시작일 같은 진행 캠페인: 분할은 대기 조각 전부 취소·종료, 승인은 종료일 → 환불 신청일(일수·정산은 최초 그대로)
  //  ① 대행사에 '오렌지'면 그 MID 비즈핏 오렌지 '진행중' 건 임시중단B  ② 풀스택 MID+시작일 정확히 같은 진행 주문·예약 취소
  // 조회만 먼저 해서 목록을 보여 주고, '취소 실행'을 눌러야 실제로 처리(⓪ 먼저 — 처리 중 다음 조각이 비즈핏에 올라가지 않게)
  const REFUND_AGENCY_KEY = '오렌지';
  function refundDate(v) {
    if (typeof v === 'number' && v > 20000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
    const m = String(v ?? '').trim().replace(/[./]/g, '-').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
  }
  function readRefundRows(wb) {
    const out = new Map(); // (MID, 시작일)로 중복 제거 — 뒤 행이 이김
    wb.SheetNames.forEach(n => {
      const ws = wb.Sheets[n];
      if (!ws['!ref']) return;
      const range = XLSX.utils.decode_range(ws['!ref']);
      if (range.e.r > 5000) range.e.r = 5000; // 양식은 서식이 시트 끝까지 깔려 있음
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', range, raw: true });
      const hi = aoa.slice(0, 21).findIndex(r => { const h = r.map(x => String(x).trim()); return h.includes('대행사') && h.includes('MID'); });
      if (hi < 0) return;
      const head = aoa[hi].map(x => String(x).trim());
      const col = (r, name) => head.indexOf(name) >= 0 ? r[head.indexOf(name)] : '';
      let blank = 0;
      for (const r of aoa.slice(hi + 1)) {
        blank = r.some(v => v !== '' && v != null) ? 0 : blank + 1;
        if (blank >= 50) break;
        let mid = String(col(r, 'MID') ?? '').trim();
        if (!mid) { const m = String(col(r, 'URL') || '').match(/\/(\d{5,})/); mid = m ? m[1] : ''; }
        if (!mid) continue;
        const row = { agency: String(col(r, '대행사') || '').trim(), name: String(col(r, '상호명') || '').trim(), mid,
          start: refundDate(col(r, '시작일')), applied: refundDate(col(r, '환불 신청일')) };
        out.set(`${mid}|${row.start}`, row);
      }
    });
    return [...out.values()];
  }

          if (!cur || cur.status !== x.expect) throw new Error('캠페인 상태가 바뀌었음 — 아무것도 안 바꿈');
          if (x.expect === 'active') { await HI.updateCampaign(x.key, { endDate: x.endDate }); updateLocalSlot(x.key, { endDate: x.endDate }); finish(x, true); }
          else { const r = await endSplitPending(x.key); finish(x, !!r, r ? `종료일 ${r.endDate}` : '대기 조각 없음'); }
        } catch (err) { finish(x, false, err.message); }
      }
      const biz = sel.filter(x => x.kind === 'biz');
      if (biz.length) {
        let done = {};
        try {
          const res = await fetch(`${BIZFIT_STOP_SERVER}/process`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ entries: biz.map(x => ({ mid: x.mid, pcode: x.pcode, agency: x.agency, do_pause: true })) }) });
          done = Object.fromEntries(((await res.json()).results || []).map(d => [d.pcode, d]));
        } catch (err) { biz.forEach(x => { done[x.pcode] = { success: false, message: err.message }; }); }
        biz.forEach(x => { const d = done[x.pcode] || { success: false, message: '결과 없음 — 비즈핏에서 확인 필요' }; finish(x, d.success, d.message || ''); });
      }
      const fs = sel.filter(x => x.kind === 'fsCamp' || x.kind === 'fsResv');
      if (fs.length) {
        try {
          const res = await HI.fullstack('cancel', { campaignSeqs: fs.filter(x => x.kind === 'fsCamp').map(x => x.id), reservationIds: fs.filter(x => x.kind === 'fsResv').map(x => x.id) });
          fs.forEach(x => { const d = (res.results || []).find(r => r.id === x.id && r.kind === (x.kind === 'fsCamp' ? 'campaign' : 'reservation')); finish(x, !!d?.ok, d?.memo || '결과 없음 — 풀스택 사이트에서 확인 필요'); });
        } catch (err) { fs.forEach(x => finish(x, false, err.message)); }
      }
      running = false;
      log(`완료: 성공 ${sel.filter(x => x.status === 'success').length} · 실패 ${sel.filter(x => x.status === 'fail').length}`);
      render();
      renderReceipts(false);
    };
    render();
  }

  window.openForceStopModal = function() {
    if (document.getElementById('fs-modal')) return;
    let entries = [], running = false, stopRequested = false;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'fs-modal';
    overlay.innerHTML = `
      <div class="modal-box" style="width:min(96vw,760px);max-height:84vh;overflow-y:auto;">
        ${FULLSTACK_ON ? `<div style="display:flex;border-bottom:2px solid var(--border);margin-bottom:12px;">
          <button type="button" class="submit-tab active" data-fspane="stop">🛑 강제종료</button>
          <button type="button" class="submit-tab" data-fspane="cancel">↩️ 취소</button>
        </div>` : ''}
        <div id="fs-pane-stop">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <div class="modal-title" style="margin-bottom:0;">🛑 강제종료</div>
          <button type="button" id="fs-tpl" class="action-btn" style="background:#f1f5f9;color:var(--text2);">양식 받기</button>
          <label class="action-btn" style="background:#0d9488;color:#fff;cursor:pointer;">📂 엑셀 올리기<input type="file" id="fs-file" accept=".xlsx,.xls" style="display:none"></label>
          <span style="font-size:11px;color:var(--muted);">영업점 / MID / Pcode</span>
        </div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.6;">
          · 성공한 MID의 진행 중 캠페인은 <b>강제종료</b> → 다음 날 자동 종료<br>
          · 남은 기간은 <b>재접수</b> 캠페인으로 생성 → 목록에서 접수 진행
        </div>
        <table style="width:100%;font-size:12px;border-collapse:collapse;">
          <thead><tr style="background:var(--bg);">
            <th style="width:30px;padding:6px;"><input type="checkbox" id="fs-all"></th>
            <th style="padding:6px;text-align:left;">영업점</th><th style="padding:6px;text-align:left;">MID / Pcode</th>
            <th style="padding:6px;">진행 중</th><th style="padding:6px;text-align:left;">상태</th>
          </tr></thead>
          <tbody id="fs-body"></tbody>
        </table>
        <div id="fs-log" style="margin-top:10px;font-size:11px;color:var(--text2);"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
          <button class="btn-cancel" id="fs-close">닫기</button>
          <button id="fs-run" style="background:#dc2626;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;">강제종료 실행</button>
        </div>
        </div>
        <div id="fs-pane-cancel" style="display:none;"></div>
      </div>`;
    document.body.appendChild(overlay);
    const $ = sel => overlay.querySelector(sel);
    if (FULLSTACK_ON) {
      initRefundCancelPane($('#fs-pane-cancel'), overlay);
      overlay.querySelectorAll('[data-fspane]').forEach(b => b.onclick = () => {
        overlay.querySelectorAll('[data-fspane]').forEach(x => x.classList.toggle('active', x === b));
        $('#fs-pane-stop').style.display = b.dataset.fspane === 'stop' ? '' : 'none';
        $('#fs-pane-cancel').style.display = b.dataset.fspane === 'cancel' ? '' : 'none';
      });
    }
    const log = msg => { $('#fs-log').innerHTML = `<div>${new Date().toLocaleTimeString('ko-KR',{hour12:false})} ${escProd(msg)}</div>`; }; // 최신 한 줄만(행별 결과는 표 상태 칸에 남음)
    const ST = { ready:'대기', running:'⏳ 진행 중', success:'✅ 완료', fail:'❌ 실패', blocked:'⛔ 예약 진행 중 — 강제종료 불가' };
    function render() {
      $('#fs-body').innerHTML = entries.length ? entries.map((e, i) => `
        <tr style="border-top:1px solid var(--border);${e.status==='blocked'?'opacity:.55;':''}">
          <td style="padding:6px;text-align:center;"><input type="checkbox" data-i="${i}" ${e.checked?'checked':''} ${e.status==='blocked'||running?'disabled':''}></td>
          <td style="padding:6px;font-weight:600;">${escProd(e.agency)}</td>
          <td style="padding:6px;">${escProd(e.mid)}<div style="font-size:10px;color:var(--muted);">${escProd(e.pcode)}</div></td>
          <td style="padding:6px;text-align:center;">${fsActiveCount(e.mid)}건</td>
          <td style="padding:6px;">${ST[e.status]}${e.result?`<div style="font-size:10px;color:var(--muted);">${escProd(e.result)}</div>`:''}</td>
        </tr>`).join('') : '<tr><td colspan="5" style="padding:20px;text-align:center;color:var(--muted);">엑셀을 올려 주세요.</td></tr>';
      const sel = entries.filter(e => e.checked && e.status !== 'blocked');
      // 실행 중엔 같은 버튼이 '중단'으로 바뀜(누르면 진행 중인 묶음까지만 처리하고 멈춤)
      const run = $('#fs-run');
      run.disabled = running ? stopRequested : !sel.length;
      run.style.opacity = run.disabled ? '.5' : '';
      run.style.background = running ? '#fff' : '#dc2626';
      run.style.color = running ? '#dc2626' : '#fff';
      run.style.border = running ? '1px solid #dc2626' : 'none';
      run.textContent = !running ? `강제종료 실행${sel.length ? ` (${sel.length})` : ''}` : stopRequested ? '중단하는 중...' : '중단';
      $('#fs-close').disabled = running; // 실행 중엔 닫기 자체를 못 누르게
      $('#fs-close').style.opacity = running ? '.4' : '';
      $('#fs-close').style.cursor = running ? 'not-allowed' : '';
    }
    $('#fs-body').addEventListener('change', e => { const i = e.target.dataset.i; if (i != null) { entries[i].checked = e.target.checked; render(); } });
    $('#fs-all').onchange = e => { entries.forEach(x => { if (x.status !== 'blocked' && x.status !== 'success') x.checked = e.target.checked; }); render(); };
    $('#fs-close').onclick = () => { if (!running) overlay.remove(); };
    // 실행 중 새로고침·탭 닫기 경고 — 끊기면 비즈핏 종료 뒤 캠페인 반영(강제종료 상태·재접수 생성)이 안 됨
    const warnLeave = e => { e.preventDefault(); e.returnValue = ''; };
    $('#fs-tpl').onclick = async () => {
      await loadXlsx();
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([['영업점','MID','Pcode']]);
      ws['!cols'] = [{wch:18},{wch:14},{wch:22}];
      XLSX.utils.book_append_sheet(wb, ws, '강제종료');
      XLSX.writeFile(wb, '강제종료_양식.xlsx');
    };
    $('#fs-file').onchange = async e => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      try {
        await loadXlsx();
        const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
        if (range.e.r > 5000) range.e.r = 5000; // 서식만 있는 빈 셀로 !ref가 커지면 느려짐
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', range });
        const hdr = (rows[0] || []).map(h => String(h || '').trim());
        const col = re => hdr.findIndex(h => re.test(h));
        const ci = { agency: col(/영업점/), mid: col(/mid/i), pcode: col(/pcode/i), force: col(/강제종료/) };
        const missing = [['영업점', ci.agency], ['MID', ci.mid], ['Pcode', ci.pcode]].filter(([, i]) => i < 0).map(([n]) => n);
        if (missing.length) { alert(`양식이 맞지 않습니다 — ${missing.join('/')} 열을 찾을 수 없습니다.`); return; }
        let added = 0, skipped = 0;
        for (const row of rows.slice(1)) {
          const agency = String(row[ci.agency] || '').trim(), mid = String(row[ci.mid] || '').trim();
          const pcodes = String(row[ci.pcode] || '').split(',').map(x => x.trim()).filter(Boolean);
          if (ci.force >= 0 && String(row[ci.force] || '').trim().toUpperCase() !== 'O') { if (agency || mid) skipped++; continue; }
          if (!agency || !mid || !pcodes.length) { if (agency || mid) skipped++; continue; }
          for (const pcode of pcodes) {
            if (entries.some(x => x.mid === mid && x.pcode === pcode)) { skipped++; continue; }
            const blocked = fsSplitBlocked(mid);
            entries.push({ agency, mid, pcode, checked: !blocked, status: blocked ? 'blocked' : 'ready', result: '' });
            added++;
          }
        }
        log(`엑셀: ${added}건 추가${skipped ? `, ${skipped}건 건너뜀(빈 칸·중복·강제종료 O 아님)` : ''}`);
        render();
      } catch (err) { alert('엑셀 읽기 실패: ' + err.message); }
    };
    // 강제종료 서버는 받은 건을 끝까지 처리하므로(연결을 끊어도 계속됨) 3건씩 나눠 보내고, 중단하면 다음 묶음을 안 보냄.
    // 묶음마다 비즈핏 성공 MID를 바로 캠페인에 반영(중단·이탈해도 끝난 건은 반영돼 있게)
    const FS_CHUNK = 3;
    async function fsRunChunk(chunk) {
      const okMids = new Set();
      try {
        const res = await fetch(`${BIZFIT_STOP_SERVER}/process-stream`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries: chunk.map(x => ({ mid: x.mid, pcode: x.pcode, agency: x.agency, do_pause: false, do_force: true })) }),
        });
        if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
        const reader = res.body.getReader(), dec = new TextDecoder();
        let buf = '';
        read: while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n'); buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let d; try { d = JSON.parse(line.slice(6)); } catch { continue; }
            if (d.entry_result) {
              const r = d.entry_result;
              const x = chunk.find(e => e.mid === r.mid && e.pcode === (r.pcode || ''));
              if (x) { x.status = r.success ? 'success' : 'fail'; x.result = r.message || ''; }
              if (r.success) okMids.add(r.mid);
              log(`${r.success ? '✅' : '❌'} ${r.mid} — ${r.message || ''}`);
              render();
            }
            if (d.error) { log(`❌ 서버 오류: ${d.error}`); break read; }
            if (d.done) break read;
          }
        }
      } catch (err) { log(`❌ ${err.message}`); }
      chunk.forEach(x => { if (x.status === 'running') { x.status = 'fail'; x.result = x.result || '결과 없음 — 비즈핏에서 직접 확인 필요'; } });
      for (const mid of okMids) {
        try {
          const r = await HI.forceStopMid(mid);
          log(`🛑 ${mid} — 캠페인 ${r.stopped}건 강제종료${r.requeued ? `, 재접수 ${r.requeued}건 생성` : ''}`);
        } catch (err) { log(`⚠️ ${mid} — 비즈핏은 종료됐지만 캠페인 반영 실패: ${err.message} — 이 MID 캠페인 상태를 직접 확인해 주세요`); }
      }
    }
    $('#fs-run').onclick = async () => {
      if (running) { stopRequested = true; log('중단 요청 — 진행 중인 건까지만 처리하고 멈춰요'); render(); return; }
      // 실행 직전 예약 상태 재확인(목록이 실시간이라 업로드 뒤 예약이 생겼을 수 있음)
      entries.forEach(x => { if (x.status !== 'success' && fsSplitBlocked(x.mid)) { x.status = 'blocked'; x.checked = false; } });
      const sel = entries.filter(x => x.checked && x.status !== 'blocked' && x.status !== 'success');
      if (!sel.length) { render(); alert('실행할 항목이 없습니다.'); return; }
      if (!confirm(`${sel.length}건을 비즈핏에서 강제종료합니다.\n되돌릴 수 없습니다. 진행할까요?`)) return;
      running = true; stopRequested = false;
      window.addEventListener('beforeunload', warnLeave);
      sel.forEach(x => { x.status = 'running'; x.result = ''; });
      render();
      log(`▶ 시작 — ${sel.length}건`);
      for (let i = 0; i < sel.length; i += FS_CHUNK) {
        if (stopRequested) break;
        await fsRunChunk(sel.slice(i, i + FS_CHUNK));
      }
      const stopped = sel.filter(x => x.status === 'running');
      stopped.forEach(x => { x.status = 'ready'; x.result = '중단됨 — 실행 안 함'; });
      running = false; stopRequested = false;
      window.removeEventListener('beforeunload', warnLeave);
      log(`━━ ${stopped.length ? '중단' : '완료'} — 성공 ${sel.filter(x => x.status === 'success').length} · 실패 ${sel.filter(x => x.status === 'fail').length}${stopped.length ? ` · 미실행 ${stopped.length}` : ''}`);
      render();
      renderReceipts(false, true);
    };
    render();
  };


  // 최초 로드
  renderReceipts(false).then(attachSlotsLiveSync);
  (async () => {
    await loadProdSettings();
    if (!document.getElementById('receipt-page')) return; // 대기 중 다른 메뉴로 이동한 경우 렌더 중단
    saveProdDefault();
    renderPS();
  })();

  // lock 전체 상태 프리페치 — 첫 상세 클릭 시 네트워크 없이 즉시 확인(SDK 인증 조회 — 잠금 노드는 스태프 전용)
  HI.getDetailLocks().then(data => {
    if (!data || typeof data !== 'object') return;
    const cu   = HI.getCurrentUser() || {};
    const myId = cu.username || cu.id || 'unknown';
    Object.entries(data).forEach(([key, lock]) => {
      if (!lock) return;
      const age = Date.now() - new Date(lock.lockedAt).getTime();
      if (lock.staffId !== myId && age < LOCK_TTL_MS) {
        LOCK_CHECK_CACHE.set(key, { conflict: true, by: lock.staffName || lock.staffId, ts: Date.now() });
      }
    });
  }).catch(() => {});

})();
</script>

      <button id="ss-done-toggle-btn" onclick="toggleScheduleDoneView()" style="padding:7px 12px;border:1px solid #c7d2fe;border-radius:8px;background:#fff;color:#4338ca;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;">완료 목록</button>

    </div>
