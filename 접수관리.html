  // 일반 상품 키워드/일목표 배분 입력칸 합계 — updateProdModalNotes/saveProdModal 공용
  function sumProdModalInputs(actives, prefix) {
    return Math.round(actives.reduce((s,q) => {
      const el = document.getElementById(`${prefix}${q.id}`);
      return s + (el ? parseFloat(el.value) || 0 : 0);
    }, 0) * 10) / 10;
  }
  window.updateProdModalNotes = function() {
    const cur = _prodModalId ? prods.find(x => x.id === _prodModalId) : null;
    if (!cur) return;
    if (cur.splitProduct) {
      const kwNote = document.getElementById('pm-kw-note');
      const ratNote = document.getElementById('pm-ratio-note');
      if (kwNote) kwNote.textContent = '';
      if (ratNote) {
        const pctEls = [...document.querySelectorAll('#pm-mission-rules .sr-fixedpct')];
        const sum = Math.round(pctEls.reduce((s,el)=> s + (parseFloat(el.value)||0), 0)*10)/10;
        ratNote.textContent = `고정 배분 합계: ${sum}%`;
        ratNote.className = 'ratio-note ' + (sum > 100 ? 'ng' : '');
      }
      return;
    }
    if (cur.fixedAlloc) {
      const kwNote = document.getElementById('pm-kw-note');
      const ratNote = document.getElementById('pm-ratio-note');
      if (kwNote) kwNote.textContent = '';
      if (ratNote) {
        const pctEl = document.getElementById('pm-fixedpct');
        const pctVal = pctEl ? parseFloat(pctEl.value) : NaN;
        if (pctVal === 100) {
          ratNote.textContent = '⚠️ 100%로 설정하면 일반 상품은 배분되지 않습니다';
          ratNote.className = 'ratio-note ng';
        } else {
          ratNote.textContent = '';
          ratNote.className = 'ratio-note';
        }
      }
      return;
    }
    const actives = ap().filter(q => !q.fixedAlloc);
    const kwR = sumProdModalInputs(actives, 'pm-kwpct-'), ratR = sumProdModalInputs(actives, 'pm-ratio-');
    const kwNote = document.getElementById('pm-kw-note');
    const ratNote = document.getElementById('pm-ratio-note');
    if(kwNote)  { kwNote.textContent=`합계: ${kwR}`;   kwNote.className='ratio-note '+(kwR===10||kwR===0?'ok':'ng'); }
    if(ratNote) { ratNote.textContent=`합계: ${ratR}`; ratNote.className='ratio-note '+(ratR===10?'ok':'ng'); }
  };
  window.closeProdModal = function() {
    document.getElementById('prod-modal-bg').classList.remove('show');
    _prodModalId = null;
  };
  // 엑셀 버전 새로고침 — 비즈핏 사이트에 등급명으로 직접 조회해 pm-ver를 최신값으로 채운다.
  window.refreshProdVersion = async function() {
    const p = prods.find(x => x.id === _prodModalId); if (!p) return;
    const btn = document.getElementById('pm-ver-refresh');
    const verEl = document.getElementById('pm-ver');
    const account = await fetchVersionCheckAccount();
    if (!account) { alert('버전 조회용 계정이 등록돼 있지 않습니다.'); return; }
    const adrole = p.id === 'charlie' ? CHARLIE_ADROLE : p.id === 'delta' ? DELTA_ADROLE : undefined;
    btn.disabled = true; const prevIcon = btn.textContent; btn.textContent = '⏳';
    try {
      const gi = await callBizfitProxy('/grade-info', {
        domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB,
        adrole: adrole || undefined, withVersion: true,
      });
      if (!gi.success || !gi.gradeGroups) { alert('조회 실패: ' + (gi.message || '등급 정보를 가져오지 못했습니다.')); return; }
      const g = gi.gradeGroups.find(x => x.gradeName === p.name);
      if (!g) { alert(`"${p.name}" 등급을 조회 계정에서 찾지 못했습니다.`); return; }
      if (!g.version) { alert('버전 조회 결과가 비어있습니다 — 잠시 후 다시 시도해주세요.'); return; }
      verEl.value = g.version;
    } catch(e) {
      alert('조회 중 오류: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = prevIcon;
    }
  };
  window.saveProdModal = function() {
    const p = prods.find(x => x.id === _prodModalId); if(!p) return;
    p.name = document.getElementById('pm-name').value.trim() || p.name;
    p.ver  = document.getElementById('pm-ver').value.trim();
    if (p.blogUrlProduct) {
      const n = parseInt(document.getElementById('pm-blogsplit')?.value, 10);
      if (!Number.isFinite(n) || n < 1) { alert('분할 값은 1 이상의 숫자여야 합니다.'); return; }
      p.blogSplit = n;
    }
    if (!p.fixedAlloc) {
      const actives = ap().filter(q => !q.fixedAlloc);
      if(actives.length) {
        const kwR = sumProdModalInputs(actives, 'pm-kwpct-'), ratR = sumProdModalInputs(actives, 'pm-ratio-');
        if(kwR!==10 && kwR!==0){ alert(`키워드 배분 합계는 10 또는 모두 0이어야 합니다. (현재: ${kwR})`); return; }
        if(ratR!==10){ alert(`일 목표 배분 합계는 10이어야 합니다. (현재: ${ratR})`); return; }
        actives.forEach(q => {
          const kwEl=document.getElementById(`pm-kwpct-${q.id}`), ratEl=document.getElementById(`pm-ratio-${q.id}`);
          if(kwEl)  q.kwPct = Math.round((parseFloat(kwEl.value) ||0)*10)/10;
          if(ratEl) q.ratio = Math.round((parseFloat(ratEl.value)||0)*10)/10;
        });
      }
    } else if (p.splitProduct) {
      const ruleRows = [...document.querySelectorAll('#pm-mission-rules .split-rule-row')];
      const seenMission = new Set();
      const rules = [];
      for (const row of ruleRows) {
        const mission     = parseInt(row.querySelector('.sr-mission')?.value, 10);
        const rowFixedPct = parseFloat(row.querySelector('.sr-fixedpct')?.value);
        if (!Number.isFinite(mission) || mission < 0 || !Number.isFinite(rowFixedPct) || rowFixedPct < 0 || rowFixedPct > 100) continue;
        if (seenMission.has(mission)) { alert(`미션 ${mission}번이 중복되었습니다.`); return; }
        seenMission.add(mission);
        rules.push({ mission, fixedPct: rowFixedPct });
      }
      if (!rules.length) {
        alert('미션을 최소 1개 이상 입력해야 합니다.');
        return;
      }
      p.missionRules = rules;
    } else if (p.deductOnly) {
      const fixedPctEl = document.getElementById('pm-fixedpct');
      if (fixedPctEl && parseFloat(fixedPctEl.value) > 100) {
        alert('차감 비율은 100%를 초과할 수 없습니다.');
        return;
      }
      if (fixedPctEl) p.fixedPct = Math.max(0, Math.min(100, parseFloat(fixedPctEl.value) || 0));
    } else {
      const fixedPctEl = document.getElementById('pm-fixedpct');
      if (fixedPctEl && parseFloat(fixedPctEl.value) > 100) {
        alert('통합 고정 배분은 100%를 초과할 수 없습니다.');
        return;
      }
      if (fixedPctEl) p.fixedPct = Math.max(0, Math.min(100, parseFloat(fixedPctEl.value) || 0));
      const ruleRows = [...document.querySelectorAll('#pm-mission-rules .mission-rule-row')];
      const seenKw = new Set();
      const rules = [];
      for (const row of ruleRows) {
        const kw        = parseInt(row.querySelector('.mr-kw')?.value, 10);
        const mission    = parseInt(row.querySelector('.mr-mission')?.value, 10);
        const rowFixedPct = parseFloat(row.querySelector('.mr-fixedpct')?.value);
        if (!Number.isFinite(kw) || kw <= 0 || !Number.isFinite(mission) || mission < 0 || !Number.isFinite(rowFixedPct) || rowFixedPct < 0 || rowFixedPct > 100) continue;
        if (seenKw.has(kw)) { alert(`키워드 ${kw}개에 대한 규칙이 중복되었습니다.`); return; }
        seenKw.add(kw);
        rules.push({ kw, mission, fixedPct: rowFixedPct });
      }
      if (!rules.length) {
        alert('키워드 배분 규칙을 최소 1개 이상 입력해야 합니다.');
        return;
      }
      p.missionRules = rules;
    }
    prodGroups.forEach(g => { const gs=g.state.find(s=>s.id===p.id); if(gs){gs.name=p.name;gs.ver=p.ver;} });
    window.closeProdModal();
    if(activeProdGroupId) updateActiveProdGroup(); else { saveProdDefault(); saveProdSettings(); }
    renderPS();
  };
  window.deleteProdModal = function() {
    if (!_prodModalId || FIXED_PROD_IDS.has(_prodModalId)) return;
    const p = prods.find(x => x.id === _prodModalId); if (!p) return;
    if (!confirm(`'${p.name}' 상품을 삭제할까요?`)) return;
    const id = _prodModalId;
    window.closeProdModal();
    prods = prods.filter(x => x.id !== id);
    prodGroups.forEach(g => { g.state = g.state.filter(s => s.id !== id); });
    if(activeProdGroupId) updateActiveProdGroup(); else { saveProdDefault(); saveProdSettings(); }
    renderPS();
  };

  // ── 분배 로직 ─────────────────────────────────────────────────

  function yupflAlloc(target, pct) { return Math.round(target * ((pct ?? 30) / 100)); }

  // 승인 시점에 차감 비율로 배분되는 수량/금액을 스냅샷으로 남겨 정산관리에서 조회 가능하게 함
  function deductFieldsFor(slot) {
    if (!slot) return {};
    const dp = ap().find(p => p.deductOnly);
    if (!dp) return {};
    const dTarget = yupflAlloc(slot.dailyTarget||0, dp.fixedPct);
    if (dTarget <= 0) return {};
    const unitPrice = (slot.unitPrice!=null && slot.unitPrice>0) ? slot.unitPrice : (userPriceMap.get(slot.userId)||0);
    const totalTarget = dTarget * (slot.days||0); // 전체 목표 차감(일수 반영) — buildNormalRows와 동일 기준으로 맞춰 차감 금액과 일치시킴
    return { deductTarget: totalTarget, deductAmount: totalTarget * unitPrice };
  }

  // 유입플 키워드 개수에 매칭되는 규칙을 찾음 — 매칭 없으면 null (이 경우 통합 고정 배분을 사용)
  function yupflRuleFor(yupfl, workKw) {
    const rules = Array.isArray(yupfl?.missionRules) ? yupfl.missionRules : [];
    const kw = (workKw||'').trim();
    const kwCount = kw ? kw.split(',').map(k=>k.trim()).filter(k=>k).length : 0;
    return rules.find(r => r.kw === kwCount) || null;
  }

  // 규칙에 매칭되면 규칙별 고정 배분 %, 매칭 안 되면 통합 고정 배분 %
  function yupflPctFor(yupfl, workKw) {
    const rule = yupflRuleFor(yupfl, workKw);
    return rule ? rule.fixedPct : yupfl?.fixedPct;
  }

  // MID가 이미 진행중인 유입플 미션 번호(ha/grades.mission/missionKeywords, 등급 자동매칭과 같은 데이터 소스) —
  // 알고 있으면 작업키워드 개수로 추정하는 yupflRuleFor보다 우선한다. 여러 미션이 동시에 잡혀있으면
  // 모호하므로 강제하지 않고 기존 방식으로 폴백. 재접수(isRequeue) 슬롯은 신규 접수가 아니므로 제외.
  // kimpro/reception.html과 동일 구현.
  // MID의 ha/grades missionKeywords(미션별 작업키워드, grade_sync.py merge_youpfl_keywords_into 참고)를
  // {미션번호: 키워드} 객체로 반환 — GRADE_CACHE 캐시 기반(동기). 없으면 null. kimpro/reception.html과 동일 구현.
  function knownYupflMissionKeywords(mid) {
    if (!mid) return null;
    const data = GRADE_CACHE.get(mid);
    if (!data) return null;
    const result = {};
    parseGradeEntries(data).forEach(g => {
      if (g.missionKeywords && typeof g.missionKeywords === 'object') {
        Object.entries(g.missionKeywords).forEach(([mission, kw]) => {
          const n = parseInt(mission, 10);
          const trimmedKw = (kw||'').trim();
          if (!Number.isNaN(n) && trimmedKw) result[n] = trimmedKw;
        });
      } else if (g.mission) {
        const kw = (g.yupflKw||'').trim();
        if (kw) {
          g.mission.split(',').map(m => m.trim()).filter(Boolean).forEach(m => {
            const n = parseInt(m, 10);
            if (!Number.isNaN(n)) result[n] = kw;
          });
        }
      }
    });
    return Object.keys(result).length ? result : null;
  }

  // 승인 시점 유입플/분할 배분 수량·금액을 스냅샷으로 남겨 정산관리에서 조회 — buildYoupflRows()와 동일 규칙을 슬롯 1건에 적용
  // 유입플·분할은 동시 진행 불가하므로 하나의 필드(yupflAmount)로 합산 저장
  function yupflFieldsFor(slot) {
    if (!slot) return {};
    const yupfl = ap().find(p => p.id === 'yupfl' && p.fixedAlloc);
    const split = ap().find(p => p.id === 'yupfl2' && p.splitProduct);
    if (!yupfl && !split) return {};
    const deduct = ap().find(p => p.deductOnly);
    const base = slot.dailyTarget||0;
    const remaining = deduct ? Math.max(0, base - yupflAlloc(base, deduct.fixedPct)) : base;

    let target = 0;
    if (yupfl) {
      const workKw = (slot.yupflKeyword||'').trim();
      const rule   = yupflRuleFor(yupfl, workKw);
      target += Math.min(yupflAlloc(remaining, rule ? rule.fixedPct : yupfl.fixedPct), remaining);
    }
    if (split && Array.isArray(split.missionRules)) {
      split.missionRules.forEach(rule => {
        const workKw = ((slot.splitKeywords || {})[rule.mission] || '').trim();
        if (!workKw) return;
        target += Math.min(yupflAlloc(remaining, rule.fixedPct), remaining);
      });
    }
    if (target <= 0) return {};
    const unitPrice = (slot.unitPrice!=null && slot.unitPrice>0) ? slot.unitPrice : (userPriceMap.get(slot.userId)||0);
    return { yupflTarget: target, yupflAmount: target * (slot.days||0) * unitPrice };
  }

  // 대행사(bizfitUid)당 여러 슬롯 차감을 합쳐 /bizfit-refund 한 번만 호출 — 슬롯마다 부르면 캐시사용내역이 승인 건수만큼 쪼개짐
  // 미매핑 대행사는 조용히 스킵. 실패해도 승인은 이미 끝났으므로 던지지 않고 boolean 반환(팝업 재시도 배너용)
  async function settleBizfitCashBatch(bizfitUid, slots, deductAmount, yupflAmount) {
    const targets = slots.filter(s => s && !s.bizfitDeducted);
    if (!targets.length) return true;
    const amount = deductAmount + yupflAmount;
    if (amount <= 0) return true;
    // bizfitDeductAttempted(레거시 슬롯 오탐 방지 마커)를 호출 전에 미리 쓰면 성공 케이스도 배지가 깜빡이므로
    // 성공 시 attempted+deducted를 한 번에, 실패 시만 attempted 단독으로 남긴다
    try {
      const res = await callBizfitProxy('/bizfit-refund', { uid: bizfitUid, amount });
      if (res && res.success) {
        await Promise.all(targets.map(s => HA.updateSlot(s._key, { bizfitDeductAttempted: true, bizfitDeducted: true })));
        targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true, bizfitDeducted: true }));
        // 최근 입금완료 건에 "[환불] 유입플 세팅 금액" 메모 누적 기록(서버가 합산) — 차감과 별개라 실패해도 콘솔에만 남김
        const agencyId = targets[0].agencyId;
        callBizfitProxy('/bizfit-charge-memo', { company: agencyId, yupflAmount, deductAmount })
          .then(mres => { if (!mres || !mres.success) console.error('비즈핏 충전 메모 실패:', agencyId, mres && mres.message); })
          .catch(e => console.error('비즈핏 충전 메모 오류:', agencyId, e));
        return true;
      }
      await Promise.all(targets.map(s => HA.updateSlot(s._key, { bizfitDeductAttempted: true })));
      targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true }));
      console.error('비즈핏 캐시 차감 실패:', targets.map(s => s._key), bizfitUid, amount, res && res.message);
      return false;
    } catch (e) {
      await Promise.all(targets.map(s => HA.updateSlot(s._key, { bizfitDeductAttempted: true })));
      targets.forEach(s => updateLocalSlot(s._key, { bizfitDeductAttempted: true }));
      console.error('비즈핏 캐시 차감 오류:', targets.map(s => s._key), bizfitUid, amount, e);
      return false;
    }
  }

  // 단건 승인용 — 슬롯 1개짜리 배치로 취급해 settleBizfitCashBatch 재사용(매핑 없어 스킵한 경우도 true)
  async function settleBizfitCash(slot, fields) {
    if (!slot) return true;
    await userBizfitUidReady;
    const bizfitUid = userBizfitUidMap.get(slot.userId);
    if (!bizfitUid) return true;
    return await settleBizfitCashBatch(bizfitUid, [slot], fields.deductAmount || 0, fields.yupflAmount || 0);
  }

  // 승인됐지만 차감 시도(bizfitDeductAttempted)했다 실패한(!bizfitDeducted) 슬롯만 필터 — bizfitDeducted만 보면
  // 이 필드가 없는 레거시 active 슬롯까지 걸리므로 attempted를 같이 요구(레거시엔 이 필드 자체가 없음)
  function bizfitDeductPending(s) {
    return !!(s && s.status === 'active' && s.bizfitDeductAttempted && !s.bizfitDeducted);
  }

  window.retryBizfitDeduct = async function(key, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '재시도 중...'; }
    const slot = allSlots.find(s => s._key === key);
    if (!slot) return;
    await settleBizfitCash(slot, { deductAmount: slot.deductAmount || 0, yupflAmount: slot.yupflAmount || 0 });
    renderReceipts(false);
  };

  // 슬롯 목록 + 슬롯별 차감 필드(deductFieldsFor/yupflFieldsFor 결과)를 bizfitUid별로 묶어 반환(실행은 안 함,
  // 조회 전용) — 즉시 승인(approveReadySlots)과 예약 저장 시점 차감(initScheduledBatches) 공용.
  // 이미 차감된 슬롯(bizfitDeducted)·매핑 없는 대행사·차감액 0인 건은 조용히 스킵.
  async function groupFieldsByBizfitUid(slots, fieldsBySlotKey) {
    await userBizfitUidReady;
    const byUid = new Map();
    for (const s of slots) {
      if (!s || s.bizfitDeducted) continue;
      const fields = fieldsBySlotKey.get(s._key);
      if (!fields) continue;
      const amount = (fields.deductAmount || 0) + (fields.yupflAmount || 0);
      if (amount <= 0) continue;
      const bizfitUid = userBizfitUidMap.get(s.userId);
      if (!bizfitUid) continue;
      if (!byUid.has(bizfitUid)) byUid.set(bizfitUid, { bizfitUid, slots: [], ded: 0, yup: 0 });
      const g = byUid.get(bizfitUid);
      g.slots.push(s);
      g.ded += fields.deductAmount || 0;
      g.yup += fields.yupflAmount || 0;
    }
    return [...byUid.values()];
  }

  // 슬롯 승인 확정(status→active) 후 남은 차감 대상을 대행사별로 묶어 반환(실행은 안 함, 조회 전용) —
  // 멀티레그 게이트 완료/단일완료/팝업 자동승인 전부 이 함수로 승인 처리 후 필요에 따라 차감 실행 또는 팝업 배너로 미룸
  async function approveReadySlots(keys, slotMap) {
    if (!keys.length) return [];
    const fieldsByKey = new Map(keys.map(k => [k, { ...deductFieldsFor(slotMap.get(k)), ...yupflFieldsFor(slotMap.get(k)) }]));
    await Promise.all(keys.map(k => HA.approveSlot(k, fieldsByKey.get(k))));
    keys.forEach(k => { const s = slotMap.get(k); if (s) s.status = 'active'; });
    return groupFieldsByBizfitUid(keys.map(k => slotMap.get(k)), fieldsByKey);
  }

  // 승인+차감 연속 실행 — 멀티레그 게이트/단일완료 3곳에서 공용. 승인·그룹핑은 approveReadySlots에 위임,
  // 차감은 그룹당 한 번만 호출. 실패한 그룹만 반환해 호출부가 팝업 재시도 배너에 넘김.
  async function approveSlotsWithBizfit(keys, slotMap) {
    const groups = await approveReadySlots(keys, slotMap);
    // await 없이 던지면 닫기 버튼이 차감 완료 전 활성화돼 요청이 취소될 수 있음 — 전부 끝난 뒤 resolve
    const results = await Promise.all(groups.map(async g => {
      const ok = await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup);
      return { ...g, ok };
    }));
    return results.filter(r => !r.ok).map(({ ok, ...g }) => g);
  }

  function lrm(items, total) {
    if (!items.length) return {};
    const totalW = items.reduce((s, p) => s + p.ratio, 0) || 1;
    const exact  = items.map(p => total * p.ratio / totalW);
    const floors = exact.map(v => Math.floor(v));
    const rems   = exact.map((v, i) => v - floors[i]);
    let leftover = total - floors.reduce((s, v) => s + v, 0);
    const order  = rems.map((_, i) => i).sort((a, b) => rems[b] - rems[a]);
    for (let i = 0; i < leftover; i++) floors[order[i]]++;
    return items.reduce((m, p, i) => (m[p.id] = floors[i], m), {});
  }

  // 유입플/분할처럼 fixedAlloc인 상품이 여러 개면 각자 몫을 먼저 떼고, 남은 걸 일반 상품끼리 비율로 나눈다.
  // 분할은 단일 workKw가 아니라 미션별 splitKeywords를 쓰므로 미션별 합계를 그 상품의 몫으로 친다.
  function allocate(asgn, target, workKw, splitKeywords) {
    if (!asgn.length) return {};
    const fixedProds = asgn.filter(p => p.fixedAlloc);
    if (fixedProds.length) {
      // 차감은 배열 순서와 무관하게 최우선 적용 — 이후 항목(유입플/분할)의 %는 차감하고 남은 수량을 기준으로 계산한다
      const ordered = [...fixedProds.filter(p => p.deductOnly), ...fixedProds.filter(p => !p.deductOnly)];
      const result = {};
      let remaining = target;
      ordered.forEach(p => {
        let amt;
        if (p.deductOnly) {
          amt = yupflAlloc(remaining, p.fixedPct);
        } else if (p.splitProduct) {
          const rules = Array.isArray(p.missionRules) ? p.missionRules : [];
          amt = rules.reduce((s, rule) => {
            const kw = ((splitKeywords||{})[rule.mission] || '').trim();
            return kw ? s + yupflAlloc(remaining, rule.fixedPct) : s;
          }, 0);
        } else {
          amt = yupflAlloc(remaining, yupflPctFor(p, workKw));
        }
        amt = Math.max(0, Math.min(amt, remaining));
        result[p.id] = amt;
        remaining -= amt;
      });
      return { ...result, ...lrm(asgn.filter(p => !p.fixedAlloc), Math.max(0, remaining)) };
    }
    return lrm(asgn, target);
  }

  function kwForProd(keywords, prod) {
    if (!keywords) return '';
    const parts = keywords.split(',').map(k => k.trim()).filter(k => k);
    if (!parts.length) return '';
    const activeOthers = ap().filter(p => !p.fixedAlloc);
    const totalPct = activeOthers.reduce((s, p) => s + (p.kwPct || 0), 0);
    if (totalPct === 0) return parts.join(',');
    const counts = lrm(activeOthers.map(p => ({id: p.id, ratio: p.kwPct || 0})), parts.length);
    let offset = 0;
    for (const p of activeOthers) {
      if (p.id === prod.id) return parts.slice(offset, offset + (counts[p.id] || 0)).join(',');
      offset += counts[p.id] || 0;
    }
    return '';
  }

  // ── MID의 기존 진행중 등급으로 접수(등급 자동매칭) ──────────────
  // ha/grades는 매시간 admin.bizfit.kr 진행중(status=3) 캠페인 기준으로 동기화되는 데이터(GRADE_CACHE에 캐싱됨,
  // fetchGrade/fetchGradesBatch 참고). 같은 MID가 이미 어떤 등급으로 진행중이면 상품 유형 설정의 ratio 배분을
  // 무시하고 그 등급(들)로만 접수한다 — 매칭된 등급이 여럿이면 그 등급끼리 균등분배, 상품 목록에 없는 등급명은
  // 일반상품 기본값(ver.5.0/3.2, adrole 미지정)으로 가상 등록. 차감/유입플/분할은 등급 개념이 아니므로 무관 —
  // allocate() 내부에서 항상 기존 fixedAlloc 로직 그대로 처리됨. kimpro/reception.html과 동일 구현.
  // 접수 확인 팝업의 토글 버튼(기본 on)으로 끄면 이 매칭 전체를 건너뛰고 상품 유형 설정값 그대로 배분.
  let gradeMatchOn = true;

  // ── 시간대 분할 예약 접수 (kimpro/reception.html과 동일 구현 + higher 전용 캐시차감 스냅샷) ──
  // scheduleConfig가 설정된 동안엔 executeSubmit/executeBlogSubmit이 즉시 /register 대신
  // ha/scheduled_dispatch에 완성된 페이로드를 저장만 해두고, 서버(bizfit-direct-proxy의
  // /dispatch-scheduled, Cloud Scheduler로 주기 호출)가 지정 시각에 그대로 재생한다.
  // higher는 승인 시 비즈핏 캐시차감이 같이 일어나야 하므로(kimpro엔 없는 기능) deductFieldsFor/
  // yupflFieldsFor 결과와 bizfitUid도 함께 스냅샷해 서버가 그룹 완료 시 그대로 재생한다.
  // 다중 leg(승인 게이트 걸리는) 슬롯은 서버가 게이트 로직을 모르므로 지원하지 않음 — gate가 있으면 토글을 막는다.
  let scheduleConfig = null; // null=끔, 아니면 [{time:'10:00', pct:34}, ...]

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  async function fbSet(path, val) {
    const { getDatabase, ref, set } = await import('https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js');
    await set(ref(getDatabase(), path), val);
  }
  async function fbGet(path) {
    const { getDatabase, ref, get } = await import('https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js');
    return get(ref(getDatabase(), path));
  }
  // patch: RTDB 멀티패스 업데이트 — 키에 '/'를 쓰면 path 하위 여러 위치를 한 번에 갱신(값 null이면 그 위치 삭제)
  async function fbUpdate(path, patch) {
    const { getDatabase, ref, update } = await import('https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js');
    await update(ref(getDatabase(), path), patch);
  }

  // baseDateStr(예약일/시작일)을 Date로 안전하게 파싱 — 자릿수가 안 맞거나(예: "2026-9-3") 이미 시각까지
  // 포함된 문자열이 섞여 들어와도 new Date(...).toISOString()이 예외를 던지지 않게 한다. 이 예외는 호출부
  // (submitPlanRowsScheduled)에서 안 잡혀 예약 접수 버튼이 "처리 중"에서 영원히 안 풀리는 결과로 이어지므로,
  // 형식이 이상하면 조용히 오늘로 폴백한다(크래시보다 낫다는 판단, baseDateStr 없을 때와 동일 취급, kimpro와 동일).
  function scheduleParseBaseDate(baseDateStr) {
    if (baseDateStr) {
      const d = new Date(`${String(baseDateStr).slice(0, 10)}T00:00:00`);
      if (!isNaN(d.getTime())) return d;
    }
    return new Date();
  }

  // "HH:MM" → (baseDateStr+dayOffset일) 그 시각의 UTC ISO 문자열 (브라우저 로컬시간=KST 가정, 이 코드베이스 전반의
  // 기존 관례와 동일). baseDateStr이 없으면 오늘을 기준으로 한다 — 예약일이 9/3이면 시간대 10:00 설정 시
  // "내일 10시"로, 9/2(오늘)이면 "오늘 10시"로 인식돼야 하므로 "오늘"을 무조건 기준으로 삼으면 안 됨.
  function scheduleTimeToIso(timeStr, baseDateStr, dayOffset = 0) {
    const [h, m] = (timeStr || '00:00').split(':').map(Number);
    const d = scheduleParseBaseDate(baseDateStr);
    d.setDate(d.getDate() + dayOffset);
    d.setHours(h || 0, m || 0, 0, 0);
    return d.toISOString();
  }

  // (baseDateStr+dayOffset일)의 로컬 날짜를 "YYYY-MM-DD"로 — 날짜분할 조각마다 예약일(=비즈핏 시작일)을 실제
  // 접수되는 그날로 맞추기 위함(안 맞추면 이틀 뒤에 나가는 콜도 예약일이 오늘로 찍혀 과거 시작일이 되어버림).
  function scheduleDateForOffset(baseDateStr, dayOffset = 0) {
    const d = scheduleParseBaseDate(baseDateStr);
    d.setDate(d.getDate() + dayOffset);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // 한 행의 일목표를 schedule 비율로 쪼갠 뒤, 일수(_days)만큼 "1일치" 접수를 하루씩 밀려가며 만들어
  // 매일 같은 시각에 접수되게 한다(1회 접수 후 비즈핏 자체 반복에 맡기지 않음).
  // daysMultiplied 상품(찰리/델타, NP위치저장)은 "일수" 칸이 실제 일수가 아니라 그 콜 하나의 총목표라서
  // 하루치 콜의 일수 필드에도 그날 portionTotal 그대로(곱하지 않음) 넣는다 — 서버 최소값도 일반(10)이
  // 아니라 NP위치저장 전용 최소(전체목표 100) 기준으로 걸러야 매일 소액 콜이 반려되지 않는다.
  function splitRowBySchedule(row, schedule) {
    const portions = lrm(schedule.map((s, i) => ({ id: i, ratio: s.pct })), row.일목표 || 0);
    const minPortion = row._daysMultiplied ? 100 : 10; // 비즈핏 최소 수량 — NP위치저장은 전체목표 100, 그 외는 10
    const out = [];
    schedule.forEach((s, i) => {
      const portionTotal = portions[i] || 0;
      if (portionTotal < minPortion) return; // 최소값 미만이면 그 조각은 버림
      const days = Math.max(1, row._days || 0);
      for (let d = 0; d < days; d++) {
        out.push({
          ...row,
          일목표: portionTotal,
          일수: row._daysMultiplied ? portionTotal : 1,
          예약일: scheduleDateForOffset(row.예약일, d),
          _sendAt: scheduleTimeToIso(s.time, row.예약일, d),
        });
      }
    });
    return out;
  }

  async function saveScheduledDispatch(entry) {
    const key = genId();
    await fbSet(`ha/scheduled_dispatch/${key}`, { ...entry, status: 'pending', createdAt: new Date().toISOString() });
  }

  // 슬롯별로 이번에 예약한 조각 개수를 미리 기록해둬야 서버가 "다 끝났는지"(승인 전환 시점) 판정 가능.
  // 캐시차감은 예약 그룹 완료를 기다리지 않고 접수(예약) 시점에 즉시 실행한다 —
  // approveReadySlots와 동일하게 deductFieldsFor/yupflFieldsFor를 슬롯에 스냅샷으로 남기고, bizfitUid별로
  // 묶어 settleBizfitCashBatch 한 번씩 호출. 슬롯 상태는 'split'(분할)로 바꿔 일반 접수 대상과 구분하고
  // 원래 상태는 preScheduleStatus에 보관 — 상태가 'active'로 바뀌는 건 여전히 예약 그룹이 실제로 전부
  // 등록 완료된 뒤(서버 디스패처)다, 차감만 미리 실행될 뿐.
  // 반환: 차감 실패한 {bizfitUid, slots, ded, yup} 그룹 배열 — 호출부가 기존 deduct-fail 배너에 반영.
  async function initScheduledBatches(slotKeyCounts, batchGroupId) {
    await userBizfitUidReady;
    const slotKeys = [...slotKeyCounts.keys()];
    const fieldsByKey = new Map();
    const slotsByKey = new Map(); // 이후 그룹핑에서 같은 slotKey로 allSlots를 다시 스캔하지 않도록 1회만 조회해 공유

    await Promise.all(slotKeys.map(async slotKey => {
      const s = allSlots.find(x => x._key === slotKey);
      slotsByKey.set(slotKey, s);
      const preStatus = s && s.status !== 'split' ? s.status : (s?.preScheduleStatus || 'pending');
      const fields = s ? { ...deductFieldsFor(s), ...yupflFieldsFor(s) } : {};
      fieldsByKey.set(slotKey, fields);
      await fbSet(`ha/scheduled_batches/${slotKey}`, { total: slotKeyCounts.get(slotKey), done: 0, failed: 0, batchGroupId, createdAt: new Date().toISOString() });
      await HA.updateSlot(slotKey, { status: 'split', preScheduleStatus: preStatus, ...fields });
      if (s) Object.assign(s, { status: 'split', preScheduleStatus: preStatus, ...fields });
    }));

    // bizfitUid별 그룹핑은 approveReadySlots와 동일 로직 재사용(groupFieldsByBizfitUid) — 대행사별 차감은 서로
    // 독립이라 settleBizfitCashBatch가 순차일 이유 없음(approveSlotsWithBizfit과 동일하게 병렬)
    const groups = await groupFieldsByBizfitUid(slotKeys.map(k => slotsByKey.get(k)), fieldsByKey);
    const results = await Promise.all(groups.map(async g => ({ g, ok: await settleBizfitCashBatch(g.bizfitUid, g.slots, g.ded, g.yup) })));
    return results.filter(r => !r.ok).map(r => r.g);
  }

  function gradeLabelsOf(mid) {
    const data = GRADE_CACHE.get(mid);
    if (!data) return [];
    return [...new Map(parseGradeEntries(data).map(g => [g.gradeLabel, g])).values()]
      .flatMap(g => (g.gradeLabel || '').split(',').map(l => l.trim()).filter(l => l));
  }

  function matchedGradeProds(mid) {
    if (!mid) return [];
    const labels = gradeLabelsOf(mid);
    if (!labels.length) return [];
    const seen = new Set();
    const result = [];
    labels.forEach(label => {
      if (seen.has(label)) return;
      seen.add(label);
      const known = prods.find(p => p.name === label && !p.fixedAlloc);
      result.push(known
        ? { ...known, ratio: 1, kwPct: 1 }
        : { id: `grade_${label}`, name: label, color: '#94a3b8', ver: 'ver.5.0/3.2', ratio: 1, kwPct: 1, daysMultiplied: false });
    });
    return result;
  }

  // buildNormalRows/buildDeltaRows가 공유하는 슬롯별 배분 — 매칭된 등급이 있으면 차감/유입플/분할(고정)은
  // 그대로 두고 나머지만 매칭된 등급끼리 균등분배(ratio:1), 없으면 기존 ratio 배분 그대로.
  // 재접수(isRequeue) 슬롯은 신규 접수가 아니라 기존 배분을 이어받는 성격이라 이 매칭 대상에서 제외한다.
  function allocRowsForSlot(r) {
    const AP = ap();
    const gradeProds = (gradeMatchOn && !r.isRequeue) ? matchedGradeProds(r.mid) : [];
    if (!gradeProds.length) {
      return { alloc: allocate(AP.slice(), r.dailyTarget||0, r.yupflKeyword, r.splitKeywords), prods: AP, gradeProds: null };
    }
    const asgn = [...AP.filter(p => p.fixedAlloc), ...gradeProds];
    return { alloc: allocate(asgn, r.dailyTarget||0, r.yupflKeyword, r.splitKeywords), prods: asgn, gradeProds };
  }

  // kwForProd와 동일한 largest-remainder 방식이지만, 전역 활성상품 kwPct 대신 매칭된 등급끼리 균등분배(ratio=1)한다.
  function kwForGradeProd(keywords, prod, gradeProds) {
    if (!keywords) return '';
    const parts = keywords.split(',').map(k => k.trim()).filter(k => k);
    if (!parts.length) return '';
    const counts = lrm(gradeProds.map(p => ({ id: p.id, ratio: 1 })), parts.length);
    let offset = 0;
    for (const p of gradeProds) {
      if (p.id === prod.id) return parts.slice(offset, offset + (counts[p.id] || 0)).join(',');
      offset += counts[p.id] || 0;
    }
    return '';
  }

  // ── XLSX 헬퍼 ─────────────────────────────────────────────────

  function sc(ws, r, c, v, s) {
    if (v === undefined || v === null) return;
    s = s || {};
    const addr = window.XLSX.utils.encode_cell({r, c});
    ws[addr] = {
      t: typeof v === 'number' ? 'n' : 's', v,
      s: {
        font:      { name: '맑은 고딕', sz: 10, ...s.font },
        alignment: { horizontal: s.align || 'center', vertical: 'center', wrapText: false },
        ...(s.fill ? {fill:{fgColor:{rgb:s.fill},patternType:'solid'}} : {}),
        border: { top:{style:'thin',color:{rgb:'D0D0D0'}}, bottom:{style:'thin',color:{rgb:'D0D0D0'}}, left:{style:'thin',color:{rgb:'D0D0D0'}}, right:{style:'thin',color:{rgb:'D0D0D0'}} },
      },
    };
  }
  function scDate(ws, r, c, dateStr) {
    if (!dateStr) return;
    const [y, m, d] = String(dateStr).split('-').map(Number);
    const serial = Math.round((new Date(y, m-1, d) - new Date(1899, 11, 30)) / (86400 * 1000));
    const addr = window.XLSX.utils.encode_cell({r, c});
    ws[addr] = {
      t: 'n', v: serial, z: 'YYYY-MM-DD',
      s: {
        font: { name:'맑은 고딕', sz:10 }, alignment: { horizontal:'center', vertical:'center' }, numFmt:'YYYY-MM-DD',
        border: { top:{style:'thin',color:{rgb:'D0D0D0'}}, bottom:{style:'thin',color:{rgb:'D0D0D0'}}, left:{style:'thin',color:{rgb:'D0D0D0'}}, right:{style:'thin',color:{rgb:'D0D0D0'}} },
      },
    };
  }

  const agencyLabel = s => (s.agencyId||'').trim() || '(대행사 미지정)';
  function getAgencies(slots) {
    const seen = new Set(), list = [];
    slots.forEach(s => { const ag=agencyLabel(s); if(!seen.has(ag)){seen.add(ag);list.push(ag);} });
    return list;
  }
  function slotsByAgency(slots, ag) { return slots.filter(s => agencyLabel(s) === ag); }

  function buildJusuSheet(wb, f) {
    const ws = {};
    const AP = ap();
    const totalGil = f.reduce((s, r) => s + (r.dailyTarget||0)*(r.days||0), 0);
    sc(ws, 0, 0, '총 일 목표 합계', {font:{bold:true,color:{rgb:'FFFFFF'}}, fill:'111827'});
    sc(ws, 1, 0, totalGil, {font:{bold:true}, fill:'F3F4F6'});
    const baseH = ['업체명','URL','MID','순위키워드','일수','시작일','일 목표','분류','검색키워드','키워드 수'];
    const headers = [...baseH, ...AP.map(p=>p.name), '합계'];
    headers.forEach((h, ci) => {
      const prod = (ci >= 10 && ci < 10 + AP.length) ? AP[ci - 10] : null;
      const fill = prod ? prod.color.replace('#','') : (ci < 10 ? 'D97706' : '374151');
      sc(ws, 3, ci, h, {font:{bold:true,color:{rgb:'FFFFFF'}}, fill, align:'center'});
    });
    f.forEach((r, ri) => {
      const rowIdx = 4 + ri;
      const alloc  = allocate(AP.slice(), r.dailyTarget||0, r.yupflKeyword, r.splitKeywords);
      const kwCount = r.searchKeyword ? r.searchKeyword.split(',').map(k=>k.trim()).filter(k=>k).length : 0;
      const base = [r.storeName||'',r.url||'',r.mid||'',r.rankKeyword||'',r.days||0,null,r.dailyTarget||0,AP.length,r.searchKeyword||'',kwCount];
      const pv   = AP.map(p => alloc[p.id] ?? '');
      const row  = [...base, ...pv, (r.dailyTarget||0)*(r.days||0)];
      row.forEach((v, ci) => {
        if (v===''||v===undefined) return;
        if (ci===5) { scDate(ws, rowIdx, 5, r.startDate); return; }
        const pi=ci-10, isProd=ci>=10&&ci<10+AP.length&&pv[pi]!=='', fc=isProd?AP[pi].color.replace('#',''):null;
        sc(ws, rowIdx, ci, v, { align:[0,1,3,8].includes(ci)?'left':'center', font:fc?{color:{rgb:fc},bold:true}:{} });
      });
    });
    ws['!ref'] = f.length
      ? window.XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:3+f.length, c:headers.length-1}})
      : window.XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:4, c:headers.length-1}});
    ws['!cols'] = [{wch:22},{wch:44},{wch:14},{wch:18},{wch:6},{wch:13},{wch:12},{wch:6},{wch:44},{wch:8},...AP.map(()=>({wch:10})),{wch:10}];
    window.XLSX.utils.book_append_sheet(wb, ws, '접수');
  }

  function buildJumuSheet_(wb, f, label, filterFn, blogUrlField=null) {
    const ws = {};
    const AP = ap();
    const pList = AP.filter(filterFn);
    if(!pList.length) return;
    const daysColLabel = pList.every(p => p.daysMultiplied) ? '전체 목표' : '일 수';
    const headers = ['상품등급명','업체명','URL','MID','순위키워드','일 목표',daysColLabel,'예약일','검색키워드'];
    if (blogUrlField) headers.push('블로그URL');
    headers.forEach((h, ci) => { sc(ws, 0, ci, h, {font:{bold:true,color:{rgb:'FFFFFF'}}, fill:h==='검색키워드'?'DC2626':(h==='블로그URL'?'16A34A':'1F2937')}); });
    let curRow = 1;
    const allocBySlot = new Map(f.map(r => [r, allocate(AP.slice(), r.dailyTarget||0, r.yupflKeyword, r.splitKeywords)]));
    pList.forEach(prod => {
      f.forEach(r => {
        const alloc   = allocBySlot.get(r);
        const pp      = alloc[prod.id] ?? 0;
        const daysVal = prod.daysMultiplied ? pp*(r.days||0) : (r.days||0);
        const kw      = kwForProd(r.searchKeyword||'', prod);
        const pc      = prod.color.replace('#','');
        const row     = [prod.name,r.storeName||'',r.url||'',r.mid||'',r.rankKeyword||'',pp,daysVal,null,kw];
        if (blogUrlField) row.push(r[blogUrlField]||'');
        row.forEach((v, ci) => {
          if(ci===7){ scDate(ws, curRow, 7, r.startDate); return; }
          sc(ws, curRow, ci, v, { align:[0,1,2,4,8,9].includes(ci)?'left':'center', font:ci===0?{color:{rgb:pc},bold:true}:{} });
        });
        curRow++;
      });
    });
    if(curRow<2) curRow=2;
    const lastCol = blogUrlField ? 9 : 8;
    ws['!ref']  = window.XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:curRow-1,c:lastCol}});
    ws['!cols'] = [{wch:10},{wch:22},{wch:44},{wch:14},{wch:18},{wch:8},{wch:8},{wch:13},{wch:52}].concat(blogUrlField ? [{wch:44}] : []);
    window.XLSX.utils.book_append_sheet(wb, ws, label);
  }

  // 델타/네이비 공용 시트 — buildJumuSheet_와 달리 "분할" 설정값(N)만큼 일 목표를 다시 쪼개 블로그 URL을
  // 1개씩 매칭한 행을 만든다(1슬롯=N행). splitEven/buildDeltaRows와 동일한 분할 규칙 사용.
  function buildDeltaSheet_(wb, f, prod) {
    const ws = {};
    const AP = ap();
    const n = Math.max(1, parseInt(prod.blogSplit, 10) || 1);
    const daysColLabel = prod.daysMultiplied ? '전체 목표' : '일 수';
    const headers = ['상품등급명','업체명','URL','MID','순위키워드','일 목표',daysColLabel,'예약일','검색키워드','블로그 스타트 URL'];
    headers.forEach((h, ci) => { sc(ws, 0, ci, h, {font:{bold:true,color:{rgb:'FFFFFF'}}, fill:h==='검색키워드'?'DC2626':(h==='블로그 스타트 URL'?'16A34A':'1F2937')}); });
    let curRow = 1;
    f.forEach(r => {
      const alloc = allocate(AP.slice(), r.dailyTarget||0, r.yupflKeyword, r.splitKeywords);
      const pp = alloc[prod.id] ?? 0;
      if (pp <= 0) return;
      const urls = (r.deltaBlogUrl||'').split(',').map(u=>u.trim()).filter(Boolean);
      // 델타는 검색키워드를 별도로 나누지 않고 순위키워드와 동일한 값을 그대로 쓴다(사용자 지정 규칙) — 네이비는 일반 검색키워드 그대로 사용.
      const kw = prod.id === 'delta' ? (r.rankKeyword||'') : kwForProd(r.searchKeyword||'', prod);
      splitEven(pp, n).forEach((partTarget, i) => {
        if (partTarget <= 0) return;
        const daysVal = prod.daysMultiplied ? partTarget*(r.days||0) : (r.days||0);
        const row = [prod.name, r.storeName||'', r.url||'', r.mid||'', r.rankKeyword||'', partTarget, daysVal, null, kw, urls[i]||''];
        row.forEach((v, ci) => {
          if (ci===7) { scDate(ws, curRow, 7, r.startDate); return; }
          sc(ws, curRow, ci, v, { align:[0,1,2,4,8,9].includes(ci)?'left':'center' });
        });
        curRow++;
      });
    });
    if (curRow < 2) curRow = 2;
    ws['!ref']  = window.XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:curRow-1,c:9}});
    ws['!cols'] = [{wch:10},{wch:22},{wch:44},{wch:14},{wch:18},{wch:8},{wch:8},{wch:13},{wch:52},{wch:44}];
    window.XLSX.utils.book_append_sheet(wb, ws, prod.name);
  }

  function buildYoupflSheet(wb, f, prod, sheetName) {
    if (!prod) return;
    const ws = {};
    const headers = ['순위키워드', '작업키워드', '플레이스ID', '작업타수', '신청일수', '미션', '익일시작'];
    headers.forEach((h, ci) => {
      sc(ws, 0, ci, h, {font:{bold:true,color:{rgb:'FFFFFF'}}, fill:'1F2937'});
    });
    const today = new Date(); today.setHours(0,0,0,0);
    let curRow = 1;
    const writeRow = (rankKw, workKw, mid, yAmt, days, mission, startDate) => {
      const start = startDate ? new Date(startDate) : today; start.setHours(0,0,0,0);
      const ikil  = Math.max(0, Math.round((start - today) / 86400000));
      const row   = [rankKw||'', workKw, mid||'', yAmt, days||0, mission||0, ikil];
      row.forEach((v, ci) => { sc(ws, curRow, ci, v, { align: ci <= 2 ? 'left' : 'center' }); });
      curRow++;
    };
    if (prod.splitProduct) {
      const rules = Array.isArray(prod.missionRules) ? prod.missionRules : [];
      f.forEach(r => {
        rules.forEach(rule => {
          const workKw = ((r.splitKeywords || {})[rule.mission] || '').trim();
          if (!workKw) return;
          const yAmt = Math.min(yupflAlloc(r.dailyTarget||0, rule.fixedPct), r.dailyTarget||0);
          if (yAmt <= 0) return;
          writeRow(r.rankKeyword, workKw, r.mid, yAmt, r.days, rule.mission, r.startDate);
        });
      });
    } else {
      f.forEach(r => {
        const workKw = (r.yupflKeyword||'').trim();
        const rule = yupflRuleFor(prod, workKw);
        const yAmt = Math.min(yupflAlloc(r.dailyTarget||0, rule ? rule.fixedPct : prod.fixedPct), r.dailyTarget||0);
        if (yAmt <= 0) return;
        writeRow(r.rankKeyword, workKw, r.mid, yAmt, r.days, rule ? rule.mission : 0, r.startDate);
      });
    }
    if (curRow < 2) curRow = 2;
    ws['!ref']  = window.XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:curRow-1,c:6}});
    ws['!cols'] = [{wch:18},{wch:40},{wch:14},{wch:8},{wch:8},{wch:8},{wch:8}];
    window.XLSX.utils.book_append_sheet(wb, ws, sheetName || prod.name || '유입플');
  }

  // ── 엑셀 다운로드 (접수 리스트) ────────────────────────────
  window.downloadExcelList = function() {
    const checkedKeys = getCheckedKeys();
    const filtered = checkedKeys.length ? allSlots.filter(s => checkedKeys.includes(s._key)) : filteredAll;
    if (!filtered.length) return alert('다운로드할 데이터가 없습니다.');

    async function buildAndDownload() {
      const XLSX = window.XLSX;
      const wb = XLSX.utils.book_new();
      const header = ['접수일시','대행사','업체명','URL','MID','순위키워드','일 수','시작일','일 목표','검색키워드','유입플키워드'];
      const rows = filtered.map(s => [
        s.createdAt ? ymd(new Date(s.createdAt)) : '',
        s.agencyId||'', s.storeName||'', s.url||'', s.mid||'',
        s.rankKeyword||'', s.days||'', s.startDate||'', s.dailyTarget||'', s.searchKeyword||'', s.yupflKeyword||'',
      ]);
      const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
      ws['!cols'] = [{wch:12},{wch:16},{wch:22},{wch:48},{wch:14},{wch:14},{wch:6},{wch:12},{wch:10},{wch:20},{wch:20}];
      XLSX.utils.book_append_sheet(wb, ws, '접수');

      // MID별 검색키워드/유입플키워드 히스토리(자체 DB + kimpro 쪽 히스토리 포함, 히스토리 모달과
      // 동일한 소스) — 서로 날짜가 다를 수 있어 시트를 분리한다. 같은 MID는 한 번만 조회.
      const btn = document.getElementById('dl-single-btn');
      if (btn) btn.disabled = true;
      const midRows = [...new Map(filtered.filter(s => s.mid).map(s => [s.mid, s])).values()];
      const histHeader = ['MID','업체명','날짜','키워드'];
      const kwHistRows = [], yupflHistRows = [];
      const [kwHistories, yupflHistories] = await Promise.all([
        Promise.all(midRows.map(s => fullKeywordHistory(s.mid))),
        Promise.all(midRows.map(s => fullYupflKeywordHistory(s.mid))),
      ]);
      midRows.forEach((s, i) => {
        kwHistories[i].forEach(h => {
          kwHistRows.push([s.mid, s.storeName || '', h.createdAt ? ymd(new Date(h.createdAt)) : '', h.searchKeyword]);
        });
        yupflHistories[i].forEach(h => {
          yupflHistRows.push([s.mid, s.storeName || '', h.createdAt ? ymd(new Date(h.createdAt)) : '', h.searchKeyword]);
        });
      });
      if (btn) btn.disabled = false;
      if (kwHistRows.length) {
        const kwHistWs = XLSX.utils.aoa_to_sheet([histHeader, ...kwHistRows]);
        kwHistWs['!cols'] = [{wch:14},{wch:22},{wch:12},{wch:40}];
        XLSX.utils.book_append_sheet(wb, kwHistWs, '검색키워드 히스토리');
      }
      if (yupflHistRows.length) {
        const yupflHistWs = XLSX.utils.aoa_to_sheet([histHeader, ...yupflHistRows]);
        yupflHistWs['!cols'] = [{wch:14},{wch:22},{wch:12},{wch:40}];
        XLSX.utils.book_append_sheet(wb, yupflHistWs, '유입플 히스토리');
      }

      const today = new Date();
      const dateStr = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
      XLSX.writeFile(wb, `접수_${dateStr}.xlsx`);
    }

    if (window.XLSX) { buildAndDownload(); } else {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = buildAndDownload;
      document.head.appendChild(s);
    }
  };

  // ── 대기 슬롯 히스토리 재접수 (같은 MID의 최근 N일 키워드 히스토리로 자동 접수) ──
  window.openReacceptModal = function() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="width:min(96vw,440px);">
        <div class="modal-title" style="display:flex;align-items:center;gap:6px;">🔁 대기 히스토리 재접수<span id="reaccept-help-btn" title="도움말" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--border);color:var(--text2);font-size:11px;font-weight:700;font-style:italic;font-family:Georgia,serif;cursor:pointer;flex-shrink:0;position:relative;top:1px;">i</span></div>
        <div id="reaccept-help" style="display:none;font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:16px;">검색키워드는 ①일 이내 이력이 있어야 처리됩니다.<br>유입플은 ②를 비우면 ③ 값을 바로 쓰고, 채우면 이력을 먼저 찾고 없을 때만 ③을 씁니다.<br>조건을 모두 충족해야 접수로 전환되고, 아니면 키워드만 채워집니다.</div>
        <div class="pmf" style="margin-bottom:12px;">
          <label>① 검색키워드 히스토리 검색 일자 (일)</label>
          <input type="number" id="reaccept-days-kw" value="7" min="1" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;">
        </div>
        <div class="pmf" style="margin-bottom:12px;">
          <label>② 유입플 키워드 히스토리 검색 일자 (일)</label>
          <input type="number" id="reaccept-days-yupfl" value="7" min="1" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;">
        </div>
        <div class="pmf" style="margin-bottom:12px;">
          <label>③ 유입플 키워드 개별 설정</label>
          <input type="text" id="reaccept-yupfl" value="" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;">
        </div>
        <div id="reaccept-result" style="font-size:12px;margin-top:14px;"></div>
        <div class="modal-footer">
          <button class="btn-cancel" id="reaccept-close-btn">닫기</button>
          <button id="reaccept-run-btn" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">실행</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#reaccept-close-btn').onclick = () => { if (!window.reacceptRunning) overlay.remove(); };
    overlay.querySelector('#reaccept-run-btn').onclick = () => runReaccept(overlay);
    overlay.querySelector('#reaccept-help-btn').onclick = () => {
      const el = overlay.querySelector('#reaccept-help');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };
  };

  async function runReaccept(overlay) {
    const runBtn   = overlay.querySelector('#reaccept-run-btn');
    const closeBtn = overlay.querySelector('#reaccept-close-btn');
    const resultEl = overlay.querySelector('#reaccept-result');
    const daysKw = parseInt(overlay.querySelector('#reaccept-days-kw').value, 10);
    if (!Number.isInteger(daysKw) || daysKw < 1) {
      alert('검색키워드 히스토리 검색 일자를 1 이상의 숫자로 입력해주세요.');
      return;
    }
    const daysYupflRaw = overlay.querySelector('#reaccept-days-yupfl').value.trim();
    const yupflSkip = daysYupflRaw === ''; // 비우면 히스토리 확인 없이 ③ 개별값 바로 사용
    const daysYupfl = yupflSkip ? null : parseInt(daysYupflRaw, 10);
    if (!yupflSkip && (!Number.isInteger(daysYupfl) || daysYupfl < 1)) {
      alert('유입플 키워드 히스토리 검색 일자를 1 이상의 숫자로 입력하거나 비워두세요.');
      return;
    }
    const yupflKw = overlay.querySelector('#reaccept-yupfl').value.trim();

    const pending = allSlots.filter(s => s.status === 'pending' && s.mid);
    if (!pending.length) { resultEl.innerHTML = '<span style="color:var(--muted)">대기 상태인 슬롯이 없습니다.</span>'; return; }

    runBtn.disabled = true; runBtn.textContent = '⏳ 히스토리 조회 중...';
    closeBtn.disabled = true;
    window.reacceptRunning = true;
    resultEl.innerHTML = '';

    // 같은 MID는 한 번만 조회 (엑셀 다운로드의 키워드 히스토리 시트와 동일 방식)
    const uniqueMids = [...new Set(pending.map(s => s.mid))];
    const histMap = new Map();
    const yupflHistMap = new Map();
    await Promise.all(uniqueMids.map(async mid => {
      const [kwHist, yupflHist] = await Promise.all([
        fullKeywordHistory(mid),
        yupflSkip ? Promise.resolve([]) : fullYupflKeywordHistory(mid), // 스킵 모드면 유입플 히스토리 조회 자체를 안 함
      ]);
      histMap.set(mid, kwHist);
      yupflHistMap.set(mid, yupflHist);
    }));

    // 검색키워드/유입플 각각 독립된 기간(일)으로 최근 히스토리 여부 판단
    const cutoffDayKw = ymd(new Date(Date.now() - daysKw * 24 * 3600 * 1000));
    const cutoffDayYupfl = yupflSkip ? null : ymd(new Date(Date.now() - daysYupfl * 24 * 3600 * 1000));
    const withinCutoff = (h, cutoffDay) => !!(h && h.createdAt && ymd(new Date(h.createdAt)) >= cutoffDay);
    const rows = pending.map(s => {
      const kwTop = (histMap.get(s.mid) || [])[0];
      const yTop  = (yupflHistMap.get(s.mid) || [])[0];
      const kwMatched = withinCutoff(kwTop, cutoffDayKw);
      const yMatched  = yupflSkip ? false : withinCutoff(yTop, cutoffDayYupfl);
      // 유입플을 스킵(②비움)했으면 개별값 사용을 그 자체로 충족된 것으로 간주 — 검색키워드만 최근이면 접수
      const ySatisfied = yupflSkip ? true : yMatched;
      const bothMatched = kwMatched && ySatisfied;
      return {
        slot: s,
        matched: kwMatched || yMatched, kwMatched, yMatched, bothMatched,
        newStatus: bothMatched ? 'accepted' : 'pending',
        matchKeyword: kwMatched ? kwTop.searchKeyword : (s.searchKeyword || ''),
        matchYupfl: yMatched ? yTop.searchKeyword : '',
      };
    });
    const matched = rows.filter(r => r.matched);

    if (!matched.length) {
      resultEl.innerHTML = `<span style="color:var(--muted)">대기 ${pending.length}건 중 최근 히스토리(검색키워드 ${daysKw}일${yupflSkip ? '' : ` / 유입플 ${daysYupfl}일`})가 있는 건이 없습니다.</span>`;
      runBtn.disabled = false; runBtn.textContent = '실행';
      closeBtn.disabled = false;
      window.reacceptRunning = false;
      return;
    }

    const acceptCount = matched.filter(r => r.bothMatched).length;
    const keepCount = matched.length - acceptCount;
    if (!confirm(`대기 ${matched.length}건 처리 대상\n- 접수 전환(접수) ${acceptCount}건\n- 키워드 갱신(대기) ${keepCount}건\n\n진행하시겠습니까?`)) {
      runBtn.disabled = false; runBtn.textContent = '실행';
      closeBtn.disabled = false;
      window.reacceptRunning = false;
      return;
    }

    runBtn.textContent = `⏳ 처리 중... (0/${matched.length})`;
    let done = 0;
    for (const r of matched) {
      const updates = { searchKeyword: r.matchKeyword, yupflKeyword: r.matchYupfl || yupflKw, status: r.newStatus };
      await HA.updateSlot(r.slot._key, updates);
      updateLocalSlot(r.slot._key, updates);
      done++;
      runBtn.textContent = `⏳ 처리 중... (${done}/${matched.length})`;
    }
    renderReceipts(false);

    resultEl.innerHTML = `<span style="color:var(--accent);font-weight:600;">✅ 접수 전환 ${acceptCount}건 / 키워드만 갱신 ${keepCount}건 처리 완료</span>`;
    runBtn.textContent = '✅ 완료'; runBtn.disabled = true;
    closeBtn.disabled = false;
    window.reacceptRunning = false;
  }

  // ── 애드로그 대량등록 접수 (그룹/키워드/URL/메모) ────────────
  // 프론트(SheetJS) xlsx를 그대로 릴레이 — 서버에서 새로 생성한 xlsx(openpyxl 등)는 adlog.kr이 거부함(실측 확인)
  window.submitAdlog = function() {
    const checkedKeys = getCheckedKeys();
    const keySet = new Set(checkedKeys);
    // 체크박스로 직접 선택한 경우 — 승인(active)·대기(pending) 상태도 예외적으로 허용 (재등록 목적)
    const target = checkedKeys.length
      ? allSlots.filter(s => keySet.has(s._key) && (s.status === 'accepted' || s.status === 'active' || s.status === 'pending'))
      : filteredAll.filter(s => s.status === 'accepted');
    if (!target.length) { alert('접수 상태인 캠페인이 없습니다.\n(체크박스 선택시 승인/대기 항목도 등록 가능)'); return; }
    openAdlogModal(target);
  };

  function buildAdlogRows(slots) {
    return slots.map(s => {
      let memo = '';
      if (s.startDate) {
        const [, m, d] = s.startDate.split('-').map(Number);
        memo = `1test ${m}/${d}`;
      }
      return { _slotKey: s._key, group: s.agencyId||'(대행사 미지정)', keyword: s.rankKeyword||'', mid: s.mid||'', memo, _statusTd: null };
    });
  }

  function openAdlogModal(target) {
    const rows = buildAdlogRows(target);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="width:min(96vw,760px);max-height:82vh;overflow-y:auto;overflow-x:hidden;">
        <div class="modal-title">애드로그 대량등록 확인</div>
        <div style="font-size:12px;margin-bottom:14px;" id="adlog-sub"></div>
        <div id="adlog-body"></div>
        <div class="modal-footer">
          <button class="btn-cancel" id="adlog-close-btn">닫기</button>
          <button id="adlog-apply-btn" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;">등록 신청</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    overlay.querySelector('#adlog-body').appendChild(buildAdlogTable(rows));

    overlay.querySelector('#adlog-sub').innerHTML =
      `<span style="color:var(--muted)">총 ${rows.length}건 —</span> <span style="color:#dc2626;font-weight:600;">검토 후 등록 신청을 눌러주세요.</span>`;

    overlay.querySelector('#adlog-close-btn').onclick = () => { if (!window.adlogSubmitting) overlay.remove(); };
    overlay.addEventListener('click', e => { if (e.target === overlay && !window.adlogSubmitting) overlay.remove(); });
    overlay.querySelector('#adlog-apply-btn').onclick = () => executeAdlogSubmit(rows, overlay);
  }

  // ag-table 스타일(비즈핏 접수 모달과 동일 클래스) — 대행사 열 포함 단일 테이블
  function buildAdlogTable(rows) {
    const block = document.createElement('div');
    block.className = 'agency-block';

    const ell = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0';
    const tbl = document.createElement('table');
    tbl.className = 'ag-table';
    tbl.style.cssText = 'table-layout:fixed;width:100%';
    tbl.innerHTML = `<thead><tr>
      <th style="width:120px">대행사</th>
      <th style="width:160px">순위키워드</th>
      <th style="width:140px">MID</th>
      <th style="width:110px">메모</th>
      <th style="width:76px;text-align:center">상태</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const statusTd = document.createElement('td');
      statusTd.style.cssText = 'text-align:center;white-space:nowrap';
      statusTd.textContent = '-';
      tr.innerHTML = `
        <td style="${ell};font-weight:700" title="${escProd(r.group)}">${escProd(r.group)}</td>
        <td style="${ell}" title="${escProd(r.keyword)}">${escProd(r.keyword||'-')}</td>
        <td style="${ell};font-size:11px;color:var(--text2)" title="${escProd(r.mid)}">${escProd(r.mid||'-')}</td>
        <td style="padding:2px 4px"><input type="text" value="${escProd(r.memo)}" style="width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:4px;padding:3px 5px;font-size:12px;font-family:inherit;background:#fff;color:inherit"></td>
      `;
      tr.appendChild(statusTd);
      tbody.appendChild(tr);
      r._statusTd = statusTd;
      tr.querySelector('input').addEventListener('input', e => { r.memo = e.target.value; });
    });
    tbl.appendChild(tbody);
    block.appendChild(tbl);
    return block;
  }

  function buildAdlogXlsxBase64(rows) {
    const XLSX = window.XLSX;
    const header = ['그룹(띄어쓰기까지 일치해야됨)', '키워드(필수)', 'URL(필수)', '메모(미작성시 공란)'];
    const aoa = [header, ...rows.map(r => [r.group, r.keyword, r.mid, r.memo])];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:22},{wch:20},{wch:20},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws, '대량등록');
    const arr = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const bytes = new Uint8Array(arr);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  const ADLOG_BATCH_SIZE = 100; // adlog.kr 대량등록 1회 최대 100건 제한

  async function executeAdlogSubmit(rows, overlay) {
    const applyBtn = overlay.querySelector('#adlog-apply-btn');
    const closeBtn = overlay.querySelector('#adlog-close-btn');
    const subEl    = overlay.querySelector('#adlog-sub');
    applyBtn.disabled = true; applyBtn.textContent = '⏳ 등록 중...'; applyBtn.style.background = '#6b7280'; applyBtn.style.cursor = 'default';
    closeBtn.disabled = true;
    window.adlogSubmitting = true;

    async function run() {
      const chunks = [];
      for (let i = 0; i < rows.length; i += ADLOG_BATCH_SIZE) chunks.push(rows.slice(i, i + ADLOG_BATCH_SIZE));

      let totalCount = 0, totalRegistered = 0, hadFailure = false;
      const failMessages = [];
      const succeededSlotKeys = [];

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        if (chunks.length > 1) {
          applyBtn.textContent = `⏳ 등록 중... (${i+1}/${chunks.length}배치)`;
          subEl.innerHTML = `<span style="color:var(--muted)">배치 ${i+1}/${chunks.length} 전송 중 (${chunk.length}건)...</span>`;
        }

        let result;
        try {
          const fileBase64 = buildAdlogXlsxBase64(chunk);
          result = await callBizfitProxy('/adlog-register', { fileBase64 });
        } catch(e) {
          result = { success: false, message: '서버 호출 실패: ' + e.message };
        }

        if (result.success) {
          chunk.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = '<span style="color:var(--accent);">✅ 완료</span>'; if (r._slotKey) succeededSlotKeys.push(r._slotKey); });
          totalCount      += (result.total ?? chunk.length);
          totalRegistered += (result.registered ?? chunk.length);
        } else {
          hadFailure = true;
          failMessages.push(result.message || '알 수 없는 오류');
          chunk.forEach(r => { if (r._statusTd) r._statusTd.innerHTML = `<span style="color:var(--danger);" title="${escProd(result.message||'')}">❌ 실패</span>`; });
        }
      }

      if (succeededSlotKeys.length) {
        // 목록에 배지 표시용 — 성공한 슬롯만 표시
        await Promise.all(succeededSlotKeys.map(k => HA.updateSlot(k, { adlogSubmitted: true })));
        succeededSlotKeys.forEach(k => { const s = allSlots.find(x => x._key === k); if (s) s.adlogSubmitted = true; });
        renderReceipts(false);
      }

      if (!hadFailure) {
        const batchNote = chunks.length > 1 ? ` (${chunks.length}개 배치로 전송)` : '';
        subEl.innerHTML = `<span style="color:var(--accent);font-weight:600;">✅ 총${totalCount}개 중 ${totalRegistered}개 등록 되었습니다.${batchNote}</span>`;
        applyBtn.textContent = '✅ 등록 완료'; applyBtn.style.background = '#475569'; applyBtn.style.cursor = 'default';
      } else {
        subEl.innerHTML = `<span style="color:var(--danger);font-weight:600;">❌ 일부 배치 실패: ${escProd(failMessages.join(' / '))}</span>`;
        applyBtn.textContent = '❌ 등록 실패'; applyBtn.style.background = '#b91c1c'; applyBtn.style.cursor = 'default';
      }
      applyBtn.disabled = true;
      closeBtn.disabled = false;
      window.adlogSubmitting = false;
    }

    if (window.XLSX) { await run(); } else {
      await new Promise(resolve => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = resolve;
        document.head.appendChild(s);
      });
      await run();
    }
  }

  // ── 엑셀 다운로드 (대행사별 · 3시트) ────────────────────────
  window.downloadExcel = function() {
    const checkedKeys = getCheckedKeys();
    const target = checkedKeys.length ? allSlots.filter(s => checkedKeys.includes(s._key)) : filteredAll;
    if (!target.length) { alert('다운로드할 데이터가 없습니다.'); return; }
    if (!ap().length)   { alert('활성화된 상품이 없습니다.\n상품 유형 설정에서 최소 1개를 켜주세요.'); return; }

    function doDownload() {
      const agencies = getAgencies(target);
      const btn = document.getElementById('dl-main-btn');
      if (btn) btn.disabled = true;
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const shortD = () => { const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
      (async () => {
        try {
          for (let i = 0; i < agencies.length; i++) {
            const ag = agencies[i], f = slotsByAgency(target, ag), realAg = ag === '(대행사 미지정)' ? '' : ag;
            setProg(true, Math.round(100*i/agencies.length), `[${ag}] 시트 생성 중... (${i+1}/${agencies.length}개 대행사)`);
            await sleep(60);
            const wb = window.XLSX.utils.book_new();
            buildJusuSheet(wb, f);
            buildJumuSheet_(wb, f, '일반', p => !FIXED_PROD_IDS.has(p.id));
            ap().filter(p => FIXED_PROD_IDS.has(p.id) && !p.deductOnly).forEach(prod => {
              if (prod.fixedAlloc) buildYoupflSheet(wb, f, prod, prod.name);
              else if (prod.blogUrlProduct) buildDeltaSheet_(wb, f, prod);
              else buildJumuSheet_(wb, f, prod.name, p => p.id === prod.id);
            });
            window.XLSX.writeFile(wb, realAg ? `${realAg}-주문서.xlsx` : `주문서-${shortD()}.xlsx`);
            await sleep(300);
          }
          setProg(true, 100, `완료 ✅  ${agencies.length}개 대행사 · ${target.length}건`);
          await sleep(2000);
        } catch(e) {
          alert('오류: ' + e.message);
        } finally {
          if (btn) btn.disabled = false;
          setProg(false);
        }
      })();
    }

    if (window.XLSX) { doDownload(); } else {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = doDownload;
      document.head.appendChild(s);
    }
  };

  // buildJumuSheet_('일반', ...)와 동일한 배분 로직 — 엑셀 셀 대신 등록 페이로드 행 생성.
  // 찰리는 등급/가격 체계가 달라 별도 메뉴(NP 위치저장)로 접수해야 해서 prodFilter로 charlie만 뽑아 별도 호출
  function buildNormalRows(slots, prodFilter = p => !FIXED_PROD_IDS.has(p.id)) {
    const deductProd = ap().find(p => p.deductOnly);
    const rows = [];
    let deductTarget = 0, deductAmount = 0;
    slots.forEach(r => {
      const { alloc, prods: slotProds, gradeProds } = allocRowsForSlot(r);
      if (deductProd) {
        const dAmt = alloc[deductProd.id] || 0;
        if (dAmt > 0) {
          const unitPrice = (r.unitPrice!=null && r.unitPrice>0) ? r.unitPrice : (userPriceMap.get(r.userId) || 0);
          deductTarget += dAmt * (r.days||0);
          deductAmount += dAmt * (r.days||0) * unitPrice;
        }
      }
      slotProds.filter(prodFilter).forEach(prod => {
        const pp = alloc[prod.id] ?? 0;
        if (pp <= 0) return;
        const daysVal = prod.daysMultiplied ? pp*(r.days||0) : (r.days||0);
        const kw = gradeProds ? kwForGradeProd(r.searchKeyword||'', prod, gradeProds) : kwForProd(r.searchKeyword||'', prod);
        rows.push({
          _slotKey:   r._key,
          _doneKey:   prod.name,
          _normalSubmitted: !!(r.normalDoneProducts && r.normalDoneProducts.includes(prod.name)),
          _days:            r.days||0,
          _daysMultiplied:  !!prod.daysMultiplied,
          상품등급명: prod.name,
          업체명:     r.storeName||'',
          업체URL:    r.url||'',
          PID번호:    r.mid||'',
          순위키워드: r.rankKeyword||'',
          일목표:     pp,
          일수:       daysVal,
          예약일:     r.startDate||'',
          검색키워드: kw,
        });
      });
    });
    return { rows, deductTarget, deductAmount };
  }

  // total을 n개로 최대한 고르게(나머지는 앞쪽부터 +1) 나눔 — 델타 블로그 URL 분할용
  function splitEven(total, n) {
    if (n <= 0) return [];
    const base = Math.floor(total / n);
    const rem  = total - base * n;
    return Array.from({length: n}, (_, i) => base + (i < rem ? 1 : 0));
  }

  // 델타/네이비 공용 — "분할" 설정값(N)만큼 일 목표를 쪼개 블로그 URL 1개씩 매칭한 N개 행을 만듦(1슬롯=N행, buildNormalRows와 별도 함수)
  // _doneKey에 분할 순번을 붙여 완료 여부를 행 단위로 추적. daysMultiplied는 상품별로 다름(델타=true, 네이비=false).
  function buildDeltaRows(slots, prodId = 'delta') {
    const baseProd = prods.find(p => p.id === prodId);
    if (!baseProd) return [];
    const n = Math.max(1, parseInt(baseProd.blogSplit, 10) || 1);
    const rows = [];
    slots.forEach(r => {
      const { alloc, gradeProds } = allocRowsForSlot(r);
      // 등급 매칭이 있으면 그 슬롯은 매칭 결과에서만(비활성이어도) 델타/네이비를 찾고, 없으면 기존처럼 활성 상품만 대상으로 한다.
      const prod = gradeProds ? gradeProds.find(p => p.name === baseProd.name) : ap().find(p => p.id === prodId);
      if (!prod) return;
      const pp = alloc[prod.id] ?? 0;
      if (pp <= 0) return;
      const urls = (r.deltaBlogUrl||'').split(',').map(u=>u.trim()).filter(Boolean);
      // 델타는 검색키워드를 별도로 나누지 않고 순위키워드와 동일한 값을 그대로 쓴다(사용자 지정 규칙) — 네이비는 일반 검색키워드 그대로 사용.
      const kw = prodId === 'delta' ? (r.rankKeyword||'') : (gradeProds ? kwForGradeProd(r.searchKeyword||'', prod, gradeProds) : kwForProd(r.searchKeyword||'', prod));
      splitEven(pp, n).forEach((partTarget, i) => {
        if (partTarget <= 0) return;
        const doneKey = `${prod.name}#${i+1}`;
        rows.push({
          _slotKey:   r._key,
          _doneKey:   doneKey,
          _normalSubmitted: !!(r.normalDoneProducts && r.normalDoneProducts.includes(doneKey)),
          _requiresBlogUrl: true,
          _days:            r.days||0,
          _daysMultiplied:  !!prod.daysMultiplied,
          상품등급명: prod.name,
          업체명:     r.storeName||'',
          업체URL:    r.url||'',
          PID번호:    r.mid||'',
          순위키워드: r.rankKeyword||'',
          일목표:     partTarget,
          일수:       prod.daysMultiplied ? partTarget*(r.days||0) : (r.days||0),
          예약일:     r.startDate||'',
          검색키워드: kw,
          블로그URL:  urls[i] || '',
        });
      });
    });
    return rows;
  }

  // daysMultiplied 상품(찰리)은 "일수" 칸에 실제 일수 대신 일목표×일수(전체목표)가 들어있으므로
  // 그 값을 그대로 합산, 아니면 일목표×일수로 계산 — buildSubmitAgencyBlock과 탭 요약에서 공유
  function daysMultipliedSum(rows, daysMultiplied) {
    return daysMultiplied
      ? rows.reduce((a,r)=>a+(r.일수||0), 0)
      : rows.reduce((a,r)=>a+(r.일목표||0)*(r.일수||0), 0);
  }

  // 유입플/분할 두 상품을 모두 훑어서 슬롯 하나당 최대 두 종류(유입플 1줄 + 분할 미션별 N줄)의 접수 행을 만든다.
  // _slotKey는 슬롯 식별(승인/완료 판정용), _rowKey는 화면·제출 단위 식별(슬롯당 여러 행이 나올 수 있어 별도로 둠)
  function buildYoupflRows(slots) {
    const yupfl = ap().find(p => p.id === 'yupfl' && p.fixedAlloc);
    const split = ap().find(p => p.id === 'yupfl2' && p.splitProduct);
    if (!yupfl && !split) return [];
    const deduct = ap().find(p => p.deductOnly);
    const rows = [];
    slots.forEach(s => {
      const agencyId  = s.agencyId||'(대행사 미지정)';
      // 슬롯 저장 단가 우선, 없으면 현재 회원 단가로 폴백 (정산관리와 동일한 규칙)
      const unitPrice = (s.unitPrice!=null && s.unitPrice>0) ? s.unitPrice : null;
      // 차감이 활성화되어 있으면 최우선 적용된 뒤 남은 수량을 유입플/분할 %의 기준으로 쓴다
      const base = s.dailyTarget||0;
      const remaining = deduct ? Math.max(0, base - yupflAlloc(base, deduct.fixedPct)) : base;

      // MID가 이미 진행중인 미션 번호(들)를 알고 있으면 그 상태를 그대로 따른다 — 미션이 1개면 유입플(단일),
      // 2개 이상이면 분할 로직으로 강제(작업키워드 개수 규칙/화면 입력 분할 키워드는 건너뜀). 모르면 기존 방식 그대로.
      const known = (gradeMatchOn && !s.isRequeue) ? knownYupflMissionKeywords(s.mid) : null;
      const knownMissions = known ? Object.keys(known).map(Number) : [];

      if (knownMissions.length >= 2 && split) {
        // 미션별 % 규칙 설정과 무관하게 미션당 10% 고정(미션이 몇 개든 각자 10%)
        // 미션 번호(라우팅)만 ha/grades 기준으로 강제하고, 키워드는 일반 탭과 동일하게 화면에 지금 입력된 값을 그대로 씀
        // (분할 입력칸이 없는 미션이면 화면에 값이 없으므로 그때만 ha/grades 값으로 보완)
        knownMissions.forEach(mission => {
          const workKw = ((s.splitKeywords || {})[mission] || '').trim() || known[mission];
          const yAmt = Math.min(yupflAlloc(remaining, 10), remaining);
          if (yAmt <= 0) return;
          rows.push({
            _slotKey: s._key, _rowKey: `${s._key}__${mission}`, _prodId: 'yupfl2', _prodLabel: split.name, _prodColor: split.color,
            _fixedSubmitted: !!(s.splitFixedSubmitted && s.splitFixedSubmitted[mission]),
            agencyId, userId: s.userId||'', unitPrice,
            storeName: s.storeName||'', rankKw: s.rankKeyword||'',
            workKw, placeId: s.mid||'', target: yAmt, days: s.days||0, startDate: s.startDate||'',
            autoMission: mission,
          });
        });
      } else if (knownMissions.length === 1 && yupfl) {
        // 미션 번호만 ha/grades 기준으로 강제하고, 키워드는 일반 탭과 동일하게 화면 유입플 키워드 칸에 지금 입력된 값을 그대로 씀
        const mission = knownMissions[0];
        const workKw  = (s.yupflKeyword||'').trim();
        const rules   = Array.isArray(yupfl.missionRules) ? yupfl.missionRules : [];
        const rule    = rules.find(r => r.mission === mission) || { mission, fixedPct: yupfl.fixedPct };
        const yAmt = Math.min(yupflAlloc(remaining, rule.fixedPct), remaining);
        if (yAmt > 0) {
          rows.push({
            _slotKey: s._key, _rowKey: s._key, _prodId: 'yupfl', _prodLabel: yupfl.name, _prodColor: yupfl.color,
            _fixedSubmitted: !!s.fixedSubmitted,
            agencyId, userId: s.userId||'', unitPrice,
            storeName: s.storeName||'', rankKw: s.rankKeyword||'',
            workKw, placeId: s.mid||'', target: yAmt, days: s.days||0, startDate: s.startDate||'',
            autoMission: mission,
          });
        }
      } else {
        if (yupfl) {
          const workKw = (s.yupflKeyword||'').trim();
          const rule   = yupflRuleFor(yupfl, workKw);
          const yAmt = Math.min(yupflAlloc(remaining, rule ? rule.fixedPct : yupfl.fixedPct), remaining);
          if (yAmt > 0) {
            rows.push({
              _slotKey: s._key, _rowKey: s._key, _prodId: 'yupfl', _prodLabel: yupfl.name, _prodColor: yupfl.color,
              _fixedSubmitted: !!s.fixedSubmitted,
              agencyId, userId: s.userId||'', unitPrice,
              storeName: s.storeName||'', rankKw: s.rankKeyword||'',
              workKw, placeId: s.mid||'', target: yAmt, days: s.days||0, startDate: s.startDate||'',
              autoMission: rule ? rule.mission : null,
            });
          }
        }
        if (split && Array.isArray(split.missionRules)) {
          split.missionRules.forEach(rule => {
            const workKw = ((s.splitKeywords || {})[rule.mission] || '').trim();
            if (!workKw) return;
            const yAmt = Math.min(yupflAlloc(remaining, rule.fixedPct), remaining);
            if (yAmt <= 0) return;
            rows.push({
              _slotKey: s._key, _rowKey: `${s._key}__${rule.mission}`, _prodId: 'yupfl2', _prodLabel: split.name, _prodColor: split.color,
              _fixedSubmitted: !!(s.splitFixedSubmitted && s.splitFixedSubmitted[rule.mission]),
              agencyId, userId: s.userId||'', unitPrice,
              storeName: s.storeName||'', rankKw: s.rankKeyword||'',
              workKw, placeId: s.mid||'', target: yAmt, days: s.days||0, startDate: s.startDate||'',
              autoMission: rule.mission,
            });
          });
        }
      }
    });
    return rows;
  }

  window.submitDirect = function() {
    const checkedKeys = getCheckedKeys();
    const keySet = new Set(checkedKeys);
    const base   = checkedKeys.length ? allSlots.filter(s => keySet.has(s._key)) : filteredAll;
    // 체크 선택 시 active도 대상 포함(초기화 재진입용). 기본 동작은 accepted만.
    const allowedStatuses = checkedKeys.length ? ['accepted', 'active'] : ['accepted'];
    const target = base.filter(s => allowedStatuses.includes(s.status));
    if (!target.length) { alert('접수 상태인 캠페인이 없습니다.'); return; }
    const hasNormal  = ap().some(p => !FIXED_PROD_IDS.has(p.id));
    const hasFixed   = ap().some(p => p.fixedAlloc && !p.deductOnly);
    const hasCharlie = ap().some(p => p.id === 'charlie');
    const hasDelta   = ap().some(p => p.id === 'delta');
    const hasNavy    = ap().some(p => p.id === 'navy');
    if (!hasNormal && !hasFixed && !hasCharlie && !hasDelta && !hasNavy) {
      alert('활성화된 상품이 없습니다.\n상품 유형 설정에서 최소 1개를 켜주세요.');
      return;
    }
    openSubmitModal(target);
  };

  // "접수 신청" 버튼을 완료 상태로 잠금 — wireSubmitTab/유입플 탭/lockDoneButtons 공용
  function markApplyBtnDone(btn) {
    btn.disabled = true; btn.textContent = '✅ 전체 완료'; btn.style.background = '#475569'; btn.style.cursor = 'default';
  }

  // 접수 신청 전 사전검사(executeSubmit과 동일 조건) — 오류 있으면 버튼 비활성화. 상태칸은 안 건드림(오류 배지 중복).
  function validateNormalRowsForSubmit(rows) {
    let anyFail = false;
    rows.forEach(r => {
      if (r._normalSubmitted) return;
      const kwCount = (r.검색키워드 || '').split(',').map(k => k.trim()).filter(k => k).length;
      let fail = kwCount === 0 || (r.일목표 || 0) < 10 || (r._requiresBlogUrl && !r.블로그URL);
      if (fail) { r._kwFail = true; anyFail = true; }
    });
    return anyFail;
  }

  // 검색키워드 미입력/일목표 10미만/블로그URL 미입력 건수 — 대행사 헤더 배지, 탭 상단 요약에 공용으로 씀
  function rowIssueCounts(rows, checkBlogUrl=false) {
    const kwEmptyCount = rows.filter(r => (r.검색키워드||'').split(',').map(k=>k.trim()).filter(k=>k).length === 0).length;
    const lowTargetCount = rows.filter(r => (r.일목표||0) < 10).length;
    const blogUrlEmptyCount = checkBlogUrl ? rows.filter(r => !r.블로그URL).length : 0;
    return { kwEmptyCount, lowTargetCount, blogUrlEmptyCount };
  }

  // 탭 상단에 "OO대행사 - 검색키워드 0개 N건 / 일 목표 10 미만 N건 / 블로그 URL 미입력 N건" 식으로 대행사별 문제 요약
  function agencyIssueSummaryHtml(plan, label='', checkBlogUrl=false) {
    const prefix = label ? `[${escProd(label)}] ` : '';
    return plan.map(p => {
      const { kwEmptyCount, lowTargetCount, blogUrlEmptyCount } = rowIssueCounts(p.rows, checkBlogUrl);
      if (!kwEmptyCount && !lowTargetCount && !blogUrlEmptyCount) return '';
      const parts = [];
      if (kwEmptyCount) parts.push(`검색키워드 0개 ${kwEmptyCount}건`);
      if (lowTargetCount) parts.push(`일 목표 10 미만 ${lowTargetCount}건`);
      if (blogUrlEmptyCount) parts.push(`블로그 URL 미입력 ${blogUrlEmptyCount}건`);
      return `<div style="color:#dc2626;font-size:11px;margin-top:2px;">⚠️ ${prefix}${escProd(p.agency)} - ${parts.join(' / ')}</div>`;
    }).join('');
  }

  // 유입플 탭 전용 — executeYoupflSubmit 안의 검사(workKw 미입력)와 동일 조건.
  function validateYoupflRowsForSubmit(rows) {
    let anyFail = false;
    rows.forEach(r => {
      if (r._fixedSubmitted) return;
      if (!r.workKw) { r._kwFail = true; anyFail = true; }
    });
    return anyFail;
  }

  function wireSubmitTab({ has, plan, bodyEl, subEl, applyBtn, label, daysMultiplied=false, blogUrl=false, target, emptyMsg, onSubmit }) {
    if (!has) {
      if (emptyMsg) { subEl.textContent = emptyMsg; applyBtn.disabled = true; }
      return;
    }
    let totalSlots = 0, totalTarget = 0;
    plan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, label, daysMultiplied, blogUrl);
      if (block) bodyEl.appendChild(block);
      // 업체명 기준으로 세면 동명 업체가 있는 슬롯이 하나로 뭉개져 실제 슬롯 수보다 적게 표시됨 — _slotKey로 세야 함
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, daysMultiplied);
    });
    subEl.innerHTML = `<span style="color:var(--muted)">대행사 ${plan.length}곳 · ${label} ${totalSlots}건 · 목표 합계 ${totalTarget.toLocaleString()}</span>${agencyIssueSummaryHtml(plan)}`;
    const allRows = plan.flatMap(p => p.rows);
    // 이 탭 행이 전부 이미 완료(_normalSubmitted)면 슬롯이 active 아니어도 완료 표시
    if (target.every(s => s.status === 'active') || (allRows.length && allRows.every(r => r._normalSubmitted))) {
      markApplyBtnDone(applyBtn);
    } else if (validateNormalRowsForSubmit(allRows)) {
      applyBtn.disabled = true;
      applyBtn.title = '오류가 있는 항목을 먼저 수정해주세요';
      applyBtn.style.background = '#9ca3af'; applyBtn.style.cursor = 'not-allowed';
    } else {
      applyBtn.onclick = onSubmit;
    }
  }

  // 블로그 탭 — 델타(NP 위치저장)와 네이비(NP트래픽)를 한 탭에 같이 보여주되, 접수는 각자의 등급/adrole 경로로 따로 나간다.
  // 표는 상품별로 분리해서 붙이므로(상품등급명 칸이 델타/네이비로 구분됨) 헤더의 "일수 vs 전체목표" 라벨도 각자 정확하게 유지된다.
  function wireBlogSubmitTab({ hasDelta, hasNavy, deltaPlan, navyPlan, bodyEl, subEl, applyBtn, target, onSubmit }) {
    if (!hasDelta && !hasNavy) {
      subEl.textContent = '블로그 배분 대상 슬롯이 없습니다.';
      applyBtn.disabled = true;
      return;
    }
    let totalSlots = 0, totalTarget = 0;
    // 델타/네이비는 같이 접수될 필요 없는 독립 상품 — 비활성인 쪽, 그리고 배분 0인 대행사는 블록 자체를 안 그린다.
    if (hasDelta) deltaPlan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, '델타', true, true);
      if (block) bodyEl.appendChild(block);
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, true);
    });
    if (hasNavy) navyPlan.forEach(p => {
      const block = buildSubmitAgencyBlock(p, '네이비', false, true);
      if (block) bodyEl.appendChild(block);
      totalSlots += new Set(p.rows.map(r => r._slotKey)).size;
      totalTarget += daysMultipliedSum(p.rows, false);
    });
    const issueSummary = (hasDelta ? agencyIssueSummaryHtml(deltaPlan, '델타', true) : '') + (hasNavy ? agencyIssueSummaryHtml(navyPlan, '네이비', true) : '');
    subEl.innerHTML = `<span style="color:var(--muted)">대행사 ${deltaPlan.length}곳 · 블로그 ${totalSlots}건 · 목표 합계 ${totalTarget.toLocaleString()}</span>${issueSummary}`;
    const allRows = [...deltaPlan.flatMap(p => p.rows), ...navyPlan.flatMap(p => p.rows)];
    if (target.every(s => s.status === 'active') || (allRows.length && allRows.every(r => r._normalSubmitted))) {
      markApplyBtnDone(applyBtn);
    } else if (validateNormalRowsForSubmit(allRows)) {
      applyBtn.disabled = true;
      applyBtn.title = '오류가 있는 항목을 먼저 수정해주세요';
      applyBtn.style.background = '#9ca3af'; applyBtn.style.cursor = 'not-allowed';
    } else {
      applyBtn.onclick = onSubmit;
    }
  }

  // 레그별 "접수 신청" 버튼 셀렉터 — openSubmitModal 안 여러 곳(lockDoneButtons, 자동승인 레이스 가드)에서 공용.
  // 델타/네이비는 "블로그" 탭 하나(#bsub-apply-btn)를 공유 — 등급 체계가 달라도 UI 버튼은 하나.
  const LEG_BTN_SEL = { normalKeys: '#submit-apply-btn', fixedKeys: '#youpfl-apply-btn', charlieKeys: '#csub-apply-btn', deltaKeys: '#bsub-apply-btn', navyKeys: '#bsub-apply-btn' };

  // 진짜 신규 오픈("접수" 버튼)만 이 진입점을 타서 토글을 항상 on으로 초기화 — 토글 버튼 자체의 재오픈은
  // 방금 뒤집은 값을 유지해야 하므로 renderSubmitModal()을 직접 호출한다(아래 gmBtn.onclick 참고).
  async function openSubmitModal(target) {
    gradeMatchOn = true;
    scheduleConfig = null;
    scheduleDraftRows = [{ time: '10:00', pct: 100 }];
    return renderSubmitModal(target);
  }
  // 각 탭의 plan/rows만 계산하는 순수 데이터 빌더 — renderSubmitModal의 최초 렌더/토글 재계산 양쪽에서 재사용.
  function computeSubmitData(target) {
    const agencies   = getAgencies(target);
    const normalPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      ...buildNormalRows(slotsByAgency(target, ag)),
    }));
    // 찰리는 등급/가격 체계가 일반 상품(NP트래픽)과 다른 별도 메뉴(NP 위치저장)로 접수해야 하므로
    // 같은 상품등급명이 겹쳐도(가격은 다름) 절대 같은 grade-info 호출에 섞이지 않게 완전히 분리한다.
    const charliePlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      ...buildNormalRows(slotsByAgency(target, ag), p => p.id === 'charlie'),
    }));
    // 델타/네이비 둘 다 찰리와 마찬가지로 별도 탭 — buildNormalRows(슬롯당 1행)와 달리 "분할" 설정값만큼
    // 슬롯당 여러 행(블로그 URL 1개씩)이 나올 수 있어 전용 buildDeltaRows를 쓴다(daysMultiplied 여부만 상품별로 다름).
    const deltaPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      rows: buildDeltaRows(slotsByAgency(target, ag), 'delta'),
    }));
    const navyPlan = agencies.map(ag => ({
      agency: ag, realAg: ag === '(대행사 미지정)' ? '' : ag,
      rows: buildDeltaRows(slotsByAgency(target, ag), 'navy'),
    }));
    const yupflRows  = buildYoupflRows(target);
    // hasNormal을 사이트 전체 설정(ap())으로 판단하면 일반 상품이 없어도 true가 되어 normalKeys가 빈 채로
    // 교집합이 영원히 안 채워져 유입플/찰리만 쓰는 대상이 승인으로 못 넘어가므로, hasFixed/hasCharlie처럼 실제 제출 행 유무로 판단
    const hasNormal  = normalPlan.some(p => p.rows.length > 0);
    const hasFixed   = yupflRows.length > 0;
    const hasCharlie = charliePlan.some(p => p.rows.length > 0);
    const hasDelta   = deltaPlan.some(p => p.rows.length > 0);
    const hasNavy    = navyPlan.some(p => p.rows.length > 0);
    const defaultTab = hasNormal ? 'normal' : (hasFixed ? 'fixed' : (hasCharlie ? 'charlie' : ((hasDelta||hasNavy) ? 'blog' : 'normal')));
    return { normalPlan, charliePlan, deltaPlan, navyPlan, yupflRows, hasNormal, hasFixed, hasCharlie, hasDelta, hasNavy, defaultTab };
  }

  async function renderSubmitModal(target) {
    // 등급 자동매칭이 buildNormalRows/buildDeltaRows에서 동기적으로 GRADE_CACHE를 읽으므로 먼저 채워둔다.
    await fetchGradesBatch([...new Set(target.map(s => s.mid).filter(Boolean))]);
    let data = computeSubmitData(target);
    scheduleValidationRows = flattenScheduleRows(data);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="width:min(96vw,940px);max-height:82vh;overflow-y:auto;overflow-x:hidden;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;">
