<div id="receipt-page">
<style>
  .ha-switch { position:relative; display:inline-block; width:28px; height:16px; flex-shrink:0; }
  .ha-switch input { opacity:0; width:0; height:0; position:absolute; }
  .ha-switch .ha-switch-track { position:absolute; inset:0; background:#cbd5e1; border-radius:999px; transition:.15s; cursor:pointer; }
  .ha-switch .ha-switch-track::before { content:''; position:absolute; width:12px; height:12px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.15s; }
  .ha-switch input:checked + .ha-switch-track { background:#f59e0b; }
  .ha-switch input:checked + .ha-switch-track::before { transform:translateX(12px); }
  #receipt-page .filter-bar {
    background:#fff; border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; display:flex; gap:10px; align-items:center; margin-bottom:14px;
  }
  #receipt-page select, #receipt-page input[type=text] {
    padding:6px 10px; border:1px solid var(--border); border-radius:6px;
    font-size:12px; font-family:inherit; color:var(--text); background:#fff; outline:none;
  }
  #receipt-page #filter-status { width:112px; }
  #receipt-page .tbl-wrap {
    background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden;
  }
  #receipt-page table { width:100%; border-collapse:collapse; font-size:12px; }
  #receipt-page thead th {
    background:#1e293b; color:#fff; padding:11px 10px; font-weight:500;
    border-right:1px solid #2d3f55; white-space:nowrap; text-align:center;
  }
  #receipt-page tbody td {
    padding:11px 10px; border-bottom:1px solid var(--border); text-align:center; vertical-align:middle;
  }
  #receipt-page tbody tr:last-child td { border-bottom:none; }
  #receipt-page tbody tr:hover { background:#f8fafc; }
  .status-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .s-pending   { background:rgba(245,158,11,.1);  color:#b45309; }
  .s-accepted  { background:rgba(59,130,246,.1);  color:#1d4ed8; }
  .s-active    { background:rgba(16,185,129,.1);  color:#059669; }
  .s-expired   { background:#f1f5f9; color:#64748b; }
  .action-btn { padding:4px 10px; border-radius:5px; border:none; font-size:11px; font-weight:600; cursor:pointer; transition:.15s; }
  .btn-approve { background:var(--accent); color:#fff; }
  .btn-approve:hover { background:var(--accent2); }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9000; display:flex; align-items:center; justify-content:center; }
  .modal-box { background:#fff; border-radius:16px; width:520px; max-height:80vh; overflow-y:auto; overscroll-behavior:contain; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .modal-title { font-size:17px; font-weight:700; margin-bottom:20px; }
  .modal-field { margin-bottom:14px; }
  .modal-field label { display:block; font-size:12px; color:var(--text2); font-weight:600; margin-bottom:5px; }
  .modal-field input, .modal-field textarea, .modal-field select { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:inherit; outline:none; color:var(--text); box-sizing:border-box; }
  .modal-field textarea { resize:vertical; min-height:70px; }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus { border-color:var(--accent); }
  .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .agency-block{margin-bottom:16px;border:1.5px solid #c7d2fe;border-radius:14px;overflow:hidden}
  .agency-block:last-child{margin-bottom:0}
  .agency-hd{display:flex;justify-content:space-between;align-items:center;background:#eff4ff;padding:12px 16px;border-bottom:1.5px solid #c7d2fe}
  .agency-hd .aname{font-size:15px;font-weight:800;color:var(--info)}
  .agency-hd .ameta{font-size:12px;color:#6366f1;margin-top:1px}
  .ag-table{width:100%;border-collapse:collapse;font-size:13px}
  .ag-table thead th{background:#f8fafc;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  .ag-table tbody tr{border-bottom:1px solid var(--border)}
  .ag-table tbody tr:last-child{border-bottom:none}
  .ag-table tbody td{padding:10px 14px}
  .ag-table.ag-table-tight thead th{padding:9px 10px}
  .ag-table.ag-table-tight tbody td{padding:10px 10px}
  .agency-ft{background:#f0f4ff;border-top:1.5px solid #c7d2fe;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .agency-ft .totals{display:flex;gap:20px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .btn-cancel { padding:8px 20px; border:1px solid var(--border); border-radius:7px; background:#fff; cursor:pointer; font-size:13px; }
  .btn-save   { padding:8px 20px; border:none; border-radius:7px; background:var(--accent); color:#fff; cursor:pointer; font-size:13px; font-weight:600; }
  .btn-save:hover { background:var(--accent2); }
  .empty-row td { height:200px; text-align:center; color:var(--muted); font-size:13px; }
  .pagination { display:flex; justify-content:center; gap:5px; margin-top:16px; }
  .pg-btn { width:30px; height:30px; border:1px solid var(--border); background:#fff; border-radius:6px; font-size:12px; cursor:pointer; color:var(--text2); display:flex; align-items:center; justify-content:center; }
  .pg-btn.active { background:var(--info); color:#fff; border-color:var(--info); }
  .slot-detail { text-align:left; }
  .slot-detail dt { font-size:11px; color:var(--text2); margin-top:10px; }
  .slot-detail dd { font-size:13px; margin:2px 0 0 0; font-weight:500; }
  .loading-wrap { display:flex; align-items:center; justify-content:center; height:200px; color:var(--muted); font-size:13px; gap:8px; }
  .spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .detail-kw-input { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; outline:none; color:var(--text); box-sizing:border-box; margin-top:3px; }
  .detail-kw-input:focus { border-color:var(--accent); }
  .stat-bar { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:16px; }
  .stat-box { background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px 20px; display:flex; align-items:center; gap:14px; }
  .stat-box.clickable { cursor:pointer; transition:box-shadow .15s,border-color .15s; }
  .stat-box.clickable:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); border-color:#c7d2fe; }
  .stat-box .sb-icon { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .stat-box .sb-label { font-size:11px; color:var(--text2); font-weight:600; margin-bottom:4px; }
  .stat-box .sb-val { font-size:22px; font-weight:800; line-height:1; }

  /* ── 반응형 ── */
  @media (max-width: 768px) {
    .stat-bar { grid-template-columns: repeat(3,1fr); gap: 8px; }
    .sb-val { font-size:16px !important; }
    .sb-icon { width:30px !important; height:30px !important; font-size:13px !important; }
    #receipt-page .filter-bar { flex-wrap: wrap; gap: 6px; }
    #receipt-page .filter-bar > * { flex: 1 1 calc(50% - 6px); min-width: 120px; }
    #receipt-page .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    #receipt-page table { min-width: 900px; }
    .modal-box { width: calc(100vw - 32px); padding: 20px; }
    .modal-row { grid-template-columns: 1fr; }
  }

  /* ── 상품 패널 ── */
  .prod-panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
  .prod-ph{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#f8fafc;cursor:pointer;user-select:none;transition:background .15s;}
  .prod-ph:hover{background:#f1f5f9;}
  .prod-ph-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
  .prod-pb{padding:14px 16px;}
  .prod-panel.collapsed .prod-ph{border-bottom:none;}
  .prod-panel.collapsed .prod-pb{display:none;}
  .prod-panel.collapsed .prod-ph-desc{display:none;}
  .prod-panel.collapsed .prod-ph-actions{display:none !important;}
  .prod-toggle-icon{margin-left:2px;color:var(--text2);transition:transform .2s;display:inline-flex;}
  .prod-ph svg{width:15px;height:15px;color:var(--text2);flex-shrink:0;}
  .prod-ph-actions button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:12px;font-weight:600;font-family:inherit;padding:5px 10px;border-radius:7px;cursor:pointer;}
  .prod-ph-actions button:hover{color:var(--text);background:#f1f5f9;}
  .prod-ph-actions button svg{width:13px;height:13px;}
  .prod-panel.collapsed .prod-toggle-icon{transform:rotate(-90deg);}
  .prod-grp-btn{display:inline-flex;align-items:center;gap:7px;background:#f8fafc;border:1.5px solid var(--border);border-radius:8px;padding:5px 8px 5px 12px;cursor:pointer;transition:all .2s;user-select:none;}
  .prod-grp-btn:hover{border-color:rgba(0,0,0,.2);background:white;}
  .prod-grp-btn.active-g{border-color:var(--info);background:#eff6ff;box-shadow:0 0 0 2px rgba(59,130,246,.12);}
  .prod-grp-name-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
  .prod-grp-name{font-size:12px;font-weight:700;line-height:1.2;color:var(--text);}
  .prod-grp-dots{display:flex;gap:3px;align-items:center;}
  .prod-grp-del{width:18px;height:18px;border-radius:4px;border:none;background:rgba(239,68,68,.08);color:#ef4444;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;line-height:1;}
  .prod-grp-del:hover{background:rgba(239,68,68,.25);}
  .prod-grp-section{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .prod-grp-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
  .prod-grp-add-form{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .prod-grp-add-form input[type=text]{border:1px solid var(--border);border-radius:7px;color:var(--text);padding:5px 10px;font-size:12px;font-family:inherit;outline:none;width:160px;transition:border-color .15s;}
  .prod-grp-add-form input[type=text]:focus{border-color:var(--info);}
  .ps-two-row{display:flex;flex-direction:column;gap:0;}
  .ps-row{display:flex;align-items:center;gap:6px;}
  .ps-row-inner{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scroll-behavior:smooth;}
  .ps-row-inner::-webkit-scrollbar{display:none;}
  .ps-sect-lbl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:26px;}
  .ps-divider-h{height:1px;background:var(--border);margin:9px 0;}
  .ps-nav-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:#f8fafc;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;flex-shrink:0;line-height:1;padding:0;}
  .ps-nav-btn:hover:not(:disabled){border-color:var(--info);color:var(--info);}
  .ps-nav-btn:disabled{opacity:.2;cursor:not-allowed;}
  .ps-item{display:flex;align-items:center;gap:7px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:6px 12px;transition:all .2s;cursor:pointer;user-select:none;flex-shrink:0;}
  .ps-item:hover{border-color:rgba(0,0,0,.15);background:white;}
  .ps-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.08);}
  .ps-name{font-size:13px;font-weight:700;white-space:nowrap;}
  .ps-tog{width:30px;height:17px;border-radius:9px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
  .ps-tog.on{background:var(--info);}
  .ps-tog.off{background:#cbd5e1;}
  .ps-tog::after{content:'';position:absolute;top:2.5px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s;}
  .ps-tog.on::after{left:16px;}
  .ps-tog.off::after{left:2px;}
  /* 다운로드 진행 */
  /* 접수 모달 탭 */
  .submit-tab{padding:9px 22px;font-size:13px;font-weight:700;border:none;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--text2);font-family:inherit;margin-bottom:-2px;transition:color .15s,border-color .15s;}
  .submit-tab.active{color:var(--info);border-bottom-color:var(--info);}
  .submit-tab:disabled{opacity:.3;cursor:not-allowed;}
  .stab-warn-ico{color:#dc2626;margin-left:4px;font-size:11px;}
  /* 엑셀 접수 모달 — higher_user 포털(user-apply.html)과 동일한 디자인 */
  .rex-shell{width:min(96vw,720px);max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px;padding:24px;box-shadow:0 24px 64px rgba(0,0,0,.3);}
  .rex-close-btn{border:none;background:rgba(255,255,255,.95);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .rex-branch-card{background:#fff;border:2px solid var(--accent);border-radius:16px;padding:24px 28px;margin-bottom:20px;box-shadow:0 4px 16px rgba(16,185,129,.08);}
  .rex-branch-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .rex-branch-icon{width:36px;height:36px;border-radius:50%;background:rgba(16,185,129,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);}
  .rex-branch-title{font-size:15px;font-weight:800;color:var(--text);}
  .rex-branch-desc{font-size:12px;color:var(--text2);margin-top:1px;}
  .rex-branch-input-wrap{position:relative;display:flex;align-items:center;border:1.5px solid var(--border);border-radius:9px;background:#fff;transition:.2s;cursor:text;}
  .rex-branch-input-wrap input{flex:1;padding:11px 10px;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--text);background:transparent;cursor:text;}
  .rex-branch-info{display:none;margin-top:12px;padding:10px 16px;background:#f1f5f9;border-radius:8px;font-size:13px;align-items:center;gap:8px;}
  .rex-branch-list{display:none;position:fixed;background:#fff;border:1.5px solid var(--accent);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:9999;max-height:240px;overflow-y:auto;}
  .rex-branch-option{padding:10px 16px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center;transition:.15s;}
  .rex-tab-bar{display:flex;gap:8px;margin-bottom:20px;}
  .rex-tab-btn{padding:10px 24px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;gap:6px;}
  .rex-tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(16,185,129,.25);}
  .rex-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.04);}
  .rex-card-title{font-size:18px;font-weight:800;margin-bottom:6px;}
  .rex-form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .rex-form-field{margin-bottom:14px;}
  .rex-form-field label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;}
  .rex-required-dot{width:5px;height:5px;border-radius:50%;background:var(--danger);display:inline-block;flex-shrink:0;}
  .rex-form-field input,.rex-form-field textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;box-sizing:border-box;}
  .rex-form-field textarea{resize:vertical;min-height:38px;}
  .rex-form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
  .rex-btn-cancel{padding:11px 22px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .rex-btn-next{padding:11px 26px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(16,185,129,.25);display:flex;align-items:center;gap:6px;}
  .rex-btn-next:disabled{background:var(--muted);box-shadow:none;cursor:not-allowed;}
  .rex-btn-template{padding:7px 16px;background:var(--info);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .rex-zone{border:2px dashed var(--border);border-radius:14px;padding:40px;text-align:center;cursor:pointer;transition:.2s;}
  .rex-zone:hover,.rex-zone.drag{border-color:var(--accent);background:rgba(16,185,129,.03);}
  .rex-zone input[type=file]{display:none;}
  .rex-preview-info{font-size:13px;color:var(--text2);margin-bottom:12px;}
  .rex-preview-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:auto;margin-bottom:20px;max-height:320px;}
  .rex-preview-table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px;}
  .rex-preview-table thead th{background:#1e293b;color:#fff;padding:10px 12px;font-weight:500;text-align:left;white-space:nowrap;position:sticky;top:0;}
  .rex-preview-table tbody td{padding:9px 12px;border-bottom:1px solid var(--border);}
  .rex-row-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;display:inline-block;}
  .rex-row-ok{background:rgba(16,185,129,.1);color:#059669;}
  .rex-row-err{background:rgba(239,68,68,.1);color:var(--danger);}
  @media (max-width:600px){ .rex-form-row{grid-template-columns:1fr;gap:0;} .rex-card{padding:20px 16px;} }
  /* 상품 설정 모달 */
  .prod-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;display:none;align-items:center;justify-content:center;}
  .prod-modal-bg.show{display:flex;}
  .prod-modal{background:white;border-radius:14px;width:460px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.2);}
  .prod-modal-head{padding:13px 18px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .prod-modal-head h3{font-size:13px;font-weight:700;flex:1;}
  .prod-modal-close{width:24px;height:24px;border:none;background:#e2e8f0;border-radius:5px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .prod-modal-close:hover{background:rgba(239,68,68,.15);color:#ef4444;}
  .prod-modal-body{padding:18px;display:flex;flex-direction:column;gap:14px;}
  .pmf label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .pmf-note{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;}
  .ratio-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .ratio-item{background:#f8fafc;border:1px solid var(--border);border-radius:7px;padding:6px 10px;display:flex;align-items:center;gap:6px;}
  .ri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .ri-name{font-size:11px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ratio-item input[type=number]{width:52px;border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:12px;font-family:monospace;outline:none;text-align:center;background:white;}
  .ratio-item input[type=number]:focus{border-color:var(--info);}
  .ratio-note{font-size:11px;color:var(--muted);text-align:right;margin-top:4px;font-family:monospace;}
  .ratio-note.ok{color:#10b981;}
  .ratio-note.ng{color:#ef4444;}
  .prod-modal-footer{padding:12px 18px;background:#f8fafc;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .pm-btn-cancel{padding:8px 16px;border:1px solid var(--border);border-radius:7px;background:white;cursor:pointer;font-size:13px;font-family:inherit;}
  .pm-btn-cancel:hover{border-color:var(--text2);}
  .pm-btn-save{padding:8px 16px;border:none;border-radius:7px;background:var(--info);color:white;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;}
  .pm-btn-save:hover{background:#2563eb;}

<script>
// 상품 유형 설정 패널 접기/펼치기
window.toggleProdPanel = function(e) {
  const panel = document.getElementById('prod-panel');
  panel.classList.toggle('collapsed');
};

(function(){
  let currentPage  = 1;
  const PER_PAGE   = 20;
  let allSlots     = [];
  let filteredAll  = [];
  // 목록 = 진행 중(키워드 포함, 실시간) + 최근 30일 종료(실시간, 키워드 없음) + 검색·날짜필터·» 때 종료 전체.
  // 종료 건 키워드는 상세·엑셀 다운로드 때만 HI.ensureKeywords로 붙임. 옛 김프로 출처 캠페인도 같은 목록
  let _withArchive = false; // 종료 전체 표시 여부 — 이 메뉴에서만 유효(데이터는 hi-store가 세션당 1회 받아 보관)
  let _liveKw = [], _recent = [];
  let _liveUnsub = null, _recentUnsub = null, _liveReady = null, _liveSyncOn = false;
  function composeSlots() {
    const have = new Set(_liveKw.map(s => s._key));
    const base = [..._liveKw, ..._recent.filter(s => !have.has(s._key))];
    return _withArchive ? HI.withClosed(base) : base;
  }
  // 메뉴를 떠나면 구독 해제 — 재방문마다 스크립트가 다시 돌아 콜백이 쌓이지 않게
  function pageGone() {
    if (document.getElementById('receipt-page')) return false;
    _liveUnsub?.(); _recentUnsub?.();
    return true;
  }
  function onLiveChange() {
    if (!_liveSyncOn) return;
    allSlots = composeSlots();
    renderReceipts(false);
  }
  function ensureLiveSubs() {
    if (!_liveReady) _liveReady = new Promise(resolve => {
      let gotLive = false, gotRecent = false;
      const first = () => { if (gotLive && gotRecent) resolve(); };
      _liveUnsub = HI.subscribeLiveWithKeywords(list => {
        if (pageGone()) return;
        _liveKw = list;
        if (!gotLive) { gotLive = true; first(); } else onLiveChange();
      });
      _recentUnsub = HI.subscribeRecentClosed(list => {
        if (pageGone()) return;
        _recent = list;
        if (!gotRecent) { gotRecent = true; first(); } else onLiveChange();
      });
    });
    return _liveReady;
  }
  async function listSlots() {
    await ensureLiveSubs();
    return composeSlots();
  }
  async function includeArchive() {
    if (_withArchive) return;
    await HI.loadClosed();
    _withArchive = true;
    allSlots = await listSlots();
  }
  let _slotsLoaded = false;
  let _detailOpen  = false;
  const userPriceMap = new Map(); // userId -> 단가(원/개), 차감 금액 계산용
  const userById = new Map();     // userId -> 회원 레코드(유입플 업체 단가 yupflPrices — HI.slotBill)
  const userBizfitUidMap = new Map(); // userId -> 비즈핏 파트너 어드민 uid(이메일), 승인 시 캐시 자동차감용
  // settleBizfitCash 등이 이 promise를 await해 로드 전 "매핑 없음" 오판을 방지
  // bizfitUid는 별도 필드 대신 bizfit_charge(BizFit 로그인 id)를 그대로 씀
  const userBizfitUidReady = HI.getUsers().then(async users => {
    users.forEach(u => { userPriceMap.set(u.username, u.unitPrice || 0); userById.set(u.username, u); });
    try {
      const charge = await HI.getBizfitCharges();
      users.forEach(u => {
        const acct = charge[sanitizeFbKey(u.agencyId||'')];
        if (acct && acct.id) userBizfitUidMap.set(u.username, acct.id);
      });
    } catch (e) { console.error('bizfit_charge 로드 실패:', e); }
    renderReceipts(false); // 매핑 로드 전엔 ⚠️차감재시도 배지를 판단 못 하므로, 로드 완료 시 한 번 다시 그려준다
  }).catch(() => {});

  const stMap = {
    pending:  '<span class="status-badge s-pending">대기</span>',
    accepted: '<span class="status-badge s-accepted">접수</span>',
    active:   '<span class="status-badge s-active">승인</span>',
    expired:  '<span class="status-badge s-expired">종료</span>',
    split:    '<span class="status-badge s-pending" style="background:#fef3c7;color:#b45309;">분할</span>',
    requeue:  '<span class="status-badge s-pending" title="강제종료 후 남은 기간 재접수 — 정산 제외">재접수 | 대기</span>',
    force_stopped: '<span class="status-badge s-expired" style="background:#fee2e2;color:#b91c1c;">강제종료</span>',
  };
  // 상태 배지 — 재접수 캠페인은 옛 김프로처럼 한 배지에 '재접수 | 상태'(색은 그 상태 색)
  const statusBadge = s => {
    const html = stMap[s.status] || s.status;
    return s.isRequeue && s.status !== 'requeue' && stMap[s.status]
      ? html.replace('<span ', '<span title="강제종료 후 남은 기간 재접수 — 정산 제외" ').replace(/>([^<]+)<\/span>$/, '>재접수 | $1</span>') : html;
  };

  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  const typeLabels = s => Array.isArray(s?.campaignType) ? s.campaignType : (s?.campaignType ? Object.values(s.campaignType) : []);
  // 풀스텍 = 시트 분류 때 가이드로 정해진 풀스텍(유입플) 상품(fullstackType) — 등급 매칭엔 안 씀
  const fullstackLabels = s => Array.isArray(s?.fullstackType) ? s.fullstackType : (s?.fullstackType ? Object.values(s.fullstackType) : []);
  // 엑셀 비고 — '리워드'(전부 리워드)·유입플 업체명(예 '풀스택': 전부 그 업체 유입플)·'50:50'(리워드%:유입플%, 합 100). 그 밖은 null
  function parseRatioNote(t, vendors = []) {
    t = String(t || '').replace(/\s+/g, '');
    const m = t.match(/^(\d{1,2})[:：](\d{1,2})$/);
    if (m) return +m[1] > 0 && +m[2] > 0 && +m[1] + +m[2] === 100 ? { reward: +m[1], yupfl: +m[2] } : null;
    if (t === '리워드') return { reward: 100, yupfl: 0 };
    if (vendors.includes(t)) return { reward: 0, yupfl: 100, vendor: t };
    return null;
  }
  // 배분에 쓰는 비율 = 엑셀 비고 배지만 — 승인 때 자동으로 붙인 배지(auto)는 표시용이라 배분에 안 씀
  const noteRatio = s => s?.yupflRatio?.auto ? null : s?.yupflRatio || null;
  // 유입플 업체 = 승인 때 유입플 몫을 '유입플' 상품 설정의 업체 비율로 나눈 값(yupflByVendor {업체명: 일 수량}) — 업체명 = 가이드 시트 탭 이름.
  // 비고가 업체명이면 그 업체에 전부
  const yupflVendors = () => { const v = prods.find(p => p.classifyOnly)?.vendors; return v && v.length ? v : [{ name: '풀스택', ratio: 100 }]; };
  function vendorSplit(target, slot) {
    if (noteRatio(slot)?.vendor) return target > 0 ? { [slot.yupflRatio.vendor]: target } : {};
    if (guideAllocOf(slot)) return target > 0 ? { '풀스택': target } : {}; // 가이드_접수면 유입플 몫은 전부 풀스택(웹 접수 대상)
    const vs = yupflVendors().filter(v => v.name && v.ratio > 0);
    const a = lrm(vs.map(v => ({ id: v.name, ratio: v.ratio })), target);
    return Object.fromEntries(Object.entries(a).filter(([, n]) => n > 0));
  }
  // 유입플 상품 배지 — 업체별 색(풀스택 청록·제이엔 주황·그 밖 보라). vendorProducts {업체: [상품]} 없는 옛 캠페인은 fullstackType(풀스택)
  const VENDOR_BADGE = { 풀스택: 'background:#ccfbf1;color:#0f766e;border:1px solid #99f6e4', 제이엔: 'background:#ffedd5;color:#c2410c;border:1px solid #fed7aa' };
  const OTHER_VENDOR_BADGE = 'background:#ede9fe;color:#6d28d9;border:1px solid #ddd6fe';
  const vendorProductsOf = s => s?.vendorProducts ? Object.entries(s.vendorProducts).map(([v, l]) => [v, Array.isArray(l) ? l : Object.values(l)]) : fullstackLabels(s).length ? [['풀스택', fullstackLabels(s)]] : [];
  const yupflProductLabels = s => vendorProductsOf(s).flatMap(([, l]) => l);
  function typeBadgesHtml(s) {
    if (s.status === 'expired') return '<span style="color:#cbd5e1">-</span>';  // 종료된 캠페인은 배지 숨김(데이터는 남음 — 엑셀·필터·등급 매칭용)
    const badge = (l, style) => `<span style="display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;${style}">${escProd(l)}</span>`;
    const html = [...typeLabels(s).map(l => badge(l, 'background:#f1f5f9;color:#334155;border:1px solid #e2e8f0')),
      ...vendorProductsOf(s).flatMap(([v, l]) => l.map(n => badge(n, VENDOR_BADGE[v] || OTHER_VENDOR_BADGE)))];

  async function addCampaignType(slotKey, names, slot) {

    const merged = [...new Set([...typeLabels(s), ...names.map(n => String(n).replace(/#\d+$/, '').trim()).filter(Boolean)])];
    await HI.updateCampaign(slotKey, { campaignType: merged });

  function buildGradeFilter(slots) {
    const sel = document.getElementById('filter-slot-type');
    if (!sel) return;
    const currentVal = sel.value;
    // 리워드·유입플 묶음마다 '전체' 항목 + 개별 상품
    const labels = new Set();
    slots.forEach(s => { if (s.status !== 'deleted') [...typeLabels(s), ...yupflProductLabels(s)].forEach(l => labels.add(l)); });
    const group = (title, value, list) => list.length
      ? `<optgroup label="${title}"><option value="${value}">${title} 전체</option>${list.sort().map(l => `<option value="${escProd(l)}">${escProd(l)}</option>`).join('')}</optgroup>` : '';
    sel.innerHTML = '<option value="">전체 등급</option>'
      + group('리워드', GRADE_REWARD, [...labels].filter(isRewardLabel))
      + group('유입플', GRADE_YUPFL, [...labels].filter(l => !isRewardLabel(l)));
    sel.disabled = false;
    if (labels.has(currentVal) || [GRADE_REWARD, GRADE_YUPFL].includes(currentVal)) sel.value = currentVal;
  }
  // 등급 필터 묶음 전체 값 — 리워드 = 상품 유형 설정(일반·고정)에 있는 상품, 유입플 = 그 밖(풀스텍 배지 등)
  const GRADE_REWARD = '__reward', GRADE_YUPFL = '__yupfl';
  const isRewardLabel = l => prods.some(p => p.name === l);
  function matchGrade(s, g) {
    const labels = [...typeLabels(s), ...yupflProductLabels(s)];
    if (g === GRADE_REWARD) return labels.some(isRewardLabel);
    if (g === GRADE_YUPFL) return labels.some(l => !isRewardLabel(l));
    return labels.includes(g);
  }

  // 일 목표 분할 종류 — 승인·예약 때 고정한 유입플 몫(yupflTarget) 기준: 일반만 / 섞임 / 유입플만, 안 나뉜 건 ''
  function splitKindOf(s) {
    if (s.yupflTarget == null) return '';
    const yup = s.yupflTarget || 0, normal = (s.dailyTarget || 0) - yup - Math.round((s.deductTarget || 0) / (s.days || 1));
    return !yup ? 'normal' : normal > 0 ? 'mixed' : 'yupfl';
  }
  function getFiltered() {
    const status   = document.getElementById('filter-status').value;
    const gradeFilter = document.getElementById('filter-slot-type').value;
    const kwTerms     = (document.getElementById('receipt-search').value||'')
      .split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    const dateFrom    = document.getElementById('filter-date-from').value;
    const startDateFrom = document.getElementById('filter-start-date').value;
    const splitFilter = document.getElementById('filter-split').value;
    return allSlots.filter(s => {
      if (s.status === 'deleted') return false;
      // 재접수|접수·승인은 재접수 건만, 대기·접수·승인은 재접수 제외(상단 카드와 같은 기준)
      if (status === 'change') { if (!isTypeChangeReq(s)) return false; }
      else if (status === 'requeue_accepted') { if (!(s.isRequeue && s.status === 'accepted')) return false; }
      else if (status === 'requeue_active') { if (!(s.isRequeue && s.status === 'active')) return false; }
      else if (['pending','accepted','active'].includes(status)) { if (s.status !== status || s.isRequeue) return false; }
      else if (status && s.status !== status) return false;
      if (gradeFilter && !matchGrade(s, gradeFilter)) return false;
      if (splitFilter && splitKindOf(s) !== splitFilter) return false;
      if (kwTerms.length && !kwTerms.some(t => [s.agencyId,s.userId,s.storeName,s.mid].some(v=>(v||'').toLowerCase().includes(t)))) return false;
      const slotDate = s.createdAt ? ymd(new Date(s.createdAt)) : '';
      if (dateFrom && slotDate !== dateFrom) return false;
      if (startDateFrom && s.startDate !== startDateFrom) return false;
      return true;
    });
  }

              ${s.status==='pending' || s.status==='requeue' ? `
                <button class="action-btn" style="background:rgba(59,130,246,.15);color:#1d4ed8;" onclick="acceptOne('${s._key}')">접수</button>
              ` : ''}
              ${s.status==='accepted' ? `
                <button class="action-btn" style="background:rgba(245,158,11,.15);color:#b45309;" onclick="changeStatusTo('${s._key}','pending')">대기</button>
                <button class="action-btn btn-approve" onclick="approveOne('${s._key}', this)">승인</button>
              ` : ''}
              ${s.status==='active' ? `
                <button class="action-btn" style="background:rgba(245,158,11,.15);color:#b45309;" onclick="changeStatusTo('${s._key}','pending')">대기</button>
                <button class="action-btn" style="background:rgba(59,130,246,.15);color:#1d4ed8;" onclick="acceptOne('${s._key}')">접수</button>
              ` : ''}
            </div>
          </td>
          <td><button class="action-btn" style="background:rgba(239,68,68,.1);color:#dc2626;font-weight:700;" onclick="deleteSlotRow('${s._key}')">✕</button></td>

    renderPagination(all.length);
    const chkAll = document.getElementById('check-all');
    if (chkAll) { chkAll.checked = false; chkAll.indeterminate = false; }
    if (window.lucide) lucide.createIcons();
    buildGradeFilter(allSlots);
  };

  // ── 접수 목록 실시간 반영 ──────────────────────────────────────
  // 첫 렌더 뒤부터 실시간 변경을 목록에 반영(구독 자체는 ensureLiveSubs가 hi-store 공유 캐시에 1회 붙임)
  function attachSlotsLiveSync() { _liveSyncOn = true; }

  function renderPagination(total) {
    const pages = Math.ceil(total/PER_PAGE) || 1;
    const pg    = document.getElementById('receipt-pagination');
    let html = `<button class="pg-btn" onclick="goPage(1)">&laquo;</button>
                <button class="pg-btn" onclick="goPage(${Math.max(1,currentPage-1)})">&lsaquo;</button>`;
    const s=Math.max(1,currentPage-2),e=Math.min(pages,currentPage+2);
    if(s>1){html+=`<button class="pg-btn" onclick="goPage(1)">1</button>`;if(s>2)html+=`<span class="pg-btn" style="pointer-events:none">…</span>`;}
    for (let i=s; i<=e; i++) {
      html += `<button class="pg-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    if(e<pages){if(e<pages-1)html+=`<span class="pg-btn" style="pointer-events:none">…</span>`;html+=`<button class="pg-btn" onclick="goPage(${pages})">${pages}</button>`;}
    html += `<button class="pg-btn" onclick="goPage(${Math.min(pages,currentPage+1)})">&rsaquo;</button>
             <button class="pg-btn" onclick="goLastPage()">&raquo;</button>`;
    pg.innerHTML = html;
  }

  window.goPage = function(n) { currentPage=n; renderReceipts(false); };
  // » = 이전 기록(종료 30일+)까지 이 메뉴에 불러온 뒤 전체 목록의 마지막 페이지로
  window.goLastPage = async function() {
    await includeArchive();
    currentPage = Math.ceil(getFiltered().length / PER_PAGE) || 1;
    renderReceipts(false);
  };

  window.toggleAll = function(cb) {
    document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
  };

  function getCheckedKeys() {
    return [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.key);
  }

  function updateLocalSlot(key, updates) {
    const idx = allSlots.findIndex(x => x._key === key);
    if (idx !== -1) Object.assign(allSlots[idx], updates);
  }
  function closeOverlayAndRefresh() {
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.remove();
    _detailOpen = false;
    renderReceipts(false);
  }

  // ── 승인 ─────────────────────────────────────────────────
  // btn 즉시 disable로 이중 차감 방지, settleBizfitCash await로 차감 끝나기 전 화면 닫힘(요청 취소) 방지
  window.approveOne = async function(key, btn) {
    if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }
    await userBizfitUidReady; // 유입플 업체 단가(userById) 로드 후 금액 계산
    const targetSlot = allSlots.find(s => s._key === key);
    // 유입플 몫은 지금 상품 유형 설정 선택값(비고 비율 우선)으로 나눔. 배지는 가이드_접수 토글과 무관하게 가이드에서 — 유입플 몫이 있으면 풀스텍 배지, 캠페인타입이 비었으면 가이드 리워드 상품
    const extra = allocFieldsFor(targetSlot);
    let guideErr = null;
    if (!guideRules.length) { try { await loadGuide(); } catch (e) { guideErr = e; } }
    const rule = !guideErr && targetSlot && !targetSlot.changeTo ? guideRuleFor(targetSlot) : null;
    if (rule && extra.yupflByVendor && !extra.vendorProducts) Object.assign(extra, vendorProductFields(rule, extra.yupflByVendor));
    // 리워드 몫(일 목표 − 유입플 − 차감)이 남을 때만 — 전부 유입플이면 리워드 배지 없음
    const rewardLeft = targetSlot && (targetSlot.dailyTarget || 0) - (extra.yupflTarget || 0) - (extra.deductTarget || 0) / (targetSlot.days || 1) > 0;
    if (rule && rule.reward.length && rewardLeft && !typeLabels(targetSlot).length) extra.campaignType = rule.reward.map(g => g.name);
    await HI.approve(key, extra);
    updateLocalSlot(key, { status: 'active', ...extra });
    await autoRegisterAdlog([targetSlot]);
    await autoStampSettlement([{ ...targetSlot, ...extra }]);
    const ok = await settleBizfitCash(targetSlot, extra);
    // 이 버튼엔 팝업이 없어 배너를 못 띄우니, 실패했을 때만 alert로 알림(성공/스킵은 조용히 넘어감)
    if (!ok) alert('접수는 승인됐지만 비즈핏 캐시차감에 실패했습니다.\n네트워크/세션 문제일 수 있으니 잠시 후 다시 승인해보거나 개발자에게 알려주세요.');
    if (guideErr) alert('가이드를 불러오지 못해 배지 없이 승인했습니다: ' + guideErr.message);
    closeOverlayAndRefresh();
  };

  /* window.bulkApprove = async function() {

    if (!keys.length) return alert('선택된 항목이 없습니다.');
    await Promise.all(keys.map(k => HI.approve(k)));
    keys.forEach(k => {
      const idx = allSlots.findIndex(x => x._key === k);
      if (idx !== -1) allSlots[idx].status = 'active';

  // ── 접수 처리 ─────────────────────────────────────────────
  // 승인 건을 대기·접수로 되돌리면 승인 때 붙인 배지·유입플 분류를 지움 — 다시 승인하면 그때 값으로 새로 계산(캐시 차감은 수동 처리)
  const unapprovePatch = key => allSlots.find(x => x._key === key)?.status === 'active'
    ? { campaignType: null, fullstackType: null, yupflTarget: null, yupflByVendor: null, yupflAmount: null, vendorProducts: null,
        ...(allSlots.find(x => x._key === key)?.yupflRatio?.auto ? { yupflRatio: null } : {}) } : {};
  window.acceptOne = async function(key) {
    const patch = { status: 'accepted', ...unapprovePatch(key) };

    updateLocalSlot(key, patch);

  // 상세 팝업의 키워드·블로그URL 입력칸 값이 바뀐 경우에만 저장 — acceptFromDetail/closeDetailModal 공용
  async function saveDetailFields(key) {
    const s0 = allSlots.find(x => x._key === key);
    // 기본 필드(대행사/플레이스명/순위키워드/URL/MID/일목표/일수/단가/기간/메모) — 김프로 상세보기와 동일하게 편집 가능
    const readField = (id, num) => {
      const el = document.getElementById(id);
      if (!el) return undefined;
      return num ? (Number(el.value)||0) : el.value.trim();
    };
    const baseFields = {
      agencyId: readField('d-agencyId'), storeName: readField('d-storeName'), rankKeyword: readField('d-rankKeyword'),
      url: readField('d-url'), mid: readField('d-mid'), dailyTarget: readField('d-dailyTarget', true), days: readField('d-days', true),
      unitPrice: readField('d-unitPrice', true), startDate: readField('d-startDate'), endDate: readField('d-endDate'),
      memo: document.getElementById('d-memo')?.value.trim(),
      adlogMemo: document.getElementById('d-adlogMemo')?.value.trim(),
    };
    const baseUpdates = {};
    for (const [k, v] of Object.entries(baseFields)) {
      if (v === undefined) continue;
      if (String(v) !== String(s0[k] ?? '')) baseUpdates[k] = v;
    }
    if (Object.keys(baseUpdates).length) {
      await HI.updateCampaign(key, baseUpdates);
      updateLocalSlot(key, baseUpdates);
    }
    const input = document.getElementById('detail-keyword-input');
    const kw = input ? input.value.trim() : null;
    const deltaInput = document.getElementById('detail-delta-url-input');
    const deltaUrl = deltaInput ? deltaInput.value.trim() : null;
    const s = allSlots.find(x => x._key === key);
    if (kw !== null && kw !== (s.searchKeyword||'')) {
      await HI.updateCampaign(key, { searchKeyword: kw });
      updateLocalSlot(key, { searchKeyword: kw });
    }
    if (s0.status === 'split') await syncScheduledRows(key, baseUpdates);
    if (deltaUrl !== null && deltaUrl !== (s.deltaBlogUrl||'')) {
      await HI.updateCampaign(key, { deltaBlogUrl: deltaUrl });
      updateLocalSlot(key, { deltaBlogUrl: deltaUrl });
    }
  }

  // 분할 예약 대기 조각에 상세 수정 반영 — 업체명·MID만(나머지는 예약 때 값 그대로)
  async function syncScheduledRows(key, updates) {
    const rowPatch = {};
    if ('storeName' in updates) rowPatch.업체명 = updates.storeName;
    if ('mid' in updates) rowPatch.PID번호 = updates.mid;
    if (!Object.keys(rowPatch).length) return;
    const pending = Object.entries(await HI.getScheduleDispatchOnce() || {}).filter(([, e]) => e.slotKey === key && !isScheduleDone(e.status));
    await Promise.all(pending.map(([id]) => HI.updateScheduleDispatch(`${id}/payload/rowData/0`, rowPatch)));
  }

  window.acceptFromDetail = async function(key) {
    await saveDetailFields(key);
    await HI.updateCampaign(key, { status: 'accepted' });
    updateLocalSlot(key, { status: 'accepted' });
    await releaseDetailLock(key);
    document.querySelector('.modal-overlay').remove();
    _detailOpen = false;
    renderReceipts(false);

  // ── 삭제(목록 열) ─────────────────────────────────────────
  window.deleteSlotRow = async function(key) {
    const s = allSlots.find(x => x._key === key);
    if (s?.status === 'split') { alert('시간대 분할 예약 진행 중에는 삭제할 수 없습니다.'); return; }
    if (!confirm('이 항목을 삭제하시겠습니까?\n(휴지통으로 이동합니다)')) return;
    await HI.trash(key);
    allSlots = allSlots.filter(x => x._key !== key);
    renderReceipts(false);
    if (s) await autoStampSettlement([{ ...s, status: 'deleted' }]); // 남은 건이 전부 승인 상태면 이때 도장
  };

  // ── 상태 변경 ────────────────────────────────────────────
  window.changeStatusTo = async function(key, newStatus) {
    const labelMap = { pending: '대기', accepted: '접수', active: '승인' };
    if (!confirm(`상태를 "${labelMap[newStatus]}"(으)로 변경하시겠습니까?`)) return;
    const patch = { status: newStatus, ...(newStatus !== 'active' ? unapprovePatch(key) : {}) };
    await HI.updateCampaign(key, patch);
    updateLocalSlot(key, patch);
    closeOverlayAndRefresh();
    if (newStatus === 'active') await autoStampSettlement([allSlots.find(x => x._key === key)]);
  };

  // ── 상세 보기 ─────────────────────────────────────────────

    const s = allSlots.find(x => x._key === key);
    if (!s) return;
    _detailOpen = true;

    // 캐시에 충돌 기록이 있으면 네트워크 없이 즉시 차단
    const _cached = LOCK_CHECK_CACHE.get(key);
    if (_cached && _cached.conflict && Date.now() - _cached.ts < LOCK_CACHE_TTL) {
      _detailOpen = false;
      showLockNotice(_cached.by);
      return;

    try {

    const editWarn = s.status === 'split' ? '⏰ 분할 예약 진행 중 — 수정 시 주의해주세요.' : s.status === 'active' ? '✅ 승인된 캠페인 — 수정 시 주의해주세요.' : '';

          </div>

            <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:5px">등급</div>

        <div class="modal-field"><label>플레이스명</label><input id="d-storeName" value="${escProd(s.storeName)}"></div>
        <div class="modal-row">
          <div class="modal-field"><label>URL</label><input id="d-url" value="${escProd(s.url||'')}"></div>
          <div class="modal-field"><label>MID</label><input id="d-mid" value="${escProd(s.mid||'')}"></div>
        </div>
        <div class="modal-row">
          <div class="modal-field"><label>일 목표</label><input type="number" id="d-dailyTarget" value="${escProd(s.dailyTarget||0)}"></div>
          <div class="modal-field"><label>일 수</label><input type="number" id="d-days" value="${escProd(s.days||0)}"></div>
        </div>

          <div class="modal-field"><label>시작일</label><input type="date" id="d-startDate" value="${escProd(s.startDate)}"></div>

          <label style="display:flex;align-items:center;justify-content:space-between;">
            <span style="display:flex;align-items:center;gap:6px;">검색키워드 <span id="kw-count-badge" style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;">${(s.searchKeyword||'').split(',').map(k=>k.trim()).filter(k=>k.length>0).length}개</span></span>
            ${s.mid ? `<button type="button" onclick="toggleMidHistory('${escJsAttr(s.mid)}','${key}')" id="mid-hist-btn" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:#f8fafc;color:var(--text2);cursor:pointer;font-family:inherit;">이전 키워드 보기</button>` : ''}

  // ── Firebase에서 MID로 현재 키워드 조회 (오늘 값 단순 덮어쓰기) ──
  async function fetchSheetKeywordByMid(mid) {
    try {
      // hi/live_keywords/{mid}.findKw — bizfit-dandok이 '분류' 시트에서 매시간 동기화
      const findKw = ((await HI.getLiveKeywordsOnce())[sanitizeFbKey(mid)]?.findKw || '').trim();
      return findKw ? [findKw] : [];
    } catch (e) {
      console.error('Firebase 키워드 조회 오류:', e);
      return null; // null = 오류, [] = 결과없음
    }
  }

  // 미션 번호마다 고정된 색을 배정 — 같은 번호는 항상 같은 색
  const MISSION_BADGE_COLORS = ['#1d4ed8','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#4d7c0f'];
  function missionBadgeColor(mission) {
    const n = parseInt(mission, 10);
    if (!Number.isFinite(n)) return '#64748b';
    return MISSION_BADGE_COLORS[((n % MISSION_BADGE_COLORS.length) + MISSION_BADGE_COLORS.length) % MISSION_BADGE_COLORS.length];
  }


  // ── MID 키워드 히스토리 공통 헬퍼 ──────────────────────────
  // 같은 키워드+접수'일자'(시각 제외)면 중복으로 간주해 제거 (히스토리 모달/엑셀 다운로드 공용)
  function dedupHistoryByDay(list) {
    const seen = new Set();
    return list.filter(s => s.searchKeyword).filter(s => {
      const dayStr = s.createdAt ? ymd(new Date(s.createdAt)) : '';
      const dedupKey = s.searchKeyword + '|' + dayStr;
      if (seen.has(dedupKey)) return false;
      seen.add(dedupKey);
      return true;
    });
  }

  // 새로 찍히므로, 생성순으로 정렬해 직전 슬롯과 키워드가 같으면 실제 변경이 아니라고 보고 뺀다.
  function dropUnchangedConsecutive(list) {
    const sorted = [...list].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    return sorted.filter((s, i) => i === 0 || s.searchKeyword !== sorted[i - 1].searchKeyword);
  }

  // searchKeyword/createdAt 모양으로 매핑. 날짜 없는 이력(이전 때 옮긴 옛 김프로 키워드)은 그 캠페인 접수일로
  async function midKeywordHistory(mid, field) {
    const camps = await HI.getByMid(mid);
    const kws = await Promise.all(camps.map(c => HI.getKeywords(c._key)));
    const current = dropUnchangedConsecutive(
      camps.map((c, i) => ({ searchKeyword: kws[i][field] || '', createdAt: c.createdAt })).filter(x => x.searchKeyword)
    );
    const changes = camps.flatMap((c, i) => (kws[i].history?.[field] || []).map(h => ({ searchKeyword: h.keyword, createdAt: h.date || c.createdAt })));
    return dedupHistoryByDay([...current, ...changes])
      .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  }

  // 상품 유형 설정은 전 계정 공용 1벌(hi/products)
  async function loadProdSettings() {
    const staticFlags = new Map(prods.map(p => [p.id, {daysMultiplied:p.daysMultiplied,fixedAlloc:p.fixedAlloc,autoBalance:p.autoBalance,deductOnly:p.deductOnly,classifyOnly:p.classifyOnly,blogUrlProduct:p.blogUrlProduct, ...(VER_LOCKED_IDS.has(p.id) ? {ver:p.ver} : {}), ...(FIXED_PROD_IDS.has(p.id) ? {name:p.name} : {})}]));
    const fixedDefaults = new Map(prods.map(p => [p.id, {fixedPct:p.fixedPct}]));
    const colorMap = new Map(prods.map(p => [p.id, p.color]));
    // 최초 로드와 실시간 구독 콜백이 공유하는 처리 로직 — 원본 데이터를 받아 prods/prodGroups를 갱신
    const applyProdsData = (loaded) => {
      const arr = Array.isArray(loaded) ? loaded : Object.values(loaded);
      prods = arr.filter(p => p && !REMOVED_PROD_IDS.has(p.id));
      prods.forEach(p => {
        const f = staticFlags.get(p.id); if(f) Object.assign(p, f);
        const fd = fixedDefaults.get(p.id);
        if (fd && p.fixedPct === undefined) p.fixedPct = fd.fixedPct;
        if (colorMap.has(p.id)) p.color = colorMap.get(p.id);
      });
      // 저장된 설정에 없는(=이후에 새로 추가된) 기본 상품은 뒤에 붙여준다
      const loadedIds = new Set(prods.map(p => p.id));
      DEFAULT_PRODS.forEach(dp => { if (!loadedIds.has(dp.id)) prods.push({ ...dp }); });
      // 고정 그룹(차감/찰리/델타/네이비) 노출 순서는 저장된 순서와 무관하게 항상
      // DEFAULT_PRODS 기준(유입플→차감→찰리→델타→네이비)을 따르도록 정렬 — 일반 상품(p1~p8) 순서는 건드리지 않음
      const fixedRank = new Map(DEFAULT_PRODS.filter(dp => FIXED_PROD_IDS.has(dp.id)).map((dp, i) => [dp.id, i]));
      const fixedSorted = prods.filter(p => fixedRank.has(p.id)).sort((a, b) => fixedRank.get(a.id) - fixedRank.get(b.id));
      let fi = 0;
      prods = prods.map(p => fixedRank.has(p.id) ? fixedSorted[fi++] : p);
      // 자동배분 대상 중 활성 ratio/kwPct 합이 10이 아니면(예: 비율이 0으로 어긋난 경우) 재배분해 수동 조작 없이 복구
      const balanced = prods.filter(p => p.active && p.autoBalance !== false);
      if (balanced.length) {
        const ratioSum = Math.round(balanced.reduce((s,p)=>s+(p.ratio||0),0)*10)/10;
        const kwSum    = Math.round(balanced.reduce((s,p)=>s+(p.kwPct||0),0)*10)/10;
        if (ratioSum !== 10) rebalanceProdActive('ratio');
        if (kwSum !== 10) rebalanceProdActive('kwPct');
      }
    };
    const applyGroupsData = (loaded) => {
      prodGroups = loaded ? (Array.isArray(loaded) ? loaded : Object.values(loaded)) : [];
    };
    try {
      // hi-store 공유 캐시 구독(세션당 리스너 1개) — 첫 값이 오면 최초 로드 완료, 이후 다른 세션 변경도 즉시 반영.
      // 페이지 재실행마다 onValue를 직접 붙이면 리스너가 누적됨 — 메뉴를 떠나면 해제

        const first = () => { if (gotP && gotG) resolve(); };
        const unP = HI.onProdsChange(v => {
          if (!document.getElementById('receipt-page')) { unP(); return; }

          if (!document.getElementById('receipt-page')) { unG(); return; }
          applyGroupsData(v);
          if (!gotG) { gotG = true; first(); } else renderPS();
        });
      });
    } catch(e) { console.error('loadProdSettings 오류:', e); }

  window.showAddProdGroup = function() {

  window.hideAddProdGroup = function() {
    document.getElementById('addProdGroupForm').style.display = 'none';
    document.getElementById('prodGroupNameInput').value = '';

  window.saveProdGroup = function() {
    const name = document.getElementById('prodGroupNameInput').value.trim();
    if (!name) { document.getElementById('prodGroupNameInput').focus(); return; }
    prodGroups.push({ id:'g'+Date.now(), name, state: prodSnapshot() });
    saveProdSettings(); window.hideAddProdGroup(); renderProdGroups();
  };
  window.deleteProdGroup = function(id) {
    if (activeProdGroupId === id) activeProdGroupId = null;
    prodGroups = prodGroups.filter(g => g.id !== id);
    saveProdSettings(); renderProdGroups();
  };
  window.applyProdGroup = function(id) {
    if (id === activeProdGroupId) { deactivateProdGroup(); return; }
    const g = prodGroups.find(x => x.id === id); if(!g) return;
    guideModeOn = false;
    if (!activeProdGroupId) saveProdDefault();
    g.state.forEach(s => {
      const p = prods.find(x => x.id === s.id); if(!p) return;
      p.active = s.active;
      if(s.ratio  !== undefined) p.ratio  = s.ratio;
      if(s.name && !FIXED_PROD_IDS.has(p.id)) p.name = s.name;  // 고정 상품 이름은 코드값
      if(s.ver    !== undefined && !VER_LOCKED_IDS.has(p.id)) p.ver = s.ver;
      if(s.kwPct  !== undefined) p.kwPct  = s.kwPct;
      if(s.fixedPct !== undefined) p.fixedPct = s.fixedPct;
      if(s.blogSplit !== undefined) p.blogSplit = s.blogSplit;
    });
    activeProdGroupId = id; renderPS();
  };
  window.startRenameProdGroup = function(id) {
    const g = prodGroups.find(x => x.id === id); if(!g) return;
    const el = document.querySelector(`.prod-grp-btn[data-gid="${id}"] .prod-grp-name`);
    if(!el) return;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = g.name; inp.maxLength = 24;
    inp.style.cssText = 'background:transparent;border:none;border-bottom:1px solid var(--info);color:var(--text);font-size:12px;font-weight:700;font-family:inherit;outline:none;width:80px;padding:0;';
    let committed = false;
    const commit = () => { if(committed) return; committed = true; const v = inp.value.trim(); if(v) g.name = v; saveProdSettings(); renderProdGroups(); };
    inp.onblur = commit;
    inp.onkeydown = e => { if(e.key==='Enter'){inp.blur();} if(e.key==='Escape'){committed=true;renderProdGroups();} e.stopPropagation(); };
    el.replaceWith(inp); inp.focus(); inp.select();
  };
  function updateActiveProdGroup() {
    if (!activeProdGroupId) return;

  window.toggleProd = function(id) {
    const p = prods.find(x => x.id === id); if (!p) return;
    p.active = !p.active;
    rebalanceProdActive('ratio'); rebalanceProdActive('kwPct');
    if(activeProdGroupId) updateActiveProdGroup(); else { saveProdDefault(); saveProdSettings(); }
    renderPS();
  };
  function rebalanceProdActive(field) {
    const active = ap().filter(p => p.autoBalance !== false);
    const n = active.length;
    if(!n){ prods.forEach(p => { p[field]=0; }); return; }
    const each = Math.round(10/n*10)/10;
    const last  = Math.round((10-each*(n-1))*10)/10;
    active.forEach((p,i) => { p[field] = i===n-1?last:each; });
    prods.forEach(p => { if(!p.active || p.autoBalance === false) p[field]=0; });
  }

  // 유입플 상품 모달의 업체별 비율 편집(이름·%, 합계 100)
  const vendorRowHtml = v => `<div class="pm-vendor" style="display:flex;gap:6px;align-items:center;margin-top:6px;">
        <input class="pm-v-name" type="text" value="${escProd(v.name)}" placeholder="업체명" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;">
        <input class="pm-v-ratio" type="number" min="0" max="100" step="1" value="${v.ratio}" style="width:56px;padding:5px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:inherit;"><span style="font-size:12px;color:var(--text2);">%</span>

  window.addVendorRow = () => document.getElementById('pm-vendors').insertAdjacentHTML('beforeend', vendorRowHtml({ name: '', ratio: 0 }));
  function vendorEditorHtml(vs) {
    return `<div style="grid-column:1/-1;margin-top:10px;">
        <div style="font-size:12px;font-weight:600;color:var(--text2);">유입플 업체 비율 <span style="font-weight:400;color:var(--muted);">(승인 때 유입플 몫을 이 %로 나눔, 합계 100%)</span></div>

  // 일반 상품 키워드/일목표 배분 입력칸 합계 — updateProdModalNotes/saveProdModal 공용
  function sumProdModalInputs(actives, prefix) {
    return Math.round(actives.reduce((s,q) => {
      const el = document.getElementById(`${prefix}${q.id}`);
      return s + (el ? parseFloat(el.value) || 0 : 0);

  window.updateProdModalNotes = function() {
    const cur = _prodModalId ? prods.find(x => x.id === _prodModalId) : null;
    if (!cur) return;
    if (cur.fixedAlloc) {
      const kwNote = document.getElementById('pm-kw-note');
      const ratNote = document.getElementById('pm-ratio-note');
      if (kwNote) kwNote.textContent = '';
      if (ratNote) {
        const pctEl = document.getElementById('pm-fixedpct');
        const pctVal = pctEl ? parseFloat(pctEl.value) : NaN;
        if (pctVal === 100) {
          ratNote.textContent = '⚠️ 100%로 설정하면 일반 상품은 배분되지 않습니다';

        } else {
          ratNote.textContent = '';
          ratNote.className = 'ratio-note';

      }

    const actives = ap().filter(q => !q.fixedAlloc);
    const kwR = sumProdModalInputs(actives, 'pm-kwpct-'), ratR = sumProdModalInputs(actives, 'pm-ratio-');

    const ratNote = document.getElementById('pm-ratio-note');
    if(kwNote)  { kwNote.textContent=`합계: ${kwR}%`;   kwNote.className='ratio-note '+(kwR===100||kwR===0?'ok':'ng'); }
    if(ratNote) { ratNote.textContent=`합계: ${ratR}%`; ratNote.className='ratio-note '+(ratR===100?'ok':'ng'); }

  window.closeProdModal = function() {

  // 엑셀 버전 새로고침 — 비즈핏 사이트에 등급명으로 직접 조회해 pm-ver를 최신값으로 채운다.
  window.refreshProdVersion = async function() {
    const p = prods.find(x => x.id === _prodModalId); if (!p) return;
    const btn = document.getElementById('pm-ver-refresh');
    const verEl = document.getElementById('pm-ver');
    const account = await fetchVersionCheckAccount();
    if (!account) { alert('버전 조회용 계정이 등록돼 있지 않습니다.'); return; }
    const adrole = p.id === 'charlie' ? CHARLIE_ADROLE : p.id === 'delta' ? DELTA_ADROLE : undefined;
    btn.disabled = true; const prevIcon = btn.textContent; btn.textContent = '⏳';
    try {
      const gi = await callBizfitProxy('/grade-info', {
        domain: BIZFIT_DOMAIN, loginId: account.id, pwd: account.pw, tab: BIZFIT_TAB,
        adrole: adrole || undefined, withVersion: true,
      });
      if (!gi.success || !gi.gradeGroups) { alert('조회 실패: ' + (gi.message || '등급 정보를 가져오지 못했습니다.')); return; }
      const g = gi.gradeGroups.find(x => x.gradeName === p.name);
      if (!g) { alert(`"${p.name}" 등급을 조회 계정에서 찾지 못했습니다.`); return; }
      if (!g.version) { alert('버전 조회 결과가 비어있습니다 — 잠시 후 다시 시도해주세요.'); return; }
      verEl.value = g.version;
    } catch(e) {
      alert('조회 중 오류: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = prevIcon;
    }
  };
  window.saveProdModal = function() {
    const p = prods.find(x => x.id === _prodModalId); if(!p) return;
    p.name = document.getElementById('pm-name').value.trim() || p.name;
    p.ver  = document.getElementById('pm-ver').value.trim();
    if (p.blogUrlProduct) {
      const n = parseInt(document.getElementById('pm-blogsplit')?.value, 10);
      if (!Number.isFinite(n) || n < 1) { alert('분할 값은 1 이상의 숫자여야 합니다.'); return; }
      p.blogSplit = n;
    }
    if (!p.fixedAlloc) {
      const actives = ap().filter(q => !q.fixedAlloc);
      if(actives.length) {
        const kwR = sumProdModalInputs(actives, 'pm-kwpct-'), ratR = sumProdModalInputs(actives, 'pm-ratio-');
        if(kwR!==100 && kwR!==0){ alert(`키워드 배분 합계는 100% 또는 모두 0이어야 합니다. (현재: ${kwR}%)`); return; }
        if(ratR!==100){ alert(`일 목표 배분 합계는 100%여야 합니다. (현재: ${ratR}%)`); return; }
        // 화면은 %, 저장값은 합 10 기준(배분 계산·자동 재배분이 이 기준)
        actives.forEach(q => {
          const kwEl=document.getElementById(`pm-kwpct-${q.id}`), ratEl=document.getElementById(`pm-ratio-${q.id}`);
          if(kwEl)  q.kwPct = Math.round(parseFloat(kwEl.value) ||0)/10;
          if(ratEl) q.ratio = Math.round(parseFloat(ratEl.value)||0)/10;
        });
      }
    } else if (p.deductOnly || p.classifyOnly) {
      if (p.classifyOnly) {
        const vs = [...document.querySelectorAll('#pm-vendors .pm-vendor')].map(r => ({
          name: r.querySelector('.pm-v-name').value.trim(), ratio: parseFloat(r.querySelector('.pm-v-ratio').value) || 0 })).filter(v => v.name);
        const vSum = vs.reduce((a, v) => a + v.ratio, 0);
        if (vSum !== 100) { alert(`유입플 업체 비율 합계는 100%여야 합니다. (현재: ${vSum}%)`); return; }
        if (new Set(vs.map(v => v.name)).size !== vs.length) { alert('유입플 업체 이름이 겹칩니다.'); return; }
        p.vendors = vs;

      const fixedPctEl = document.getElementById('pm-fixedpct');
      if (fixedPctEl && parseFloat(fixedPctEl.value) > 100) {
        alert(`${p.deductOnly ? '차감' : '유입플'} 비율은 100%를 초과할 수 없습니다.`);
        return;
      }
      if (fixedPctEl) p.fixedPct = Math.max(0, Math.min(100, parseFloat(fixedPctEl.value) || 0));
    }
    prodGroups.forEach(g => { const gs=g.state.find(s=>s.id===p.id); if(gs){gs.name=p.name;gs.ver=p.ver;} });
    window.closeProdModal();
    if(activeProdGroupId) updateActiveProdGroup(); else { saveProdDefault(); saveProdSettings(); }
    renderPS();
  };
  window.deleteProdModal = function() {
    if (!_prodModalId || FIXED_PROD_IDS.has(_prodModalId)) return;
    const p = prods.find(x => x.id === _prodModalId); if (!p) return;

    window.closeProdModal();
